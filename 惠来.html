<script>
// ====== EXAM DATA ======
var EXAMS = [{"id": "2023", "title": "2023年揭阳惠来教师招聘笔试真题", "subtitle": "（回忆版）· 7月1日", "sections": [{"id": "s2023_1", "type": "single", "name": "单选题", "score_each": 1.18, "questions": [{"id": 1, "q": "“学在官府”学校既是施教的场所，也是进行整治活动的地方。体现了教育的（ ）功能", "opts": ["社会发展", "正向", "负向", "个体发展"], "ans": 0, "exp": "“学在官府”意味着学校不仅是知识传授的场所，也深度参与政治活动，这体现了教育对社会政治、文化等方面的推动作用，是教育社会发展功能的典型表现。"}, {"id": 2, "q": "习近平：教师不能只是教书匠，而要成为“大先生”。体现了教师劳动的（ ）特点", "opts": ["复杂性", "示范性", "创造性", "个体性与集体性结合"], "ans": 2, "exp": "教师不仅要教书，更要成为“大先生”，这要求教师具备高度的创造性，能够不断探索新的教学方法和理念，以适应学生多样化的学习需求。这体现了教师劳动的创造性特点。"}, {"id": 3, "q": "班主任：班里的学生都是进入青春期的孩子，开始在意个人形象和穿着。班主任结合教育心理学的理论开展研究希望能提出针对性的措施。这符合了教育的（ ）原则", "opts": ["理论联系实际", "客观性", "因材施教", "循序渐进"], "ans": 0, "exp": "班主任结合教育心理学理论开展研究，旨在提出针对性的教育措施，这体现了理论联系实际的教育原则。"}, {"id": 4, "q": "有同学跟小蓝借东西，小蓝转头把东西拿给他，就被班主任看到并批评“你怎么总是交头接耳？”这会影响小蓝的（ ）", "opts": ["自我认识", "自我体验", "自我控制", "自我效能"], "ans": 0, "exp": "小蓝被班主任误解并批评，这会影响他对自己的认识和评价。自我认识是指个体对自己的认识和评价，包括对自己的性格、能力、价值等方面的认知。"}, {"id": 5, "q": "某同学改变赖床，自觉早到校。这体现了克拉斯沃尔的情感领域目标的（ ）", "opts": ["组织", "接受", "反应", "价值"], "ans": 2, "exp": "学生自觉早到校，表明他对学校规定和纪律有积极反应，愿意遵守并主动适应。这体现了克拉斯沃尔情感领域目标中的反应阶段。"}, {"id": 6, "q": "教师在教学课文时，让同学对文章进行分段并概括大意。这体现了（ ）策略", "opts": ["精加工", "组织", "复述", "资源管理策略"], "ans": 1, "exp": "教师在教学时让学生对文章进行分段并概括大意，这是组织策略的体现。组织策略是指将学习材料分成一些小的单元，并把这些小的单元置于适当的类别之中，从而使每项信息和其他信息联系在一起。"}, {"id": 7, "q": "小明理解了两栖动物，哺乳动物，爬行动物的本质特征，是到了智技能的（ ）", "opts": ["定义概念", "具体概念", "辨别", "规则"], "ans": 0, "exp": "小明理解了两栖动物、哺乳动物、爬行动物的本质特征，这表明他已经掌握了这些动物的定义概念。定义概念是指用词语来概括同类事物的共同本质特征的概念。"}, {"id": 8, "q": "不属于行政复议制的特点是（ ）", "opts": ["一级复议制，操作简单", "具有最终的法律效力", "行政复议以书面审理为主要方式", "行政复议以行政机关为处理机关"], "ans": 1, "exp": "行政复议制度并不具有最终的法律效力，行政诉讼才是解决行政争议的最终途径。行政复议以书面审理为主要方式，以行政机关为处理机关，实行一级复议制。"}, {"id": 9, "q": "与“甲板；汽船”相近的是（ ）", "opts": ["芯片；手机", "镜片；镜框", "汽锤；蒸汽锤", "苹果；水果"], "ans": 0, "exp": "甲板是汽船的重要组成部分，类似地，芯片是手机的重要组成部分。这种关系体现了部分与整体的关系。"}, {"id": 10, "q": "某公司突击检查，发现公司有4人在聚众打麻将。领导对这几人进行讯问。抽烟的说“我们都不是公司的人”，穿短袖的“至少有一人是公司的人”，戴帽子的说“我什么都不知道”，穿拖鞋的“至少有1人不是公司的人”。这四人只有1人说了真话。下列哪项是正确的（ ）", "opts": ["穿短袖和拖鞋的是公司的人", "都是公司的人", "抽烟的、穿短袖和戴帽子的是公司的人", "戴帽子和穿拖鞋不是公司的人"], "ans": 0, "exp": "通过逻辑推理可知，抽烟者说假话，则四人都是公司的人。由此可推断穿短袖和穿拖鞋的也是公司的人，而戴帽子的话无法确定真假，但不影响穿短袖和穿拖鞋者身份的判断。"}, {"id": 11, "q": "传统的“七艺”不包括（ ）", "opts": ["天文", "音乐", "算数", "美术"], "ans": 3, "exp": "传统的“七艺”包括文法、修辞、辩证法、算术、几何、天文和音乐，不包括美术。"}, {"id": 12, "q": "“举一反三”属于教学的（ ）迁移", "opts": ["逆向正迁移", "逆向负迁移", "顺向正迁移", "顺向负迁移"], "ans": 2, "exp": "“举一反三”是指从一件事情类推而知道其他许多事情，体现了先前学习对后续学习的积极影响，且先前学习发生在后续学习之前，因此属于顺向正迁移。"}, {"id": 13, "q": "“社会智力”是（ ）在1920年首次提出", "opts": ["加德纳", "斯皮尔曼", "桑代克", "皮亚杰"], "ans": 2, "exp": "“社会智力”这一概念是由桑代克在1920年首次提出的，用于描述个体在社会交往中表现出的智力能力。"}, {"id": 14, "q": "某学校班主任王某在家长群里通知：“小吴学生，没带校卡，形象不整洁，导致班级被扣一分，全体学生的努力付诸东流，该生明天不准来上课，请家长知悉。若有异议，请家长明日到校说明原因。出现这种低级错误，家长负第一责任，请反省。”王某的做法（ ）", "opts": ["合理，教师有教育学生的义务和管理学生的权力", "不合理，教师不让学生进入教室上课，侵犯了学生的受教育权", "合理，教师进行了有效的家校沟通，有助于家长了解学生的在校表现", "不合理，学校教育是青少年教育最重要的组成部分，教师应对学生的行为负首要责任"], "ans": 1, "exp": "班主任王某因学生未带校卡、形象不整洁而禁止其上课，这侵犯了学生的受教育权。教育权是学生的基本权利之一，教师无权剥夺。"}, {"id": 15, "q": "习近平总书记曾强调，做好教育工作（ ）是根本保证", "opts": ["加强党的全面领导", "提高教师待遇", "加强教师培训", "完善体制机制"], "ans": 0, "exp": "习近平总书记强调，做好教育工作的根本保证是加强党的全面领导。党的领导是教育事业发展的根本保障。"}, {"id": 16, "q": "下列是四位教师对板书书写顺序的看法，其中最恰当的是（ ）", "opts": ["先上后下，先右后左；先小结，后内容，再标题", "先下后上，先左后右；先标题，后小结，再内容", "先上后下，先左后右；先标题，后内容，再小结", "先下后上，先右后左；先内容，后标题，再小结"], "ans": 2, "exp": "板书书写顺序应遵循先上后下、先左后右的原则，先写标题，再写内容，最后写小结，这样有利于学生清晰地把握知识结构和重点。"}, {"id": 17, "q": "小女孩丽丽未来想成为物理学家，但计算能力不强，认为自己能力有限，目标遥不可及。丽丽应该怎么做（ ）", "opts": ["克服内疚", "培养勤奋感", "建立同一性", "缺失"], "ans": 2, "exp": "丽丽未来想成为物理学家，但因计算能力不强而感到目标遥不可及。此时，她需要建立同一性，即明确自己的职业目标和价值观，并为之努力奋斗。"}, {"id": 18, "q": "老师给学生听写单词，属于信息加工中的（ ）阶段", "opts": ["回忆", "了解", "获得", "反馈"], "ans": 0, "exp": "老师给学生听写单词，要求学生回忆之前学过的单词，这属于信息加工中的回忆阶段。"}, {"id": 19, "q": "小红是一名成绩优异的学生。她经常利用零碎时间处理学习上的杂事，例如削铅笔，此外所有与学习有关的东西，她都会有条理的做好，什么东西放在什么地方都心中有数，以免耽误学习时间，由此判断小红使用了（ ）来帮助学习", "opts": ["模式再认策略", "复述策略", "资源管理策略", "精细加工策略"], "ans": 2, "exp": "小红利用零碎时间处理学习上的杂事，并有条理地管理学习用品，这体现了她使用了资源管理策略来帮助学习。资源管理策略包括时间管理、学习环境管理、努力管理和学业求助策略等。"}, {"id": 20, "q": "以下（ ）属于《儿童权利公约》规定的四大权利", "opts": ["平安权利", "参与权利", "人身权利", "优先权利"], "ans": 1, "exp": "《儿童权利公约》规定的四大权利包括生存权利、保护权利、发展权利和参与权利。"}, {"id": 21, "q": "受教育者的权利和义务在以下哪部法律中得以明确规定（ ）", "opts": ["《中华人民共和国义务教育法》", "《中华人民共和国教育法》", "《中华人民共和国教师法》", "《中华人民共和国未成年人保护法》"], "ans": 1, "exp": "《中华人民共和国教育法》明确规定了受教育者的权利和义务，是保障受教育者权益的重要法律。"}, {"id": 22, "q": "教育的（ ）是教育史上第一个正式提出的有关教育起源的学说，也是较早把教育起源问题作为学术问题提出来的学说。该学说的代表人物是法国社会学家、哲学家利托尔诺和英国教育家沛西能。", "opts": ["生物起源说", "心理起源说", "需要起源说", "神话起源说"], "ans": 0, "exp": "教育的生物起源说是教育史上第一个正式提出的有关教育起源的学说，代表人物是利托尔诺和沛西能。该学说认为教育起源于生物的本能。"}, {"id": 23, "q": "在教学过程中，学生的认识可划分为不同阶段，其中（ ）是教学的中心环节", "opts": ["引起学习动机", "领会知识", "巩固知识", "运用知识"], "ans": 1, "exp": "在教学过程中，领会知识是教学的中心环节。领会知识包括使学生感知和理解教材，是教学过程中的重要阶段。"}, {"id": 24, "q": "考试是对学生的学习成果进行检验与鉴定的一种方式，下列是李老师对学生考试结果处理的方式，其中最恰当的是（ ）", "opts": ["高度表扬得高分的学生，严厉批评分数低、成绩退步的学生", "把全班学生的分数公布出来，并按成绩高低进行排名", "根据每个学生的实际情况做出具体的分析指导，给学生指出他们在学习上的优缺点和努力的方向", "赏罚分明，对成绩优异者给予奖励，对成绩差的学生给予严重警告"], "ans": 2, "exp": "最恰当的是根据每个学生的实际情况做出具体的分析指导，给学生指出他们在学习上的优缺点和努力的方向。这种方式既关注了学生的个体差异，又有助于学生的进步和发展。"}, {"id": 25, "q": "古人云：“尽信书，不如无书。”这句话给我们的启示是（ ）", "opts": ["在“读书”过程中发展真理", "坚持用“扬弃”的观点对待书本", "直接经验比间接经验更可靠", "对于书本的知识持肯定态度"], "ans": 1, "exp": "“尽信书，不如无书”这句话启示我们要坚持用“扬弃”的观点对待书本，即既要吸收书本中的有益知识，又要批判地看待其中的不足和错误。"}, {"id": 26, "q": "某小学语文张老师为了让学生对课文的重点段落加深记忆，让学生回家把课文抄写一遍。事后多位家长反映张老师搞应试教育，写字慢的孩子抄到晚上十点多都没抄完。张老师让学生抄写课文的做法（ ）", "opts": ["侵犯了学生的人格尊严权", "属于变相体罚学生的行为", "侵犯了学生的身心健康权", "有利于学生巩固所学知识"], "ans": 2, "exp": "张老师让学生回家抄写课文一遍，导致写字慢的孩子抄到晚上十点多都没抄完，这侵犯了学生的身心健康权。学生有权利在合理的时间内完成学习任务，避免过度劳累。"}, {"id": 27, "q": "化学朱老师本来计划一节课讲两组实验，但是由于学生接受较快，一节课完成了四组实验的讲解和操作，并且学生都纷纷表示知识点听懂了，实验会做了。下列选项中，谁会认为这节课是成功的？（ ）", "opts": ["加利福尼亚大学洛杉矶分校评价研究中心的研究人员(CSE)", "CIPP评价模式的支持者", "泰勒", "斯克里文"], "ans": 2, "exp": "泰勒的目标评价模式强调以目标为中心，通过具体的行为变化来判断教学目标是否达成。朱老师一节课完成了四组实验的讲解和操作，且学生都表示听懂了、会做了，这符合泰勒目标评价模式中教学目标达成的标准。"}, {"id": 28, "q": "班里的学生都非常喜欢上历史课，因此每次上课前，历史老师都会通过小故事给学生提出问题，让学生思考并回答，然后才过渡到新课的学习。由此可见，历史老师是运用了教学方法中的（ ）", "opts": ["讲授法", "谈话法", "讨论法", "读书指导法"], "ans": 1, "exp": "历史老师通过小故事给学生提出问题，让学生思考并回答，然后才过渡到新课的学习，这体现了谈话法的教学方法。谈话法是通过师生间的对话来传授知识、引导学生思考的教学方法。"}, {"id": 29, "q": "下列关于建构主义的表述，正确的是（ ）", "opts": ["认为学习是主动构建的社会性过程，也是“刺激-反应”的简单过程", "知识具有高度的客观性和确定性", "教学不是知识的传递，而是知识的处理和转换", "建构主义的学习理论基本观点包括学习观、学生观、认识观"], "ans": 2, "exp": "建构主义认为教学不是知识的传递，而是知识的处理和转换。教师不是知识的灌输者，而是学生建构知识的帮助者和促进者。"}, {"id": 30, "q": "李老师的教育理想就是要培养既用认知的方式也用情感的方式行事的人，那么李老师最有可能提倡的学习观是（ ）", "opts": ["主动建构", "情境性", "认知——结构", "有意义的自由学习"], "ans": 3, "exp": "李老师的教育理想是培养既用认知的方式也用情感的方式行事的人，这符合罗杰斯提倡的有意义的自由学习观。罗杰斯认为学习应该是学生自我发起、自我评价的，且学习过程应该是愉快的、有意义的。"}, {"id": 31, "q": "林则徐小时候去应童子试，因人群拥挤，他的父亲就扛着他进考场，考官开玩笑道“骑父作马”，引起______，弄得林则徐父亲十分尴尬。谁知，林则徐脱口而出：“望子成龙”，满场为之______。林则徐的回答既解除了父亲的_______，又道出父亲盼儿成材的心情。", "opts": ["哄堂大笑 惊叹不已 窘迫", "唏嘘一片 惊愕失色 困境", "一片喝彩 惊叹不已 尴尬", "拍手叫好 惊喜欲狂 窘境"], "ans": 0, "exp": "根据语境，“骑父作马”这一玩笑话会引起哄堂大笑，使林则徐父亲感到窘迫；而林则徐的回答“望子成龙”则让满场为之惊叹不已，既解除了父亲的窘迫，又道出了父亲盼儿成材的心情。"}, {"id": 32, "q": "科学社会主义的思想来源是（ ）", "opts": ["古典政治经济学", "西方经济学", "黑格尔哲学", "空想社会主义"], "ans": 3, "exp": "科学社会主义的思想来源是空想社会主义。空想社会主义者对资本主义社会进行了深刻的批判，并提出了对未来社会的设想，为科学社会主义的产生提供了思想基础。"}, {"id": 33, "q": "制约教育的性质、领导权和受教育权的根本因素是（ ）", "opts": ["政治经济制度", "社会生产力", "人口数量与质量", "文化习俗"], "ans": 0, "exp": "制约教育的性质、领导权和受教育权的根本因素是政治经济制度。政治经济制度决定了教育的社会性质和目的，也决定了谁有权利接受教育和接受什么样的教育。"}, {"id": 34, "q": "具有鲜明的“中学为体、西学为用”特征的旧中国学制是（ ）", "opts": ["壬寅学制", "癸卯学制", "壬子癸丑学制", "壬戌学制"], "ans": 1, "exp": "具有鲜明的“中学为体、西学为用”特征的旧中国学制是癸卯学制。该学制在保持中国传统教育体制的基础上，吸收了西方近代教育的一些内容和方法。"}, {"id": 35, "q": "马卡连柯说：“儿童集体里的舆论力量，完全是一种物质的、实际可以感触到的教育力量。”这句话提示在教育过程中（ ）", "opts": ["充分发挥班集体的教育功能，使之成为真正的教育力量", "要通过转化个别学生，促进班集体的管理与发展", "要通过制定规章制度管理好学生的日常行为", "班主任要充分掌握管理的主动权"], "ans": 0, "exp": "马卡连柯的话强调了班集体舆论力量的重要性，提示在教育过程中要充分发挥班集体的教育功能，使之成为真正的教育力量。"}]}, {"id": "s2023_2", "type": "multi", "name": "多选题", "score_each": 1.36, "questions": [{"id": 61, "q": "下列不正确的是（ ）", "opts": ["陶行知“教是为了不教”", "叶圣陶“思想合并，兼容并蓄”", "蔡元培“知行合一，首脑并用、理论联系实际”", "黄炎培“职业教育”"], "ans": [0, 1, 2], "exp": "A选项，“教是为了不教”是叶圣陶的教育观点，非陶行知；B选项，“思想合并，兼容并蓄”并非叶圣陶的表述；C选项，“知行合一，首脑并用，理论联系实际”并非蔡元培的表述，蔡元培主张“思想自由，兼容并包”；D选项，黄炎培是中国近代职业教育的创始人，正确。本题要求选不正确的，故选ABC。"}, {"id": 62, "q": "班级的特点有哪些（ ）", "opts": ["学习性", "社会性", "易变性", "向上性"], "ans": [0, 1, 3], "exp": "班级具有学习性、社会性和向上性。班级是学生学习的场所，具有学习性；班级是一个小型社会，具有社会性；班级中存在积极向上的氛围，具有向上性。班级具有一定稳定性，并非易变，故选ABD。"}, {"id": 63, "q": "班级管理的内容包含（ ）", "opts": ["教学", "德育", "体育卫生", "生活指导"], "ans": [0, 1, 2, 3], "exp": "班级管理的内容包括教学、德育、体育卫生和生活指导，全部正确，故选ABCD。"}, {"id": 64, "q": "以下哪些属于高级学习（ ）①老师在课堂上讲解牛顿定律 ②老师讲解完知识点和例题之后让学生重做例题 ③老师讲完导数知识点后，让学生完成相关的导数题目 ④老师在课堂上提问超纲的问题", "opts": ["①②", "③④", "①②③", "①②③④"], "ans": [1], "exp": "①②③都属于初级学习范畴，主要是对已学知识的传授、巩固和练习。④老师在课堂上提问超纲的问题，需要学生运用已有的知识和经验进行深入思考、探索和创新，属于高级学习。所以选B（③④）。"}, {"id": 65, "q": "党的二十大报告指出，未来五年是全面建设社会主义现代化国家开局起步的关键，其主要目标任务包括（ ）", "opts": ["城乡人民居住环境明显改善，美丽中国建设成效显著", "国家安全更为巩固，建军一百年奋斗目标如期实现，平安中国建设扎实推进", "中国国际地位和影响进一步提高，在全球治理中发挥主导作用", "人民精神文化生活更加丰富，中华民族凝聚力和中华文化影响力不断增强"], "ans": [0, 1, 3], "exp": "ABD均为党的二十大报告提出的未来五年主要目标任务。C选项错误，中国在国际治理中发挥重要作用，但不是主导作用。"}, {"id": 66, "q": "下列关于我国中小学德育改革的主要趋势的表述，正确的有（ ）", "opts": ["落实德育工作在素质教育中的首要地位", "因地制宜开展德育活动", "确立符合中小学生思想品德发展实际的德育目标", "积极改进中小学思想品德的教育方法和形式"], "ans": [0, 1, 2, 3], "exp": "ABCD均为我国中小学德育改革的主要趋势。德育在素质教育中处于首要地位；因地制宜开展德育活动能提高德育的针对性和实效性；确立符合实际的目标才能使德育工作有的放矢；改进方法和形式能增强德育效果。"}, {"id": 67, "q": "下列学生学习方法主要运用了复述策略的有（ ）", "opts": ["学生小梨抄知识点来帮助记忆", "学生晓佳将书本知识列提纲以便复习", "学生佳慧利用谐音联想法记记忆古诗", "学生惠敏在文章内容下划线以把握文章重点"], "ans": [0, 3], "exp": "A选项抄知识点是重复抄写加深印象，运用了复述策略；D选项在文章内容下划线是对关键信息进行标记，运用了复述策略。B选项列提纲属于组织策略；C选项谐音联想法属于精加工策略。故选AD。"}]}, {"id": "s2023_3", "type": "judge", "name": "判断题", "score_each": 0.88, "questions": [{"id": 76, "q": "古人说：“蓬生麻中，不扶而直。”说的是遗传对人的影响。（ ）", "ans": 1, "exp": "错误。“蓬生麻中，不扶而直”意思是蓬草生长在麻丛里，不用扶持，自然挺直，强调的是环境对人的影响，而不是遗传对人的影响。"}, {"id": 77, "q": "根据《教育法》地方各级人民政府对教师以及具有中专以上学历的毕业生到少数民族从事教育教学工作，应当予以补贴。（ ）", "ans": 0, "exp": "正确。《中华人民共和国教育法》规定，地方各级人民政府对教师以及具有中专以上学历的毕业生到少数民族地区和边远贫困地区从事教育教学工作的，应当予以补贴。"}, {"id": 78, "q": "关于理性权威与非理性权威的区别就在于，前者排斥情感、后者却依赖情感。（ ）", "ans": 0, "exp": "正确。理性权威是基于理性、知识和逻辑的权威，相对排斥情感因素的干扰。而非理性权威则更多地依赖情感、个人魅力、传统习俗等因素来维持其权威地位。"}, {"id": 79, "q": "格塞尔“双生子爬梯实验”的结果表明，家庭教育在儿童身心发展中作用更显著。（ ）", "ans": 1, "exp": "错误。格塞尔“双生子爬梯实验”的结果表明，儿童的发展取决于成熟，成熟的顺序对儿童发展的顺序起决定性作用。该实验强调的是成熟机制在儿童身心发展中的关键作用，而不是家庭教育的作用。"}, {"id": 80, "q": "教师若持有性恶论的人性假设，其教育方法会更加注重“外铄”。（ ）", "ans": 0, "exp": "正确。性恶论认为人性本恶，需要通过外在的教育和规范来约束和改造人的行为。持有性恶论人性假设的教师，会认为学生的发展主要依靠外在的力量，因此其教育方法会更加注重“外铄”。"}, {"id": 81, "q": "教育部印发了《义务教育课程方案和课程标准》，从有理想、有本领、有担当三个方面，明确义务教育阶段时代新人培养的具体要求。（ ）", "ans": 0, "exp": "正确。教育部印发的《义务教育课程方案和课程标准》，从有理想、有本领、有担当三个方面，明确了义务教育阶段时代新人培养的具体要求。"}, {"id": 82, "q": "数学、化学、生物等学科内容缺乏美的元素，教师很难在相应课程教学中开展美育。（ ）", "ans": 1, "exp": "错误。数学、化学、生物等学科内容中蕴含着丰富的美的元素。例如数学中的对称美、简洁美、逻辑美；化学中的物质结构美、化学反应的奇妙美；生物中的生命现象的和谐美、生态系统的平衡美等。"}, {"id": 83, "q": "创造力是一种特殊的智力品质，智力越高的人创造力水平越高。（ ）", "ans": 1, "exp": "错误。创造力是一种特殊的智力品质，但智力高的人创造力水平不一定高。创造力不仅与智力有关，还与个性特征、知识经验、动机、环境等多种因素密切相关。"}, {"id": 84, "q": "个案研究法是在某一时间点针对某一个体、某一群体或某一组织进行调查，从而研究其行为的一种研究方法。（ ）", "ans": 1, "exp": "错误。个案研究法是对单个对象的某项特定行为或问题进行探索研究，它强调在较长时间内对研究对象进行连续、深入、全面的调查和分析，而不仅仅是在某一时间点进行调查。"}]}]}, {"id": "2024", "title": "2024年揭阳惠来教师招聘考试真题卷", "subtitle": "《教育综合知识》· 7月13日", "sections": [{"id": "s2024_1", "type": "single", "name": "单选题", "score_each": 1.18, "questions": [{"id": 1, "q": "教育家精神与习近平好老师的首位的是（ ）", "opts": ["要有道德情操", "要有理想信念", "要有扎实学识", "要有仁爱之心"], "ans": 1, "exp": "在教育家精神与习近平对好老师的要求中，“要有理想信念”居于首位。理想信念是教育的灵魂所在，是教师安身立命的根本。"}, {"id": 2, "q": "学校教育制度简称学制，正确的说法有（ ）项。\n①壬寅学制是一个学制，但未真正实行\n②癸卯学制由张百熙于1914年颁布\n③学校教育可以分为单轨学制、双轨学制以及分支型学制", "opts": ["0", "1", "2", "3"], "ans": 2, "exp": "①正确，壬寅学制是中国近代教育史上最早由国家颁布的学制系统，但并未真正实行；②错误，癸卯学制是1904年颁布的，不是1914年；③正确，从学校系统角度，学校教育制度可分为单轨学制、双轨学制和分支型学制。有两个说法正确，选C。"}, {"id": 3, "q": "“孟母三迁”等俗语均表明（ ）", "opts": ["教育要适应人的身心发展规律", "学校教育在人的发展中起主导作用", "环境为个体的发展提供了多种可能", "学校教育能有效地控制学生个人发展的各种因素"], "ans": 2, "exp": "“孟母三迁”体现了环境对个体发展的影响。环境为个体发展提供了多种可能，良好的环境能提供丰富的资源和积极的氛围。"}, {"id": 4, "q": "教育目的不仅明确，这表明教育目的具有（ ）", "opts": ["定向作用", "评价作用", "调控作用", "激励作用"], "ans": 0, "exp": "明确的教育目的为教育活动指明了方向，使教育工作者清楚要培养什么样的人，从而确定教育内容、选择教育方法、安排教育活动等，这直接体现了其定向作用。"}, {"id": 5, "q": "学校教育通过传承文化，使人挣脱奴性、物性，这主要体现了文化知识在（ ）方面的作用。", "opts": ["促进人的认识的发展", "促进人的精神的发展", "促进人的能力的发展", "促进人的实践发展"], "ans": 1, "exp": "文化知识能促进人的精神的发展，通过传承文化，使个体获得精神滋养，摆脱奴性、物性，提升精神境界和人格修养。"}, {"id": 6, "q": "教育不仅传播科学技术，还能促进生产力的发展，这体现了教育的（ ）", "opts": ["个体谋生功能", "个体享用功能", "生态功能", "经济功能"], "ans": 3, "exp": "教育通过传播科学技术，培养高素质人才，提高劳动者的素质和生产效率，从而促进生产力的发展，这体现了教育的经济功能。"}, {"id": 7, "q": "国家和地方政府政策的倾斜，对课程实施产生很大的影响，这属于（ ）对课程实施的影响。", "opts": ["教师的培训", "各种外部因素的支持", "课程实施的组织和领导", "交流与合作的方式"], "ans": 1, "exp": "国家和地方政府政策的倾斜，能为课程实施提供资源、资金、政策支持等外部因素，属于各种外部因素的支持对课程实施的影响。"}, {"id": 8, "q": "在西方，（ ）的思想早在柏拉图时代就提出了。", "opts": ["学科中心课程论", "人本主义课程论", "活动课程理论", "社会再造主义课程论"], "ans": 0, "exp": "在西方教育思想史上，学科中心课程论的思想早在柏拉图时代就已提出。柏拉图强调知识的系统性和逻辑性，主张以学科为中心组织课程内容。"}, {"id": 9, "q": "通常在新学期开始前，学校进行课程开发属于课程内容中的（ ）", "opts": ["课程计划", "课程标准", "编写教材", "课程开发"], "ans": 0, "exp": "通常在新学期开始前，学校进行的课程开发主要是制定课程计划，课程计划是根据教育目的和不同类型学校的教育任务，由国家教育主管部门制定的有关教学和教育工作的指导性文件。"}, {"id": 10, "q": "为了加深学生对书本知识的理解，进行大规模的活动属于（ ）", "opts": ["游戏活动", "学科活动", "科技活动", "文体活动"], "ans": 1, "exp": "学科活动是以学科为中心，围绕学科知识开展的活动，如学科竞赛、学科讲座等，能加深学生对书本知识的理解。"}, {"id": 11, "q": "下列教学原则中，（ ）是理论联系实际的实践体现。", "opts": ["理论联系实际原则", "巩固性原则", "启发性原则", "量力性原则"], "ans": 0, "exp": "理论联系实际原则强调教学要以学习基础知识为主导，从理论与实际的联系上去理解知识，注意运用知识去分析问题和解决问题，达到学懂会用、学以致用。"}, {"id": 12, "q": "在历史课上，教师特意选用实物进行教学，这种方法属于直观教学中的（ ）", "opts": ["实物直观", "感性直观", "模象直观", "言语直观"], "ans": 0, "exp": "实物直观是通过直接感知要学习的实际事物而进行的一种直观方式，在历史课上教师特意选用实物进行教学，属于实物直观。"}, {"id": 13, "q": "关于下图的方法正确的是（ ）", "opts": ["有利于提高教学效率", "有利于促进教育公平", "没有尊重学生学习的主体性", "体现了教师在教学过程中的从属地位"], "ans": 2, "exp": "图中教学方法过于强调教师主导，忽视学生主体地位，没有尊重学生学习的主体性。"}, {"id": 14, "q": "学期末，班主任对学生的评价是“虽然你取得了一些进步，但不要满足于现状，争取更好。”这种评价属于（ ）", "opts": ["量化评价", "质性评价", "绝对评价", "相对评价"], "ans": 1, "exp": "班主任用描述性的语言对学生的表现进行评价，属于质性评价。质性评价是通过自然调查，全面充分地揭示和描述评价对象的各种特质。"}, {"id": 15, "q": "在教师教育研究中，如果研究对象只能选择“是”或“否”，则这份问卷被称为（ ）", "opts": ["封闭式问卷", "半封闭式问卷", "开放式问卷", "结构化问卷"], "ans": 0, "exp": "封闭式问卷是指问卷中所有问题都有固定答案，研究对象只能选择“是”或“否”等固定选项。"}, {"id": 16, "q": "下列关于课程改革的说法不正确的是（ ）", "opts": ["课程改革的核心是价值命题的变革", "课程改革与社会改革没有联系", "课程改革必然对课程的形态或形式进行变革", "课程改革是教育改革的核心"], "ans": 1, "exp": "课程改革与社会改革联系紧密，社会改革对人才的需求会推动课程改革，课程改革培养的人才也会影响社会改革，所以“课程改革与社会改革没有联系”说法错误。"}, {"id": 17, "q": "教师的劳动价值是以学生的成长为体现的，这主要反映了教师工作具有（ ）的特点。", "opts": ["劳动时间的延续性", "劳动空间的广延性", "主体性和示范性", "长期性和间接性"], "ans": 3, "exp": "教师的劳动价值不是立竿见影的，而是以学生的成长为体现，需要经过较长时间才能看到效果，且教师并不直接创造物质财富，而是通过培养学生的品德、知识和能力等间接影响社会发展。"}, {"id": 18, "q": "陈老师既不参加学生的活动，也不干涉学生的行为，任其自然，这种领导类型最可能属于（ ）", "opts": ["权威型", "仁慈型", "放任型", "民主型"], "ans": 2, "exp": "放任型领导类型的教师既不参加学生的活动，也不干涉学生的行为，任其自然，符合题干描述。"}, {"id": 19, "q": "一个人最早接受的教育是家庭教育，这主要体现出家庭教育具有的特点是（ ）", "opts": ["先导性", "专业性", "权威性", "针对性"], "ans": 0, "exp": "先导性是指家庭教育是一个人最早接受的教育，在个体成长中起着引领和基础作用。"}, {"id": 20, "q": "德育过程是培养学生知、情、意、行的过程，当学生对是非善恶进行判断时产生的内心体验属于（ ）", "opts": ["知", "情", "意", "行"], "ans": 1, "exp": "情即道德情感，是人们对社会思想道德和人们行为的爱憎、好恶等情绪态度，是进行道德判断时引发的一种内心体验。"}, {"id": 21, "q": "在某次考试中，学生小军抄袭被发现，老师对其进行说服教育，这种德育方法为（ ）", "opts": ["说服教育法", "情感陶治法", "品德评价法", "道德修养法"], "ans": 0, "exp": "说服教育法是通过摆事实、讲道理，使学生提高认识、形成正确观点的方法。老师对抄袭的小军进行说服教育，符合说服教育法的特点。"}, {"id": 22, "q": "西方教育思想家中，提出儿童教育要尊重其自然发展的思想家是（ ）", "opts": ["福禄贝尔", "裴斯泰洛齐", "卢梭", "洛克"], "ans": 2, "exp": "卢梭提出儿童教育要尊重其自然发展的思想，主张让儿童在自然的环境中自由成长。"}, {"id": 23, "q": "埃里克森认为，3-6岁的儿童面临的心理冲突是（ ）", "opts": ["信任对怀疑", "自主对羞愧", "主动对内疚", "亲密对孤独"], "ans": 2, "exp": "埃里克森将人格发展分为八个阶段，3-6岁儿童面临的心理冲突是主动对内疚。"}, {"id": 24, "q": "在记忆过程中，学生小明通过编故事记住了很多单词，这主要利用了记忆的（ ）", "opts": ["关联性", "序列性", "形象性", "逻辑性"], "ans": 2, "exp": "小明通过编故事记单词，将单词转化为故事中的形象，利用了记忆的形象性。形象性是指通过将抽象的信息转化为具体的形象来帮助记忆。"}, {"id": 25, "q": "在学习外语时，学习语法规则属于（ ）的学习。", "opts": ["程序性知识", "陈述性知识", "感知性知识", "情感性知识"], "ans": 1, "exp": "学习语法规则是对语言规则的认知和掌握，属于陈述性知识。陈述性知识是关于“是什么”的知识。"}, {"id": 26, "q": "当一个学生在课堂上一直表现出色，但在一次考试中失误后，老师对他的评价变得消极，这属于（ ）的影响。", "opts": ["刻板效应", "首因效应", "近因效应", "霍桑效应"], "ans": 2, "exp": "近因效应是指在总体印象形成上，新近获得的信息比原来获得的信息影响更大的现象。学生一直表现出色，但一次考试失误后老师评价变得消极，体现了近因效应。"}, {"id": 27, "q": "斯金纳认为教育就是通过行为（ ）达到目标的过程，旨在通过小步反馈帮助学生达到目标。", "opts": ["连锁", "维持", "泛化", "塑造"], "ans": 3, "exp": "塑造是指通过小步反馈帮助学生达到目标的过程，符合斯金纳的观点。"}, {"id": 28, "q": "李洁在毕业后的职业选择中遇到困惑，是去大城市还是留在家乡陪伴家人，他在这两个选择之间犹豫不决。李洁的这种动机冲突属于（ ）", "opts": ["双避型", "趋避型", "双趋型", "多重趋避型"], "ans": 2, "exp": "双趋型冲突是指个体同时对两个同等目标具有吸引力，但只能选其中一个时所产生的动机冲突。李洁在去大城市和留在家乡陪伴家人这两个有吸引力的选择之间犹豫不决，属于双趋型冲突。"}, {"id": 29, "q": "训犬员为了防止狗随地大小便，每次发现狗在错误的地方便时都会用工具给予刺激，这种做法属于（ ）", "opts": ["正强化", "负强化", "正惩罚", "负惩罚"], "ans": 2, "exp": "正惩罚是指给予一个厌恶刺激，以降低行为出现的概率。训犬员发现狗在错误地方便时用工具给予刺激，属于正惩罚。"}, {"id": 30, "q": "蒋老师班级的小王同学参与了欺凌弱小的行为，这属于典型的（ ）", "opts": ["霸凌行为", "侵犯行为", "破坏行为", "自主行为"], "ans": 1, "exp": "侵犯行为是指有意伤害他人的行为，小王参与欺凌弱小的行为，属于典型的侵犯行为。"}, {"id": 31, "q": "周老师的教龄已有30年，拥有丰富的教学经验和深厚的教育教学功底，但他从未停止学习的脚步。他不仅积极参加各类教育培训和学术研讨活动，还自主阅读大量教育领域的前沿书籍和期刊，不断更新自己的教育理念和教学方法，以适应新时代教育发展的需求。周老师所承担的角色主要是（ ）", "opts": ["传道者", "研究者", "终身学习者", "管理者"], "ans": 2, "exp": "周老师教龄长但从未停止学习，积极参加培训和研讨，自主阅读前沿书籍期刊，体现了终身学习者的角色。"}, {"id": 32, "q": "小玲在学习声乐的过程中，为了提升自己的演唱水平，每天都会早起进行发声练习，认真钻研声乐技巧，遇到不懂的问题就向专业老师请教，还积极参加各种声乐表演活动来积累经验。经过一段时间的不懈努力，她的声乐水平有了显著提高。当被问及取得进步的原因时，小玲认为主要是自己坚持不懈地付出努力才有了现在的成果。小玲的这种归因属于（ ）的因素。", "opts": ["内部、稳定、可控", "内部、不稳定、可控", "内部、稳定、不可控", "外部、不稳定、不可控"], "ans": 1, "exp": "韦纳的归因理论中，努力属于内部、不稳定、可控的因素。小玲认为取得进步主要是自己坚持不懈地付出努力。"}, {"id": 33, "q": "小华非常喜欢钢琴，从儿时起，他就对钢琴那优美的音色和丰富的表现力深深着迷。他梦想着有一天能够成为像郎朗那样的钢琴大师，在世界的舞台上绽放光彩。为了实现这个梦想，小华每天都会坚持练习钢琴数小时，主动学习各种复杂的乐理知识，积极参加各类钢琴比赛和演出活动。这种学习动机是（ ）", "opts": ["内在近景性学习动机", "内在远景性学习动机", "外在近景性学习动机", "外在远景性学习动机"], "ans": 1, "exp": "小华梦想成为钢琴大师是长远目标，且源于自身对钢琴的热爱，属于内在远景性学习动机。"}, {"id": 34, "q": "小张在掌握了弹奏吉他的技巧后，发现学习尤克里里变得轻松许多。他能够快速地理解尤克里里的指法、和弦转换等要点，并且弹奏起来也更加得心应手。这种因掌握弹奏吉他的技巧而对学习尤克里里产生的积极影响称为（ ）", "opts": ["正迁移", "负迁移", "横向迁移", "纵向迁移"], "ans": 0, "exp": "正迁移是指一种学习对另一种学习起到积极的促进作用。小张掌握弹奏吉他技巧后学习尤克里里变得轻松，是正迁移。"}, {"id": 35, "q": "班长小兰在班级事务管理中表现得十分沉稳。每次组织班级活动时，她都会提前制定详细且周全的计划，并严格按照计划推进。面对同学们之间偶尔发生的小摩擦和矛盾，她从不急躁冲动，而是耐心倾听双方的诉求，冷静分析问题，以平和且理性的方式化解矛盾。小兰的气质类型倾向于（ ）", "opts": ["胆汁质", "多血质", "黏液质", "抑郁质"], "ans": 2, "exp": "黏液质的人安静稳重踏实，反应性低，交际适度，自制力强（性格坚韧），话少，适于从事细心、程序化的学习，表现出内倾性。小兰沉稳、冷静的特征符合黏液质特点。"}, {"id": 36, "q": "有研究发现，教师在教学过程中，当学生完成一项学习任务后，教师及时给予学生反馈，包括一些鼓励性的话语，如“你这次作业完成得非常认真，思路清晰，继续保持！”“你在课堂讨论中的观点很有创意，为你点赞！”等，会显著提高学生的学习效果。这是因为（ ）", "opts": ["正确地运用奖励和惩罚的手段能提高学生的学习效果", "适当运用竞争的手段能让学生获得更多成功", "教学模式的转换会促进学生产生学习的动力", "及时让学生得到反馈，会提高其学习热情，增加其努力程度"], "ans": 3, "exp": "及时让学生得到反馈，会提高其学习热情，增加其努力程度，符合教师及时给予学生反馈提高学生学习效果的原因。"}, {"id": 37, "q": "下列选项中属于增补反馈的是（ ）", "opts": ["学生对家长说写字手酸", "教师问学生说“这道题听懂了吗”", "学生告诉教练说“练习某个动作时不流畅”", "运动员借助摄像机与可穿戴式传感器，了解自己的动作标准度"], "ans": 3, "exp": "增补反馈是指由外部提供的关于运动操作特征或结果的反馈信息。运动员借助摄像机与可穿戴式传感器了解自己的动作标准度，是外部设备提供的关于运动操作特征的反馈，属于增补反馈。"}, {"id": 38, "q": "在学习汽车驾驶技能时，每人练习完一次休息30分钟，再进行第二次练习。这种练习的方式为（ ）", "opts": ["集中练习", "分布练习", "高强度练习", "低强度练习"], "ans": 1, "exp": "分布练习是指将练习时间分散开，中间有休息间隔。每人练习完一次休息30分钟，再进行第二次练习，属于分布练习。"}, {"id": 39, "q": "语文课上，周老师给学生介绍了一些成语故事，根据加涅的学习结果分类，这里发生的是（ ）的学习。", "opts": ["言语信息", "智慧技能", "认知策略", "社会技能"], "ans": 0, "exp": "言语信息是指掌握以言语信息传递的内容。周老师给学生介绍成语故事，学生获得的是关于成语故事的知识，属于言语信息的学习。"}, {"id": 40, "q": "在绘画课上，老师向学生展示了多种颜色的叶子，但指出大多数树叶实际上是绿色的。这主要反映了知觉具有（ ）", "opts": ["整体性", "选择性", "理解性", "恒常性"], "ans": 3, "exp": "知觉的恒常性是指当知觉的条件在一定范围内发生改变时，知觉的映象仍然保持相对不变。老师向学生展示多种颜色叶子但指出大多数树叶实际上是绿色的，体现了知觉的恒常性。"}, {"id": 41, "q": "每逢开学季，叶老师都会向学生家长收取一些额外费用，这一做法（ ）", "opts": ["符合教师的本职工作", "违背了廉洁从教的原则", "能有效约束学生家长的行为", "履行了教书育人的职责"], "ans": 1, "exp": "廉洁从教要求教师坚守高尚情操，发扬奉献精神，自觉抵制社会不良风气影响，不利用职责之便谋取私利。叶老师向学生家长收取额外费用违背了廉洁从教的原则。"}, {"id": 42, "q": "根据《教育法》的相关规定，学校应加强对（ ）的互认和衔接，推动全民终身学习。", "opts": ["校外教育", "远程教育", "继续教育", "高等教育"], "ans": 2, "exp": "《教育法》规定学校应加强对继续教育的互认和衔接，推动全民终身学习。"}, {"id": 43, "q": "我国《教育法》对各类学生的基本权利进行了明确规定，以下不属于学生基本权利的是（ ）", "opts": ["获得奖学金、贷学金", "养成良好的思想品德和行为习惯", "使用学校图书馆、投影仪", "在品行上获得老师公正评价"], "ans": 1, "exp": "养成良好的思想品德和行为习惯是学生的义务，而非权利。"}, {"id": 44, "q": "对于有不良行为且拒不改正的学生，学校和教师通常会采取一系列教育措施来引导其改正。下列选项中，不宜用于此类情况的教育措施是（ ）", "opts": ["予以训教", "要求参加特定的专题教育", "要求参加校内服务活动", "指派班级的优秀学生实施教育惩戒"], "ans": 3, "exp": "指派班级的优秀学生实施教育惩戒不符合科学、合理且符合教育规律的原则，优秀学生不具备实施教育惩戒的专业能力和权力。"}, {"id": 45, "q": "根据《家庭教育促进法》相关规定，在家庭教育中，父母对未成年子女负有不可推卸的责任。当父母离异后，关于家庭教育的责任承担，下列说法正确的是（ ）", "opts": ["拥有抚养权的一方应履行家庭教育的主要责任，另一方为次要责任", "拥有抚养权的一方应全面履行家庭教育责任，另一方无需履行", "父母双方应相互配合履行家庭教育责任", "由未成年人的祖父母履行家庭教育责任"], "ans": 2, "exp": "根据《家庭教育促进法》，父母对未成年子女负有家庭教育责任，即使父母离异，也应相互配合履行家庭教育责任。"}, {"id": 46, "q": "在教育领域，近年来随着升学竞争压力的不断增大以及社会对教育成果的过度关注，一种不良现象逐渐凸显。部分家长和学校为了追求学生在学业成绩上的突出表现，不断给学生增加学习负担。这种过度追求成绩、忽视学生身心健康和全面发展的行为，恰当的描述这种现象发展趋势的选项是（ ）", "opts": ["悄然兴起", "愈演愈烈", "前赴后继", "层出不穷"], "ans": 1, "exp": "愈演愈烈是指事情（情况）变得越来越严重，符合随着升学竞争压力增大和社会对教育成果过度关注，这种不良现象不断加剧的情况。"}, {"id": 47, "q": "我们必须牢记：高质量的教育是民族振兴、社会进步的重要基石，是功在当代、利在千秋的德政工程。在推动教育事业发展的进程中，我们要构建一套科学、完善且行之有效的教育体系，让各项教育政策、措施真正落实到位。依次填入画横线部分最恰当的一项是（ ）", "opts": ["创造 自力更生", "建造 独立自主", "制造 自强不息", "建立 自立自强"], "ans": 3, "exp": "第一空，“建立”有开始成立、开始产生、开始形成的意思，“构建教育体系”搭配恰当；第二空，“自立自强”强调依靠自己的力量立足并奋发图强，符合语境。"}, {"id": 48, "q": "在当下的教育场景中，很多家长喜欢“统一”，他们希望孩子在学校接受的教育模式、作业布置等方面都整齐划一。然而，每个孩子都有独特的学习节奏、兴趣爱好和知识掌握程度，这种“统一”的做法往往难以满足不同孩子的成长需求。这段文字最恰当的标题是（ ）", "opts": ["学生作业要保持统一", "作业多少算适量", "适合的作业才是最好的", "教师应如何布置作业"], "ans": 2, "exp": "文段主要论述了很多家长在教育孩子时喜欢“统一”，不考虑孩子个体差异和实际学习情况，这种做法难以满足不同孩子的成长需求。“适合的作业才是最好的”强调要根据孩子个体情况，符合文段主旨。"}, {"id": 49, "q": "“蛟龙”号成功下潜至7000米深海，深海中每下潜10米水压增加约1个大气压，7000米深度时其承受的水压高达700个大气压。如此巨大的水压，对潜水器的材料、结构和密封技术等方面提出了极高要求。这段文字强调了（ ）", "opts": ["载人潜水器的研发要解决材料、结构和密封技术等问题", "目前中国已经拥有“蛟龙”号深度载人潜水器", "“蛟龙”号下潜时，主要依赖的是先进的导航系统", "潜水器下潜深度与压力的关系密切"], "ans": 0, "exp": "文段开篇指出“蛟龙”号下潜至7000米深海面临巨大水压，接着阐述巨大水压对潜水器的材料、结构和密封技术等方面提出极高要求，重点在于强调研发要解决材料、结构和密封技术等问题。"}, {"id": 50, "q": "民间有“一年补透透，不如补霜降”的说法，凸显秋季进补重要性。霜降是秋季末节气，有独特风俗。请将以下句子组成语意连贯语段，排序最恰当的一项是（ ）\n①“霜打菊花开”，登高赏菊习俗从重阳延续到霜降。\n②霜降节气有登高望远、赏菊饮酒等传统风俗。\n③因此，霜降是登高亲近自然的好时机。\n④不过从养生看，霜降登高习俗或与进补有内在联系。\n⑤“霜打菊花开”描绘霜降菊花盛开之景。", "opts": ["②③④⑤①", "②⑤⑥③④①", "⑤⑥②①③④", "⑤②①③⑥④"], "ans": 1, "exp": "②句引出霜降节气有登高望远、赏菊饮酒等传统风俗的话题，应为首句；⑤句描绘霜降菊花盛开之景，是对②句中赏菊习俗的具体描述，应紧跟②句；⑥句“因此，霜降是登高亲近自然的好时机”承接⑤句；③句通过“不过”转折，从养生角度进一步阐述；④句再次提到“霜打菊花开”和登高赏菊习俗；①句放在最后总结。排序为②⑤⑥③④①。"}, {"id": 51, "q": "今年小明的年龄是爸爸年龄的一半，明年爸爸的年龄是小明年龄的两倍，则小明今年是（ ）岁。", "opts": ["9", "10", "12", "15"], "ans": 1, "exp": "设小明今年x岁，则爸爸今年2x岁。明年小明x+1岁，爸爸2x+1岁。由题意：2x+1=2(x+1)，解得x=10。"}, {"id": 52, "q": "某导师为其研究生发放奖学金，已知该导师指导的研究生中，有获得一等奖学金且为硕士研究生的，也有获得二等奖学金且为硕士研究生的。具体信息如下：获得一等奖学金的有3人，其中1人是博士研究生，其余为硕士研究生；获得二等奖学金的有5人，其中2人是博士研究生，其余为硕士研究生；另外，还有1名硕士研究生未获得任何奖学金。最后统计出共有（ ）名硕士研究生。", "opts": ["3", "4", "5", "6"], "ans": 3, "exp": "获得一等奖学金的硕士研究生有3-1=2人；获得二等奖学金的硕士研究生有5-2=3人；还有1名硕士研究生未获得任何奖学金。所以硕士研究生总人数为2+3+1=6人。"}, {"id": 53, "q": "根据所给材料，得出一个最合理的答案（ ）", "opts": ["（缺）", "（缺）", "（缺）", "（缺）"], "ans": 0, "exp": "（此题缺失）"}, {"id": 54, "q": "与“水滴石穿”意思相近的一项是（ ）", "opts": ["绳锯木断：坚持不懈", "风吹草动：草木皆兵", "雾里看花：水中捞月", "雪中送炭：锦上添花"], "ans": 0, "exp": "“水滴石穿”比喻只要有恒心，不断努力，事情就一定能成功。“绳锯木断”和“坚持不懈”都与“水滴石穿”意思相近，都强调了坚持不懈的重要性。"}, {"id": 55, "q": "广场舞既能锻炼身体也能促进社交互动，以下选项如果为真，最能作为以上结论前提的是（ ）", "opts": ["不是专业舞者跳广场舞会造成膝关节损伤", "加强臀部及下肢的肌肉锻炼，可以给关节带来足够的支撑和保护", "高难度的大跨步、下肢扭转的动作大量运用到膝关节", "肥胖会加重膝关节的负担，增加膝关节软骨磨损"], "ans": 1, "exp": "加强臀部及下肢的肌肉锻炼，可以给关节带来足够的支撑和保护，这直接支持了广场舞（作为一种包含臀部及下肢肌肉锻炼的活动）能够锻炼身体，是结论成立的前提。"}, {"id": 56, "q": "心理咨询是指运用心理学的方法进行专业帮助，以下属于心理咨询的是（ ）", "opts": ["小李每次遇到工作上的难题，都会向他姐姐寻求帮助", "医生通过疏导和专业建议使长期抑郁的小红情绪好转", "老钱自诩为情感专家，经常向失恋的女同事提供建议", "在听完下属的抱怨后，老王建议他提高心理抗压能力"], "ans": 1, "exp": "医生通过疏导和专业建议使长期抑郁的小红情绪好转，运用了心理学的方法（疏导和专业建议）来提供专业帮助，符合心理咨询的定义。"}, {"id": 57, "q": "小黄并非既能参加钢琴培训班又能参加小提琴培训班，以下选项一定为真的是（ ）", "opts": ["小黄只能参加钢琴培训班", "小黄只能参加小提琴培训班", "小黄既不能参加钢琴培训班，也不能参加小提琴培训班", "如果小黄能参加钢琴培训班，那么他一定不能参加小提琴培训班"], "ans": 3, "exp": "题干指出小黄不能同时参加两个培训班，因此如果他能参加其中一个，就一定不能参加另一个。"}, {"id": 58, "q": "填入材料中画横线1处的数值是（ ）", "opts": ["1.9%", "7.9%", "9.1%", "10.9%"], "ans": 0, "exp": "根据材料“2022年幼儿园数量较上一年度的增长率为1.9%”可知，填入材料中画横线1处的数值是1.9%。"}, {"id": 59, "q": "2022年，全国普惠性幼儿园占全国幼儿园的比重约为（ ）", "opts": ["50.9%", "75.8%", "85.0%", "95.7%"], "ans": 2, "exp": "根据材料“2022年，全国普惠性幼儿园数量占全国幼儿园总数的比重约为85.0%”可知。"}, {"id": 60, "q": "根据上述材料，正确的有（ ）项\n①2021年，普惠性幼儿园在园幼儿的比例超过85%\n②2022年，全国在园幼儿数量减少约200万人\n③2025年，学前教育普惠性幼儿园覆盖率超过95%", "opts": ["0", "1", "2", "3"], "ans": 2, "exp": "①错误，2021年比例为84.2%，未超过85%；②正确，材料明确说明减少约200万人；③正确，材料中提到2025年目标是超过95%（但未表明已达成），该项表述为“2025年超过95%”作为目标陈述是正确的。正确的有②③两项。"}]}, {"id": "s2024_2", "type": "multi", "name": "多选题", "score_each": 1.36, "questions": [{"id": 61, "q": "陶行知先生倡导“生活即教育”“教学做合一”等理念，在相关教育实践探索中，涉及为学生制定任务清单。此类任务清单整体应呈现出（ ）等特点。", "opts": ["实践性", "开放性", "功利性", "进阶性"], "ans": [0, 1, 3], "exp": "陶行知的教育理念强调实践与生活的结合。任务清单应包含实践性、开放性和进阶性。功利性与陶行知的教育理念相悖。故选ABD。"}, {"id": 62, "q": "美国教育家布鲁纳是认知结构学习理论的代表人物，其教育思想影响深远。他提出的教育相关观点包括（ ）", "opts": ["以学科结构为课程中心", "教育的主要目的是为每一个具体的人服务", "倡导发现式学习法", "基本结构要与学生的认识发展水平相一致"], "ans": [0, 2, 3], "exp": "布鲁纳强调学科的基本结构，提倡发现式学习法，认为基本结构要与学生的认知发展水平相一致。教育的主要目的是为每一个具体的人服务并非布鲁纳的主要教育思想。故选ACD。"}, {"id": 63, "q": "隐性课程又叫“非正规课程”“潜在课程”等，它是指学校情境中以间接的、内隐的方式呈现的课程。隐性课程对学生的影响往往是潜移默化的，以下属于隐性课程对学生发挥作用的体现有（ ）", "opts": ["激励", "同化", "暗示", "心理调适"], "ans": [0, 1, 2, 3], "exp": "隐性课程中的师生关系、校园文化等可以激励学生；学生在隐性课程的影响下会逐渐接受并内化学校的价值观和行为规范；隐性课程中的各种元素可能对学生产生暗示作用；隐性课程中的和谐氛围可以帮助学生进行心理调适。全部正确，故选ABCD。"}, {"id": 64, "q": "人们对教学的任务有着不同的认识和理解，以下关于教学任务的说法中，正确的有（ ）", "opts": ["应根据学生发展的需要和学科特点来确定教学任务与重点，教学重点应随着学生认知水平提升等进行动态调整", "教学的基础性任务是引导学生掌握科学文化基础知识和基本技能", "每门学科的教学都要兼顾全面性，同时要担起本学科应当承担的特有的任务", "发展学生的体力、智力、能力，培养学生的创新精神和实践能力，是教学任务的重要组成部分"], "ans": [0, 1, 2, 3], "exp": "ABCD均为关于教学任务的正确说法。"}, {"id": 65, "q": "运用问卷调查法开展研究时，一份完整且规范的调查问卷一般由（ ）组成。", "opts": ["调查题目", "被调查者的自然状况", "指导语", "需要回答的问题"], "ans": [0, 1, 2, 3], "exp": "一份完整且规范的调查问卷通常由调查题目、被调查者的自然状况、指导语和需要回答的问题组成。全部正确，故选ABCD。"}, {"id": 66, "q": "下列关于学校文化的表述，正确的有（ ）", "opts": ["学校文化是一种相对稳定的文化", "学校文化对学生和教师的行为具有约束力", "学校文化就是校园文化，即校风、班风", "学校文化体现着一个学校的个性"], "ans": [0, 1, 3], "exp": "学校文化是一种相对稳定的文化，对学生和教师的行为具有约束力，体现着一个学校的个性。学校文化不仅仅包括校园文化，还涉及学校的办学理念、管理制度等多个方面。C选项表述过于狭隘，错误。故选ABD。"}, {"id": 67, "q": "观察法作为教育研究中的重要方法，在运用观察法进行研究时需要注意的有（ ）", "opts": ["观察目的不应太明确", "要使被观察者尽量处于自然状态", "观察时要做到客观和精确", "要善于记录跟观察目的有关的事实"], "ans": [1, 2, 3], "exp": "观察法要求被观察者在自然状态下进行活动，观察者需要保持客观中立的态度，尽可能精确地记录观察结果，善于捕捉和记录与观察目的相关的事实和信息。观察目的应该明确具体。A选项错误。故选BCD。"}, {"id": 68, "q": "认知风格是个体在感知、记忆、思维等方面的差异，主要包括（ ）等。", "opts": ["视觉型与言语型", "冲动型与反思型", "活跃型与沉思型", "场独立型与场依存型"], "ans": [0, 1, 3], "exp": "认知风格包括视觉型与言语型、冲动型与反思型、场独立型与场依存型等。活跃型与沉思型这一分类并不常见于认知风格的描述中。故选ABD。"}, {"id": 69, "q": "为了激励小华，妈妈决定带他去玩游戏、吃自助餐、奖励500元现金和笔记本电脑，其中属于二级强化物的有（ ）", "opts": ["玩游戏", "自助餐", "500元现金", "笔记本电脑"], "ans": [0, 1, 2], "exp": "二级强化物是指那些原本不具有强化作用，但通过与一级强化物的结合而获得强化作用的刺激。玩游戏、自助餐、500元现金作为妈妈给予的奖励，可以视为二级强化物。笔记本电脑通常被视为一种高级需求，更可能被视为一级强化物。故选ABC。"}, {"id": 70, "q": "下列属于开放性动作技能的有（ ）", "opts": ["打鸡蛋", "滑冰", "开车", "射箭"], "ans": [1, 2], "exp": "开放性动作技能是指那些需要根据环境变化而不断调整动作方式的技能。滑冰时需要根据冰面的情况不断调整动作，开车时需要根据路况、交通信号等因素不断调整驾驶动作，属于开放性动作技能。打鸡蛋和射箭的动作相对固定，不属于开放性动作技能。故选BC。"}, {"id": 71, "q": "人的高级心理是随意的心理过程，包括（ ）等复杂的心理活动。", "opts": ["记忆", "思维", "推理", "判断"], "ans": [1, 2, 3], "exp": "思维、推理和判断是高级心理的重要组成部分。记忆虽然也是心理活动的一部分，但它更多属于基础心理过程，不完全等同于高级心理。故选BCD。"}, {"id": 72, "q": "根据皮亚杰的观点，一个儿童在具体运算阶段对物体数量、体积等基本性质的理解主要包括（ ）等。", "opts": ["同一性", "补偿性", "可逆性", "变异性"], "ans": [0, 1, 2], "exp": "根据皮亚杰的观点，儿童在具体运算阶段对物体数量、体积等基本性质的理解主要包括同一性、补偿性和可逆性。变异性并不是皮亚杰在具体运算阶段强调的理解之一。故选ABC。"}, {"id": 73, "q": "自我调节是指个体对自己行为和情绪的调控能力，包括（ ）等。", "opts": ["自我认识", "自我检查", "自我监督", "自我控制"], "ans": [1, 2, 3], "exp": "自我调节包括自我检查、自我监督和自我控制。自我认识虽然也是自我调节的基础，但它本身并不直接等同于自我调节。故选BCD。"}, {"id": 74, "q": "下列措施中，能有效提升教师职业素养的有（ ）", "opts": ["在教育教学中提升师德素养", "加快教师社会地位的提升", "持续开展优秀教师选树宣传", "强化教师的法治和纪律教育"], "ans": [0, 2, 3], "exp": "在教育教学中提升师德素养、持续开展优秀教师选树宣传、强化教师的法治和纪律教育均能有效提升教师职业素养。加快教师社会地位的提升虽然有助于增强教师的职业荣誉感，但它并不直接等同于提升教师职业素养。故选ACD。"}, {"id": 75, "q": "《预防未成年人犯罪法》中所列行为的有（ ）", "opts": ["无故夜不归宿、离家出走", "在数学课上看课外书", "多次旷课、逃学", "参与赌博、变相赌博"], "ans": [0, 2, 3], "exp": "无故夜不归宿、离家出走，多次旷课、逃学，参与赌博、变相赌博均是《预防未成年人犯罪法》中明确列出的不良行为。在数学课上看课外书虽然可能违反了课堂纪律，但并不属于该法列出的不良行为。故选ACD。"}]}, {"id": "s2024_3", "type": "judge", "name": "判断题", "score_each": 0.88, "questions": [{"id": 76, "q": "教育学是一门涉及学科规训的科学。（ ）", "ans": 1, "exp": "错误。教育学虽然涉及学科知识和教学方法，但它更侧重于研究教育现象、揭示教育规律，而不仅仅是学科规训。"}, {"id": 77, "q": "身心发展的关键期给予合适的教育，以促进其得到更好的发展。（ ）", "ans": 0, "exp": "正确。身心发展的关键期是指个体在发展过程中，某些能力或特征的发展特别迅速的时期。在这个时期给予合适的教育，可以更有效地促进这些能力或特征的发展。"}, {"id": 78, "q": "螺旋式课程在逻辑上前后联系，不重复地进行排列。（ ）", "ans": 1, "exp": "错误。螺旋式课程并不是不重复地进行排列，而是指在不同阶段重复出现某些主题或内容，但每次出现时都以更高的层次和更深入的方式呈现。"}, {"id": 79, "q": "新课程旨在扭转填鸭式教育。（ ）", "ans": 0, "exp": "正确。新课程改革强调学生的主体地位，倡导自主学习、合作学习和探究学习，旨在改变传统的填鸭式教育方式。"}, {"id": 80, "q": "教育民主化要求的是平等对待个体个性特征的教育。（ ）", "ans": 0, "exp": "正确。教育民主化强调教育机会的平等和教育过程的公平，要求教育尊重并平等对待每个学生的个性特征，提供个性化的教育服务。"}, {"id": 81, "q": "正式学校的学习活动都属于正式学习。（ ）", "ans": 0, "exp": "正确。正式学习通常指的是在学校或其他正式教育机构中进行的有组织、有计划的学习活动。正式学校的学习活动显然属于这一范畴。"}, {"id": 82, "q": "教育智能化是教育发展的重要趋势。（ ）", "ans": 0, "exp": "正确。随着科技的进步，特别是人工智能技术的发展，教育智能化已经成为教育发展的重要趋势。"}, {"id": 83, "q": "激情具有正负两方面的价值。（ ）", "ans": 0, "exp": "正确。激情是一种强烈的、短暂的、爆发式的情绪状态，它可以激发人的积极性和创造力，也可能导致冲动和盲目行为，确实具有正负两方面的价值。"}, {"id": 84, "q": "无意识模仿说从根本上认为儿童的模仿等同于动物的无意识模仿。（ ）", "ans": 1, "exp": "错误。无意识模仿说并不认为儿童的模仿等同于动物的无意识模仿。儿童的模仿是在社会环境中进行的，受到语言、文化等多种因素的影响，与动物的无意识模仿有本质区别。"}, {"id": 85, "q": "马斯洛认为生理需求是最基本的需要，满足后才能追求更高的需要。（ ）", "ans": 0, "exp": "正确。马斯洛的需求层次理论认为，生理需求是最基本的需要，只有当这些基本需求得到满足后，个体才会追求更高层次的需求。"}]}]}, {"id": "2025", "title": "2025年揭阳惠来教师招聘考试真题", "subtitle": "《教育综合》· 6月28日（回忆版）", "sections": [{"id": "s2025_1", "type": "single", "name": "单选题", "score_each": 1.18, "questions": [{"id": 1, "q": "党的十八大以来，确立到（ ）建成教育强国，教育强国建设迈出坚实步伐。", "opts": ["2030年", "2035年", "2049年", "2050年"], "ans": 1, "exp": "党的十八大以来，确立了到2035年建成教育强国的奋斗目标，推动教育事业取得历史性成就。"}, {"id": 2, "q": "习近平总书记曾致信全国优秀教师代表，强调弘扬教育家精神为推动教育高质量发展提供了根本遵循。下列不属于教育家精神内涵的是（ ）", "opts": ["启智润心，因材施教的育人智慧", "心怀大爱，至诚报国的理想信念", "胸怀天下，以文化人的思想追求", "勤学笃行，传统保守的严谨态度"], "ans": 3, "exp": "教育家精神强调创新与开放，“传统保守”与教育理念相悖。正确内涵包括育人智慧、报国信念、文化追求等。"}, {"id": 3, "q": "（ ）常常应用于具体的环境与活动之中。", "opts": ["情境陶冶法", "理想激励法", "思维训练法", "修养指导法"], "ans": 0, "exp": "情境陶冶法通过创设具体环境和活动渗透德育内容，符合题干描述。"}, {"id": 4, "q": "中学生和小学生在完成任务的驱动因素方面存在差异，是（ ）", "opts": ["中学生更多地依靠外力推动，小学生更多地依赖内心自觉", "中学生更多地依赖内心自觉，小学生更多地依靠外力推动", "中学生和小学生都依赖内心自觉完成任务", "中学生和小学生都仅依靠外力推动完成任务"], "ans": 1, "exp": "中学生自我意识发展，更多依靠内在动机；小学生自律能力较弱，需外力引导。这符合身心发展规律的阶段性特征。"}, {"id": 5, "q": "班级开展环保活动，家庭和学校均接受系统环保教育，这主要体现的教育原则是（ ）", "opts": ["长善救失原则", "可接受性原则", "在集体中教育原则", "教育影响一致性和连贯性原则"], "ans": 3, "exp": "教育影响一致性和连贯性原则要求家庭、学校等多方教育力量保持一致。题干中“家庭和学校均接受系统环保教育”体现了这一点。"}, {"id": 6, "q": "有素质研究表明，受过教育的人生产率比未受教育的人生产率高1.6倍，来分析，这主要表明（ ）", "opts": ["教育可以促进经济增长", "教育可以推动科技进步", "教育可以刺激社会变革", "教育可以提高劳动者文化水平"], "ans": 0, "exp": "“生产率高1.6倍”直接体现教育对经济的推动作用，属于教育的经济功能。"}, {"id": 7, "q": "（ ）是学校的中心工作，它决定着学校的办学水平和效益。", "opts": ["宣传", "行政", "教学", "校务"], "ans": 2, "exp": "教学是学校的中心工作，决定办学水平和效益。行政、宣传、校务均为辅助性工作。"}, {"id": 8, "q": "马克思认为培养全面发展人才的唯一方法是（ ）", "opts": ["提高生产力水平", "改革教育体制", "将教育与生产劳动相结合", "增加社会福利"], "ans": 2, "exp": "马克思认为，教育与生产劳动相结合是培养全面发展人才的唯一方法，这是马克思主义教育理论的核心观点。"}, {"id": 9, "q": "下列关于教育形态的说法正确的是（ ）", "opts": ["非制度化教育是指没有能够形成相对独立的教育形式的教育，现在已不存在", "制度化的教育是人类教育的高级形态，它的出现推动了人类总体文明的进步", "学前教育、初等教育、高等教育和特殊教育等都属于学校教育", "家庭教育的主要任务包括启蒙性、个别性、终身性"], "ans": 1, "exp": "制度化的教育是人类教育的高级形态，它的出现推动了人类总体文明的进步。A选项非制度化教育至今仍存在（如终身教育）；C选项特殊教育不完全属于学校教育；D选项终身性不是学校教育的任务。"}, {"id": 10, "q": "“虽有嘉肴，弗食不知其旨也”这是（ ）中教育思想的体现。", "opts": ["《孟子》", "《中庸》", "《礼记》", "《论语》"], "ans": 2, "exp": "“虽有嘉肴，弗食不知其旨也”出自《礼记·学记》，强调教学相长的教育思想。"}, {"id": 11, "q": "新旧民主主义革命时期，有位教育家在北京大学任校长，在国内率先成立大学研究所，允许女生入学，实行教授治校。上述文段中的“他”指的是教育家（ ）", "opts": ["李大钊", "蔡元培", "晏阳初", "黄炎培"], "ans": 1, "exp": "蔡元培任北大校长时推行“兼容并包”，允许女生入学，实行教授治校，符合题干描述。"}, {"id": 12, "q": "班主任认为评价学生应关注过程和动态发展，以调动学生积极性。李老师的这种看法是（ ）评价原则的体现。", "opts": ["客观性", "发展性", "指导性", "计划性"], "ans": 1, "exp": "发展性评价侧重动态发展和积极性调动，符合李老师“关注过程和动态发展”的理念。"}, {"id": 13, "q": "与学校正规教育相比，非正规教育的特点不包括（ ）", "opts": ["结构松散", "比较灵活", "目标间接", "时间上有伸缩性"], "ans": 2, "exp": "非正规教育（如家庭教育）的特点包括结构松散、灵活、时间灵活，但目标并非“间接”，而是更贴近实际需求。"}, {"id": 14, "q": "校本课程是学校自主开发的课程，以下关于校本课程作用表述不恰当的一项是（ ）", "opts": ["有利于学校形成办学特色，满足学校“个性化”发展的需求", "有利于教师专业水平的提高，尤其是科研能力的提升", "有利于学生主体性的发挥，真正满足学生生存与发展的需要", "有利于促进当地经济、社会的发展，起到主导作用"], "ans": 3, "exp": "校本课程对地方发展有促进作用，但“主导作用”夸大了其影响。A、B、C选项均为校本课程的正确作用。"}, {"id": 15, "q": "小明最近开始经历一系列身体变化，如长胡须、变声等，且变得不爱和父母或老师分享。根据小明的情况，老师在对小明的教育教学中应（ ）", "opts": ["重点发展小明的语言和社交技能", "重点培养小明的学习兴趣和社交能力", "对小明进行青春期生理和心理健康教育", "帮助小明培养独立生活技能"], "ans": 2, "exp": "小明出现青春期身体变化，且不愿分享，需针对性进行生理和心理健康教育，帮助其适应变化。"}, {"id": 16, "q": "在教育活动中，学生能够突破书本知识的局限，提出新的观点和方法，这体现了学生具有（ ）", "opts": ["被动性", "选择性", "创造性", "调控性"], "ans": 2, "exp": "学生能够突破书本知识的局限，提出新的观点和方法，体现了学生具有创造性。"}, {"id": 17, "q": "校园文化的（ ）是通过规范学生言行，对学生言行的约束作用。", "opts": ["凝聚功能", "同化功能", "激励功能", "制约功能"], "ans": 3, "exp": "校园文化通过规范约束学生言行，体现制约功能。"}, {"id": 18, "q": "任何教学方法的选择都需要考虑学生的实际情况，对于有一定基础且需要巩固知识的学生，最好选用（ ）", "opts": ["练习法", "讲授法", "谈话法", "讨论法"], "ans": 0, "exp": "练习法适合有一定基础且需要巩固知识的学生，通过练习来强化所学内容。"}, {"id": 19, "q": "课程目标需要依据学生的身心发展规律和教育目标来制定，具有（ ）", "opts": ["整体性", "阶段性", "持续性", "游戏性"], "ans": 1, "exp": "课程目标需要依据学生的身心发展规律来制定，具有阶段性特征。"}, {"id": 20, "q": "根据皮亚杰的认知发展理论，以下属于顺应的是（ ）", "opts": ["小明在画装了半瓶水并倾斜的瓶子时，将水面与瓶底形成平行关系", "小明在学习英语单词时通过调整发音方式学会了正确发音", "小枫知道鸟会飞，当他见到鸵鸟时认为它也会飞", "小枫知道香蕉需要剥皮，当他第一次吃榴莲时学会了用工具打开外壳再吃果肉"], "ans": 3, "exp": "顺应指改变原有图式适应新情境。D选项中，小枫从“手剥香蕉”到“用工具开榴莲”，图式发生改变，属于顺应。A、B、C选项均为同化（用原有图式解释新事物）。"}, {"id": 21, "q": "吴老师比较推崇勤能补拙，认为学生掌握知识后还应不断巩固，比如完成作业后再针对当天内容加练，吴老师推崇的方法是（ ）", "opts": ["过度学习法", "合作学习法", "接受学习法", "观察学习法"], "ans": 0, "exp": "过度学习指在掌握后继续学习以强化记忆，符合“完成作业后再针对当天内容加练”的描述。"}, {"id": 22, "q": "（ ）又称交往内驱力，是一种外部动机。", "opts": ["认知内驱力", "附属内驱力", "自我提高内驱力", "生理性内驱力"], "ans": 1, "exp": "附属内驱力是为获得他人认可（如家长、教师表扬）的外部动机，符合“交往内驱力”定义。"}, {"id": 23, "q": "改变个体的自我效能感，通过他人鼓励来增强个体对自己能力的信心，这是（ ）因素对自我效能感形成的影响。", "opts": ["直接经验", "替代经验", "言语说服", "情绪唤起"], "ans": 2, "exp": "言语说服（他人鼓励）是影响自我效能感的重要因素之一。"}, {"id": 24, "q": "小伟在和妈妈逛商场时，看到玩具就走不动路，哭着闹着要买，妈妈没有理会他的哭闹，继续向前走，小伟哭了一会儿发现妈妈没有回应，就不哭了，继续跟着妈妈走。例中小伟的妈妈运用的方法是（ ）", "opts": ["压抑", "正惩罚", "负惩罚", "消退"], "ans": 3, "exp": "消退是指对行为不予理睬，从而减少该行为的发生。妈妈没有理会小伟的哭闹，最终小伟停止了哭闹，这是消退的典型应用。"}, {"id": 25, "q": "（ ）的观点集中体现在他所出版的《学习的自由》一书中。", "opts": ["苛勒", "桑代克", "罗杰斯", "奥苏贝尔"], "ans": 2, "exp": "罗杰斯是人本主义代表，《学习的自由》体现其“以学生为中心”的理念。"}, {"id": 26, "q": "下列关于大脑功能的说法，错误的是（ ）", "opts": ["大脑的每个半球都有独立的信息加工和思维功能", "只有处理复杂的任务时，大脑的两个半球才会进行信息交换", "大脑功能的水平服从“用进废退”的规则", "学习可以令不同脑区的联系方式发生改变"], "ans": 1, "exp": "大脑两半球在简单任务中也会交换信息，B选项错误。A、C、D选项均符合大脑功能特点。"}, {"id": 27, "q": "李涛在政治课上学了“矛盾”的概念后，在后续学习“主要矛盾”“次要矛盾”等概念的学习也产生了影响。这属于（ ）", "opts": ["负迁移", "纵向迁移", "横向迁移", "逆向迁移"], "ans": 1, "exp": "纵向迁移指不同抽象层次的知识迁移（如“矛盾”概念对“主次矛盾”的影响）。"}, {"id": 28, "q": "人们在绘画时，看到冷色调的画会感觉凉爽，看到暖色调的画会感觉温暖，这种现象体现了（ ）", "opts": ["感觉的适应", "感觉的对比", "感觉的补偿", "联觉"], "ans": 3, "exp": "联觉指一种感觉引起另一种感觉（如视觉“冷暖色调”引发触觉联想）。"}, {"id": 29, "q": "读小说时在头脑中形成小说中描述的场景，建筑师根据图纸在头脑中形成建筑的样子，这属于（ ）", "opts": ["幻想", "无意想象", "梦想", "再造想象"], "ans": 3, "exp": "再造想象是根据语言或图纸等提示形成形象，符合题干中“读小说”“看图纸”的情境。"}, {"id": 30, "q": "学生小吴无论是在学习还是在生活中，都严格遵守行为规范与法律法规，按照科尔伯格的道德发展阶段理论，小吴正处于（ ）", "opts": ["前习俗水平", "习俗水平", "后习俗水平", "一般水平"], "ans": 1, "exp": "习俗水平侧重遵守社会规范和法律，符合小吴“严格遵守行为规范与法律法规”的表现。"}, {"id": 33, "q": "某教师在课堂上提问学生，学生回答错误，此时教师最恰当的做法是（ ）", "opts": ["直接公布正确答案纠正错误", "请其他学生回答", "引导学生思考和自我纠正", "忽略错误继续提问"], "ans": 2, "exp": "教师应引导学生自主发现错误，培养批判性思维。直接公布答案、忽略错误或请他人回答均不利于学生主动思考。"}, {"id": 34, "q": "某次全体教师大会上，校长鼓励全体教师团结协作，共同为学校发展努力，强调“众人拾柴火焰高，大家要发愤图强不畏艰难。”这主要体现出教师劳动的（ ）", "opts": ["潜在性", "合力性", "复杂性", "广延性"], "ans": 1, "exp": "教师劳动需团队协作，体现合力性。复杂性侧重任务多样，广延性侧重时间和空间的延伸。"}, {"id": 35, "q": "教师的下列做法中，不利于学生适应校园生活的是（ ）", "opts": ["禁止学生参与校内外活动，引导学生积极学习", "引导学生自由地探索，同时给予适当的关怀和保护", "在学生主动性和创造性的活动中不过多干涉", "帮助学生与他人进行深层次的交往并保持友好关系"], "ans": 0, "exp": "禁止活动会抑制学生社会性发展，不利于适应校园生活。B、C、D选项均体现合理引导和支持，有助于学生适应。"}, {"id": 36, "q": "（ ）认为，有机体只有对于即将达成的目标产生期待时，才会对不同目标做出实际的不同行为。", "opts": ["加涅", "托尔曼", "班杜拉", "柏拉图"], "ans": 1, "exp": "托尔曼的符号学习理论强调“期待”对行为的影响，认为有机体对目标建立期待后才会调整行为。"}, {"id": 37, "q": "考前临时复习，为了应付考试而进行的记忆属于（ ）", "opts": ["短时记忆", "逻辑记忆", "中时记忆", "长时记忆"], "ans": 0, "exp": "短时记忆容量有限（7±2组块），保持时间短，需复述才能进入长时记忆，符合“考前临时抱佛脚”的记忆特点。"}, {"id": 38, "q": "某教师在课堂上对学生进行体罚，下列说法正确的是（ ）", "opts": ["教师可以随意惩罚学生", "该教师的行为符合教书育人的原则", "该教师的行为严重违反了刑法", "教师应尊重学生的人格尊严和基本权利"], "ans": 3, "exp": "惩罚学生侵犯人格尊严，违反教育法规。教师不可随意惩罚学生，应尊重学生的人格尊严和基本权利。"}, {"id": 39, "q": "某教师私下收受课外培训机构的“广告费”，为其进行宣传推荐，该教师的行为主要违背了教师职业道德的（ ）", "opts": ["教育人道原则", "终身学习的要求", "廉洁从教的规范", "尊重家长的准则"], "ans": 2, "exp": "收取课外机构“广告费”违反廉洁从教，属于利益输送。"}, {"id": 40, "q": "某教师发现小林因营养不良导致学习精力不足，遂私下联系家长建议给孩子补充营养，家长却投诉教师歧视家境不好的学生，相关说法正确的是（ ）", "opts": ["教师不应该私下联系家长，而应该在班上公开讨论小林的情况", "家长的投诉是合理的，因为教师的行为确实涉及家境歧视", "教师的行为是出于对学生的关心，但沟通方式需要改进", "学校应该立即对教师进行处分，以维护家长的权益"], "ans": 2, "exp": "教师关心学生营养是合理的，但私下建议家长可能引发误解。家长投诉未必合理，学校应视情况处理，而非直接处分。"}, {"id": 41, "q": "某小学教师章老师因学生小明未按时完成作业，在教室内对其进行了体罚，导致小明受伤就医，针对此情况正确的是（ ）", "opts": ["章老师仅需向小明及其家长道歉", "学校有权给予章老师行政处分或解聘", "章老师不用承担小明的医疗费用，但其教师职位会受影响", "教育部门应直接吊销章老师教师资格证，无需经过学校处理"], "ans": 1, "exp": "体罚学生违反教师职业道德，学校可给予行政处分或解聘。章老师需承担医疗费用，教育部门吊销教师资格证需按程序处理。"}, {"id": 42, "q": "小红未满12周岁，父母让她独自骑自行车去距离较远的商场，下列关于父母的行为（ ）", "opts": ["符合道德和法律要求，孩子应该学会独立", "违反了法律，父母应确保未成年人的安全", "不违反法律，但要求确保独自骑行距离不超过5公里", "仅违背道德，但只要小红自己觉得没问题就可以接受"], "ans": 1, "exp": "让未满12周岁的未成年人独自骑行上路违反《道路交通安全法》，父母需确保未成年人安全。"}]}, {"id": "s2025_2", "type": "multi", "name": "多选题", "score_each": 1.36, "questions": [{"id": 62, "q": "设计班级活动时需要遵循的要求包括（ ）", "opts": ["有利于推动班级发展", "与学习、劳动及游戏结合", "寓教于乐", "具有目的性和组织性"], "ans": [0, 1, 2, 3], "exp": "设计班级活动需有利于推动班级发展、与学习劳动及游戏结合、寓教于乐、具有目的性和组织性。全部正确，故选ABCD。"}, {"id": 63, "q": "班主任在了解、研究学生集体时，可以采用的方法包括（ ）", "opts": ["访问", "谈话", "问卷", "观察"], "ans": [0, 1, 2, 3], "exp": "班主任了解学生集体可采用访问（家访、走访社区）、谈话（与学生面对面交流）、问卷（设计标准化问卷）、观察（在课堂、活动中观察学生行为表现）等方法。全部正确，故选ABCD。"}, {"id": 64, "q": "教育系统这一复杂体系是由（ ）等要素构成。", "opts": ["教育者", "受教育者", "教育内容", "教育手段"], "ans": [0, 1, 2, 3], "exp": "教育系统由教育者、受教育者、教育内容和教育手段等要素构成。全部正确，故选ABCD。"}, {"id": 65, "q": "如果学生之间发生矛盾冲突，老师可以（ ）", "opts": ["教学生主动、真诚地与对方沟通，试着消除误会", "直接让学生找同学、家长或者其他老师帮忙调解", "引导学生稍微大度一点，接受别人的道歉", "引导学生保持积极乐观的心态"], "ans": [0, 1, 3], "exp": "A选项教学生主动沟通消除误会，B选项让学生找他人帮忙调解，D选项引导学生保持积极心态，均是正确的做法。C选项单纯要求“大度接受道歉”可能忽视矛盾根源，不利于建立正确的人际关系观。故选ABD。"}, {"id": 66, "q": "示范—模仿教学技能中，适宜通过这种方法来传授给学生的有（ ）", "opts": ["实验技能", "体育技能", "演奏技能", "朗诵技能"], "ans": [0, 1, 2, 3], "exp": "实验技能、体育技能、演奏技能、朗诵技能均适合通过示范—模仿教学来传授。全部正确，故选ABCD。"}, {"id": 67, "q": "每个人都会有一些学习偏好，这些偏好由多方面的特征构成，如（ ）等。", "opts": ["知觉偏好", "物理环境需要", "社会环境偏好", "认知风格"], "ans": [0, 1, 2, 3], "exp": "学习偏好包括知觉偏好（如视觉型、听觉型、动觉型）、物理环境需要（如对光线、声音、温度的偏好）、社会环境偏好（如独自学习或小组合作）、认知风格（如场独立型或场依存型）。全部正确，故选ABCD。"}, {"id": 68, "q": "近年来，教育网络将信号接入偏远地区使远程支教成为现实。基于这种学习环境，教师应履行的职责有（ ）", "opts": ["向学生提供及时的反馈", "积极引导学生", "限制学生接触互联网", "监督和协调讨论"], "ans": [0, 1, 3], "exp": "教师应提供及时反馈、积极引导学生、监督和协调讨论。限制学生接触互联网与远程支教依托网络的本质矛盾，不合理。故选ABD。"}, {"id": 69, "q": "美国心理学家提出通过类比进行教学，以下属于类比教学的是（ ）", "opts": ["钱老师讲授沙漠时，给学生们播放了相关风景纪录片，并结合纪录片进行讲解", "在讲解光的折射时，李老师用玻璃瓶装满水，将一根筷子插入水中让学生观察筷子在水面处似乎折断的现象", "张老师引导学生想象自己是小鸟，将自己交友的感受赋予到小鸟身上，并以此写一篇日记", "在讲解杠杆原理时，教师让学生观察跷跷板的工作方式，理解力臂和支点的关系"], "ans": [1, 3], "exp": "B选项用“筷子插入水中折断”类比光的折射，D选项用“跷跷板”类比杠杆原理，均属于类比教学。A选项播放纪录片属于直观展示，未涉及类比；C选项想象小鸟属于角色扮演，非类比。故选BD。"}, {"id": 70, "q": "若从课堂管理的角度分析，老师应该（ ）", "opts": ["维护课堂常规，劝退违反纪律的学生", "了解学生需求，创造积极的课堂人际关系", "使学生明确教学目标，使课堂教学活动朝着预计的目标前进", "创造良好的课堂气氛，吸引学生积极参与课堂活动"], "ans": [1, 2, 3], "exp": "了解学生需求、明确教学目标、创造良好课堂气氛均是正确的课堂管理做法。劝退学生属于极端措施，不符合课堂管理的“教育性原则”。故选BCD。"}, {"id": 71, "q": "美国学者将教师的权威类型分为制度性权威和个人权威两种类型。其中教师的个人权威包括（ ）", "opts": ["法定权威", "传统权威", "专业权威", "感召权威"], "ans": [2, 3], "exp": "教师的个人权威包括专业权威（基于教师的知识储备、教学能力）和感召权威（基于教师的人格魅力、情感关怀）。法定权威和传统权威属于“制度性权威”。故选CD。"}, {"id": 72, "q": "当我们提及光环效应时，通常会有以下一些表现。以下体现了光环效应的有（ ）", "opts": ["以偏概全", "爱屋及乌", "上行下效", "情人眼里出西施"], "ans": [0, 1, 3], "exp": "以偏概全、爱屋及乌、情人眼里出西施均体现了光环效应。上行下效指上级行为对下级的影响，属于模仿效应，与光环效应无关。故选ABD。"}, {"id": 73, "q": "某教师在教学和沟通中经常有以下类似行为：1.将学生作文中“我的理想是当网红”批注为“不切实际，建议修改”；2.对家长说：“您家孩子天赋一般，建议放弃竞赛专心补课”；3.要求班主任记录“课堂说闲话”学生名单并公示。该教师需要从（ ）等方面加以改进。", "opts": ["尊重学生人格，保护学生自信心", "严慈相济，保护学生自主发展权", "遵循教育规律，实施应试教育", "言语规范文明，避免伤害性评价"], "ans": [0, 1, 3], "exp": "批注否定学生理想、直接建议放弃竞赛、公示名单均涉及不尊重学生人格、忽视自主发展权和伤害性评价的问题。C选项“实施应试教育”与素质教育理念相悖，且与题干行为无关。故选ABD。"}, {"id": 74, "q": "《关于开展基础教育规范整治行动的通知》要求重点规范整治（ ）", "opts": ["安全底线失守", "日常管理失序", "家庭教育缺失", "师德师风失范"], "ans": [0, 1, 3], "exp": "重点规范整治安全底线失守、日常管理失序和师德师风失范。家庭教育缺失属于家庭责任，非基础教育“规范管理”的直接整治对象。故选ABD。"}, {"id": 75, "q": "根据《中华人民共和国未成年人保护法》，以下人员中能作为被委托人的有（ ）", "opts": ["强奸过妇女的小伟叔叔", "沉迷赌博的小亮舅妈", "经常吸烟的小安大姨", "经常酗酒的小翔爷爷"], "ans": [0, 1, 3], "exp": "根据《未成年人保护法》，被委托人需具备完全民事行为能力且无不良行为记录。强奸过妇女（触犯刑法）、沉迷赌博、经常酗酒均属于不能担任被委托人的情形。经常吸烟虽不提倡，但未被法律明确列为禁止担任被委托人的情形。故选ABD。"}]}, {"id": "s2025_3", "type": "judge", "name": "判断题", "score_each": 0.75, "questions": [{"id": 76, "q": "坚持以人民为中心的发展思想，在教育领域主要通过提升教育公平性、优化教育资源配置等方面来体现。（ ）", "ans": 0, "exp": "正确。以人民为中心是中国特色社会主义的根本立场，教育作为党和国家的重要事业，必须坚持以人民为中心的发展思想，满足人民群众对优质教育的需求。"}, {"id": 77, "q": "我国现阶段所实施的学校教育制度，是按照低等、中等、高等这三个层级来划分的。（ ）", "ans": 1, "exp": "错误。我国现行学校教育制度分为学前教育、初等教育、中等教育和高等教育四级，而非“低等、中等、高等”三级。"}, {"id": 78, "q": "布置作业的时候，仅仅依据课堂教学时间与学生自学时间的比例来确定作业量就足够了。（ ）", "ans": 1, "exp": "错误。布置作业需遵循科学性和合理性原则，学科特点和学生实际是重要依据，同时需兼顾课堂教学效率与学生自学时间的平衡，避免作业量过多或过少。"}, {"id": 79, "q": "教室外墙设置以展示学生们优秀假期作业或作品为主题的展览，能够体现出班级生活的丰富性。（ ）", "ans": 0, "exp": "正确。教室外墙作为班级文化建设的重要阵地，通过展示学生作品，既能激发学生的积极性和创造力，也能直观体现班级活动的多样性和学生的个性化发展。"}, {"id": 80, "q": "社会本位论主张教育应该以社会需求为导向，凯兴斯泰纳和涂尔干是该理论的重要代表人物。（ ）", "ans": 0, "exp": "正确。社会本位论强调教育的目的是培养社会所需的人才，满足社会发展的需求。德国教育家凯兴斯泰纳和法国社会学家涂尔干是该理论的典型代表。"}, {"id": 81, "q": "系统论的基本思想是围绕完全撇开事物的具体形态，以信息这一中心概念来分析和处理问题。（ ）", "ans": 1, "exp": "错误。该描述混淆了“系统论”与“信息论”的概念。系统论的核心思想是将事物视为一个有机整体，研究其内部各要素的相互作用；而信息论才是以“信息”为中心。"}, {"id": 82, "q": "元认知水平越高的人，对自身学习活动的计划、监控和调节能力越强，相应地，良好的学习习惯也越容易形成。（ ）", "ans": 0, "exp": "正确。元认知包括对认知活动的计划、监控和调节能力，这种自我认知和管理能力有助于培养自律、高效的学习习惯。"}, {"id": 83, "q": "低级心理机能是生物进化所赋予的，高级心理机能则是在人类历史发展过程中，通过社会文化环境的作用而发展起来的，二者遵循不同的历史发展路线。（ ）", "ans": 0, "exp": "正确。这是维果茨基心理发展理论的核心观点。低级心理机能是动物和人类共有的种系进化结果，而高级心理机能则是人类在社会文化环境中通过符号系统学习和发展的产物。"}, {"id": 84, "q": "王老师为了提升自己的教学水平，利用业余时间参加教育类研讨会。王老师的做法体现了为人师表的职业道德。（ ）", "ans": 1, "exp": "错误。王老师的行为更符合“终身学习”的职业道德要求，而“为人师表”更侧重教师的言行举止、廉洁从教等对学生的示范作用。"}, {"id": 85, "q": "组织学生参加“红色之旅”活动，通过参观革命纪念地等方式，这符合爱国主义教育的要求。（ ）", "ans": 0, "exp": "正确。“红色之旅”通过实地参观革命遗址、感受革命历史，能直观激发学生的民族自豪感和爱国情怀，是爱国主义教育的重要实践形式。"}]}]}];

var pendingAction = 'submit';

// ====== INIT ======
(function init() {
  var savedScale = parseFloat(localStorage.getItem('fontScale'));
  if (savedScale && savedScale >= 0.7 && savedScale <= 1.8) {
    document.documentElement.style.setProperty('--font-scale', savedScale);
  }

  var savedMode = localStorage.getItem('quizMode');
  if (savedMode === 'study' || savedMode === 'quiz') {
    state.mode = savedMode;
    document.querySelectorAll('.mode-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.mode === state.mode);
    });
  }

  renderYearCards();
  bindEvents();
})();

function renderYearCards() {
  var container = document.getElementById('yearCards');
  var html = '';
  EXAMS.forEach(function(exam, idx) {
    var totalQ = 0;
    exam.sections.forEach(function(s) { totalQ += s.questions.length; });
    html += '<div class="year-card" data-exam-idx="' + idx + '">' +
      '<div class="year-num">' + exam.id + '年</div>' +
      '<div class="year-title">' + exam.title + '</div>' +
      '<div class="year-sub">' + exam.subtitle + '</div>' +
      '<div class="year-count">共 ' + totalQ + ' 题</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function bindEvents() {
  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      state.mode = this.dataset.mode;
      localStorage.setItem('quizMode', state.mode);
    });
  });

  document.getElementById('yearCards').addEventListener('click', function(e) {
    var card = e.target.closest('.year-card');
    if (!card) return;
    document.querySelectorAll('.year-card').forEach(function(c) { c.classList.remove('selected'); });
    card.classList.add('selected');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '开始答题：' + EXAMS[card.dataset.examIdx].id + '年真题';
    document.getElementById('startBtn').dataset.examIdx = card.dataset.examIdx;
  });

  document.getElementById('startBtn').addEventListener('click', function() {
    var idx = parseInt(this.dataset.examIdx);
    if (isNaN(idx)) return;
    startExam(idx);
  });

  document.getElementById('backBtn').addEventListener('click', function() {
    pendingAction = 'backHome';
    document.getElementById('confirmTitle').textContent = '返回首页';
    var answered = Object.keys(state.userAnswers).length;
    document.getElementById('confirmMsg').textContent = '返回首页将丢失当前答题进度，确定返回吗？（已答 ' + answered + ' 题）';
    document.getElementById('confirmOverlay').classList.add('show');
  });

  document.getElementById('cardBtn').addEventListener('click', function() { showCardModal(); });
  document.getElementById('submitBtn').addEventListener('click', function() {
    pendingAction = 'submit';
    var answered = Object.keys(state.userAnswers).length;
    var total = state.allQuestions.length;
    var unanswered = total - answered;
    document.getElementById('confirmTitle').textContent = '确认交卷';
    document.getElementById('confirmMsg').textContent = '您已完成 ' + answered + '/' + total + ' 题' + (unanswered > 0 ? '，还有 ' + unanswered + ' 题未作答' : '') + '，确认交卷吗？';
    document.getElementById('confirmOverlay').classList.add('show');
  });

  document.getElementById('prevBtn').addEventListener('click', function() { goPrev(); });
  document.getElementById('nextBtn').addEventListener('click', function() { goNext(); });

  document.getElementById('cardCloseBtn').addEventListener('click', function() {
    document.getElementById('cardModal').classList.remove('show');
  });
  document.getElementById('cardModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

  document.getElementById('cardGrid').addEventListener('click', function(e) {
    var num = e.target.closest('.card-num');
    if (!num) return;
    var idx = parseInt(num.dataset.idx);
    state.currentIndex = idx;
    renderQuestion();
    document.getElementById('cardModal').classList.remove('show');
  });

  document.getElementById('reviewBtn').addEventListener('click', showReview);
  document.getElementById('retryBtn').addEventListener('click', function() { startExam(state.currentExamIdx); });
  document.getElementById('exportBtn').addEventListener('click', showExport);
  document.getElementById('backHomeBtn').addEventListener('click', goHome);
  document.getElementById('reviewBackBtn').addEventListener('click', function() {
    document.getElementById('reviewPage').classList.remove('active');
    document.getElementById('resultPage').classList.add('active');
    window.scrollTo(0, 0);
  });

  document.getElementById('copyBtn').addEventListener('click', copyExport);
  document.getElementById('closeExport').addEventListener('click', function() {
    document.getElementById('exportModal').classList.remove('show');
  });

  document.getElementById('cfCancel').addEventListener('click', function() {
    document.getElementById('confirmOverlay').classList.remove('show');
  });
  document.getElementById('cfOk').addEventListener('click', function() {
    document.getElementById('confirmOverlay').classList.remove('show');
    if (pendingAction === 'submit') { doSubmit(); }
    else if (pendingAction === 'backHome') { goHome(); }
  });

  // Swipe detection
  var touchStartX = 0, touchStartY = 0, touchStartTime = 0;
  var qa = document.getElementById('questionArea');
  qa.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }, {passive: true});
  qa.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    var dt = Date.now() - touchStartTime;
    if (dt < 500 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) goNext();
      else goPrev();
    }
  });
}

// ====== FONT CONTROL ======
function adjustFont(delta) {
  var current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
  var next = Math.min(1.8, Math.max(0.7, Math.round((current + delta) * 100) / 100));
  document.documentElement.style.setProperty('--font-scale', next);
  localStorage.setItem('fontScale', next);
  updateFontDisplay();
}
function updateFontDisplay() {
  var current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
  var pct = Math.round(current * 100);
  var v1 = document.getElementById('fontValue');
  var v2 = document.getElementById('fontValue2');
  if (v1) v1.textContent = pct + '%';
  if (v2) v2.textContent = pct + '%';
}

// ====== EXAM START ======
function startExam(examIdx) {
  var exam = EXAMS[examIdx];
  state.currentExam = exam;
  state.currentExamIdx = examIdx;
  state.submitted = false;
  state.userAnswers = {};
  state.answeredShown = {};
  state.currentIndex = 0;
  state.score = 0;
  state.correctCount = 0;
  state.wrongCount = 0;

  state.allQuestions = [];
  exam.sections.forEach(function(section) {
    section.questions.forEach(function(q) {
      q._sectionId = section.id;
      q._type = section.type;
      q._score = section.score_each;
      q._sectionName = section.name;
      state.allQuestions.push(q);
    });
  });

  document.getElementById('quizTitle').textContent = exam.id + '年真题';
  document.getElementById('quizSub').textContent = exam.subtitle + ' · 共' + state.allQuestions.length + '题';
  var badge = document.getElementById('modeBadge');
  badge.textContent = state.mode === 'quiz' ? '做题模式' : '背题模式';
  badge.classList.toggle('study', state.mode === 'study');

  document.getElementById('homePage').style.display = 'none';
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('reviewPage').classList.remove('active');
  document.getElementById('quizPage').classList.add('active');

  renderQuestion();
  window.scrollTo(0, 0);
}

// ====== RENDER QUESTION ======
function renderQuestion() {
  var q = state.allQuestions[state.currentIndex];
  if (!q) return;

  var area = document.getElementById('questionArea');
  var typeName = q._type === 'single' ? '单选题' : q._type === 'multi' ? '多选题' : '判断题';
  var userAns = state.userAnswers[q.id];
  var correctAns = q.ans;

  // 是否显示答案：已交卷 或 （背题模式 且 本题已作答）
  var showAnswer = state.submitted || (state.mode === 'study' && state.answeredShown[q.id]);
  var isCorrect = false;

  if (showAnswer) {
    if (q._type === 'multi') {
      var ua = userAns || [];
      var ca = correctAns;
      isCorrect = ua.length === ca.length && ua.every(function(v) { return ca.indexOf(v) >= 0; });
    } else {
      isCorrect = userAns === correctAns;
    }
  }

  // 是否可点击：未交卷 且 （做题模式 或 背题模式但本题还未作答）
  var isInteractive = !state.submitted && !(state.mode === 'study' && state.answeredShown[q.id]);

  var html = '';
  html += '<span class="q-type-badge ' + q._type + '">' + typeName + '</span>';
  html += '<div class="q-num">第 ' + (state.currentIndex + 1) + ' / ' + state.allQuestions.length + ' 题 （' + q._score + '分）</div>';
  html += '<div class="q-text">' + escapeHtml(q.q) + '</div>';
  html += '<div class="options-list">';

  q.opts.forEach(function(opt, oi) {
    var classes = ['option-item'];
    if (showAnswer) {
      if (q._type === 'multi') {
        var isCorrectOpt = correctAns.indexOf(oi) >= 0;
        var isUserOpt = userAns && userAns.indexOf(oi) >= 0;
        if (isCorrectOpt) classes.push('correct');
        if (isUserOpt && !isCorrectOpt) classes.push('wrong');
      } else {
        if (oi === correctAns) classes.push('correct');
        if (oi === userAns && oi !== correctAns) classes.push('wrong');
      }
    } else {
      if (q._type === 'single' || q._type === 'judge') {
        if (userAns === oi) classes.push('selected');
      } else {
        if (userAns && userAns.indexOf(oi) >= 0) classes.push('selected');
      }
    }
    if (!isInteractive) classes.push('disabled');

    var clickAttr = isInteractive ? ' data-oi="' + oi + '"' : '';
    html += '<div class="' + classes.join(' ') + '"' + clickAttr + '>';
    html += '<span class="opt-letter">' + LABELS[oi] + '</span>';
    html += '<span class="opt-text">' + escapeHtml(opt) + '</span>';
    html += '</div>';
  });

  html += '</div>';

  // 背题模式：本题还未作答时给提示
  if (state.mode === 'study' && !state.answeredShown[q.id] && !state.submitted) {
    html += '<div style="margin-top:14px;padding:10px 12px;background:#f0f9ff;border-radius:8px;font-size:0.85rem;color:var(--accent);text-align:center;border:1px dashed #c7d2fe;">💡 背题模式：请选择答案，选完后将显示正确答案和解析</div>';
  }

  // Explanation box
  if (showAnswer && q.exp) {
    var correctLabel = q._type === 'multi'
      ? correctAns.map(function(a) { return LABELS[a]; }).join('')
      : LABELS[correctAns];
    html += '<div class="explanation-box show">';
    html += '<div class="exp-answer">✅ 正确答案：' + correctLabel + '</div>';
    if (userAns !== undefined && userAns !== null) {
      var userLabel = q._type === 'multi'
        ? (userAns || []).map(function(a) { return LABELS[a]; }).join('') || '未作答'
        : LABELS[userAns];
      if (!isCorrect) html += '<div class="exp-answer wrong-ans">❌ 你的答案：' + userLabel + '</div>';
      else html += '<div style="font-size:0.85rem;color:var(--success);font-weight:600;margin-bottom:4px;">🎉 答对了！</div>';
    }
    html += '<div class="exp-label">📝 解析：</div>';
    html += '<div>' + escapeHtml(q.exp) + '</div>';
    html += '</div>';
  }

  area.innerHTML = html;

  if (isInteractive) {
    area.querySelectorAll('.option-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var oi = parseInt(this.dataset.oi);
        handleOptionClick(q, oi);
      });
    });
  }

  var answered = Object.keys(state.userAnswers).length;
  var pct = (answered / state.allQuestions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('qIndicator').textContent = (state.currentIndex + 1) + ' / ' + state.allQuestions.length;
  document.getElementById('prevBtn').disabled = state.currentIndex === 0;
  document.getElementById('nextBtn').disabled = state.currentIndex >= state.allQuestions.length - 1;
  area.scrollTop = 0;
}

function handleOptionClick(q, oi) {
  if (q._type === 'single' || q._type === 'judge') {
    state.userAnswers[q.id] = oi;
  } else {
    if (!state.userAnswers[q.id]) state.userAnswers[q.id] = [];
    var arr = state.userAnswers[q.id];
    var idx = arr.indexOf(oi);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(oi);
    state.userAnswers[q.id] = arr;
  }

  // 背题模式：选择后立即显示答案和解析
  if (state.mode === 'study' && !state.submitted) {
    // 对于单选和判断，直接显示；多选需至少选一项，一般用户点一个就出一个也行，但最好用户全部选完点别处再出
    // 简化：背题模式下，每道题只要有选择就显示答案
    var ua = state.userAnswers[q.id];
    if (q._type === 'multi') {
      if (!ua || ua.length === 0) return; // 多选没选任何项时不显示
    }
    state.answeredShown[q.id] = true;
  }

  renderQuestion();
}

// ====== NAVIGATION ======
function goPrev() { if (state.currentIndex > 0) { state.currentIndex--; renderQuestion(); } }
function goNext() { if (state.currentIndex < state.allQuestions.length - 1) { state.currentIndex++; renderQuestion(); } }

// ====== SUBMIT ======
function doSubmit() {
  state.submitted = true;
  state.correctCount = 0;
  state.wrongCount = 0;
  state.score = 0;

  state.allQuestions.forEach(function(q) {
    var userAns = state.userAnswers[q.id];
    var correctAns = q.ans;
    var isCorrect = false;
    if (q._type === 'multi') {
      var ua = userAns || [];
      isCorrect = ua.length === correctAns.length && correctAns.every(function(v) { return ua.indexOf(v) >= 0; });
    } else {
      isCorrect = userAns === correctAns;
    }
    if (isCorrect) { state.correctCount++; state.score += q._score; }
    else { state.wrongCount++; }
  });

  state.score = Math.round(state.score * 100) / 100;
  document.getElementById('resultScore').textContent = state.score;
  document.getElementById('correctCount').textContent = state.correctCount;
  document.getElementById('wrongCount').textContent = state.wrongCount;
  var rate = state.allQuestions.length > 0 ? Math.round((state.correctCount / state.allQuestions.length) * 100) : 0;
  document.getElementById('accuracyRate').textContent = rate + '%';

  document.getElementById('quizPage').classList.remove('active');
  document.getElementById('resultPage').classList.add('active');
  window.scrollTo(0, 0);
  renderQuestion();
  updateCardModal();
}

// ====== ANSWER CARD ======
function showCardModal() { updateCardModal(); document.getElementById('cardModal').classList.add('show'); }
function updateCardModal() {
  var html = '';
  var currentSectionId = '';
  state.allQuestions.forEach(function(q, idx) {
    if (q._sectionId !== currentSectionId) {
      currentSectionId = q._sectionId;
      html += '<div class="card-section-label">' + q._sectionName + '</div>';
    }
    var classes = ['card-num'];
    var userAns = state.userAnswers[q.id];
    if (idx === state.currentIndex) classes.push('current');
    var showResult = state.submitted || (state.mode === 'study' && state.answeredShown[q.id]);
    if (showResult) {
      var isCorrect = false;
      if (q._type === 'multi') {
        var ua = userAns || [];
        isCorrect = ua.length === q.ans.length && q.ans.every(function(v) { return ua.indexOf(v) >= 0; });
      } else { isCorrect = userAns === q.ans; }
      if (isCorrect) classes.push('correct-num');
      else classes.push('wrong-num');
    } else if (userAns !== undefined && userAns !== null) {
      if (q._type === 'multi') { if (userAns.length > 0) classes.push('answered'); }
      else { classes.push('answered'); }
    }
    html += '<div class="' + classes.join(' ') + '" data-idx="' + idx + '">' + q.id + '</div>';
  });
  document.getElementById('cardGrid').innerHTML = html;
  document.getElementById('cardSub').textContent = '已答 ' + Object.keys(state.userAnswers).length + '/' + state.allQuestions.length + ' 题';
}

// ====== REVIEW ======
function showReview() {
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('reviewPage').classList.add('active');
  var html = '';
  state.allQuestions.forEach(function(q, idx) {
    var userAns = state.userAnswers[q.id];
    var correctAns = q.ans;
    var isCorrect = false;
    if (q._type === 'multi') {
      var ua = userAns || [];
      isCorrect = ua.length === correctAns.length && correctAns.every(function(v) { return ua.indexOf(v) >= 0; });
    } else { isCorrect = userAns === correctAns; }
    var correctLabel = q._type === 'multi' ? correctAns.map(function(a) { return LABELS[a]; }).join('') : LABELS[correctAns];
    var userLabel = q._type === 'multi' ? (userAns || []).map(function(a) { return LABELS[a]; }).join('') || '未作答' : (userAns !== undefined ? LABELS[userAns] : '未作答');

    html += '<div class="review-item">';
    html += '<div class="ri-header"><span class="ri-num">' + q.id + '. [' + q._sectionName + ']</span>';
    html += '<span class="ri-status ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✓ 正确' : '✗ 错误') + '</span></div>';
    html += '<div class="ri-q">' + escapeHtml(q.q) + '</div>';
    q.opts.forEach(function(opt, oi) {
      var isCorrectOpt = q._type === 'multi' ? (correctAns.indexOf(oi) >= 0) : (oi === correctAns);
      html += '<div class="ri-opt' + (isCorrectOpt ? ' correct' : '') + '">' + LABELS[oi] + '. ' + escapeHtml(opt) + '</div>';
    });
    html += '<div class="ri-answer">✅ 正确答案：' + correctLabel + '</div>';
    if (!isCorrect) html += '<div class="ri-your">❌ 你的答案：' + userLabel + '</div>';
    if (q.exp) html += '<div class="ri-exp">📝 ' + escapeHtml(q.exp) + '</div>';
    html += '</div>';
  });
  document.getElementById('reviewContent').innerHTML = html;
  window.scrollTo(0, 0);
}

// ====== EXPORT ======
function showExport() {
  var wrongQuestions = [];
  state.allQuestions.forEach(function(q) {
    var userAns = state.userAnswers[q.id];
    var correctAns = q.ans;
    var isCorrect = false;
    if (q._type === 'multi') {
      var ua = userAns || [];
      isCorrect = ua.length === correctAns.length && correctAns.every(function(v) { return ua.indexOf(v) >= 0; });
    } else { isCorrect = userAns === correctAns; }
    if (!isCorrect) wrongQuestions.push(q);
  });
  if (wrongQuestions.length === 0) { showToast('恭喜！没有错题 🎉'); return; }

  var text = '【' + state.currentExam.id + '年真题 · 错题集】\n共 ' + wrongQuestions.length + ' 道错题\n\n';
  wrongQuestions.forEach(function(q, idx) {
    var correctLabel = q._type === 'multi' ? q.ans.map(function(a) { return LABELS[a]; }).join('') : LABELS[q.ans];
    var userAns = state.userAnswers[q.id];
    var userLabel = q._type === 'multi' ? (userAns || []).map(function(a) { return LABELS[a]; }).join('') || '未作答' : (userAns !== undefined ? LABELS[userAns] : '未作答');
    text += (idx + 1) + '. [' + q._sectionName + '] ' + q.q + '\n';
    q.opts.forEach(function(opt, oi) { text += '   ' + LABELS[oi] + '. ' + opt + '\n'; });
    text += '   正确答案：' + correctLabel + ' | 你的答案：' + userLabel + '\n';
    text += '   解析：' + (q.exp || '暂无') + '\n\n';
  });
  document.getElementById('exportText').value = text;
  document.getElementById('exportModal').classList.add('show');
}
function copyExport() {
  var textarea = document.getElementById('exportText');
  textarea.select(); textarea.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); showToast('已复制到剪贴板'); }
  catch(e) {
    navigator.clipboard.writeText(textarea.value).then(function() { showToast('已复制到剪贴板'); })
      .catch(function() { showToast('复制失败，请手动选择复制'); });
  }
}

// ====== HOME ======
function goHome() {
  document.getElementById('quizPage').classList.remove('active');
  document.getElementById('resultPage').classList.remove('active');
  document.getElementById('reviewPage').classList.remove('active');
  document.getElementById('homePage').style.display = 'block';
  document.querySelectorAll('.year-card').forEach(function(c) { c.classList.remove('selected'); });
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = '选择试卷开始答题';
  document.getElementById('startBtn').dataset.examIdx = '';
  window.scrollTo(0, 0);
}

// ====== UTILS ======
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
