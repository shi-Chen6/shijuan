<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>程序与算法基础 - 刷题练习</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary-color: #4a90e2;
            --primary-light: #e6f7ff;
            --success-color: #52c41a;
            --success-light: #f6ffed;
            --error-color: #f5222d;
            --error-light: #fff2f0;
            --warning-color: #faad14;
            --warning-light: #fffbe6;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --border-color: #e8e8e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.12);
            --font-size-base: 16px;
            --font-size-small: 14px;
            --font-size-large: 18px;
            --radius: 12px;
            --radius-sm: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            transition: font-size 0.3s ease;
        }
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            z-index: 200;
            box-shadow: var(--shadow);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .left-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn,
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:active,
        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
        .question-info {
            text-align: center;
            flex: 1;
        }
        .question-number {
            font-size: 18px;
            font-weight: 600;
        }
        .progress-text {
            font-size: 12px;
            opacity: 0.9;
        }
        .right-section {
            display: flex;
            gap: 8px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 140px;
        }
        .knowledge-page {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .knowledge-page.hidden {
            display: none;
        }
        .knowledge-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .knowledge-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }
        .knowledge-content {
            font-size: var(--font-size-base);
            line-height: 1.8;
            color: var(--text-primary);
        }
        .knowledge-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 18px 0 8px;
            color: var(--primary-color);
            padding-left: 10px;
            border-left: 4px solid var(--primary-color);
        }
        .knowledge-content p {
            margin-bottom: 10px;
        }
        .knowledge-content ul {
            margin: 8px 0 12px 18px;
        }
        .knowledge-content li {
            margin-bottom: 6px;
        }
        .knowledge-content .highlight {
            background: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
        }
        .knowledge-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 4px;
            font-size: 13px;
        }
        .knowledge-table th,
        .knowledge-table td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }
        .knowledge-table th {
            background: #f5f7fb;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .start-quiz-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .start-quiz-btn:active {
            transform: scale(0.98);
        }
        .question-card,
        .analysis-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-type {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-light);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .question-stem {
            font-size: var(--font-size-large);
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .formula {
            background: #fafafa;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            font-family: 'Courier New', monospace;
            text-align: center;
            border-left: 4px solid var(--primary-color);
            overflow-x: auto;
        }
        .question-image {
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            display: block;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 56px;
            position: relative;
        }
        .option-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--radius-sm);
            pointer-events: none;
        }
        .option-item:hover {
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: scale(1.01);
        }
        .option-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
        }
        .option-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
        }
        .option-label {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
            transition: all 0.3s ease;
        }
        .selected .option-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .correct .option-label {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
        .wrong .option-label {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }
        .option-text {
            flex: 1;
            padding-top: 2px;
        }
        .analysis-card {
            padding: 0;
            margin-top: 16px;
            overflow: hidden;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 2000px;
            }
        }
        .analysis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #fafafa;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .analysis-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-primary);
            flex-wrap: wrap;
        }
        .result-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .result-badge.correct {
            background: var(--success-light);
            color: var(--success-color);
        }
        .result-badge.wrong {
            background: var(--error-light);
            color: var(--error-color);
        }
        .result-badge.partial {
            background: var(--warning-light);
            color: var(--warning-color);
        }
        .toggle-icon {
            transition: transform 0.3s ease;
        }
        .toggle-icon.expanded {
            transform: rotate(180deg);
        }
        .analysis-content {
            padding: 20px;
            font-size: var(--font-size-small);
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .analysis-content p {
            margin-bottom: 10px;
        }
        .analysis-content strong {
            color: var(--text-primary);
            font-size: 15px;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.08);
            z-index: 150;
        }
        .footer.hidden {
            transform: translateY(100%);
        }
        .footer-content {
            max-width: 430px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 60px;
        }
        .nav-btn:active {
            transform: scale(0.98);
        }
        .prev-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .prev-btn:not(:disabled):hover {
            background: #e8e8e8;
        }
        .next-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .submit-btn {
            background: var(--success-color);
            color: white;
            flex: 2;
        }
        .draft-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
            flex: 1;
        }
        .clear-btn {
            background: #fff2f0;
            color: var(--error-color);
            flex: 1;
        }
        .sheet-overlay,
        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sheet-overlay.show,
        .history-overlay.show {
            display: block;
            opacity: 1;
        }
        .sheet-panel,
        .history-panel {
            position: fixed;
            background: var(--bg-card);
            z-index: 400;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sheet-panel {
            bottom: 0;
            left: 50%;
            right: auto;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            transform: translate(-50%, 100%);
            max-height: 70vh;
            width: min(430px, 100%);
        }
        .sheet-panel.show {
            transform: translate(-50%, 0);
        }
        .history-panel {
            top: 0;
            right: 0;
            bottom: 0;
            width: 85%;
            max-width: 360px;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            transform: translateX(100%);
        }
        .history-panel.show {
            transform: translateX(0);
        }
        .sheet-header,
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-title,
        .history-title {
            font-size: 18px;
            font-weight: 600;
        }
        .close-sheet {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 50%;
            cursor: pointer;
        }
        .sheet-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-btn,
        .clear-history {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .clear-history {
            background: #fff2f0;
            color: var(--error-color);
        }
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }
        .sheet-item {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--border-color);
            background: white;
            font-size: 11px;
        }
        .sheet-item.unanswered {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .sheet-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
            color: var(--success-color);
        }
        .sheet-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
            color: var(--error-color);
        }
        .sheet-item.current {
            border-width: 3px;
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .sheet-number {
            font-size: 16px;
        }
        .sheet-status {
            font-size: 10px;
            margin-top: 2px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            background: #fafafa;
            border-radius: var(--radius-sm);
            padding: 16px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        .history-item:active {
            transform: scale(0.98);
        }
        .history-date {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .history-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-stat {
            text-align: center;
        }
        .history-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .history-label {
            font-size: 11px;
            color: var(--text-light);
        }
        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .history-action-btn {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .review-btn {
            background: var(--primary-color);
            color: white;
        }
        .delete-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .completion-screen {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        .completion-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--success-color), #73d13d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        .completion-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .history-view-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .review-wrong-btn {
            background: var(--warning-color);
            color: white;
        }
        .export-btn {
            background: #52c41a;
            color: white;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: toastIn 0.3s ease;
            pointer-events: none;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .textarea-answer {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            font-family: inherit;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.3s ease;
            background: var(--bg-card);
            color: var(--text-primary);
            box-sizing: border-box;
        }
        .textarea-answer:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        .textarea-answer:disabled {
            background: #fafafa;
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        .task-list {
            background: #fafbfc;
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            margin-bottom: 14px;
            border-left: 4px solid var(--primary-color);
        }
        .task-list ol {
            margin: 8px 0 0 18px;
            padding: 0;
        }
        .task-list li {
            margin-bottom: 6px;
            font-size: var(--font-size-small);
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .task-list strong {
            color: var(--text-primary);
        }
        .keyword-highlight {
            background: #ffeaa7;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }
        .keyword-match-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            align-items: center;
        }
        .match-tag {
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
        }
        .match-tag.hit {
            background: var(--success-light);
            color: var(--success-color);
        }
        .match-tag.miss {
            background: #f5f5f5;
            color: var(--text-light);
        }
        .progress-score-bar {
            height: 10px;
            background: #e8e8e8;
            border-radius: 5px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-score-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

                    <li><strong>循环结构</strong>：重复执行某一段代码，直到满足终止条件，如<code>for</code>循环、<code>while</code>循环</li>
                </ul>
                <h3>教材典型案例</h3>
                <p><strong>1. 计算圆的面积（顺序结构）</strong></p>
                <p>问题：输入圆的半径r，计算并输出圆的面积S。算法步骤：①输入半径r；②根据公式S=πr²计算面积；③输出面积S。</p>
                <p><strong>2. 判断闰年（分支结构）</strong></p>
                <p>问题：输入一个年份，判断该年份是否为闰年。闰年判断规则：能被4整除但不能被100整除，或者能被400整除。用<code>if-elif-else</code>语句实现分支判断。</p>
                <p><strong>3. 计算1到100的累加和（循环结构）</strong></p>
                <p>问题：计算1+2+3+...+100的结果。算法步骤：①初始化累加和sum=0，计数器i=1；②当i≤100时，执行sum=sum+i，i=i+1；③输出sum。</p>
                <h3>教学重点 / 易错点</h3>
                <p><strong>教学重点：</strong>掌握程序的定义和程序设计的一般过程；熟记程序设计语言的发展历程及各阶段特点；理解算法的五大核心特征；识别流程图基本符号；掌握算法的三种基本结构。</p>
                <p><strong>易错点：</strong>①算法特征混淆（有穷性≠时间短）；②流程图符号错误（矩形和菱形混淆）；③结构区分错误（分支和循环混淆）；④语言发展误区（误认为高级语言执行更快）；⑤程序设计过程颠倒（先写程序再设计算法）。</p>
                <h3>学段区分说明</h3>
                <p><strong>初中阶段</strong>：了解程序基本概念，认识流程图基本符号，能读懂简单的顺序和分支结构流程图，会用Python编写简单的顺序和分支程序。</p>
                <p><strong>高中阶段</strong>：理解程序与算法的关系，掌握算法五大特征，能独立设计算法解决实际问题，熟练绘制流程图，掌握三种基本结构的程序实现，了解程序设计语言发展历程。</p>
            `;
            document.getElementById('knowledgeTitle').textContent = title;
            document.getElementById('knowledgeContent').innerHTML = content;
        }

        function switchToKnowledgePage() {
            currentPage = 'learn';
            document.getElementById('knowledgePage').classList.remove('hidden');
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('questionInfo').style.display = 'none';
            document.getElementById('pageTitle').style.display = 'block';
            document.querySelector('.progress-bar').style.display = 'none';
            document.getElementById('footerContent').innerHTML = `
                <button class="start-quiz-btn" onclick="startQuiz()"><i class="fas fa-play-circle"></i> 我已学完，开始刷题</button>
            `;
        }

        function startQuiz() {
            currentPage = 'quiz';
            reviewMode = false;
            reviewIndices = [];
            document.getElementById('knowledgePage').classList.add('hidden');
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('questionInfo').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            if (answers.every(a => a === null) && currentIndex === 0) {
                currentIndex = 0;
            }
            renderQuestion();
            updateNavButtons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getCurrentQuestion() {
            if (reviewMode && reviewIndices.length > 0) {
                return questions[reviewIndices[currentIndex]];
            }
            return questions[currentIndex];
        }

        function getRealIndex() {
            if (reviewMode && reviewIndices.length > 0) {
                return reviewIndices[currentIndex];
            }
            return currentIndex;
        }

        function getTotalInMode() {
            if (reviewMode) return reviewIndices.length;
            return questions.length;
        }

        function renderQuestion() {
            const q = getCurrentQuestion();
            const realIdx = getRealIndex();
            const contentArea = document.getElementById('quizContent');
            const totalInMode = getTotalInMode();

            if (q.type === '简答题' || q.type === '综合应用题') {
                renderOpenEndedQuestion(q, realIdx, contentArea, totalInMode);
                return;
            }

            let html =
                `<div class="question-card"><span class="question-type">${q.type}</span><div class="question-stem">${q.stem}</div>`;
            if (q.image) { html += `<img src="${q.image}" alt="题目图片" class="question-image">`; }
            html += `<div class="options-container">`;
            q.options.forEach((opt, idx) => {
                const isSelected = answers[realIdx] === idx;
                const isCorrect = q.answer === idx;
                let classes = ['option-item'];
                if (answers[realIdx] !== null) {
                    if (isSelected && isCorrect) classes.push('correct');
                    else if (isSelected && !isCorrect) classes.push('wrong');
                    else if (isCorrect) classes.push('correct');
                } else if (isSelected) {
                    classes.push('selected');
                }
                html +=
                    `<div class="${classes.join(' ')}" onclick="selectOption(${idx})"><div class="option-label">${opt.label}</div><div class="option-text">${opt.text}</div></div>`;
            });
            html += '</div></div>';

            if (answers[realIdx] !== null) {
                const isCorrect = answers[realIdx] === q.answer;
                html += `
                    <div class="analysis-card">
                        <div class="analysis-header" onclick="toggleAnalysis(this)">
                            <div class="analysis-title">📝 答案分析 <span class="result-badge ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓ 回答正确' : '✗ 回答错误'}</span></div>
                            <div class="toggle-icon expanded">▼</div>
                        </div>
                        <div class="analysis-content" style="display: block;">${q.analysis}</div>
                    </div>
                `;
            }

            if (currentIndex === totalInMode - 1 && answers.filter((a, i) => {
                    if (reviewMode && reviewIndices.length > 0) return reviewIndices.includes(i) && a !==
                        null;
                    return a !== null;
                }).length >= totalInMode && totalInMode > 0) {
                html += renderCompletionScreen();
            }
            contentArea.innerHTML = html;
            updateHeader();
            if (window.MathJax) { MathJax.typeset(); }
        }

        function renderOpenEndedQuestion(q, realIdx, contentArea, totalInMode) {
            const userAnswer = answers[realIdx] || '';
            const isSubmitted = answers[realIdx] !== null && typeof answers[realIdx] === 'string';
            let html = `<div class="question-card"><span class="question-type">${q.type}</span><div class="question-stem">${q.stem}</div>`;

            if (q.tasks && q.tasks.length > 0) {
                html += `<div class="task-list"><strong>📋 任务列表：</strong><ol>`;
                q.tasks.forEach(task => { html += `<li>${task}</li>`; });
                html += `</ol></div>`;
            }

            html +=
                `<textarea class="textarea-answer" id="openAnswerTextarea" placeholder="请在此输入你的作答内容..." ${isSubmitted ? 'disabled' : ''}>${userAnswer}</textarea>`;

            if (isSubmitted && q.keywords && q.keywords.length > 0) {
                const matchResult = calculateKeywordMatch(userAnswer, q.keywords);
                const hitRate = matchResult.hitRate;
                const hitKeywords = matchResult.hitKeywords;
                const missKeywords = matchResult.missKeywords;
                let levelText = '';
                let levelClass = '';
                let barClass = '';
                if (q.type === '简答题') {
                    if (hitRate >= 60) { levelText = '回答较好';
                        levelClass = 'correct';
                        barClass = 'excellent'; } else if (hitRate >= 30) { levelText = '部分正确';
                        levelClass = 'partial';
                        barClass = 'pass'; } else { levelText = '需加强';
                        levelClass = 'wrong';
                        barClass = 'weak'; }
                } else {
                    if (hitRate >= 80) { levelText = '优秀';
                        levelClass = 'correct';
                        barClass = 'excellent'; } else if (hitRate >= 60) { levelText = '良好';
                        levelClass = 'correct';
                        barClass = 'good'; } else if (hitRate >= 40) { levelText = '合格';
                        levelClass = 'partial';
                        barClass = 'pass'; } else { levelText = '需加强';
                        levelClass = 'wrong';
                        barClass = 'weak'; }
                }
                html +=
                    `<div style="margin-top:12px;"><strong>📊 关键词命中率：</strong><span style="font-weight:700;color:var(--primary-color);">${hitRate}%</span> <span class="result-badge ${levelClass}">${levelText}</span></div>`;
                html +=
                    `<div class="progress-score-bar"><div class="progress-score-fill ${barClass}" style="width:${hitRate}%;"></div></div>`;
                html += `<div class="keyword-match-info"><strong>✅ 命中关键词：</strong>`;
                if (hitKeywords.length > 0) {
                    hitKeywords.forEach(kw => { html +=
                            `<span class="match-tag hit">${kw}</span>`; });
                } else { html += `<span style="color:var(--text-light);">无</span>`; }
                html += `</div><div class="keyword-match-info"><strong>❌ 未命中关键词：</strong>`;
                if (missKeywords.length > 0) {
                    missKeywords.forEach(kw => { html +=
                            `<span class="match-tag miss">${kw}</span>`; });
                } else { html += `<span style="color:var(--text-light);">无</span>`; }
                html += `</div>`;
                html +=
                    `<div style="margin-top:10px;"><strong>📝 你的作答：</strong><div class="user-answer-display">${highlightKeywordsInText(userAnswer, hitKeywords)}</div></div>`;
                html +=
                    `<div style="margin-top:8px;"><strong>📋 参考答案：</strong><div class="user-answer-display">${q.answer}</div></div>`;
            }

            html += '</div>';

            if (isSubmitted) {
                const matchResult = calculateKeywordMatch(userAnswer, q.keywords || []);
                const hitRate = matchResult.hitRate;
                let isWrong = hitRate < 60;
                let levelText = hitRate >= 60 ? (hitRate >= 80 ? '优秀' : '良好') : (hitRate >= 30 ? '部分正确' : '需加强');
                let badgeClass = isWrong ? 'wrong' : 'correct';
                html += `
                    <div class="analysis-card">
                        <div class="analysis-header" onclick="toggleAnalysis(this)">
                            <div class="analysis-title">📝 答案分析 <span class="result-badge ${badgeClass}">命中率 ${hitRate}% · ${levelText}</span></div>
                            <div class="toggle-icon expanded">▼</div>
                        </div>
                        <div class="analysis-content" style="display: block;">${q.analysis}</div>
                    </div>
                `;
            }

            if (currentIndex === totalInMode - 1 && totalInMode > 0) {
                const allAnswered = answers.filter((a, i) => {
                    if (reviewMode && reviewIndices.length > 0) return reviewIndices.includes(i) && a !==
                        null;
                    return a !== null;
                }).length >= totalInMode;
                if (allAnswered) {
                    html += renderCompletionScreen();
                }
            }
            contentArea.innerHTML = html;

            const textarea = document.getElementById('openAnswerTextarea');
            if (textarea && !isSubmitted) {
                textarea.addEventListener('input', function() {
                    autoResizeTextarea(this);
                    saveDraft(realIdx, this.value);
                });
                autoResizeTextarea(textarea);
            }

            updateHeader();
            if (window.MathJax) { MathJax.typeset(); }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.max(120, textarea.scrollHeight) + 'px';
        }

        function calculateKeywordMatch(userText, keywords) {
            if (!userText || !keywords || keywords.length === 0) return { hitRate: 0, hitKeywords: [],
                missKeywords: keywords || [] };
            const lowerText = userText.toLowerCase();
            const hitKeywords = [];
            const missKeywords = [];
            keywords.forEach(kw => {
                if (lowerText.includes(kw.toLowerCase())) {
                    hitKeywords.push(kw);
                } else {
                    missKeywords.push(kw);
                }
            });
            const hitRate = Math.round((hitKeywords.length / keywords.length) * 100);
            return { hitRate, hitKeywords, missKeywords };
        }

        function highlightKeywordsInText(text, hitKeywords) {
            if (!text || !hitKeywords || hitKeywords.length === 0) return text || '';
            let result = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            hitKeywords.forEach(kw => {
                const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escapedKw})`, 'gi');
                result = result.replace(regex,
                    '<span class="keyword-highlight" style="background:#ffeaa7;padding:1px 4px;border-radius:3px;font-weight:600;">$1</span>'
                    );
            });
            return result;
        }

        function renderCompletionScreen() {
            const totalInMode = getTotalInMode();
            let correctCount = 0;
            let totalAnswered = 0;
            const indicesToCheck = reviewMode && reviewIndices.length > 0 ? reviewIndices : questions.map((_, i) => i);
            indicesToCheck.forEach(i => {
                if (answers[i] !== null) {
                    totalAnswered++;
                    const q = questions[i];
                    if (q.type === '单选题' || q.type === '判断题') {
                        if (answers[i] === q.answer) correctCount++;
                    } else if (q.type === '简答题' || q.type === '综合应用题') {
                        const matchResult = calculateKeywordMatch(answers[i] || '', q.keywords || []);
                        if (matchResult.hitRate >= 60) correctCount++;
                    }
                }
            });
            const accuracy = totalAnswered > 0 ? Math.round(correctCount / totalInMode * 100) : 0;
            if (!reviewMode) {
                saveToHistory(correctCount, accuracy);
            }
            return `
                <div class="completion-screen">
                    <div class="completion-icon">🎉</div>
                    <h1 class="completion-title">${reviewMode ? '错题回顾完成！' : '刷题完成！'}</h1>
                    <p style="color: var(--text-secondary);">${reviewMode ? '你已经回顾了所有错题，继续加油！' : '太棒了！你已经完成了所有题目'}</p>
                    <div class="stats">
                        <div class="stat-item"><div class="stat-value">${correctCount}/${totalInMode}</div><div class="stat-label">答对题数</div></div>
                        <div class="stat-item"><div class="stat-value">${accuracy}%</div><div class="stat-label">正确率</div></div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn restart-btn" onclick="restartQuiz()">重新开始</button>
                        <button class="action-btn history-view-btn" onclick="toggleHistory()">查看历史</button>
                        ${!reviewMode ? '<button class="action-btn review-wrong-btn" onclick="reviewWrongQuestions()">回看错题</button>' : ''}
                        <button class="action-btn export-btn" onclick="exportWrongQuestionsCSV()">📥 导出错题CSV</button>
                    </div>
                </div>
            `;
        }

        function selectOption(idx) {
            const realIdx = getRealIndex();
            if (answers[realIdx] !== null) return;
            answers[realIdx] = idx;
            saveAnswers();
            renderQuestion();
            renderAnswerSheet();
            updateNavButtons();
            const q = getCurrentQuestion();
            showToast(idx === q.answer ? '回答正确！✓' : '回答错误 ✗');
        }

        function submitOpenAnswer() {
            const realIdx = getRealIndex();
            const textarea = document.getElementById('openAnswerTextarea');
            if (!textarea) return;
            const userText = textarea.value.trim();
            if (!userText) { showToast('请输入作答内容后再提交'); return; }
            answers[realIdx] = userText;
            saveAnswers();
            clearDraft(realIdx);
            renderQuestion();
            renderAnswerSheet();
            updateNavButtons();
            const q = getCurrentQuestion();
            const matchResult = calculateKeywordMatch(userText, q.keywords || []);
            const hitRate = matchResult.hitRate;
            if (hitRate >= 60) {
                showToast(`作答提交成功！关键词命中率 ${hitRate}% ✓`);
            } else if (hitRate >= 30) {
                showToast(`作答提交成功！命中率 ${hitRate}%，部分正确 ⚠️`);
            } else {
                showToast(`作答提交成功！命中率 ${hitRate}%，需加强 ✗`);
            }
        }

        function clearOpenAnswer() {
            const realIdx = getRealIndex();
            const textarea = document.getElementById('openAnswerTextarea');
            if (textarea && answers[realIdx] === null) {
                textarea.value = '';
                textarea.style.height = 'auto';
                textarea.style.height = '120px';
                clearDraft(realIdx);
                showToast('输入已清空');
            }
        }

        function saveDraft(index, value) {
            const drafts = getDrafts();
            if (value.trim()) {
                drafts[index] = value;
            } else {
                delete drafts[index];
            }
            localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts));
        }

        function clearDraft(index) {
            const drafts = getDrafts();
            delete drafts[index];
            localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts));
        }

        function getDrafts() {
            const saved = localStorage.getItem(STORAGE_KEY_DRAFTS);
            return saved ? JSON.parse(saved) : {};
        }

        function initAutoSaveDrafts() {
            const drafts = getDrafts();
            Object.keys(drafts).forEach(idx => {
                const i = parseInt(idx);
                if (answers[i] === null && drafts[i]) {
                    answers[i] = null;
                }
            });
        }

        function loadDraftForIndex(index) {
            const drafts = getDrafts();
            return drafts[index] || '';
        }

        function toggleAnalysis(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');
            if (content.style.display === 'none') { content.style.display = 'block';
                icon.classList.add('expanded'); } else { content.style.display = 'none';
                icon.classList.remove('expanded'); }
        }

        function prevQuestion() {
            const totalInMode = getTotalInMode();
            if (currentIndex > 0) { currentIndex--;
                renderQuestion();
                updateNavButtons(); }
        }

        function nextQuestion() {
            const totalInMode = getTotalInMode();
            if (currentIndex < totalInMode - 1) { currentIndex++;
                renderQuestion();
                updateNavButtons(); }
        }

        function updateHeader() {
            if (currentPage !== 'quiz') return;
            const totalInMode = getTotalInMode();
            document.getElementById('currentNum').textContent = currentIndex + 1;
            const indicesToCheck = reviewMode && reviewIndices.length > 0 ? reviewIndices : questions.map((_, i) => i);
            const answeredCount = indicesToCheck.filter(i => answers[i] !== null).length;
            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('totalCount').textContent = totalInMode;
            document.getElementById('progressFill').style.width = `${totalInMode > 0 ? (answeredCount / totalInMode) * 100 : 0}%`;
        }

        function updateNavButtons() {
            const footerContent = document.getElementById('footerContent');
            if (currentPage !== 'quiz') return;
            const q = getCurrentQuestion();
            const realIdx = getRealIndex();
            const totalInMode = getTotalInMode();
            const isSubmitted = answers[realIdx] !== null;

            if ((q.type === '简答题' || q.type === '综合应用题') && !isSubmitted) {
                footerContent.innerHTML = `
                    <button class="nav-btn draft-btn" onclick="saveDraft(${realIdx}, document.getElementById('openAnswerTextarea')?.value || ''); showToast('草稿已保存')"><i class="fas fa-save"></i> 保存草稿</button>
                    <button class="nav-btn clear-btn" onclick="clearOpenAnswer()"><i class="fas fa-eraser"></i> 清空</button>
                    <button class="nav-btn submit-btn" onclick="submitOpenAnswer()"><i class="fas fa-check-circle"></i> 提交作答</button>
                `;
            } else {
                footerContent.innerHTML = `
                    <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> 上一题</button>
                    <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()" ${currentIndex === totalInMode - 1 ? 'disabled' : ''}>下一题 <i class="fas fa-chevron-right"></i></button>
                `;
            }
        }

        function changeFontSize(delta) {
            fontSize = Math.max(14, Math.min(22, fontSize + delta));
            document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`);
            document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`);
            document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`);
            saveSettings();
        }

        function toggleSheet() {
            const overlay = document.getElementById('sheetOverlay');
            const panel = document.getElementById('sheetPanel');
            if (panel.classList.contains('show')) { overlay.classList.remove('show');
                panel.classList.remove('show'); } else { overlay.classList.add('show');
                panel.classList.add('show');
                renderAnswerSheet(); }
        }

        function renderAnswerSheet() {
            const grid = document.getElementById('sheetGrid');
            const indicesToShow = reviewMode && reviewIndices.length > 0 ? reviewIndices : questions.map((_, i) => i);
            let html = '';
            indicesToShow.forEach((realIdx, displayIdx) => {
                const q = questions[realIdx];
                let statusClass = 'unanswered';
                let statusText = '未答';
                if (answers[realIdx] !== null) {
                    let isCorrect = false;
                    if (q.type === '单选题' || q.type === '判断题') {
                        isCorrect = answers[realIdx] === q.answer;
                    } else if (q.type === '简答题' || q.type === '综合应用题') {
                        const matchResult = calculateKeywordMatch(answers[realIdx] || '', q.keywords || []);
                        isCorrect = matchResult.hitRate >= 60;
                    }
                    if (isCorrect) { statusClass = 'correct';
                        statusText = '正确'; } else { statusClass = 'wrong';
                        statusText = '错误'; }
                }
                if (displayIdx === currentIndex) { statusClass += ' current'; }
                if (currentFilter !== 'all') {
                    if (currentFilter === 'unanswered' && answers[realIdx] !== null) return;
                    if (currentFilter === 'correct') {
                        let isC = false;
                        if (q.type === '单选题' || q.type === '判断题') isC = answers[realIdx] === q.answer;
                        else if (q.type === '简答题' || q.type === '综合应用题') {
                            const mr = calculateKeywordMatch(answers[realIdx] || '', q.keywords || []);
                            isC = mr.hitRate >= 60;
                        }
                        if (!isC) return;
                    }
                    if (currentFilter === 'wrong') {
                        let isW = false;
                        if (q.type === '单选题' || q.type === '判断题') isW = answers[realIdx] !== null && answers[
                            realIdx] !== q.answer;
                        else if (q.type === '简答题' || q.type === '综合应用题') {
                            const mr = calculateKeywordMatch(answers[realIdx] || '', q.keywords || []);
                            isW = answers[realIdx] !== null && mr.hitRate < 60;
                        }
                        if (!isW) return;
                    }
                }
                html +=
                    `<div class="sheet-item ${statusClass}" onclick="jumpToQuestionByDisplay(${displayIdx})"><div class="sheet-number">${displayIdx + 1}</div><div class="sheet-status">${statusText}</div></div>`;
            });
            grid.innerHTML = html;
        }

        function filterQuestions(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderAnswerSheet();
        }

        function jumpToQuestionByDisplay(displayIdx) {
            currentIndex = displayIdx;
            renderQuestion();
            updateNavButtons();
            toggleSheet();
        }

        function jumpToQuestion(index) {
            if (reviewMode && reviewIndices.length > 0) {
                const pos = reviewIndices.indexOf(index);
                if (pos >= 0) { currentIndex = pos;
                    renderQuestion();
                    updateNavButtons();
                    toggleSheet(); }
            } else {
                currentIndex = index;
                renderQuestion();
                updateNavButtons();
                toggleSheet();
            }
        }

        function toggleHistory() {
            const overlay = document.getElementById('historyOverlay');
            const panel = document.getElementById('historyPanel');
            if (panel.classList.contains('show')) { overlay.classList.remove('show');
                panel.classList.remove('show'); } else { overlay.classList.add('show');
                panel.classList.add('show');
                renderHistory(); }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = getHistory();
            if (history.length === 0) { list.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">📊</div><div>暂无历史记录</div><div style="font-size: 12px; margin-top: 8px;">完成一套题后会自动保存记录</div></div>`
                    ; return; }
            let html = '';
            history.forEach((record, index) => {
                const dateStr = new Date(record.timestamp).toLocaleDateString('zh-CN', { month: 'short',
                    day: 'numeric', hour: '2-digit', minute: '2-digit' });
                html +=
                    `<div class="history-item"><div class="history-date">${dateStr}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${record.correctCount}/${record.totalCount}</div><div class="history-label">答对题数</div></div><div class="history-stat"><div class="history-value">${record.accuracy}%</div><div class="history-label">正确率</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${index})">回顾</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${index})">删除</button></div></div>`;
            });
            list.innerHTML = html;
        }

        function saveToHistory(correctCount, accuracy) {
            const history = getHistory();
            const serializableAnswers = answers.map(a => {
                if (a === null) return null;
                if (typeof a === 'string') return a;
                return a;
            });
            history.unshift({ timestamp: new Date().getTime(), totalCount: questions.length, correctCount: correctCount,
                accuracy: accuracy, answers: serializableAnswers });
            if (history.length > 50) history.pop();
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        }

        function getHistory() { const saved = localStorage.getItem(STORAGE_KEY_HISTORY); return saved ? JSON.parse(saved) :
                []; }

        function reviewHistory(index) {
            const history = getHistory();
            if (index >= 0 && index < history.length) {
                answers = [...history[index].answers];
                currentIndex = 0;
                reviewMode = false;
                reviewIndices = [];
                saveAnswers();
                startQuiz();
                toggleHistory();
                showToast('已加载历史记录');
            }
        }

        function deleteHistory(index) {
            if (!confirm('确定要删除这条记录吗？')) return;
            const history = getHistory();
            if (index >= 0 && index < history.length) { history.splice(index, 1);
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
                renderHistory();
                showToast('记录已删除'); }
        }

        function clearAllHistory() {
            if (!confirm('确定要清空所有历史记录吗？')) return;
            localStorage.removeItem(STORAGE_KEY_HISTORY);
            renderHistory();
            showToast('历史记录已清空');
        }

        function reviewWrongQuestions() {
            const wrongIndices = [];
            questions.forEach((q, i) => {
                if (answers[i] !== null) {
                    if (q.type === '单选题' || q.type === '判断题') {
                        if (answers[i] !== q.answer) wrongIndices.push(i);
                    } else if (q.type === '简答题' || q.type === '综合应用题') {
                        const matchResult = calculateKeywordMatch(answers[i] || '', q.keywords || []);
                        if (matchResult.hitRate < 60) wrongIndices.push(i);
                    }
                }
            });
            if (wrongIndices.length === 0) {
                showToast('没有错题，太棒了！🎉');
                return;
            }
            reviewMode = true;
            reviewIndices = wrongIndices;
            currentIndex = 0;
            currentPage = 'quiz';
            document.getElementById('knowledgePage').classList.add('hidden');
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('questionInfo').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            renderQuestion();
            updateNavButtons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(`进入错题回顾模式，共 ${wrongIndices.length} 道错题`);
        }

        function exportWrongQuestionsCSV() {
            const wrongData = [];
            questions.forEach((q, i) => {
                if (answers[i] !== null) {
                    let isWrong = false;
                    let userAnswerStr = '';
                    let correctAnswerStr = '';
                    let hitRateStr = '';
                    let resultStr = '';
                    if (q.type === '单选题' || q.type === '判断题') {
                        if (answers[i] !== q.answer) {
                            isWrong = true;
                            userAnswerStr = q.options[answers[i]] ? q.options[answers[i]].text : String(answers[
                                i]);
                            correctAnswerStr = q.options[q.answer] ? q.options[q.answer].text : String(q.answer);
                            resultStr = '错误';
                            hitRateStr = 'N/A';
                        }
                    } else if (q.type === '简答题' || q.type === '综合应用题') {
                        const matchResult = calculateKeywordMatch(answers[i] || '', q.keywords || []);
                        if (matchResult.hitRate < 60) {
                            isWrong = true;
                            userAnswerStr = (answers[i] || '').replace(/"/g, '""');
                            correctAnswerStr = (q.answer || '').replace(/"/g, '""');
                            hitRateStr = matchResult.hitRate + '%';
                            resultStr = matchResult.hitRate >= 30 ? '部分正确' : '需加强';
                        }
                    }
                    if (isWrong) {
                        wrongData.push({
                            type: q.type,
                            stem: q.stem.replace(/"/g, '""'),
                            userAnswer: userAnswerStr,
                            correctAnswer: correctAnswerStr,
                            hitRate: hitRateStr,
                            result: resultStr,
                            analysis: (q.analysis || '').replace(/<[^>]*>/g, '').replace(/"/g, '""')
                        });
                    }
                }
            });
            if (wrongData.length === 0) {
                showToast('没有错题可导出！🎉');
                return;
            }
            const BOM = '\uFEFF';
            let csvContent = BOM + '题型,题目,用户答案,正确答案,关键词命中率,结果,解析\n';
            wrongData.forEach(row => {
                csvContent +=
                    `"${row.type}","${row.stem}","${row.userAnswer}","${row.correctAnswer}","${row.hitRate}","${row.result}","${row.analysis}"\n`;
            });
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate())
                .padStart(2, '0');
            const filename = `错题本_程序与算法基础_${dateStr}.csv`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast(`已导出 ${wrongData.length} 道错题：${filename}`);
        }

        function saveAnswers() {
            const dataToSave = { currentIndex, answers, reviewMode, reviewIndices };
            localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(dataToSave));
        }

        function saveSettings() { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ fontSize })); }

        function loadAllData() {
            const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS);
            if (savedAnswers) {
                const data = JSON.parse(savedAnswers);
                currentIndex = data.currentIndex || 0;
                answers = data.answers || new Array(questions.length).fill(null);
                reviewMode = data.reviewMode || false;
                reviewIndices = data.reviewIndices || [];
            }
            const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
            if (savedSettings) {
                const settings = JSON.parse(savedSettings);
                fontSize = settings.fontSize || 16;
                document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`);
                document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`);
                document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`);
            }
            const drafts = getDrafts();
            Object.keys(drafts).forEach(idx => {
                const i = parseInt(idx);
                if (answers[i] === null && drafts[i] && (questions[i].type === '简答题' || questions[i].type ===
                        '综合应用题')) {} else if (answers[i] === null && drafts[i]) {
                    delete drafts[idx];
                }
            });
            localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts));
        }

        function restartQuiz() {
            if (confirm('确定要重新开始吗？当前进度将被清除。')) {
                currentIndex = 0;
                answers = new Array(questions.length).fill(null);
                reviewMode = false;
                reviewIndices = [];
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                localStorage.removeItem(STORAGE_KEY_DRAFTS);
                renderQuestion();
                updateNavButtons();
                showToast('已重新开始');
            }
        }

        function showHome() {
            if (confirm('返回主页将丢失当前进度，确定吗？')) { window.location.href = 'index.html'; }
        }

        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }
    </script>
</body>
</html>
