    <style>

        .sheet-overlay.show, .history-overlay.show { display: block; opacity: 1; }
        .sheet-panel, .history-panel { position: fixed; background: var(--bg-card); z-index: 400; transition: transform 0.3s ease; overflow-y: auto; }

        .sheet-panel.show { transform: translate(-50%, 0); }

        .history-panel.show { transform: translateX(0); }
        .sheet-header, .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .sheet-title, .history-title { font-size: 18px; font-weight: 600; }

        .history-actions { display: flex; gap: 8px; margin-top: 12px; }

        .restart-btn { background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; }
        .history-view-btn { background: #f5f5f5; color: var(--text-secondary); }
        .review-wrong-btn { background: linear-gradient(135deg, #f5222d, #ff7875); color: white; }
        .export-btn { background: #fff7e6; color: #d48806; border: 2px solid #faad14; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 1000; animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.9); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }

        .text-answer-area textarea:focus { outline: none; border-color: var(--primary-color); background: var(--bg-card); box-shadow: 0 0 0 3px rgba(74,144,226,0.1); }

        .text-answer-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

        .btn-submit { background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; }
        .btn-draft { background: #f5f5f5; color: var(--text-secondary); }
        .btn-clear { background: #fff2f0; color: var(--error-color); }
        .tasks-list { margin: 16px 0; padding: 0; list-style: none; }
        .tasks-list li { background: #fafbfc; border-left: 4px solid var(--primary-color); padding: 12px 16px; margin-bottom: 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-weight: 500; color: var(--text-primary); line-height: 1.6; }
        .tasks-list li .task-id { display: inline-block; background: var(--primary-color); color: white; width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-size: 12px; font-weight: 700; margin-right: 8px; }
        .keyword-highlight { background: #ffd591; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
        .keyword-missed { background: #ffccc7; padding: 2px 6px; border-radius: 3px; text-decoration: line-through; }
        .score-progress { width: 100%; height: 10px; background: #e8e8e8; border-radius: 5px; margin: 8px 0 4px; overflow: hidden; }
        .score-progress-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
        .score-progress-fill.excellent { background: linear-gradient(90deg, #52c41a, #73d13d); }
        .score-progress-fill.good { background: linear-gradient(90deg, #4a90e2, #6ba8ff); }
        .score-progress-fill.pass { background: linear-gradient(90deg, #faad14, #ffc53d); }
        .score-progress-fill.fail { background: linear-gradient(90deg, #f5222d, #ff7875); }
        .score-tag { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-top: 6px; }

        .score-tag.good { background: #e6f7ff; color: #096dd9; border: 1px solid #91d5ff; }
        .score-tag.pass { background: #fffbe6; color: #ad6800; border: 1px solid #ffe58f; }
        .score-tag.fail { background: #fff2f0; color: #a8071a; border: 1px solid #ffa39e; }
        .review-mode-banner { background: #fff7e6; border: 1px solid #ffd591; border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: 16px; font-weight: 600; color: #ad6800; display: flex; align-items: center; gap: 8px; font-size: 14px; }

        @media (min-width: 768px) { .app-container { border-radius: 20px; margin: 20px auto; min-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); } .footer { position: static; border-radius: 0 0 20px 20px; } .sheet-panel { border-radius: 20px; bottom: 20px; max-height: 60vh; } }
        @media (max-width: 360px) { .sheet-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; } }
    </style>
</head>

<div class="app-container">
<header class="header"><div class="header-top"><div class="left-section"><div class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i></div><div class="question-info" id="questionInfo"><div class="question-number">第 <span id="currentNum">1</span> 题</div><div class="progress-text"><span id="answeredCount">0</span>/<span id="totalCount">0</span> 已答</div></div><div class="question-info" id="pageTitle" style="display:none;"><div class="question-number">字典与集合</div><div class="progress-text">高中信息科技 · 核心考点</div></div></div><div class="right-section"><div class="icon-btn" onclick="toggleSheet()"><i class="fas fa-th-large"></i></div><div class="icon-btn" onclick="toggleHistory()"><i class="fas fa-history"></i></div><div class="icon-btn" onclick="changeFontSize(-1)"><i class="fas fa-font"></i>-</div><div class="icon-btn" onclick="changeFontSize(1)"><i class="fas fa-font"></i>+</div></div></div><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div></header>

        {"type":"单选题","difficulty":"基础","stem":"字典中用于唯一标识元素的是（ ）","options":[{"label":"A","text":"值"},{"label":"B","text":"键"},{"label":"C","text":"索引"},{"label":"D","text":"序号"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 键</strong>。字典通过唯一的键来标识和访问对应的值，键是字典的核心标识。<br><strong>📚 知识点讲解：</strong>字典是键值对映射结构，键必须唯一且不可变，值可以任意类型。<br><strong>💡 解题思路：</strong>索引是列表的访问方式，字典通过键访问值。<br><strong>🧠 记忆口诀：</strong>字典靠键不靠索引，键唯一值任意，键值对映射存，快速查找效率高。"},

        {"type":"单选题","difficulty":"基础","stem":"下列代码的运行结果是（ ）\n```python\nd = {\"name\": \"张三\", \"age\": 16}\nprint(d[\"name\"])\n```","options":[{"label":"A","text":"\"张三\""},{"label":"B","text":"\"age\""},{"label":"C","text":"16"},{"label":"D","text":"报错"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. \"张三\"</strong>。d[\"name\"]访问键\"name\"对应的值，即\"张三\"。<br><strong>📚 知识点讲解：</strong>字典通过键名在方括号中访问对应的值。<br><strong>💡 解题思路：</strong>键\"name\"对应的值是\"张三\"。<br><strong>🧠 记忆口诀：</strong>字典名[键]取值，键存在返回值，键不存在报错，推荐用get方法。"},
        {"type":"单选题","difficulty":"基础","stem":"集合的主要特点是（ ）","options":[{"label":"A","text":"有序、可重复"},{"label":"B","text":"有序、不可重复"},{"label":"C","text":"无序、可重复"},{"label":"D","text":"无序、不可重复"}],"answer":3,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>D. 无序、不可重复</strong>。集合是无序的，元素不允许重复，重复元素会被自动去除。<br><strong>📚 知识点讲解：</strong>列表有序可重复，集合无序不重复。<br><strong>💡 解题思路：</strong>集合的两大特征：无序、不重复。<br><strong>🧠 记忆口诀：</strong>集合无序不重复，自动去重是特点，不支持索引访问，集合运算交并差。"},
        {"type":"单选题","difficulty":"基础","stem":"向字典中添加键值对的正确方式是（ ）","options":[{"label":"A","text":"d.add(\"gender\", \"男\")"},{"label":"B","text":"d[\"gender\"] = \"男\""},{"label":"C","text":"d.insert(\"gender\", \"男\")"},{"label":"D","text":"d.append(\"gender\": \"男\")"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. d[\"gender\"] = \"男\"</strong>。字典添加或修改键值对直接使用赋值语句。<br><strong>📚 知识点讲解：</strong>add()是集合方法，insert()和append()是列表方法。<br><strong>💡 解题思路：</strong>字典用方括号赋值，键存在则修改，不存在则添加。<br><strong>🧠 记忆口诀：</strong>字典添加d[键]=值，键存在修改不存在添，add集合append列表，方法不同莫混淆。"},
        {"type":"单选题","difficulty":"基础","stem":"下列代码的运行结果是（ ）\n```python\ns = {1, 2, 2, 3, 3, 3}\nprint(s)\n```","options":[{"label":"A","text":"{1,2,2,3,3,3}"},{"label":"B","text":"{1,2,3}"},{"label":"C","text":"[1,2,3]"},{"label":"D","text":"报错"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. {1,2,3}</strong>。集合会自动去除重复元素，{1,2,2,3,3,3}变为{1,2,3}。<br><strong>📚 知识点讲解：</strong>集合的元素具有唯一性，重复元素会被自动去除。<br><strong>💡 解题思路：</strong>集合去重是核心功能。<br><strong>🧠 记忆口诀：</strong>集合自动去重，重复元素只留一，{1,2,2,3,3,3}变{1,2,3}，去重利器集合用。"},
        {"type":"单选题","difficulty":"基础","stem":"用于获取字典中所有键的方法是（ ）","options":[{"label":"A","text":"keys()"},{"label":"B","text":"values()"},{"label":"C","text":"items()"},{"label":"D","text":"get()"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. keys()</strong>。keys()返回所有键，values()返回所有值，items()返回所有键值对。<br><strong>📚 知识点讲解：</strong>这三个方法常用于遍历字典。<br><strong>💡 解题思路：</strong>键对应keys，值对应values。<br><strong>🧠 记忆口诀：</strong>keys键values值，items键值对，三个方法遍历用，get安全取值。"},
        {"type":"单选题","difficulty":"基础","stem":"两个集合的交集运算使用的符号是（ ）","options":[{"label":"A","text":"&"},{"label":"B","text":"|"},{"label":"C","text":"-"},{"label":"D","text":"+"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. &</strong>。交集用&，并集用|，差集用-，集合不支持+运算。<br><strong>📚 知识点讲解：</strong>集合运算与数学集合概念一致。<br><strong>💡 解题思路：</strong>交并差对应& | -。<br><strong>🧠 记忆口诀：</strong>交集&并集|，差集用减号-，集合运算三符号，数学集合相对应。"},
        {"type":"单选题","difficulty":"基础","stem":"下列代码的运行结果是（ ）\n```python\nd = {\"a\": 1, \"b\": 2}\nd[\"c\"] = 3\nprint(len(d))\n```","options":[{"label":"A","text":"1"},{"label":"B","text":"2"},{"label":"C","text":"3"},{"label":"D","text":"4"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. 3</strong>。添加键值对\"c\":3后，字典有3个元素，len(d)返回3。<br><strong>📚 知识点讲解：</strong>len()返回字典中键值对的数量。<br><strong>💡 解题思路：</strong>原来2个键值对，添加1个，共3个。<br><strong>🧠 记忆口诀：</strong>len统计键值对，添加一个多一个，删除一个少一个，字典长度len得。"},
        {"type":"单选题","difficulty":"基础","stem":"从集合中删除指定元素且元素不存在时不会报错的方法是（ ）","options":[{"label":"A","text":"remove()"},{"label":"B","text":"discard()"},{"label":"C","text":"pop()"},{"label":"D","text":"clear()"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. discard()</strong>。discard()删除指定元素，不存在时不会报错；remove()删除不存在的元素会报错。<br><strong>📚 知识点讲解：</strong>推荐使用discard()避免程序崩溃。<br><strong>💡 解题思路：</strong>discard安全，remove会报错。<br><strong>🧠 记忆口诀：</strong>discard安全删，不存在也不报错，remove删必须存在，否则报错程序停。"},
        {"type":"单选题","difficulty":"中档","stem":"下列代码的运行结果是（ ）\n```python\nd = {\"a\": 1, \"b\": 2, \"c\": 3}\nprint(d.get(\"d\", 0))\n```","options":[{"label":"A","text":"1"},{"label":"B","text":"2"},{"label":"C","text":"3"},{"label":"D","text":"0"}],"answer":3,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>D. 0</strong>。get(\"d\",0)中键\"d\"不存在，返回默认值0。<br><strong>📚 知识点讲解：</strong>get()方法是安全访问字典的方式，键不存在返回默认值。<br><strong>💡 解题思路：</strong>\"d\"不在字典中，返回默认值0。<br><strong>🧠 记忆口诀：</strong>get安全取值，键在返回值，键不在返默认，不会报错程序稳。"},
        {"type":"单选题","difficulty":"中档","stem":"下列代码的运行结果是（ ）\n```python\ns1 = {1, 2, 3, 4}\ns2 = {3, 4, 5, 6}\nprint(s1 - s2)\n```","options":[{"label":"A","text":"{1,2}"},{"label":"B","text":"{3,4}"},{"label":"C","text":"{1,2,3,4,5,6}"},{"label":"D","text":"{5,6}"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. {1,2}</strong>。差集s1-s2返回属于s1但不属于s2的元素，即{1,2}。<br><strong>📚 知识点讲解：</strong>差集运算返回只在第一个集合中存在的元素。<br><strong>💡 解题思路：</strong>s1有1,2,3,4，s2有3,4,5,6，差集为1,2。<br><strong>🧠 记忆口诀：</strong>差集减号运算，属于前不属于后，{1,2,3,4}减{3,4,5,6}，结果{1,2}。"},
        {"type":"单选题","difficulty":"中档","stem":"下列可以作为字典键的是（ ）","options":[{"label":"A","text":"[1,2,3]"},{"label":"B","text":"{\"a\":1}"},{"label":"C","text":"(1,2,3)"},{"label":"D","text":"{1,2,3}"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. (1,2,3)</strong>。字典的键必须是不可变类型，元组是不可变类型，可以作为键。<br><strong>📚 知识点讲解：</strong>列表、字典、集合都是可变类型，不能作为字典的键。<br><strong>💡 解题思路：</strong>不可变类型才能做键。<br><strong>🧠 记忆口诀：</strong>键要不可变，字符串整数元组可，列表字典集合不可，可变类型不能做键。"},
        {"type":"单选题","difficulty":"中档","stem":"下列代码的运行结果是（ ）\n```python\nd = {\"name\": \"李四\", \"age\": 17}\nfor value in d.values():\n    print(value, end=\" \")\n```","options":[{"label":"A","text":"name age"},{"label":"B","text":"李四 17"},{"label":"C","text":"name:李四 age:17"},{"label":"D","text":"报错"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 李四 17</strong>。d.values()返回所有值，即\"李四\"和17，输出\"李四 17\"。<br><strong>📚 知识点讲解：</strong>values()返回字典中所有值的视图对象。<br><strong>💡 解题思路：</strong>遍历值，输出\"李四\"和17。<br><strong>🧠 记忆口诀：</strong>values取值列表，遍历得到所有值，keys取键items键值对，三个方法各有用。"},

        {"type":"判断题","difficulty":"基础","stem":"字典是键值对的集合，键和值都必须是不可变类型。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。字典的键必须是不可变类型，但值可以是任意类型（包括列表、字典等可变类型）。<br><strong>📚 知识点讲解：</strong>只有键有不可变限制，值没有限制。<br><strong>💡 解题思路：</strong>值可以是列表、字典等。<br><strong>🧠 记忆口诀：</strong>键必须不可变，值任意类型可，列表字典都能存，键唯一值自由。"},
        {"type":"判断题","difficulty":"基础","stem":"集合中的元素不允许重复。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。集合的元素具有唯一性，重复元素会被自动去除。<br><strong>📚 知识点讲解：</strong>这是集合区别于列表的核心特征。<br><strong>💡 解题思路：</strong>集合自动去重。<br><strong>🧠 记忆口诀：</strong>集合元素不重复，自动去重是特性，列表可重复有序，集合无序不重复。"},
        {"type":"判断题","difficulty":"基础","stem":"可以通过索引访问字典和集合中的元素。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。字典和集合都是无序的，不支持索引访问；字典通过键访问值。<br><strong>📚 知识点讲解：</strong>只有序列类型（列表、元组、字符串）支持索引。<br><strong>💡 解题思路：</strong>无序=无索引。<br><strong>🧠 记忆口诀：</strong>字典集合无序，索引访问不支持，字典用键来取值，集合只能遍历看。"},
        {"type":"判断题","difficulty":"基础","stem":"`{}`表示空字典，`set()`表示空集合。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。{}默认表示空字典，空集合必须用set()创建。<br><strong>📚 知识点讲解：</strong>这是Python语法规定，{}优先解释为字典。<br><strong>💡 解题思路：</strong>空字典{}，空集合set()。<br><strong>🧠 记忆口诀：</strong>花括号空是字典，空集合要set()，这是语法规定，区分记清楚。"},
        {"type":"判断题","difficulty":"基础","stem":"字典的`items()`方法返回所有键值对。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。items()返回所有键值对的视图对象，每个元素是一个(键,值)元组。<br><strong>📚 知识点讲解：</strong>items()常用于遍历字典的键和值。<br><strong>💡 解题思路：</strong>items=键值对。<br><strong>🧠 记忆口诀：</strong>items键值对，keys键values值，三个方法遍历用，for循环解包便。"},
        {"type":"判断题","difficulty":"基础","stem":"集合的并集运算使用`|`符号。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。并集运算使用|符号，返回两个集合中所有的元素（去重）。<br><strong>📚 知识点讲解：</strong>交并差分别对应&、|、-。<br><strong>💡 解题思路：</strong>并集=合并去重。<br><strong>🧠 记忆口诀：</strong>并集竖线|，交集&，差集减号-，三符号对应交并差。"},
        {"type":"判断题","difficulty":"基础","stem":"向集合中添加已存在的元素不会改变集合。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。集合不允许重复元素，添加已存在的元素不会产生任何变化。<br><strong>📚 知识点讲解：</strong>集合会自动忽略重复元素的添加。<br><strong>💡 解题思路：</strong>集合去重特性。<br><strong>🧠 记忆口诀：</strong>集合已存在元素，再次添加无变化，自动去重是特性，重复添加不报错。"},
        {"type":"判断题","difficulty":"中档","stem":"字典中如果有重复的键，后面的值会覆盖前面的值。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。字典的键必须唯一，如果有重复的键，后面的值会覆盖前面的值。<br><strong>📚 知识点讲解：</strong>这是字典键唯一性的体现。<br><strong>💡 解题思路：</strong>后值覆盖前值。<br><strong>🧠 记忆口诀：</strong>字典键唯一，重复键后覆盖前，赋值即修改，键在值更新。"},
        {"type":"判断题","difficulty":"中档","stem":"`set([1,2,3,3])`的结果是`[1,2,3]`。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。set([1,2,3,3])的结果是集合{1,2,3}，不是列表[1,2,3]。<br><strong>📚 知识点讲解：</strong>set()函数返回的是集合类型，不是列表。<br><strong>💡 解题思路：</strong>set()返回集合，list()返回列表。<br><strong>🧠 记忆口诀：</strong>set返回集合类型，花括号包裹，list返回列表类型，方括号包裹。"},
        {"type":"判断题","difficulty":"中档","stem":"集合的`pop()`方法会删除并返回集合的第一个元素。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。集合是无序的，pop()方法会随机删除并返回一个元素，不是第一个元素。<br><strong>📚 知识点讲解：</strong>无序结构没有“第一个”的概念。<br><strong>💡 解题思路：</strong>随机删除，不是第一个。<br><strong>🧠 记忆口诀：</strong>集合无序无第一，pop随机删一个，列表pop删末尾，两者行为不相同。"},
        {"type":"简答题","difficulty":"中档","stem":"简述字典和列表的区别，分别说明它们的适用场景。","answer":"区别：①存储方式：列表是有序的元素序列，通过索引访问；字典是无序的键值对映射，通过键访问值。②元素特点：列表元素可以重复；字典的键必须唯一且不可变。③访问速度：字典通过键查找比列表通过索引查找快。适用场景：列表适合存储有序的、需要按顺序访问的数据；字典适合存储具有关联关系的数据，需要快速查找。","keywords":["有序","无序","索引","键","列表","字典","关联"],"analysis":"<strong>🎯 答案解析：</strong>列表有序通过索引访问，字典无序通过键访问，适用场景不同。<br><strong>📚 知识点讲解：</strong>根据数据特点和访问需求选择合适的数据结构。<br><strong>💡 解题思路：</strong>从有序性、访问方式、适用场景三方面对比。<br><strong>🧠 记忆口诀：</strong>列表有序索引访，字典无序键取值，关联数据用字典，顺序数据用列表。"},
        {"type":"简答题","difficulty":"中档","stem":"简述集合的三个主要特点，并说明集合的主要用途。","answer":"三个特点：①无序性：元素没有固定顺序，不能通过索引访问。②唯一性：元素不允许重复，重复元素自动去除。③元素不可变性：元素必须是不可变类型。主要用途：①数据去重：去除列表中的重复元素。②集合运算：进行交集、并集、差集运算。③成员判断：快速判断元素是否存在。","keywords":["无序","唯一","不可变","去重","集合运算","成员判断"],"analysis":"<strong>🎯 答案解析：</strong>集合三大特点：无序、唯一、元素不可变。主要用途：去重、集合运算、成员判断。<br><strong>📚 知识点讲解：</strong>集合的数学特性使其在数据处理中非常有用。<br><strong>💡 解题思路：</strong>先列特点，再说用途。<br><strong>🧠 记忆口诀：</strong>无序唯一不可变，去重运算判成员，集合三大特点记，数据处理好帮手。"},
        {"type":"简答题","difficulty":"提高","stem":"对比说明字典的`get()`方法和直接通过键访问值的区别，以及各自的优缺点。","answer":"区别：直接访问（d[键]）：键不存在时抛出KeyError异常，程序可能崩溃。get()方法：键不存在时返回默认值（默认None），不会报错。优缺点：直接访问语法简洁但不够安全；get()方法更安全健壮，但语法稍长。","keywords":["get","直接访问","KeyError","默认值","安全","健壮"],"analysis":"<strong>🎯 答案解析：</strong>get()比直接访问更安全，键不存在时不报错而是返回默认值。<br><strong>📚 知识点讲解：</strong>推荐使用get()方法访问字典，避免程序因键不存在而崩溃。<br><strong>💡 解题思路：</strong>从安全性和语法简洁性两方面对比。<br><strong>🧠 记忆口诀：</strong>直接访问键须在，否则报错程序崩，get安全返默认，健壮代码推荐用。"},
        {"type":"综合应用题","difficulty":"提高","stem":"编写一个程序，统计一段文本中每个单词出现的次数。要求：（1）输入一段英文文本；（2）将文本按空格分割为单词列表；（3）使用字典统计每个单词出现的次数；（4）输出统计结果。","tasks":[{"id":1,"stem":"请写出完整的Python代码。","answer":"text = input(\"请输入一段英文文本：\")\nwords = text.split()\nword_count = {}\nfor word in words:\n    if word in word_count:\n        word_count[word] += 1\n    else:\n        word_count[word] = 1\nprint(\"\\n单词出现次数统计：\")\nfor word, count in word_count.items():\n    print(f\"{word}: {count}次\")","keywords":["split","字典","word_count","统计","items"]}],"answer":"用split分割文本，遍历单词用字典统计，键为单词值为次数，最后遍历items输出。","keywords":["split","字典","统计","items","遍历"],"analysis":"<strong>🎯 答案解析：</strong>用字典统计单词频率是字典的经典应用，键为单词，值为出现次数。<br><strong>📚 知识点讲解：</strong>综合运用字符串split、字典增改、items遍历等知识。<br><strong>💡 解题思路：</strong>分割→遍历→判断→计数→输出。<br><strong>🧠 记忆口诀：</strong>split分割单词，字典统计频次，键在加一不在设一，items遍历输出。"},
        {"type":"综合应用题","difficulty":"提高","stem":"编写一个程序，实现简单的通讯录管理功能。要求：（1）创建一个空字典存储通讯录，键为姓名，值为电话号码；（2）提供菜单选项：1.添加联系人 2.删除联系人 3.查询联系人 4.显示所有联系人 5.退出；（3）根据用户输入的选项执行相应的操作。","tasks":[{"id":1,"stem":"请写出完整的Python代码。","answer":"address_book = {}\nwhile True:\n    print(\"\\n===== 通讯录管理系统 =====\")\n    print(\"1.添加联系人\")\n    print(\"2.删除联系人\")\n    print(\"3.查询联系人\")\n    print(\"4.显示所有联系人\")\n    print(\"5.退出\")\n    choice = input(\"请输入选择(1-5)：\")\n    if choice == \"1\":\n        name = input(\"请输入姓名：\")\n        phone = input(\"请输入电话：\")\n        address_book[name] = phone\n        print(\"添加成功！\")\n    elif choice == \"2\":\n        name = input(\"请输入要删除的姓名：\")\n        if name in address_book:\n            del address_book[name]\n            print(\"删除成功！\")\n        else:\n            print(\"该联系人不存在！\")\n    elif choice == \"3\":\n        name = input(\"请输入要查询的姓名：\")\n        if name in address_book:\n            print(f\"{name}: {address_book[name]}\")\n        else:\n            print(\"该联系人不存在！\")\n    elif choice == \"4\":\n        if not address_book:\n            print(\"通讯录为空！\")\n        else:\n            for name, phone in address_book.items():\n                print(f\"{name}: {phone}\")\n    elif choice == \"5\":\n        print(\"再见！\")\n        break\n    else:\n        print(\"输入错误，请重新输入！\")","keywords":["字典","while","if","items","通讯录"]}],"answer":"用字典存储通讯录，while循环显示菜单，根据选择执行添加、删除、查询、显示或退出操作。","keywords":["字典","通讯录","while","菜单","增删改查"],"analysis":"<strong>🎯 答案解析：</strong>通讯录是字典的典型应用，键为姓名值为电话，实现增删改查功能。<br><strong>📚 知识点讲解：</strong>综合运用字典操作、while循环、条件判断等知识。<br><strong>💡 解题思路：</strong>循环菜单→选择→字典操作→输出结果。<br><strong>🧠 记忆口诀：</strong>字典存储通讯录，姓名键电话值，菜单循环选择，增删查显退出。"}

    const APP_ID = 'dict_set_quiz_1';
    const STORAGE_KEY_ANSWERS = APP_ID + '_answers', STORAGE_KEY_SETTINGS = APP_ID + '_settings', STORAGE_KEY_HISTORY = APP_ID + '_history', STORAGE_KEY_DRAFTS = APP_ID + '_drafts';
    let currentIndex = 0, currentPage = 'learn', answers = new Array(questions.length).fill(null), fontSize = 16, currentFilter = 'all', reviewMode = false, wrongIndices = [], reviewIndex = 0;
    function renderKnowledgePage(){document.getElementById('knowledgeTitle').textContent='字典与集合（高中信息科技）';document.getElementById('knowledgeContent').innerHTML=`<h3>📖 核心定义</h3><p><strong>字典（dict）</strong>和<strong>集合（set）</strong>是Python中两种重要的<strong>无序可变</strong>数据结构。字典是<strong>键值对映射</strong>集合，通过唯一键快速查找值；集合是<strong>无序、不重复</strong>的元素集合，主要用于去重和集合运算。</p><h3>🔍 核心要点拆解</h3><p><strong>1. 字典（dict）</strong></p><ul><li>用{}包裹，键值对格式，键必须唯一且不可变</li><li>访问：d[键]或d.get(键,默认值)</li><li>添加/修改：d[键]=值</li><li>删除：del d[键]、d.pop(键)、d.clear()</li><li>常用方法：keys()、values()、items()、get()</li></ul><p><strong>2. 集合（set）</strong></p><ul><li>空集合用set()，{}是空字典</li><li>元素无序不重复，必须是不可变类型</li><li>添加：add()、update()</li><li>删除：remove()、discard()、pop()、clear()</li><li>集合运算：交集&、并集|、差集-</li></ul><h3>⚠️ 易错点</h3><ul><li>❌ 用{}创建空集合</li><li>❌ 用可变类型做字典键</li><li>❌ 试图索引访问集合</li><li>❌ remove()删不存在元素报错</li></ul>`;}
    function switchToKnowledgePage(){currentPage='learn';reviewMode=false;document.getElementById('knowledgePage').classList.remove('hidden');document.getElementById('quizContent').style.display='none';document.getElementById('questionInfo').style.display='none';document.getElementById('pageTitle').style.display='block';document.querySelector('.progress-bar').style.display='none';document.getElementById('footerContent').innerHTML=`<button class="start-quiz-btn" onclick="startQuiz()"><i class="fas fa-play-circle"></i> 我已学完，开始刷题</button>`;}
    function startQuiz(){currentPage='quiz';reviewMode=false;wrongIndices=[];document.getElementById('knowledgePage').classList.add('hidden');document.getElementById('quizContent').style.display='block';document.getElementById('questionInfo').style.display='block';document.getElementById('pageTitle').style.display='none';document.querySelector('.progress-bar').style.display='block';currentIndex=0;renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});}
    function getQuestionTypeLabel(q){return{'单选题':'单选题','判断题':'判断题','简答题':'简答题','综合应用题':'综合应用题'}[q.type]||q.type;}
    function isChoiceType(q){return q.type==='单选题'||q.type==='判断题';}
    function isTextType(q){return q.type==='简答题'||q.type==='综合应用题';}
    function getActualIndex(){return reviewMode&&wrongIndices.length?wrongIndices[reviewIndex]:currentIndex;}
    function getTotalInMode(){return reviewMode&&wrongIndices.length?wrongIndices.length:questions.length;}
    function getCurrentPosition(){return reviewMode&&wrongIndices.length?reviewIndex+1:currentIndex+1;}
    function renderQuestion(){const ai=getActualIndex(),q=questions[ai],area=document.getElementById('quizContent');const tim=getTotalInMode(),cp=getCurrentPosition();let h='';if(reviewMode)h+=`<div class="review-mode-banner">🔁 错题回顾模式 — 第 ${cp}/${tim} 题 <span class="exit-review" onclick="exitReviewMode()">退出回顾</span></div>`;h+=`<div class="question-card"><span class="question-type">${getQuestionTypeLabel(q)}${q.difficulty?' · '+q.difficulty:''}</span><div class="question-stem">${q.stem}</div>`;if(q.image)h+=`<img src="${q.image}" class="question-image">`;if(isChoiceType(q)){h+=`<div class="options-container">`;q.options.forEach((o,i)=>{const sel=answers[ai]===i,cor=q.answer===i;let cls=['option-item'];if(answers[ai]!==null){if(sel&&cor)cls.push('correct');else if(sel&&!cor)cls.push('wrong');else if(cor)cls.push('correct');}else if(sel)cls.push('selected');h+=`<div class="${cls.join(' ')}" onclick="selectOption(${i})"><div class="option-label">${o.label}</div><div class="option-text">${o.text}</div></div>`;});h+=`</div>`;}else if(q.type==='简答题'){h+=renderTextAnswerArea(ai,q);}else if(q.type==='综合应用题'){h+=renderComprehensiveArea(ai,q);}h+=`</div>`;if(answers[ai]!==null){if(isChoiceType(q)){const cor=answers[ai]===q.answer;h+=`<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">📝 答案分析 <span class="result-badge ${cor?'correct':'wrong'}">${cor?'✓ 回答正确':'✗ 回答错误'}</span></div><div class="toggle-icon expanded">▼</div></div><div class="analysis-content" style="display:block;">${q.analysis}</div></div>`;}else if(isTextType(q)){const res=evaluateTextAnswer(ai,q);h+=buildTextResultCard(ai,q,res);}}const done=checkAllAnsweredInMode();if((reviewMode&&reviewIndex>=wrongIndices.length-1&&done)||(!reviewMode&&currentIndex===questions.length-1&&answers.every(a=>a!==null))){const cc=getCorrectCount(),ac=Math.round(cc/questions.length*100),wc=getWrongCount();if(!reviewMode)saveToHistory(cc,ac);h+=buildCompletionScreen(cc,ac,wc);}area.innerHTML=h;updateHeader();setTimeout(()=>{if(isTextType(q)){const ta=document.getElementById('textAnswerInput');if(ta&&answers[ai]!==null&&typeof answers[ai]==='string')ta.value=answers[ai];const dr=getDraft(ai);if(ta&&answers[ai]===null&&dr)ta.value=dr;}},50);if(window.MathJax)MathJax.typeset();}
    function renderTextAnswerArea(ai,q){const saved=answers[ai],draft=getDraft(ai);const dv=(saved!==null&&typeof saved==='string')?saved:(draft||'');const dis=saved!==null&&typeof saved==='string';let h=`<div class="text-answer-area"><textarea id="textAnswerInput" placeholder="请在此输入你的回答..." ${dis?'disabled':''}>${escapeHtml(dv)}</textarea><div class="text-answer-buttons">`;if(!dis)h+=`<button class="btn-draft" onclick="saveDraftOnly(${ai})"><i class="fas fa-save"></i> 保存草稿</button><button class="btn-clear" onclick="clearTextInput(${ai})"><i class="fas fa-eraser"></i> 清空输入</button><button class="btn-submit" onclick="submitTextAnswer(${ai})"><i class="fas fa-check-circle"></i> 提交作答</button>`;else h+=`<button class="btn-submit" disabled style="opacity:0.6;"><i class="fas fa-check-circle"></i> 已提交</button>`;return h+`</div></div>`;}
    function renderComprehensiveArea(ai,q){let h='';if(q.tasks&&q.tasks.length){h+=`<ul class="tasks-list">`;q.tasks.forEach(t=>h+=`<li><span class="task-id">${t.id}</span> ${t.stem}</li>`);h+=`</ul>`;}return h+renderTextAnswerArea(ai,q);}
    function buildTextResultCard(ai,q,res){const bc=res.level==='good'?'correct':(res.level==='partial'?'partial':'wrong');const bt=res.level==='good'?'✓ 回答较好':(res.level==='partial'?'△ 部分正确':'✗ 需加强');return `<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">📝 作答评估 <span class="result-badge ${bc}">${bt}</span></div><div class="toggle-icon expanded">▼</div></div><div class="analysis-content" style="display:block;"><p><strong>📋 你的作答：</strong></p><div style="background:#fafbfc;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(res.userAnswer||'（空）')}</div><p><strong>✅ 标准答案：</strong></p><div style="background:#f6ffed;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(res.referenceAnswer)}</div><p><strong>🔑 关键词命中：</strong>命中 ${res.hitCount}/${res.totalKeywords} 个（${res.hitRate}%）</p><div class="score-progress"><div class="score-progress-fill ${res.progressClass}" style="width:${res.hitRate}%;"></div></div><span class="score-tag ${res.progressClass}">${res.levelLabel}</span><p style="margin-top:8px;"><strong>命中：</strong>${res.hitKeywords.length?res.hitKeywords.map(k=>'<span class="keyword-highlight">'+k+'</span>').join('、'):'无'}</p><p><strong>未命中：</strong>${res.missedKeywords.length?res.missedKeywords.map(k=>'<span class="keyword-missed">'+k+'</span>').join('、'):'无'}</p><hr style="border:none;border-top:1px solid #e8e8e8;margin:12px 0;">${q.analysis}</div></div>`;}
    function buildCompletionScreen(cc,ac,wc){let h=`<div class="completion-screen"><div class="completion-icon">${ac>=80?'🎉':ac>=60?'👍':'💪'}</div><h1 class="completion-title">${reviewMode?'错题回顾完成！':'刷题完成！'}</h1><p style="color:var(--text-secondary);">${reviewMode?'你已经回顾了所有错题':'太棒了！你已经完成了所有题目'}</p><div class="stats"><div class="stat-item"><div class="stat-value">${cc}/${questions.length}</div><div class="stat-label">答对题数</div></div><div class="stat-item"><div class="stat-value">${ac}%</div><div class="stat-label">正确率</div></div><div class="stat-item"><div class="stat-value">${wc}</div><div class="stat-label">错题数</div></div></div><div class="action-buttons"><button class="action-btn restart-btn" onclick="restartQuiz()">重新开始</button><button class="action-btn history-view-btn" onclick="toggleHistory()">查看历史</button>`;if(wc>0&&!reviewMode){h+=`<button class="action-btn review-wrong-btn" onclick="startReviewWrong()"><i class="fas fa-redo"></i> 回看错题</button><button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>`;}if(reviewMode&&wc>0)h+=`<button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>`;return h+`</div></div>`;}
    function selectOption(i){const ai=getActualIndex();if(answers[ai]!==null||!isChoiceType(questions[ai]))return;answers[ai]=i;saveAnswers();renderQuestion();renderAnswerSheet();updateNavButtons();showToast(i===questions[ai].answer?'回答正确！✓':'回答错误 ✗');}
    function submitTextAnswer(ai){if(answers[ai]!==null&&typeof answers[ai]==='string')return;const ta=document.getElementById('textAnswerInput');if(!ta)return;const ua=ta.value.trim();if(!ua){showToast('请先输入你的回答');return;}answers[ai]=ua;clearDraft(ai);saveAnswers();renderQuestion();renderAnswerSheet();updateNavButtons();const res=evaluateTextAnswer(ai,questions[ai]);showToast(res.level==='good'?'回答较好！✓':(res.level==='partial'?'部分正确 △':'需加强 ✗'));}
    function saveDraftOnly(ai){const ta=document.getElementById('textAnswerInput');if(!ta)return;const v=ta.value.trim();if(v){saveDraft(ai,v);showToast('草稿已保存 ✓');}else{clearDraft(ai);showToast('草稿已清空');}}
    function clearTextInput(ai){const ta=document.getElementById('textAnswerInput');if(ta)ta.value='';clearDraft(ai);showToast('输入已清空');}
    function evaluateTextAnswer(ai,q){const ua=(answers[ai]&&typeof answers[ai]==='string')?answers[ai]:'';const ak=[];let ra='';if(q.type==='简答题'){if(q.keywords)ak.push(...q.keywords);ra=q.answer||'';}else if(q.type==='综合应用题'){if(q.keywords)ak.push(...q.keywords);ra=q.answer||'';}const tk=ak.length,hk=[],mk=[],ul=ua.toLowerCase();ak.forEach(k=>{if(ul.includes(k.toLowerCase()))hk.push(k);else mk.push(k);});const hc=hk.length,hr=tk>0?Math.round((hc/tk)*100):0;let l,ll,pc;if(q.type==='简答题'){if(hr>=60){l='good';ll='回答较好';pc='excellent';}else if(hr>=30){l='partial';ll='部分正确';pc='pass';}else{l='weak';ll='需加强';pc='fail';}}else{if(hr>=80){l='good';ll='优秀';pc='excellent';}else if(hr>=60){l='good';ll='良好';pc='good';}else if(hr>=40){l='partial';ll='合格';pc='pass';}else{l='weak';ll='需加强';pc='fail';}}return{userAnswer:ua,referenceAnswer:ra,totalKeywords:tk,hitCount:hc,hitRate:hr,hitKeywords:hk,missedKeywords:mk,level:l,levelLabel:ll,progressClass:pc};}
    function getCorrectCount(){let c=0;questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]===q.answer)c++;}else{const r=evaluateTextAnswer(i,q);if(r.level==='good')c++;}});return c;}
    function getWrongCount(){let c=0;questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]!==q.answer)c++;}else{const r=evaluateTextAnswer(i,q);if(r.level==='weak')c++;}});return c;}
    function getWrongIndicesArray(){const a=[];questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]!==q.answer)a.push(i);}else{const r=evaluateTextAnswer(i,q);if(r.level==='weak')a.push(i);}});return a;}
    function checkAllAnsweredInMode(){if(reviewMode&&wrongIndices.length)return wrongIndices.every(wi=>answers[wi]!==null);return answers.every(a=>a!==null);}
    function startReviewWrong(){wrongIndices=getWrongIndicesArray();if(!wrongIndices.length){showToast('没有错题可回顾');return;}reviewMode=true;reviewIndex=0;currentPage='quiz';document.getElementById('knowledgePage').classList.add('hidden');document.getElementById('quizContent').style.display='block';document.getElementById('questionInfo').style.display='block';document.getElementById('pageTitle').style.display='none';document.querySelector('.progress-bar').style.display='block';renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});showToast(`进入错题回顾模式，共 ${wrongIndices.length} 题`);}
    function exitReviewMode(){reviewMode=false;wrongIndices=[];currentIndex=0;currentPage='quiz';renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});showToast('已退出错题回顾模式');}
    function exportWrongCSV(){const wa=getWrongIndicesArray();if(!wa.length){showToast('没有错题可导出');return;}const mn='字典与集合',ds=new Date().toISOString().slice(0,10),fn=`错题本_${mn}_${ds}.csv`;const rows=[['题型','题目','用户答案','正确答案','关键词命中率','结果','解析']];wa.forEach(i=>{const q=questions[i],qt=getQuestionTypeLabel(q);const stem=q.stem.replace(/"/g,'""');let ua='',ca='',hr='',res='';if(isChoiceType(q)){ua=(answers[i]!==null&&answers[i]!==undefined)?(q.options[answers[i]]?q.options[answers[i]].text:String(answers[i])):'';ca=q.options[q.answer]?q.options[q.answer].text:String(q.answer);res=answers[i]===q.answer?'正确':'错误';hr=answers[i]===q.answer?'100%':'0%';}else{ua=(answers[i]&&typeof answers[i]==='string')?answers[i]:'';ca=q.answer||'';const er=evaluateTextAnswer(i,q);hr=er.hitRate+'%';res=er.levelLabel;}const at=q.analysis?q.analysis.replace(/<[^>]+>/g,'').replace(/"/g,'""'):'';rows.push([qt,'"'+stem+'"','"'+ua.replace(/"/g,'""')+'"','"'+ca.replace(/"/g,'""')+'"',hr,res,'"'+at+'"']);});const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=fn;document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);showToast('错题CSV已导出：'+fn);}
    function toggleAnalysis(h){const c=h.nextElementSibling,i=h.querySelector('.toggle-icon');if(c.style.display==='none'){c.style.display='block';i.classList.add('expanded');}else{c.style.display='none';i.classList.remove('expanded');}}
    function prevQuestion(){if(reviewMode&&wrongIndices.length){if(reviewIndex>0){reviewIndex--;renderQuestion();updateNavButtons();}}else if(!reviewMode&&currentIndex>0){currentIndex--;renderQuestion();updateNavButtons();}}
    function nextQuestion(){if(reviewMode&&wrongIndices.length){if(reviewIndex<wrongIndices.length-1){reviewIndex++;renderQuestion();updateNavButtons();}}else if(!reviewMode&&currentIndex<questions.length-1){currentIndex++;renderQuestion();updateNavButtons();}}
    function updateHeader(){if(currentPage!=='quiz')return;document.getElementById('currentNum').textContent=getCurrentPosition();const ac=answers.filter(a=>a!==null).length;document.getElementById('answeredCount').textContent=ac;document.getElementById('totalCount').textContent=questions.length;document.getElementById('progressFill').style.width=`${(ac/questions.length)*100}%`;}
    function updateNavButtons(){const fc=document.getElementById('footerContent');if(currentPage!=='quiz')return;const tim=getTotalInMode(),cp=getCurrentPosition(),isF=cp<=1,isL=cp>=tim,ad=checkAllAnsweredInMode();fc.innerHTML=`<button class="nav-btn prev-btn" onclick="prevQuestion()" ${isF?'disabled':''}><i class="fas fa-chevron-left"></i> 上一题</button><button class="nav-btn next-btn" onclick="nextQuestion()" ${isL&&ad?'disabled':''}>下一题 <i class="fas fa-chevron-right"></i></button>`;}
    function changeFontSize(d){fontSize=Math.max(14,Math.min(22,fontSize+d));document.documentElement.style.setProperty('--font-size-base',`${fontSize}px`);document.documentElement.style.setProperty('--font-size-small',`${fontSize-2}px`);document.documentElement.style.setProperty('--font-size-large',`${fontSize+2}px`);saveSettings();}
    function toggleSheet(){const o=document.getElementById('sheetOverlay'),p=document.getElementById('sheetPanel');if(p.classList.contains('show')){o.classList.remove('show');p.classList.remove('show');}else{o.classList.add('show');p.classList.add('show');renderAnswerSheet();}}
    function renderAnswerSheet(){const g=document.getElementById('sheetGrid');let h='';questions.forEach((q,i)=>{let sc='unanswered',st='未答';if(answers[i]!==null){if(isChoiceType(q)){if(answers[i]===q.answer){sc='correct';st='正确';}else{sc='wrong';st='错误';}}else{const r=evaluateTextAnswer(i,q);if(r.level==='good'){sc='correct';st='较好';}else if(r.level==='partial'){sc='correct';st='部分';}else{sc='wrong';st='加强';}}}if(i===getActualIndex()&&!reviewMode)sc+=' current';if(reviewMode&&wrongIndices.includes(i)&&wrongIndices[reviewIndex]===i)sc+=' current';if(currentFilter!=='all'){if(currentFilter==='unanswered'&&answers[i]!==null)return;if(currentFilter==='correct'){if(answers[i]===null)return;if(isChoiceType(q)&&answers[i]!==q.answer)return;if(isTextType(q)){const r=evaluateTextAnswer(i,q);if(r.level==='weak')return;}}if(currentFilter==='wrong'){if(answers[i]===null)return;if(isChoiceType(q)&&answers[i]===q.answer)return;if(isTextType(q)){const r=evaluateTextAnswer(i,q);if(r.level!=='weak')return;}}}h+=`<div class="sheet-item ${sc}" onclick="jumpToQuestion(${i})"><div class="sheet-number">${i+1}</div><div class="sheet-status">${st}</div></div>`;});g.innerHTML=h;}
    function filterQuestions(f,e){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');renderAnswerSheet();}
    function jumpToQuestion(i){reviewMode=false;wrongIndices=[];currentIndex=i;renderQuestion();updateNavButtons();toggleSheet();}
    function toggleHistory(){const o=document.getElementById('historyOverlay'),p=document.getElementById('historyPanel');if(p.classList.contains('show')){o.classList.remove('show');p.classList.remove('show');}else{o.classList.add('show');p.classList.add('show');renderHistory();}}
    function renderHistory(){const l=document.getElementById('historyList'),h=getHistory();if(!h.length){l.innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div>暂无历史记录</div></div>`;return;}let ht='';h.forEach((r,i)=>{const ds=new Date(r.timestamp).toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});ht+=`<div class="history-item"><div class="history-date">${ds}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${r.correctCount}/${r.totalCount}</div><div class="history-label">答对题数</div></div><div class="history-stat"><div class="history-value">${r.accuracy}%</div><div class="history-label">正确率</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${i})">回顾</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${i})">删除</button></div></div>`;});l.innerHTML=ht;}
    function saveToHistory(cc,ac){const h=getHistory();h.unshift({timestamp:Date.now(),totalCount:questions.length,correctCount:cc,accuracy:ac,answers:[...answers]});if(h.length>50)h.pop();localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(h));}
    function getHistory(){try{const s=localStorage.getItem(STORAGE_KEY_HISTORY);return s?JSON.parse(s):[];}catch(e){localStorage.removeItem(STORAGE_KEY_HISTORY);return[];}}
    function reviewHistory(i){const h=getHistory();if(i>=0&&i<h.length){answers=[...h[i].answers];currentIndex=0;reviewMode=false;wrongIndices=[];saveAnswers();renderQuestion();updateNavButtons();toggleHistory();showToast('已加载历史记录');}}
    function deleteHistory(i){if(!confirm('确定删除？'))return;const h=getHistory();if(i>=0&&i<h.length){h.splice(i,1);localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(h));renderHistory();showToast('记录已删除');}}
    function clearAllHistory(){if(!confirm('确定清空所有历史记录？'))return;localStorage.removeItem(STORAGE_KEY_HISTORY);renderHistory();showToast('历史记录已清空');}
    function saveAnswers(){localStorage.setItem(STORAGE_KEY_ANSWERS,JSON.stringify({currentIndex,answers,reviewMode,wrongIndices,reviewIndex}));}
    function saveSettings(){localStorage.setItem(STORAGE_KEY_SETTINGS,JSON.stringify({fontSize}));}
    function loadAllData(){try{const s=localStorage.getItem(STORAGE_KEY_ANSWERS);if(s){const d=JSON.parse(s);currentIndex=d.currentIndex||0;answers=d.answers||new Array(questions.length).fill(null);reviewMode=d.reviewMode||false;wrongIndices=d.wrongIndices||[];reviewIndex=d.reviewIndex||0;}}catch(e){localStorage.removeItem(STORAGE_KEY_ANSWERS);answers=new Array(questions.length).fill(null);}try{const ss=localStorage.getItem(STORAGE_KEY_SETTINGS);if(ss){const st=JSON.parse(ss);fontSize=st.fontSize||16;document.documentElement.style.setProperty('--font-size-base',`${fontSize}px`);document.documentElement.style.setProperty('--font-size-small',`${fontSize-2}px`);document.documentElement.style.setProperty('--font-size-large',`${fontSize+2}px`);}}catch(e){localStorage.removeItem(STORAGE_KEY_SETTINGS);}}
    function saveDraft(i,v){const d=getDrafts();d[i]=v;localStorage.setItem(STORAGE_KEY_DRAFTS,JSON.stringify(d));}
    function getDraft(i){const d=getDrafts();return d[i]||null;}
    function clearDraft(i){const d=getDrafts();delete d[i];localStorage.setItem(STORAGE_KEY_DRAFTS,JSON.stringify(d));}
    function getDrafts(){try{const s=localStorage.getItem(STORAGE_KEY_DRAFTS);return s?JSON.parse(s):{};}catch(e){localStorage.removeItem(STORAGE_KEY_DRAFTS);return{};}}
    function restartQuiz(){if(confirm('确定重新开始？进度将被清除。')){currentIndex=0;reviewMode=false;wrongIndices=[];reviewIndex=0;answers=new Array(questions.length).fill(null);localStorage.removeItem(STORAGE_KEY_ANSWERS);localStorage.removeItem(STORAGE_KEY_DRAFTS);renderQuestion();updateNavButtons();renderAnswerSheet();}}
    function showHome(){if(confirm('返回主页将丢失进度，确定吗？')){currentIndex=0;reviewMode=false;wrongIndices=[];reviewIndex=0;answers=new Array(questions.length).fill(null);localStorage.removeItem(STORAGE_KEY_ANSWERS);localStorage.removeItem(STORAGE_KEY_DRAFTS);switchToKnowledgePage();renderAnswerSheet();}}
    function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
    function escapeHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    renderKnowledgePage();switchToKnowledgePage();renderQuestion();renderAnswerSheet();renderHistory();updateNavButtons();
</script>
