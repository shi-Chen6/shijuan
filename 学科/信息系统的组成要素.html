        {"type":"单选题","difficulty":"基础","stem":"看得见摸得着的实体设备，属于信息系统组成要素中的（ ）","options":[{"label":"A","text":"硬件"},{"label":"B","text":"软件"},{"label":"C","text":"数据"},{"label":"D","text":"人员"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. 硬件</strong>。硬件是信息系统的物理设备基础，如电脑、手机、服务器等。<br><strong>📚 知识点讲解：</strong>硬件要素包括输入设备、处理设备、存储设备、输出设备和网络设备。<br><strong>💡 解题思路：</strong>“看得见摸得着”是硬件的典型特征，区别于软件、数据等无形要素。<br><strong>🧠 记忆口诀：</strong>硬件实体摸得着，输入输出存储算，软件程序无形体，数据数字大脑传。"},
        {"type":"单选题","difficulty":"基础","stem":"控制硬件工作、实现业务功能的程序与文档，统称为（ ）","options":[{"label":"A","text":"存储设备"},{"label":"B","text":"软件"},{"label":"C","text":"传输介质"},{"label":"D","text":"终端设备"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 软件</strong>。软件包括系统软件和应用软件，负责指挥硬件完成各项任务。<br><strong>📚 知识点讲解：</strong>软件是信息系统的指挥中枢，分为系统软件（如Windows）和应用软件（如WPS）。<br><strong>💡 解题思路：</strong>“程序与文档”明确指向软件，而非硬件设备。<br><strong>🧠 记忆口诀：</strong>软件程序发指令，系统应用两类型，系统管理硬件底，应用服务具体需。"},
        {"type":"单选题","difficulty":"基础","stem":"考试分数、交易订单、监控画面，属于系统的核心要素（ ）","options":[{"label":"A","text":"硬件"},{"label":"B","text":"网络"},{"label":"C","text":"数据"},{"label":"D","text":"人员"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. 数据</strong>。数据是信息系统加工处理的核心对象，是系统价值的载体。<br><strong>📚 知识点讲解：</strong>数据要素包括原始数据、加工信息、业务档案等，没有数据系统就失去了意义。<br><strong>💡 解题思路：</strong>分数、订单、画面都是具体的数据内容。<br><strong>🧠 记忆口诀：</strong>数据系统核心值，分数订单画面存，五大要素围绕它，没有数据系统废。"},
        {"type":"单选题","difficulty":"基础","stem":"网线、路由器、WiFi网络，主要承担设备间数据传输，该要素是（ ）","options":[{"label":"A","text":"软件"},{"label":"B","text":"网络"},{"label":"C","text":"数据"},{"label":"D","text":"硬件"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 网络</strong>。网络要素负责设备之间的互联互通和数据传输。<br><strong>📚 知识点讲解：</strong>网络包括传输介质（网线、光纤）和网络设备（路由器、交换机），是信息传递的纽带。<br><strong>💡 解题思路：</strong>网线、WiFi等都属于网络通信范畴。<br><strong>🧠 记忆口诀：</strong>网络互联传数据，网线WiFi路由器，设备互通靠网络，信息传递无阻碍。"},
        {"type":"单选题","difficulty":"基础","stem":"操作、维护、管理信息系统的使用者，属于（ ）","options":[{"label":"A","text":"硬件要素"},{"label":"B","text":"人员要素"},{"label":"C","text":"软件要素"},{"label":"D","text":"网络要素"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 人员要素</strong>。人员是信息系统的规划者、操作者和管理者，是五大要素中最具能动性的部分。<br><strong>📚 知识点讲解：</strong>人员包括普通用户、系统管理员、开发人员等，主导系统的运行和业务开展。<br><strong>💡 解题思路：</strong>“使用者”指向人员，而非设备或程序。<br><strong>🧠 记忆口诀：</strong>人员主导系统行，操作维护与管理，五大要素人最活，没有人员系统停。"},
        {"type":"单选题","difficulty":"基础","stem":"电脑操作系统Windows属于（ ）","options":[{"label":"A","text":"系统软件"},{"label":"B","text":"应用软件"},{"label":"C","text":"硬件设备"},{"label":"D","text":"网络介质"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. 系统软件</strong>。操作系统是管理硬件资源、为其他软件提供运行环境的基础软件。<br><strong>📚 知识点讲解：</strong>系统软件包括操作系统、驱动程序等；应用软件面向具体用户需求。<br><strong>💡 解题思路：</strong>Windows是典型的系统软件，不是应用软件。<br><strong>🧠 记忆口诀：</strong>Windows系统软件，管理硬件打底撑，应用软件上层跑，办公娱乐具体用。"},
        {"type":"单选题","difficulty":"基础","stem":"键盘、显示器、硬盘都归属于信息系统哪一类要素（ ）","options":[{"label":"A","text":"软件"},{"label":"B","text":"硬件"},{"label":"C","text":"数据"},{"label":"D","text":"网络"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 硬件</strong>。键盘是输入设备，显示器是输出设备，硬盘是存储设备，均属于硬件要素。<br><strong>📚 知识点讲解：</strong>硬件按功能分为输入、处理、存储、输出、网络五大类设备。<br><strong>💡 解题思路：</strong>三者都是实体设备，符合硬件定义。<br><strong>🧠 记忆口诀：</strong>键盘输入显输出，硬盘存储数据留，实体设备归硬件，五大分类各司职。"},
        {"type":"单选题","difficulty":"基础","stem":"用来统计表格的WPS办公软件，属于（ ）","options":[{"label":"A","text":"系统软件"},{"label":"B","text":"应用软件"},{"label":"C","text":"存储硬件"},{"label":"D","text":"传输设备"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 应用软件</strong>。WPS满足用户办公统计的具体需求，属于应用软件范畴。<br><strong>📚 知识点讲解：</strong>应用软件直接面向用户，提供文字处理、表格计算、图像编辑等功能。<br><strong>💡 解题思路：</strong>统计表格是具体业务应用，因此WPS是应用软件。<br><strong>🧠 记忆口诀：</strong>WPS办公应用软，统计表格它来干，系统软件打基础，应用软件服务端。"},
        {"type":"单选题","difficulty":"基础","stem":"信息系统五大要素中，决定系统实际价值的核心是（ ）","options":[{"label":"A","text":"硬件外观"},{"label":"B","text":"各类数据"},{"label":"C","text":"网线长度"},{"label":"D","text":"设备数量"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 各类数据</strong>。数据是系统处理的核心对象，承载业务信息，体现系统的实际应用价值。<br><strong>📚 知识点讲解：</strong>没有数据，信息系统就成了空壳，无法提供任何有用信息。<br><strong>💡 解题思路：</strong>系统的价值在于处理和提供有用的数据。<br><strong>🧠 记忆口诀：</strong>系统价值在数据，分数档案交易单，硬件软件为它转，没有数据全白干。"},
        {"type":"单选题","difficulty":"基础","stem":"没有人员参与操控，信息系统无法自主开展复杂业务，体现人员的（ ）","options":[{"label":"A","text":"主导作用"},{"label":"B","text":"存储作用"},{"label":"C","text":"传输作用"},{"label":"D","text":"运算作用"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A. 主导作用</strong>。人员是信息系统中最具能动性的要素，规划、操作、维护系统运行。<br><strong>📚 知识点讲解：</strong>人员要素在五大要素中起主导和管控作用，其他要素都需要人来操控。<br><strong>💡 解题思路：</strong>“无法自主开展”反证了人员的主导地位。<br><strong>🧠 记忆口诀：</strong>人员主导不可缺，操控维护定规则，硬件软件为人用，系统运转靠人推。"},
        {"type":"单选题","difficulty":"中档","stem":"下列全部属于硬件设备的一组是（ ）","options":[{"label":"A","text":"打印机、服务器、扫码枪"},{"label":"B","text":"网课软件、浏览器、文档程序"},{"label":"C","text":"成绩数据、图片信息、文字档案"},{"label":"D","text":"网络协议、无线信号、网线"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A</strong>。打印机、服务器、扫码枪都是实体硬件设备。B是软件，C是数据，D中网络协议和无线信号不是硬件。<br><strong>📚 知识点讲解：</strong>硬件是看得见摸得着的物理设备。<br><strong>💡 解题思路：</strong>逐一判断每组是否全部为实体设备。<br><strong>🧠 记忆口诀：</strong>打印机服务器扫码枪，三者都是硬设备，软件数据无形体，分清类别不混淆。"},
        {"type":"单选题","difficulty":"中档","stem":"一个完整的信息系统，必不可少的组成数量是（ ）","options":[{"label":"A","text":"两类要素"},{"label":"B","text":"三类要素"},{"label":"C","text":"五类要素"},{"label":"D","text":"一类要素"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. 五类要素</strong>。完整的信息系统必须包含硬件、软件、数据、网络、人员五大要素，缺一不可。<br><strong>📚 知识点讲解：</strong>五大要素相互配合、协同工作，任何一类缺失都会导致系统无法正常运转。<br><strong>💡 解题思路：</strong>信息系统定义的完整性要求五要素齐全。<br><strong>🧠 记忆口诀：</strong>信息系统五要素，硬软数网人齐全，缺一不可成系统，协同配合功能全。"},
        {"type":"单选题","difficulty":"中档","stem":"下列关于系统软件与应用软件说法正确的是（ ）","options":[{"label":"A","text":"系统软件面向日常具体办公使用"},{"label":"B","text":"应用软件负责管理计算机底层硬件"},{"label":"C","text":"操作系统属于系统软件"},{"label":"D","text":"网课平台属于系统软件"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. 操作系统属于系统软件</strong>。操作系统是管理硬件资源的基础软件。A、B、D说法均错误。<br><strong>📚 知识点讲解：</strong>系统软件管理硬件，应用软件服务具体需求。<br><strong>💡 解题思路：</strong>A应为应用软件，B应为系统软件，D应为应用软件。<br><strong>🧠 记忆口诀：</strong>系统软件管硬件，应用软件服务人，Windows系统类，网课平台应用分。"},
        {"type":"单选题","difficulty":"中档","stem":"智慧校园系统中，负责连通所有教室设备、传递数据的是（ ）","options":[{"label":"A","text":"数据要素"},{"label":"B","text":"网络要素"},{"label":"C","text":"单机硬件"},{"label":"D","text":"本地软件"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 网络要素</strong>。网络要素通过传输介质和网络设备，实现各教室设备之间的互联互通和数据共享。<br><strong>📚 知识点讲解：</strong>网络是信息系统的“神经系统”，负责数据传输。<br><strong>💡 解题思路：</strong>“连通”“传递数据”是网络的典型功能。<br><strong>🧠 记忆口诀：</strong>网络连通各设备，数据传输靠它传，智慧校园离不开，网线WiFi路由器。"},
        {"type":"单选题","difficulty":"中档","stem":"缺少数据要素的信息系统，会出现的问题是（ ）","options":[{"label":"A","text":"硬件运行速度加快"},{"label":"B","text":"无实际业务处理内容"},{"label":"C","text":"软件自动升级更新"},{"label":"D","text":"网络传输更加稳定"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 无实际业务处理内容</strong>。数据是系统处理的核心对象，没有数据系统就失去了存在的意义。<br><strong>📚 知识点讲解：</strong>数据是信息系统的价值所在，缺少数据系统就变成了空壳。<br><strong>💡 解题思路：</strong>其他选项都不是缺数据的结果。<br><strong>🧠 记忆口诀：</strong>无数据系统空转，没有业务可处理，硬件软件白忙活，信息系统无价值。"},
        {"type":"判断题","difficulty":"基础","stem":"硬件是信息系统的物理基础，软件指挥硬件完成各项工作。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。硬件提供物理平台，软件发出指令控制硬件工作，两者相辅相成。<br><strong>📚 知识点讲解：</strong>硬件与软件的关系就像身体与大脑。<br><strong>💡 解题思路：</strong>符合信息系统的基本原理。<br><strong>🧠 记忆口诀：</strong>硬件身体软件脑，指令下发硬件跑，软硬结合系统活，分工协作效率高。"},
        {"type":"判断题","difficulty":"基础","stem":"数据是信息系统加工处理的核心对象，体现系统使用价值。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。系统围绕数据进行采集、处理、存储和传输，数据承载着业务信息。<br><strong>📚 知识点讲解：</strong>没有数据，信息系统就失去了实际应用价值。<br><strong>💡 解题思路：</strong>数据是信息系统的核心资产。<br><strong>🧠 记忆口诀：</strong>数据核心价值高，采集处理存储传，没有数据空系统，业务信息无处找。"},
        {"type":"判断题","difficulty":"基础","stem":"路由器、光纤、移动通信都属于信息系统的网络要素。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。这些都是网络传输的硬件设备和介质，属于网络要素。<br><strong>📚 知识点讲解：</strong>网络要素包括传输介质和网络设备，负责数据通信。<br><strong>💡 解题思路：</strong>三者都用于网络连接和数据传输。<br><strong>🧠 记忆口诀：</strong>路由光纤移动网，网络要素传输忙，连接设备通数据，信息高速路通畅。"},
        {"type":"判断题","difficulty":"基础","stem":"人员只是单纯使用者，不会影响信息系统的运行状态。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。人员的操作、维护、管理行为直接影响系统的安全与运行状态。<br><strong>📚 知识点讲解：</strong>人员是系统中最活跃、最具影响力的要素，误操作或恶意行为都可能造成系统故障。<br><strong>💡 解题思路：</strong>人员行为决定系统的稳定与安全。<br><strong>🧠 记忆口诀：</strong>人员影响系统大，操作维护与管理，误操破坏可致命，安全运行靠人把。"},
        {"type":"判断题","difficulty":"基础","stem":"微信、在线课堂软件都属于应用软件范畴。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。这些软件面向用户的具体需求，属于应用软件。<br><strong>📚 知识点讲解：</strong>应用软件直接为用户提供各种功能服务。<br><strong>💡 解题思路：</strong>微信、网课软件都是具体应用。<br><strong>🧠 记忆口诀：</strong>微信网课应用类，服务用户具体需，系统软件打底撑，应用软件上层居。"},
        {"type":"判断题","difficulty":"基础","stem":"信息系统仅由硬件和软件两部分组成即可正常工作。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。完整的信息系统还需要数据、网络、人员三大要素。<br><strong>📚 知识点讲解：</strong>五大要素缺一不可，软硬件只是其中两部分。<br><strong>💡 解题思路：</strong>仅软硬件无法构成完整的信息系统。<br><strong>🧠 记忆口诀：</strong>软硬两件不够全，数据网络人员添，五大要素齐备好，信息系统才运转。"},
        {"type":"判断题","difficulty":"基础","stem":"硬盘、U盘属于硬件里的存储设备，用来存放各类数据。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。硬盘和U盘都是常见的存储硬件设备，用于保存系统和用户数据。<br><strong>📚 知识点讲解：</strong>存储设备是硬件要素中的重要组成部分。<br><strong>💡 解题思路：</strong>它们都是数据存储的物理载体。<br><strong>🧠 记忆口诀：</strong>硬盘U盘存储硬，数据存放靠它们，硬件分类之一员，读取写入速度快。"},
        {"type":"判断题","difficulty":"中档","stem":"系统软件和应用软件功能不同，相互配合才能发挥电脑全部作用。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。系统软件提供底层支撑，应用软件实现具体功能，两者缺一不可。<br><strong>📚 知识点讲解：</strong>没有系统软件，应用软件无法运行；没有应用软件，电脑无法满足用户需求。<br><strong>💡 解题思路：</strong>两者功能互补，协同工作。<br><strong>🧠 记忆口诀：</strong>系统应用配合好，底层支撑上层跑，没有系统软件瘫，没有应用功能少。"},
        {"type":"判断题","difficulty":"中档","stem":"脱离网络要素，多台设备之间也能自由共享交换数据。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。多台设备之间需要网络才能实现数据共享和通信，无网络只能单机运行。<br><strong>📚 知识点讲解：</strong>网络是实现设备互联和数据传输的基础。<br><strong>💡 解题思路：</strong>脱离网络，设备就是信息孤岛。<br><strong>🧠 记忆口诀：</strong>网络连通共享桥，没有网络孤岛立，设备再多各自战，数据传输靠网连。"},
        {"type":"判断题","difficulty":"中档","stem":"同一套信息系统中，五大组成要素分工不同、缺一不可。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。五大要素各有职责，相互依存，任何一类缺失都会导致系统无法正常运转。<br><strong>📚 知识点讲解：</strong>信息系统是五要素协同的整体。<br><strong>💡 解题思路：</strong>这是信息系统完整性的基本要求。<br><strong>🧠 记忆口诀：</strong>五要素分工明，缺一系统不完整，协同配合整体强，信息系统稳运行。"},
        {"type":"简答题","difficulty":"中档","stem":"按顺序写出信息系统的五大组成要素。","answer":"信息系统的五大组成要素是：硬件、软件、数据、网络、人员。","keywords":["硬件","软件","数据","网络","人员"],"analysis":"<strong>🎯 答案解析：</strong>五大要素为：硬件、软件、数据、网络、人员。这五者共同构成完整的信息系统。<br><strong>📚 知识点讲解：</strong>记忆时可联想“硬软数网人”，缺一不可。<br><strong>💡 解题思路：</strong>按教材标准顺序写出即可。<br><strong>🧠 记忆口诀：</strong>硬软数网人，五要素记心间，信息系统靠它们，缺一不可成系统。"},
        {"type":"简答题","difficulty":"中档","stem":"简述系统软件与应用软件的区别，并各举一个实例。","answer":"系统软件用于管理计算机硬件资源，为其他程序提供运行环境；应用软件面向用户，满足具体业务需求。实例：系统软件——Windows操作系统；应用软件——WPS办公软件。","keywords":["系统软件","应用软件","Windows","WPS","管理硬件","具体需求"],"analysis":"<strong>🎯 答案解析：</strong>系统软件管硬件，应用软件服务人。Windows是系统软件，WPS是应用软件。<br><strong>📚 知识点讲解：</strong>区分关键在于是否直接面向用户的具体业务。<br><strong>💡 解题思路：</strong>从功能定位和典型实例两方面说明。<br><strong>🧠 记忆口诀：</strong>系统软件打地基，应用软件盖楼房，Windows系统类，WPS应用广。"},
        {"type":"简答题","difficulty":"提高","stem":"简要说明信息系统五大要素各自承担的核心作用。","answer":"硬件：提供物理设备载体，支撑信息处理。软件：下发指令，控制硬件，实现功能。数据：系统处理的核心对象，承载业务信息。网络：连通设备，传输数据，实现共享。人员：操控管理系统，主导运行与决策。","keywords":["硬件","软件","数据","网络","人员","载体","指令","对象","传输","主导"],"analysis":"<strong>🎯 答案解析：</strong>五大要素各司其职：硬件是基础，软件是指挥，数据是核心，网络是纽带，人员是主导。<br><strong>📚 知识点讲解：</strong>理解各要素的核心作用是分析信息系统的基础。<br><strong>💡 解题思路：</strong>用简洁语言概括每个要素的核心职能。<br><strong>🧠 记忆口诀：</strong>硬件载体软件令，数据核心网络通，人员主导系统转，五要素协同功。"},
        {"type":"综合应用题","difficulty":"提高","stem":"线上作业提交系统包含：手机、后台服务器、作业提交软件、学生答题数据、校园网络、师生操作人员。\n（1）将上述内容分别对应划分到五大组成要素中。\n（2）分析数据要素在该系统里起到的核心价值。\n（3）说明网络要素对线上作业系统不可缺少的原因。","tasks":[{"id":1,"stem":"划分各内容到五大要素。","answer":"手机、后台服务器→硬件；作业提交软件→软件；学生答题数据→数据；校园网络→网络；师生操作人员→人员。","keywords":["硬件","软件","数据","网络","人员"]},{"id":2,"stem":"分析数据要素的核心价值。","answer":"答题数据是系统处理核心，用于提交作业、教师批阅、成绩统计，没有数据线上作业业务无法开展。","keywords":["答题数据","提交","批阅","统计"]},{"id":3,"stem":"说明网络要素不可缺的原因。","answer":"依靠网络将学生终端答题数据上传服务器，并将批阅结果回传学生设备，实现远程作业交互，无网络只能单机查看，无法完成线上提交批阅。","keywords":["网络","上传","回传","远程交互"]}],"answer":"（1）手机服务器硬件，作业软件软件，答题数据数据，校园网络网络，师生人员；（2）数据是作业提交、批阅、统计的基础；（3）网络实现远程数据上传与回传。","keywords":["硬件","软件","数据","网络","人员"],"analysis":"<strong>🎯 答案解析：</strong>该系统典型体现了五大要素的分工协作：硬件提供终端，软件处理逻辑，数据承载作业，网络连接传输，人员操作交互。<br><strong>📚 知识点讲解：</strong>线上作业系统是信息系统五要素协同的典型案例。<br><strong>💡 解题思路：</strong>按要素分类，分析数据和网络的关键作用。<br><strong>🧠 记忆口诀：</strong>手机服务器硬件，作业软件数据存，校园网络连两端，师生人员交互成。"},
        {"type":"综合应用题","difficulty":"提高","stem":"小区智能门禁信息系统由人脸识别设备、门禁控制程序、住户身份信息、小区内网、安保管理员共同组成。\n（1）逐一判断各项内容所属的系统组成要素。\n（2）简述硬件、软件相互配合，如何完成身份核验功能。\n（3）结合要素作用，说说人员在门禁系统运行中的必要性。","tasks":[{"id":1,"stem":"判断各项所属要素。","answer":"人脸识别设备→硬件；门禁控制程序→软件；住户身份信息→数据；小区内网→网络；安保管理员→人员。","keywords":["硬件","软件","数据","网络","人员"]},{"id":2,"stem":"简述软硬件配合过程。","answer":"人脸识别硬件采集人脸图像，门禁软件对比内部住户信息判定身份，软硬件配合完成人脸核验，符合条件则开启门禁。","keywords":["采集","对比","判定","开启"]},{"id":3,"stem":"说明人员必要性。","answer":"人员负责日常设备检修、异常处理、住户信息维护，出现故障人为排查处置，保障门禁系统长期稳定运行。","keywords":["检修","异常","维护","故障"]}],"answer":"（1）人脸识别硬件，门禁软件软件，住户数据数据，小区内网网络，安保人员；（2）硬件采集图像，软件对比数据，通过后开门；（3）人员负责维护、异常处理，保障系统稳定。","keywords":["硬件","软件","数据","网络","人员"],"analysis":"<strong>🎯 答案解析：</strong>门禁系统是典型的物联网信息系统，人脸识别设备采集数据，软件进行比对，数据存储身份信息，网络连接后台，人员运维管理。<br><strong>📚 知识点讲解：</strong>五要素协同完成身份核验与门禁控制。<br><strong>💡 解题思路：</strong>按设备分类，描述软硬件交互流程，强调人员的运维角色。<br><strong>🧠 记忆口诀：</strong>人脸识别硬件采，门禁软件数据比，内网传输管理员护，五要素协防安全。"}
    ]);})();

<script>
    // 增强脚本：覆盖原有函数以支持新题型、错题回顾和导出
    (function() {
        const APP_ID = 'info_sys_elements_quiz_1';
        const STORAGE_KEY_ANSWERS = APP_ID + '_answers', STORAGE_KEY_SETTINGS = APP_ID + '_settings', STORAGE_KEY_HISTORY = APP_ID + '_history', STORAGE_KEY_DRAFTS = APP_ID + '_drafts';
        let currentIndex = 0, currentPage = 'learn', answers = new Array(window.questions.length).fill(null), fontSize = 16, currentFilter = 'all', reviewMode = false, wrongIndices = [], reviewIndex = 0;

        function renderKnowledgePage(){document.getElementById('knowledgeTitle').textContent='信息系统的组成要素（高中信息科技）';document.getElementById('knowledgeContent').innerHTML=`<h3>📖 核心定义</h3><p>信息系统是由<strong>硬件、软件、数据、网络、人员</strong>五大基本要素共同组成，能够对信息进行采集、处理、存储、传输与应用，服务于生产管理、学习生活、政务办公等场景的人机协同系统。五大要素相互配合、缺一不可。</p><h3>🔍 核心要点拆解</h3><p><strong>1. 硬件要素</strong>：物理设备，分为输入、处理、存储、输出、网络设备。</p><p><strong>2. 软件要素</strong>：系统软件（如Windows）和应用软件（如WPS）。</p><p><strong>3. 数据要素</strong>：系统处理的核心对象，如成绩、订单、档案。</p><p><strong>4. 网络要素</strong>：传输介质和网络设备，实现设备互联。</p><p><strong>5. 人员要素</strong>：使用者、管理员、开发者，主导系统运行。</p><h3>📚 教材典型案例</h3><p>班级成绩管理系统、超市收银信息系统。</p><h3>⚠️ 易错点</h3><ul><li>❌ 程序软件误判为硬件</li><li>❌ 忽略人员和网络要素</li><li>❌ 认为硬件最重要，忽视数据核心价值</li><li>❌ 分不清系统软件和应用软件</li></ul>`;}
        function switchToKnowledgePage(){currentPage='learn';reviewMode=false;document.getElementById('knowledgePage').classList.remove('hidden');document.getElementById('quizContent').style.display='none';document.getElementById('questionInfo').style.display='none';document.getElementById('pageTitle').style.display='block';document.querySelector('.progress-bar').style.display='none';document.getElementById('footerContent').innerHTML=`<button class="start-quiz-btn" onclick="startQuiz()"><i class="fas fa-play-circle"></i> 我已学完，开始刷题</button>`;}
        function startQuiz(){currentPage='quiz';reviewMode=false;wrongIndices=[];document.getElementById('knowledgePage').classList.add('hidden');document.getElementById('quizContent').style.display='block';document.getElementById('questionInfo').style.display='block';document.getElementById('pageTitle').style.display='none';document.querySelector('.progress-bar').style.display='block';currentIndex=0;renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'})}
        function getQuestionTypeLabel(q){return{'单选题':'单选题','判断题':'判断题','简答题':'简答题','综合应用题':'综合应用题'}[q.type]||q.type}
        function isChoiceType(q){return q.type==='单选题'||q.type==='判断题'}
        function isTextType(q){return q.type==='简答题'||q.type==='综合应用题'}
        function getActualIndex(){return reviewMode&&wrongIndices.length?wrongIndices[reviewIndex]:currentIndex}
        function getTotalInMode(){return reviewMode&&wrongIndices.length?wrongIndices.length:window.questions.length}
        function getCurrentPosition(){return reviewMode&&wrongIndices.length?reviewIndex+1:currentIndex+1}
        function renderQuestion(){
            const ai=getActualIndex(),q=window.questions[ai],area=document.getElementById('quizContent');
            const tim=getTotalInMode(),cp=getCurrentPosition();
            let h='';
            if(reviewMode)h+=`<div class="review-mode-banner">🔁 错题回顾模式 — 第 ${cp}/${tim} 题 <span class="exit-review" onclick="exitReviewMode()">退出回顾</span></div>`;
            h+=`<div class="question-card"><span class="question-type">${getQuestionTypeLabel(q)}${q.difficulty?' · '+q.difficulty:''}</span><div class="question-stem">${q.stem}</div>`;
            if(q.image)h+=`<img src="${q.image}" class="question-image">`;
            if(isChoiceType(q)){
                h+=`<div class="options-container">`;
                q.options.forEach((o,i)=>{
                    const sel=answers[ai]===i,cor=q.answer===i;
                    let cls=['option-item'];
                    if(answers[ai]!==null){if(sel&&cor)cls.push('correct');else if(sel&&!cor)cls.push('wrong');else if(cor)cls.push('correct');}else if(sel)cls.push('selected');
                    h+=`<div class="${cls.join(' ')}" onclick="selectOption(${i})"><div class="option-label">${o.label}</div><div class="option-text">${o.text}</div></div>`;
                });
                h+=`</div>`;
            }else if(q.type==='简答题'){h+=renderTextAnswerArea(ai,q);}
            else if(q.type==='综合应用题'){h+=renderComprehensiveArea(ai,q);}
            h+=`</div>`;
            if(answers[ai]!==null){
                if(isChoiceType(q)){const cor=answers[ai]===q.answer;h+=`<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">📝 答案分析 <span class="result-badge ${cor?'correct':'wrong'}">${cor?'✓ 回答正确':'✗ 回答错误'}</span></div><div class="toggle-icon expanded">▼</div></div><div class="analysis-content" style="display:block;">${q.analysis}</div></div>`;}
                else if(isTextType(q)){const res=evaluateTextAnswer(ai,q);h+=buildTextResultCard(ai,q,res);}
            }
            const done=checkAllAnsweredInMode();
            if((reviewMode&&reviewIndex>=wrongIndices.length-1&&done)||(!reviewMode&&currentIndex===window.questions.length-1&&answers.every(a=>a!==null))){
                const cc=getCorrectCount(),ac=Math.round(cc/window.questions.length*100),wc=getWrongCount();
                if(!reviewMode)saveToHistory(cc,ac);
                h+=buildCompletionScreen(cc,ac,wc);
            }
            area.innerHTML=h;updateHeader();
            setTimeout(()=>{if(isTextType(q)){const ta=document.getElementById('textAnswerInput');if(ta&&answers[ai]!==null&&typeof answers[ai]==='string')ta.value=answers[ai];const dr=getDraft(ai);if(ta&&answers[ai]===null&&dr)ta.value=dr;}},50);
            if(window.MathJax)MathJax.typeset();
        }
        function renderTextAnswerArea(ai,q){const saved=answers[ai],draft=getDraft(ai);const dv=(saved!==null&&typeof saved==='string')?saved:(draft||'');const dis=saved!==null&&typeof saved==='string';let h=`<div class="text-answer-area"><textarea id="textAnswerInput" placeholder="请在此输入你的回答..." ${dis?'disabled':''}>${escapeHtml(dv)}</textarea><div class="text-answer-buttons">`;if(!dis)h+=`<button class="btn-draft" onclick="saveDraftOnly(${ai})"><i class="fas fa-save"></i> 保存草稿</button><button class="btn-clear" onclick="clearTextInput(${ai})"><i class="fas fa-eraser"></i> 清空输入</button><button class="btn-submit" onclick="submitTextAnswer(${ai})"><i class="fas fa-check-circle"></i> 提交作答</button>`;else h+=`<button class="btn-submit" disabled style="opacity:0.6;"><i class="fas fa-check-circle"></i> 已提交</button>`;return h+`</div></div>`;}
        function renderComprehensiveArea(ai,q){let h='';if(q.tasks&&q.tasks.length){h+=`<ul class="tasks-list">`;q.tasks.forEach(t=>h+=`<li><span class="task-id">${t.id}</span> ${t.stem}</li>`);h+=`</ul>`;}return h+renderTextAnswerArea(ai,q);}
        function buildTextResultCard(ai,q,res){const bc=res.level==='good'?'correct':(res.level==='partial'?'partial':'wrong');const bt=res.level==='good'?'✓ 回答较好':(res.level==='partial'?'△ 部分正确':'✗ 需加强');return `<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">📝 作答评估 <span class="result-badge ${bc}">${bt}</span></div><div class="toggle-icon expanded">▼</div></div><div class="analysis-content" style="display:block;"><p><strong>📋 你的作答：</strong></p><div style="background:#fafbfc;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(res.userAnswer||'（空）')}</div><p><strong>✅ 标准答案：</strong></p><div style="background:#f6ffed;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(res.referenceAnswer)}</div><p><strong>🔑 关键词命中：</strong>命中 ${res.hitCount}/${res.totalKeywords} 个（${res.hitRate}%）</p><div class="score-progress"><div class="score-progress-fill ${res.progressClass}" style="width:${res.hitRate}%;"></div></div><span class="score-tag ${res.progressClass}">${res.levelLabel}</span><p style="margin-top:8px;"><strong>命中：</strong>${res.hitKeywords.length?res.hitKeywords.map(k=>'<span class="keyword-highlight">'+k+'</span>').join('、'):'无'}</p><p><strong>未命中：</strong>${res.missedKeywords.length?res.missedKeywords.map(k=>'<span class="keyword-missed">'+k+'</span>').join('、'):'无'}</p><hr style="border:none;border-top:1px solid #e8e8e8;margin:12px 0;">${q.analysis}</div></div>`;}
        function buildCompletionScreen(cc,ac,wc){let h=`<div class="completion-screen"><div class="completion-icon">${ac>=80?'🎉':ac>=60?'👍':'💪'}</div><h1 class="completion-title">${reviewMode?'错题回顾完成！':'刷题完成！'}</h1><p style="color:var(--text-secondary);">${reviewMode?'你已经回顾了所有错题':'太棒了！你已经完成了所有题目'}</p><div class="stats"><div class="stat-item"><div class="stat-value">${cc}/${window.questions.length}</div><div class="stat-label">答对题数</div></div><div class="stat-item"><div class="stat-value">${ac}%</div><div class="stat-label">正确率</div></div><div class="stat-item"><div class="stat-value">${wc}</div><div class="stat-label">错题数</div></div></div><div class="action-buttons"><button class="action-btn restart-btn" onclick="restartQuiz()">重新开始</button><button class="action-btn history-view-btn" onclick="toggleHistory()">查看历史</button>`;if(wc>0&&!reviewMode){h+=`<button class="action-btn review-wrong-btn" onclick="startReviewWrong()"><i class="fas fa-redo"></i> 回看错题</button><button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>`;}if(reviewMode&&wc>0)h+=`<button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>`;return h+`</div></div>`;}
        function selectOption(i){const ai=getActualIndex();if(answers[ai]!==null||!isChoiceType(window.questions[ai]))return;answers[ai]=i;saveAnswers();renderQuestion();renderAnswerSheet();updateNavButtons();showToast(i===window.questions[ai].answer?'回答正确！✓':'回答错误 ✗');}
        function submitTextAnswer(ai){if(answers[ai]!==null&&typeof answers[ai]==='string')return;const ta=document.getElementById('textAnswerInput');if(!ta)return;const ua=ta.value.trim();if(!ua){showToast('请先输入你的回答');return;}answers[ai]=ua;clearDraft(ai);saveAnswers();renderQuestion();renderAnswerSheet();updateNavButtons();const res=evaluateTextAnswer(ai,window.questions[ai]);showToast(res.level==='good'?'回答较好！✓':(res.level==='partial'?'部分正确 △':'需加强 ✗'));}
        function saveDraftOnly(ai){const ta=document.getElementById('textAnswerInput');if(!ta)return;const v=ta.value.trim();if(v){saveDraft(ai,v);showToast('草稿已保存 ✓');}else{clearDraft(ai);showToast('草稿已清空');}}
        function clearTextInput(ai){const ta=document.getElementById('textAnswerInput');if(ta)ta.value='';clearDraft(ai);showToast('输入已清空');}
        function evaluateTextAnswer(ai,q){const ua=(answers[ai]&&typeof answers[ai]==='string')?answers[ai]:'';const ak=[];let ra='';if(q.type==='简答题'){if(q.keywords)ak.push(...q.keywords);ra=q.answer||'';}else if(q.type==='综合应用题'){if(q.keywords)ak.push(...q.keywords);ra=q.answer||'';}const tk=ak.length,hk=[],mk=[],ul=ua.toLowerCase();ak.forEach(k=>{if(ul.includes(k.toLowerCase()))hk.push(k);else mk.push(k);});const hc=hk.length,hr=tk>0?Math.round((hc/tk)*100):0;let l,ll,pc;if(q.type==='简答题'){if(hr>=60){l='good';ll='回答较好';pc='excellent';}else if(hr>=30){l='partial';ll='部分正确';pc='pass';}else{l='weak';ll='需加强';pc='fail';}}else{if(hr>=80){l='good';ll='优秀';pc='excellent';}else if(hr>=60){l='good';ll='良好';pc='good';}else if(hr>=40){l='partial';ll='合格';pc='pass';}else{l='weak';ll='需加强';pc='fail';}}return{userAnswer:ua,referenceAnswer:ra,totalKeywords:tk,hitCount:hc,hitRate:hr,hitKeywords:hk,missedKeywords:mk,level:l,levelLabel:ll,progressClass:pc};}
        function getCorrectCount(){let c=0;window.questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]===q.answer)c++;}else{const r=evaluateTextAnswer(i,q);if(r.level==='good')c++;}});return c;}
        function getWrongCount(){let c=0;window.questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]!==q.answer)c++;}else{const r=evaluateTextAnswer(i,q);if(r.level==='weak')c++;}});return c;}
        function getWrongIndicesArray(){const a=[];window.questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]!==q.answer)a.push(i);}else{const r=evaluateTextAnswer(i,q);if(r.level==='weak')a.push(i);}});return a;}
        function checkAllAnsweredInMode(){if(reviewMode&&wrongIndices.length)return wrongIndices.every(wi=>answers[wi]!==null);return answers.every(a=>a!==null);}
        function startReviewWrong(){wrongIndices=getWrongIndicesArray();if(!wrongIndices.length){showToast('没有错题可回顾');return;}reviewMode=true;reviewIndex=0;currentPage='quiz';document.getElementById('knowledgePage').classList.add('hidden');document.getElementById('quizContent').style.display='block';document.getElementById('questionInfo').style.display='block';document.getElementById('pageTitle').style.display='none';document.querySelector('.progress-bar').style.display='block';renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});showToast(`进入错题回顾模式，共 ${wrongIndices.length} 题`);}
        function exitReviewMode(){reviewMode=false;wrongIndices=[];currentIndex=0;currentPage='quiz';renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});showToast('已退出错题回顾模式');}
        function exportWrongCSV(){const wa=getWrongIndicesArray();if(!wa.length){showToast('没有错题可导出');return;}const mn='信息系统的组成要素',ds=new Date().toISOString().slice(0,10),fn=`错题本_${mn}_${ds}.csv`;const rows=[['题型','题目','用户答案','正确答案','关键词命中率','结果','解析']];wa.forEach(i=>{const q=window.questions[i],qt=getQuestionTypeLabel(q);const stem=q.stem.replace(/"/g,'""');let ua='',ca='',hr='',res='';if(isChoiceType(q)){ua=(answers[i]!==null&&answers[i]!==undefined)?(q.options[answers[i]]?q.options[answers[i]].text:String(answers[i])):'';ca=q.options[q.answer]?q.options[q.answer].text:String(q.answer);res=answers[i]===q.answer?'正确':'错误';hr=answers[i]===q.answer?'100%':'0%';}else{ua=(answers[i]&&typeof answers[i]==='string')?answers[i]:'';ca=q.answer||'';const er=evaluateTextAnswer(i,q);hr=er.hitRate+'%';res=er.levelLabel;}const at=q.analysis?q.analysis.replace(/<[^>]+>/g,'').replace(/"/g,'""'):'';rows.push([qt,'"'+stem+'"','"'+ua.replace(/"/g,'""')+'"','"'+ca.replace(/"/g,'""')+'"',hr,res,'"'+at+'"']);});const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=fn;document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);showToast('错题CSV已导出：'+fn);}
        function toggleAnalysis(h){const c=h.nextElementSibling,i=h.querySelector('.toggle-icon');if(c.style.display==='none'){c.style.display='block';i.classList.add('expanded');}else{c.style.display='none';i.classList.remove('expanded');}}
        function prevQuestion(){if(reviewMode&&wrongIndices.length){if(reviewIndex>0){reviewIndex--;renderQuestion();updateNavButtons();}}else if(!reviewMode&&currentIndex>0){currentIndex--;renderQuestion();updateNavButtons();}}
        function nextQuestion(){if(reviewMode&&wrongIndices.length){if(reviewIndex<wrongIndices.length-1){reviewIndex++;renderQuestion();updateNavButtons();}}else if(!reviewMode&&currentIndex<window.questions.length-1){currentIndex++;renderQuestion();updateNavButtons();}}
        function updateHeader(){if(currentPage!=='quiz')return;document.getElementById('currentNum').textContent=getCurrentPosition();const ac=answers.filter(a=>a!==null).length;document.getElementById('answeredCount').textContent=ac;document.getElementById('totalCount').textContent=window.questions.length;document.getElementById('progressFill').style.width=`${(ac/window.questions.length)*100}%`;}
        function updateNavButtons(){const fc=document.getElementById('footerContent');if(currentPage!=='quiz')return;const tim=getTotalInMode(),cp=getCurrentPosition(),isF=cp<=1,isL=cp>=tim,ad=checkAllAnsweredInMode();fc.innerHTML=`<button class="nav-btn prev-btn" onclick="prevQuestion()" ${isF?'disabled':''}><i class="fas fa-chevron-left"></i> 上一题</button><button class="nav-btn next-btn" onclick="nextQuestion()" ${isL&&ad?'disabled':''}>下一题 <i class="fas fa-chevron-right"></i></button>`;}
        function changeFontSize(d){fontSize=Math.max(14,Math.min(22,fontSize+d));document.documentElement.style.setProperty('--font-size-base',`${fontSize}px`);document.documentElement.style.setProperty('--font-size-small',`${fontSize-2}px`);document.documentElement.style.setProperty('--font-size-large',`${fontSize+2}px`);saveSettings();}
        function toggleSheet(){const o=document.getElementById('sheetOverlay'),p=document.getElementById('sheetPanel');if(p.classList.contains('show')){o.classList.remove('show');p.classList.remove('show');}else{o.classList.add('show');p.classList.add('show');renderAnswerSheet();}}
        function renderAnswerSheet(){const g=document.getElementById('sheetGrid');let h='';window.questions.forEach((q,i)=>{let sc='unanswered',st='未答';if(answers[i]!==null){if(isChoiceType(q)){if(answers[i]===q.answer){sc='correct';st='正确';}else{sc='wrong';st='错误';}}else{const r=evaluateTextAnswer(i,q);if(r.level==='good'){sc='correct';st='较好';}else if(r.level==='partial'){sc='correct';st='部分';}else{sc='wrong';st='加强';}}}if(i===getActualIndex()&&!reviewMode)sc+=' current';if(reviewMode&&wrongIndices.includes(i)&&wrongIndices[reviewIndex]===i)sc+=' current';if(currentFilter!=='all'){if(currentFilter==='unanswered'&&answers[i]!==null)return;if(currentFilter==='correct'){if(answers[i]===null)return;if(isChoiceType(q)&&answers[i]!==q.answer)return;if(isTextType(q)){const r=evaluateTextAnswer(i,q);if(r.level==='weak')return;}}if(currentFilter==='wrong'){if(answers[i]===null)return;if(isChoiceType(q)&&answers[i]===q.answer)return;if(isTextType(q)){const r=evaluateTextAnswer(i,q);if(r.level!=='weak')return;}}}h+=`<div class="sheet-item ${sc}" onclick="jumpToQuestion(${i})"><div class="sheet-number">${i+1}</div><div class="sheet-status">${st}</div></div>`;});g.innerHTML=h;}
        function filterQuestions(f,e){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');renderAnswerSheet();}
        function jumpToQuestion(i){reviewMode=false;wrongIndices=[];currentIndex=i;renderQuestion();updateNavButtons();toggleSheet();}
        function toggleHistory(){const o=document.getElementById('historyOverlay'),p=document.getElementById('historyPanel');if(p.classList.contains('show')){o.classList.remove('show');p.classList.remove('show');}else{o.classList.add('show');p.classList.add('show');renderHistory();}}
        function renderHistory(){const l=document.getElementById('historyList'),h=getHistory();if(!h.length){l.innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div>暂无历史记录</div></div>`;return;}let ht='';h.forEach((r,i)=>{const ds=new Date(r.timestamp).toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});ht+=`<div class="history-item"><div class="history-date">${ds}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${r.correctCount}/${r.totalCount}</div><div class="history-label">答对题数</div></div><div class="history-stat"><div class="history-value">${r.accuracy}%</div><div class="history-label">正确率</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${i})">回顾</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${i})">删除</button></div></div>`;});l.innerHTML=ht;}
        function saveToHistory(cc,ac){const h=getHistory();h.unshift({timestamp:Date.now(),totalCount:window.questions.length,correctCount:cc,accuracy:ac,answers:[...answers]});if(h.length>50)h.pop();localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(h));}
        function getHistory(){try{const s=localStorage.getItem(STORAGE_KEY_HISTORY);return s?JSON.parse(s):[];}catch(e){localStorage.removeItem(STORAGE_KEY_HISTORY);return[];}}
        function reviewHistory(i){const h=getHistory();if(i>=0&&i<h.length){answers=[...h[i].answers];currentIndex=0;reviewMode=false;wrongIndices=[];saveAnswers();renderQuestion();updateNavButtons();toggleHistory();showToast('已加载历史记录');}}
        function deleteHistory(i){if(!confirm('确定删除？'))return;const h=getHistory();if(i>=0&&i<h.length){h.splice(i,1);localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(h));renderHistory();showToast('记录已删除');}}
        function clearAllHistory(){if(!confirm('确定清空所有历史记录？'))return;localStorage.removeItem(STORAGE_KEY_HISTORY);renderHistory();showToast('历史记录已清空');}
        function saveAnswers(){localStorage.setItem(STORAGE_KEY_ANSWERS,JSON.stringify({currentIndex,answers,reviewMode,wrongIndices,reviewIndex}));}
        function saveSettings(){localStorage.setItem(STORAGE_KEY_SETTINGS,JSON.stringify({fontSize}));}
        function loadAllData(){try{const s=localStorage.getItem(STORAGE_KEY_ANSWERS);if(s){const d=JSON.parse(s);currentIndex=d.currentIndex||0;answers=d.answers||new Array(window.questions.length).fill(null);reviewMode=d.reviewMode||false;wrongIndices=d.wrongIndices||[];reviewIndex=d.reviewIndex||0;}}catch(e){localStorage.removeItem(STORAGE_KEY_ANSWERS);answers=new Array(window.questions.length).fill(null);}try{const ss=localStorage.getItem(STORAGE_KEY_SETTINGS);if(ss){const st=JSON.parse(ss);fontSize=st.fontSize||16;document.documentElement.style.setProperty('--font-size-base',`${fontSize}px`);document.documentElement.style.setProperty('--font-size-small',`${fontSize-2}px`);document.documentElement.style.setProperty('--font-size-large',`${fontSize+2}px`);}}catch(e){localStorage.removeItem(STORAGE_KEY_SETTINGS);}}
        function saveDraft(i,v){const d=getDrafts();d[i]=v;localStorage.setItem(STORAGE_KEY_DRAFTS,JSON.stringify(d));}
        function getDraft(i){const d=getDrafts();return d[i]||null;}
        function clearDraft(i){const d=getDrafts();delete d[i];localStorage.setItem(STORAGE_KEY_DRAFTS,JSON.stringify(d));}
        function getDrafts(){try{const s=localStorage.getItem(STORAGE_KEY_DRAFTS);return s?JSON.parse(s):{};}catch(e){localStorage.removeItem(STORAGE_KEY_DRAFTS);return{};}}
        function restartQuiz(){if(confirm('确定重新开始？进度将被清除。')){currentIndex=0;reviewMode=false;wrongIndices=[];reviewIndex=0;answers=new Array(window.questions.length).fill(null);localStorage.removeItem(STORAGE_KEY_ANSWERS);localStorage.removeItem(STORAGE_KEY_DRAFTS);renderQuestion();updateNavButtons();renderAnswerSheet();}}
        function showHome(){if(confirm('返回主页将丢失进度，确定吗？')){currentIndex=0;reviewMode=false;wrongIndices=[];reviewIndex=0;answers=new Array(window.questions.length).fill(null);localStorage.removeItem(STORAGE_KEY_ANSWERS);localStorage.removeItem(STORAGE_KEY_DRAFTS);switchToKnowledgePage();renderAnswerSheet();}}
        function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
        function escapeHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
        // 覆盖全局函数引用
        window.renderKnowledgePage=renderKnowledgePage;window.switchToKnowledgePage=switchToKnowledgePage;window.startQuiz=startQuiz;
        window.renderQuestion=renderQuestion;window.selectOption=selectOption;window.submitTextAnswer=submitTextAnswer;
        window.saveDraftOnly=saveDraftOnly;window.clearTextInput=clearTextInput;window.toggleAnalysis=toggleAnalysis;
        window.prevQuestion=prevQuestion;window.nextQuestion=nextQuestion;window.updateHeader=updateHeader;
        window.updateNavButtons=updateNavButtons;window.changeFontSize=changeFontSize;window.toggleSheet=toggleSheet;
        window.renderAnswerSheet=renderAnswerSheet;window.filterQuestions=filterQuestions;window.jumpToQuestion=jumpToQuestion;
        window.toggleHistory=toggleHistory;window.renderHistory=renderHistory;window.saveToHistory=saveToHistory;
        window.reviewHistory=reviewHistory;window.deleteHistory=deleteHistory;window.clearAllHistory=clearAllHistory;
        window.saveAnswers=saveAnswers;window.loadAllData=loadAllData;window.restartQuiz=restartQuiz;
        window.showHome=showHome;window.startReviewWrong=startReviewWrong;window.exitReviewMode=exitReviewMode;
        window.exportWrongCSV=exportWrongCSV;
        // 初始化
        renderKnowledgePage();switchToKnowledgePage();renderQuestion();renderAnswerSheet();renderHistory();updateNavButtons();
    })();
</script>
</body>
</html>
