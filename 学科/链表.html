<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>链表刷题</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6">
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary-color: #4a90e2;
            --primary-light: #e6f7ff;
            --success-color: #52c41a;
            --success-light: #f6ffed;
            --error-color: #f5222d;
            --error-light: #fff2f0;
            --warning-color: #faad14;
            --warning-light: #fffbe6;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --border-color: #e8e8e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.12);
            --font-size-base: 16px;
            --font-size-small: 14px;
            --font-size-large: 18px;
            --radius: 12px;
            --radius-sm: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            transition: font-size 0.3s ease;
        }
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            z-index: 200;
            box-shadow: var(--shadow);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .left-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn,
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:active,
        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
        .question-info {
            text-align: center;
            flex: 1;
        }
        .question-number {
            font-size: 18px;
            font-weight: 600;
        }
        .progress-text {
            font-size: 12px;
            opacity: 0.9;
        }
        .right-section {
            display: flex;
            gap: 8px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 140px;
        }
        .knowledge-page {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .knowledge-page.hidden {
            display: none;
        }
        .knowledge-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .knowledge-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }
        .knowledge-content {
            font-size: var(--font-size-base);
            line-height: 1.8;
            color: var(--text-primary);
        }
        .knowledge-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 18px 0 8px;
            color: var(--primary-color);
            padding-left: 10px;
            border-left: 4px solid var(--primary-color);
        }
        .knowledge-content p {
            margin-bottom: 10px;
        }
        .knowledge-content ul {
            margin: 8px 0 12px 18px;
        }
        .knowledge-content li {
            margin-bottom: 6px;
        }
        .knowledge-content .highlight {
            background: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
        }
        .knowledge-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 4px;
            font-size: 13px;
        }
        .knowledge-table th,
        .knowledge-table td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }
        .knowledge-table th {
            background: #f5f7fb;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .start-quiz-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .start-quiz-btn:active {
            transform: scale(0.98);
        }
        .question-card,
        .analysis-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-type {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-light);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .question-stem {
            font-size: var(--font-size-large);
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .formula {
            background: #fafafa;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            font-family: 'Courier New', monospace;
            text-align: center;
            border-left: 4px solid var(--primary-color);
            overflow-x: auto;
        }
        .question-image {
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            display: block;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 56px;
            position: relative;
        }
        .option-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--radius-sm);
            pointer-events: none;
        }
        .option-item:hover {
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: scale(1.01);
        }
        .option-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
        }
        .option-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
        }
        .option-label {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
            transition: all 0.3s ease;
        }
        .selected .option-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .correct .option-label {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
        .wrong .option-label {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }
        .option-text {
            flex: 1;
            padding-top: 2px;
        }
        .analysis-card {
            padding: 0;
            margin-top: 16px;
            overflow: hidden;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 2000px;
            }
        }
        .analysis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #fafafa;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .analysis-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .result-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .result-badge.correct {
            background: var(--success-light);
            color: var(--success-color);
        }
        .result-badge.wrong {
            background: var(--error-light);
            color: var(--error-color);
        }
        .toggle-icon {
            transition: transform 0.3s ease;
        }
        .toggle-icon.expanded {
            transform: rotate(180deg);
        }
        .analysis-content {
            padding: 20px;
            font-size: var(--font-size-small);
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .analysis-content p {
            margin-bottom: 10px;
        }
        .analysis-content strong {
            color: var(--text-primary);
            font-size: 15px;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.08);
            z-index: 150;
        }
        .footer.hidden {
            transform: translateY(100%);
        }
        .footer-content {
            max-width: 430px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-btn:active {
            transform: scale(0.98);
        }
        .prev-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .prev-btn:not(:disabled):hover {
            background: #e8e8e8;
        }
        .next-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sheet-overlay,
        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sheet-overlay.show,
        .history-overlay.show {
            display: block;
            opacity: 1;
        }
        .sheet-panel,
        .history-panel {
            position: fixed;
            background: var(--bg-card);
            z-index: 400;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sheet-panel {
            bottom: 0;
            left: 50%;
            right: auto;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            transform: translate(-50%, 100%);
            max-height: 70vh;
            width: min(430px, 100%);
        }
        .sheet-panel.show {
            transform: translate(-50%, 0);
        }
        .history-panel {
            top: 0;
            right: 0;
            bottom: 0;
            width: 85%;
            max-width: 360px;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            transform: translateX(100%);
        }
        .history-panel.show {
            transform: translateX(0);
        }
        .sheet-header,
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-title,
        .history-title {
            font-size: 18px;
            font-weight: 600;
        }
        .close-sheet {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 50%;
            cursor: pointer;
        }
        .sheet-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .filter-btn,
        .clear-history {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .clear-history {
            background: #fff2f0;
            color: var(--error-color);
        }
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }
        .sheet-item {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--border-color);
            background: white;
        }
        .sheet-item.unanswered {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .sheet-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
            color: var(--success-color);
        }
        .sheet-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
            color: var(--error-color);
        }
        .sheet-item.current {
            border-width: 3px;
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .sheet-number {
            font-size: 16px;
        }
        .sheet-status {
            font-size: 10px;
            margin-top: 2px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            background: #fafafa;
            border-radius: var(--radius-sm);
            padding: 16px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        .history-item:active {
            transform: scale(0.98);
        }
        .history-date {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .history-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-stat {
            text-align: center;
        }
        .history-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .history-label {
            font-size: 11px;
            color: var(--text-light);
        }
        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .history-action-btn {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .review-btn {
            background: var(--primary-color);
            color: white;
        }
        .delete-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .completion-screen {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        .completion-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--success-color), #73d13d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        .completion-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .action-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .history-view-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        @media (min-width: 768px) {
            .app-container {
                border-radius: 20px;
                margin: 20px auto;
                min-height: calc(100vh - 40px);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            }
            .footer {
                position: static;
                border-radius: 0 0 20px 20px;
            }
            .sheet-panel {
                border-radius: 20px;
                bottom: 20px;
                max-height: 60vh;
            }
        }
        @media (max-width: 360px) {
            .sheet-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }
        }

        /* 新增题型及扩展样式 */
        .question-type.diff-basic {
            background: #e6f7ff;
            color: #1890ff;
        }
        .question-type.diff-mid {
            background: #fffbe6;
            color: #d48806;
        }
        .question-type.diff-high {
            background: #fff2f0;
            color: #cf1322;
        }
        .textarea-input {
            width: 100%;
            min-height: 100px;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            font-family: inherit;
            line-height: 1.7;
            resize: vertical;
            transition: all 0.3s ease;
            background: #fafafa;
            color: var(--text-primary);
            margin-top: 12px;
        }
        .textarea-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        .textarea-input:disabled {
            background: #f5f5f5;
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin: 12px 0;
        }
        .task-list li {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: #fafafa;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary-color);
            font-weight: 500;
            color: var(--text-primary);
        }
        .submit-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .submit-btn,
        .draft-btn,
        .clear-input-btn {
            flex: 1;
            min-width: 70px;
            height: 42px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .submit-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .draft-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .clear-input-btn {
            background: #fff2f0;
            color: var(--error-color);
        }
        .submit-btn:active,
        .draft-btn:active,
        .clear-input-btn:active {
            transform: scale(0.97);
        }
        .hit-rate-bar {

                const status = getAnswerStatus(effIndex);
                let badgeHtml = '';
                if (status === 'correct') badgeHtml = '<span class="result-badge correct">✓ 回答正确</span>';
                else if (status === 'partial') badgeHtml = '<span class="result-badge partial">△ 部分正确</span>';
                else badgeHtml = '<span class="result-badge wrong">✗ 回答错误</span>';

                if (isTextInputType(q) && aVal && aVal.submitted) {
                    const hr = aVal.hitRate || 0;
                    const hrPercent = Math.round(hr * 100);
                    let hrClass = 'weak', tagHtml = '<span class="tag-weak">需加强</span>';
                    if (q.type === '简答题') {
                        if (hr >= 0.6) { hrClass = 'excellent'; tagHtml = '<span class="tag-excellent">回答较好</span>'; }
                        else if (hr >= 0.3) { hrClass = 'ok'; tagHtml = '<span class="tag-ok">部分正确</span>'; }
                    } else if (q.type === '综合应用题') {
                        if (hr >= 0.85) { hrClass = 'excellent'; tagHtml = '<span class="tag-excellent">优秀</span>'; }
                        else if (hr >= 0.7) { hrClass = 'good'; tagHtml = '<span class="tag-good">良好</span>'; }
                        else if (hr >= 0.5) { hrClass = 'ok'; tagHtml = '<span class="tag-ok">合格</span>'; }
                    }
                    html += `<div class="analysis-card" style="padding:16px; margin-top:16px;">
                        <p><strong>📝 你的回答：</strong></p>
                        <div style="background:#fafafa;padding:12px;border-radius:8px;margin:8px 0;white-space:pre-wrap;">${escapeHtml(aVal.userInput || '')}</div>
                        <p><strong>关键词命中率：</strong>${tagHtml} <span style="font-weight:700;">${hrPercent}%</span></p>
                        <div class="hit-rate-bar"><div class="hit-rate-fill ${hrClass}" style="width:${hrPercent}%"></div></div>
                        ${aVal.hitKeywords && aVal.hitKeywords.length > 0 ? `<p><strong>✅ 命中关键词：</strong>${aVal.hitKeywords.map(k => '<span class="highlight-hit">'+escapeHtml(k)+'</span>').join('、')}</p>` : ''}
                        ${aVal.missedKeywords && aVal.missedKeywords.length > 0 ? `<p><strong>❌ 未命中关键词：</strong>${aVal.missedKeywords.map(k => '<span class="highlight-miss">'+escapeHtml(k)+'</span>').join('、')}</p>` : ''}
                        <p style="margin-top:10px;"><strong>📋 标准答案：</strong>${q.answer}</p>
                    </div>`;
                }

                html += `<div class="analysis-card">
                    <div class="analysis-header" onclick="toggleAnalysis(this)">
                        <div class="analysis-title">📝 答案分析 ${badgeHtml}</div>
                        <div class="toggle-icon expanded">▼</div>
                    </div>
                    <div class="analysis-content" style="display: block;">${q.analysis}</div>
                </div>`;
            }

            const allAnsweredInScope = reviewMode ? reviewIndices.every(i => isAnswered(i)) : questions.every((_, i) => isAnswered(i));
            const lastInScope = (currentIndex >= getEffectiveTotal() - 1);

            if (lastInScope && allAnsweredInScope && !reviewMode) {
                let totalQ = questions.length, correctCount = 0;
                questions.forEach((_, i) => { if (isAnswerCorrect(i)) correctCount++; });
                const accuracy = Math.round(correctCount / totalQ * 100);
                saveToHistory(correctCount, accuracy);
                html += `<div class="completion-screen">
                    <div class="completion-icon">🎉</div>
                    <h1 class="completion-title">刷题完成！</h1>
                    <div class="stats">
                        <div class="stat-item"><div class="stat-value">${correctCount}/${totalQ}</div><div class="stat-label">答对题数</div></div>
                        <div class="stat-item"><div class="stat-value">${accuracy}%</div><div class="stat-label">正确率</div></div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> 重新开始</button>
                        <button class="action-btn review-wrong-btn" onclick="reviewWrongQuestions()"><i class="fas fa-exclamation-triangle"></i> 回看错题</button>
                        <button class="action-btn history-view-btn" onclick="toggleHistory()"><i class="fas fa-history"></i> 查看历史</button>
                        <button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>
                    </div>
                </div>`;
            }
            if (lastInScope && allAnsweredInScope && reviewMode) {
                html += `<div class="completion-screen">
                    <div class="completion-icon">📋</div>
                    <h1 class="completion-title">错题回顾完成！</h1>
                    <div class="action-buttons">
                        <button class="action-btn restart-btn" onclick="exitReviewMode()"><i class="fas fa-arrow-left"></i> 返回刷题</button>
                        <button class="action-btn review-wrong-btn" onclick="reviewWrongQuestions()"><i class="fas fa-redo"></i> 再次回看</button>
                        <button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>
                    </div>
                </div>`;
            }
            contentArea.innerHTML = html;
            updateHeader();
            if (window.MathJax) { MathJax.typeset(); }
        }

        function selectOption(idx) {
            const effIndex = getEffectiveIndex();
            if (!isChoiceType(questions[effIndex])) return;
            if (answers[effIndex] !== null && typeof answers[effIndex] === 'number') return;
            answers[effIndex] = idx;
            saveAnswers();
            renderQuestion(); renderAnswerSheet(); updateNavButtons();
            showToast(idx === questions[effIndex].answer ? '回答正确！✓' : '回答错误 ✗');
        }

        function submitTextAnswer(effIndex) {
            const textarea = document.getElementById('textAnswerInput');
            if (!textarea) return;
            const userInput = textarea.value.trim();
            if (!userInput) { showToast('请输入你的回答后再提交'); return; }
            const q = questions[effIndex];
            let allKeywords = [];
            if (q.type === '简答题') allKeywords = q.keywords || [];
            else if (q.type === '综合应用题' && q.keywords && Array.isArray(q.keywords)) {
                q.keywords.forEach(kArr => { if (Array.isArray(kArr)) allKeywords = allKeywords.concat(kArr); });
            }
            const hitKeywords = [], missedKeywords = [];
            const inputLower = userInput.toLowerCase();
            allKeywords.forEach(kw => {
                if (inputLower.includes(kw.toLowerCase())) hitKeywords.push(kw);
                else missedKeywords.push(kw);
            });
            const hitRate = allKeywords.length > 0 ? hitKeywords.length / allKeywords.length : 0;
            answers[effIndex] = { userInput, submitted: true, hitRate, hitKeywords, missedKeywords, totalKeywords: allKeywords.length };
            saveAnswers();
            clearDraft(effIndex);
            renderQuestion(); renderAnswerSheet(); updateNavButtons();
            const hrPercent = Math.round(hitRate * 100);
            if (q.type === '简答题') {
                if (hitRate >= 0.6) showToast(`回答较好！命中率 ${hrPercent}% ✓`);
                else if (hitRate >= 0.3) showToast(`部分正确，命中率 ${hrPercent}%`);
                else showToast(`需加强，命中率 ${hrPercent}%`);
            } else {
                if (hitRate >= 0.85) showToast(`优秀！完成度 ${hrPercent}% ✓`);
                else if (hitRate >= 0.7) showToast(`良好！完成度 ${hrPercent}%`);
                else if (hitRate >= 0.5) showToast(`合格，完成度 ${hrPercent}%`);
                else showToast(`需加强，完成度 ${hrPercent}%`);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveDraft(effIndex) {
            const textarea = document.getElementById('textAnswerInput');
            if (!textarea) return;
            const drafts = getDrafts(); drafts[effIndex] = textarea.value;
            localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts));
            showToast('草稿已保存 ✓');
        }

        function clearInput(effIndex) {
            const textarea = document.getElementById('textAnswerInput');
            if (!textarea) return;
            if (textarea.value.trim() && !confirm('确定要清空输入内容吗？')) return;
            textarea.value = '';
            clearDraft(effIndex);
            showToast('输入已清空');
        }

        function getDrafts() { const saved = localStorage.getItem(STORAGE_KEY_DRAFTS); return saved ? JSON.parse(saved) : {}; }
        function clearDraft(effIndex) { const drafts = getDrafts(); delete drafts[effIndex]; localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts)); }

        function reviewWrongQuestions() {
            const wrongIndices = [];
            questions.forEach((_, i) => { if (isAnswered(i) && !isAnswerCorrect(i)) wrongIndices.push(i); });
            if (wrongIndices.length === 0) { showToast('恭喜！没有错题需要回顾 🎉'); return; }
            reviewMode = true; reviewIndices = wrongIndices; currentIndex = 0;
            currentPage = 'quiz';
            document.getElementById('knowledgePage').classList.add('hidden');
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('questionInfo').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            renderQuestion(); updateNavButtons();
            showToast(`共 ${wrongIndices.length} 道错题，开始回顾`);
        }

        function exitReviewMode() {
            reviewMode = false; reviewIndices = []; currentIndex = 0;
            currentPage = 'quiz';
            document.getElementById('knowledgePage').classList.add('hidden');
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('questionInfo').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            renderQuestion(); updateNavButtons();
            showToast('已返回正常刷题模式');
        }

        function exportWrongCSV() {
            const wrongIndices = [];
            questions.forEach((_, i) => { if (isAnswered(i) && !isAnswerCorrect(i)) wrongIndices.push(i); });
            if (wrongIndices.length === 0) { showToast('没有错题可导出'); return; }
            const BOM = '\uFEFF';
            let csvContent = BOM + '题型,题号,题目,用户答案,正确答案,关键词命中率,结果,解析\n';
            wrongIndices.forEach(i => {
                const q = questions[i]; const aVal = answers[i];
                let userAnswerStr = '', correctAnswerStr = '', hitRateStr = '', resultStr = '';
                if (isChoiceType(q)) {
                    const selectedLabel = (typeof aVal === 'number' && aVal >= 0 && q.options[aVal]) ? q.options[aVal].label : '未作答';
                    const correctLabel = q.options[q.answer] ? q.options[q.answer].label : '';
                    userAnswerStr = selectedLabel; correctAnswerStr = correctLabel;
                    hitRateStr = (typeof aVal === 'number' && aVal === q.answer) ? '100%' : '0%';
                    resultStr = (typeof aVal === 'number' && aVal === q.answer) ? '正确' : '错误';
                } else if (isTextInputType(q)) {
                    userAnswerStr = (aVal && aVal.userInput) ? aVal.userInput.replace(/\n/g, ' ').replace(/"/g, '""') : '未作答';
                    correctAnswerStr = q.answer ? q.answer.replace(/\n/g, ' ').replace(/"/g, '""') : '';
                    hitRateStr = (aVal && aVal.submitted) ? Math.round((aVal.hitRate || 0) * 100) + '%' : '未提交';
                    const hr = (aVal && aVal.submitted) ? (aVal.hitRate || 0) : 0;
                    if (q.type === '简答题') resultStr = hr >= 0.6 ? '回答较好' : (hr >= 0.3 ? '部分正确' : '需加强');
                    else resultStr = hr >= 0.85 ? '优秀' : (hr >= 0.7 ? '良好' : (hr >= 0.5 ? '合格' : '需加强'));
                }
                const analysisPlain = q.analysis ? q.analysis.replace(/<[^>]+>/g, '').replace(/\n/g, ' ').replace(/"/g, '""') : '';
                csvContent += `"${q.type}","${i+1}","${q.stem.replace(/"/g,'""')}","${userAnswerStr}","${correctAnswerStr}","${hitRateStr}","${resultStr}","${analysisPlain}"\n`;
            });
            const dateStr = new Date().toISOString().slice(0,10);
            const filename = `错题本_链表_${dateStr}.csv`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = filename;
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
            showToast(`错题已导出：${filename}`);
        }

        function toggleAnalysis(header) {
            const content = header.nextElementSibling, icon = header.querySelector('.toggle-icon');
            if (content.style.display === 'none') { content.style.display = 'block'; icon.classList.add('expanded'); }
            else { content.style.display = 'none'; icon.classList.remove('expanded'); }
        }

        function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); updateNavButtons(); } }
        function nextQuestion() { if (currentIndex < getEffectiveTotal() - 1) { currentIndex++; renderQuestion(); updateNavButtons(); } }

        function updateHeader() {
            if (currentPage !== 'quiz') return;
            const effectiveTotal = getEffectiveTotal();
            document.getElementById('currentNum').textContent = currentIndex + 1;
            let answeredCount = 0;
            const scope = reviewMode && reviewIndices.length > 0 ? reviewIndices : questions.map((_, i) => i);
            scope.forEach(i => { if (isAnswered(i)) answeredCount++; });
            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('totalCount').textContent = effectiveTotal;
            document.getElementById('progressFill').style.width = effectiveTotal > 0 ? `${(answeredCount / effectiveTotal) * 100}%` : '0%';
            if (reviewMode) document.getElementById('questionInfo').querySelector('.progress-text').textContent = `错题回顾 · ${answeredCount}/${effectiveTotal} 已答`;
        }

        function updateNavButtons() {
            if (currentPage !== 'quiz') return;
            const effectiveTotal = getEffectiveTotal();
            document.getElementById('footerContent').innerHTML = `<button class="nav-btn prev-btn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> 上一题</button><button class="nav-btn next-btn" onclick="nextQuestion()" ${currentIndex >= effectiveTotal - 1 ? 'disabled' : ''}>下一题 <i class="fas fa-chevron-right"></i></button>`;
        }

        function changeFontSize(delta) {
            fontSize = Math.max(14, Math.min(22, fontSize + delta));
            document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`);
            document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`);
            document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`);
            saveSettings();
        }

        function toggleSheet() {
            const overlay = document.getElementById('sheetOverlay'), panel = document.getElementById('sheetPanel');
            if (panel.classList.contains('show')) { overlay.classList.remove('show'); panel.classList.remove('show'); }
            else { overlay.classList.add('show'); panel.classList.add('show'); renderAnswerSheet(); }
        }

        function renderAnswerSheet() {
            const grid = document.getElementById('sheetGrid'); let html = '';
            questions.forEach((q, index) => {
                const status = getAnswerStatus(index);
                let statusClass = 'unanswered', statusText = '未答';
                if (status === 'correct') { statusClass = 'correct'; statusText = '正确'; }
                else if (status === 'wrong') { statusClass = 'wrong'; statusText = '错误'; }
                else if (status === 'partial') { statusClass = 'partial'; statusText = '部分'; }
                if (index === getEffectiveIndex() && !reviewMode) statusClass += ' current';
                if (reviewMode && reviewIndices.includes(index) && reviewIndices.indexOf(index) === currentIndex) statusClass += ' current';
                if (currentFilter !== 'all') {
                    if (currentFilter === 'unanswered' && status !== 'unanswered') return;
                    if (currentFilter === 'correct' && status !== 'correct') return;
                    if (currentFilter === 'wrong' && status !== 'wrong' && status !== 'partial') return;
                }
                html += `<div class="sheet-item ${statusClass}" onclick="jumpToQuestion(${index})"><div class="sheet-number">${index+1}</div><div class="sheet-status">${statusText}</div></div>`;
            });
            grid.innerHTML = html;
        }

        function filterQuestions(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderAnswerSheet();
        }

        function jumpToQuestion(index) {
            if (reviewMode) { const pos = reviewIndices.indexOf(index); if (pos >= 0) currentIndex = pos; else { reviewMode = false; reviewIndices = []; currentIndex = index; } }
            else currentIndex = index;
            renderQuestion(); updateNavButtons(); toggleSheet();
        }

        function toggleHistory() {
            const overlay = document.getElementById('historyOverlay'), panel = document.getElementById('historyPanel');
            if (panel.classList.contains('show')) { overlay.classList.remove('show'); panel.classList.remove('show'); }
            else { overlay.classList.add('show'); panel.classList.add('show'); renderHistory(); }
        }

        function renderHistory() {
            const list = document.getElementById('historyList'), history = getHistory();
            if (history.length === 0) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div>暂无历史记录</div></div>`; return; }
            let html = '';
            history.forEach((record, index) => {
                const dateStr = new Date(record.timestamp).toLocaleDateString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                html += `<div class="history-item"><div class="history-date">${dateStr}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${record.correctCount}/${record.totalCount}</div><div class="history-label">答对题数</div></div><div class="history-stat"><div class="history-value">${record.accuracy}%</div><div class="history-label">正确率</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${index})">回顾</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${index})">删除</button></div></div>`;
            });
            list.innerHTML = html;
        }

        function saveToHistory(correctCount, accuracy) {
            const history = getHistory();
            const serializableAnswers = answers.map((a, i) => {
                if (isTextInputType(questions[i]) && a && a.submitted) return { userInput: a.userInput, submitted: true, hitRate: a.hitRate, hitKeywords: a.hitKeywords, missedKeywords: a.missedKeywords, totalKeywords: a.totalKeywords };
                return a;
            });
            history.unshift({ timestamp: Date.now(), totalCount: questions.length, correctCount, accuracy, answers: serializableAnswers });
            if (history.length > 50) history.pop();
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        }

        function getHistory() { const saved = localStorage.getItem(STORAGE_KEY_HISTORY); return saved ? JSON.parse(saved) : []; }

        function reviewHistory(index) {
            const history = getHistory();
            if (index >= 0 && index < history.length) {
                const record = history[index];
                answers = record.answers.map((a, i) => {
                    if (isTextInputType(questions[i]) && a && a.submitted) return { userInput: a.userInput || '', submitted: true, hitRate: a.hitRate || 0, hitKeywords: a.hitKeywords || [], missedKeywords: a.missedKeywords || [], totalKeywords: a.totalKeywords || 0 };
                    return a;
                });
                currentIndex = 0; reviewMode = false; reviewIndices = [];
                saveAnswers();
                currentPage = 'quiz';
                document.getElementById('knowledgePage').classList.add('hidden');
                document.getElementById('quizContent').style.display = 'block';
                document.getElementById('questionInfo').style.display = 'block';
                document.getElementById('pageTitle').style.display = 'none';
                document.querySelector('.progress-bar').style.display = 'block';
                renderQuestion(); updateNavButtons(); toggleHistory();
                showToast('已加载历史记录');
            }
        }

        function deleteHistory(index) {
            if (!confirm('确定要删除这条记录吗？')) return;
            const history = getHistory();
            if (index >= 0 && index < history.length) { history.splice(index, 1); localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history)); renderHistory(); showToast('记录已删除'); }
        }

        function clearAllHistory() { if (!confirm('确定要清空所有历史记录吗？')) return; localStorage.removeItem(STORAGE_KEY_HISTORY); renderHistory(); showToast('历史记录已清空'); }

        function saveAnswers() {
            const serializableAnswers = answers.map((a, i) => {
                if (isTextInputType(questions[i]) && a && a.submitted) return { userInput: a.userInput, submitted: true, hitRate: a.hitRate, hitKeywords: a.hitKeywords, missedKeywords: a.missedKeywords, totalKeywords: a.totalKeywords };
                return a;
            });
            localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify({ currentIndex, answers: serializableAnswers, reviewMode, reviewIndices }));
        }

        function saveSettings() { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ fontSize })); }

        function loadAllData() {
            const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS);
            if (savedAnswers) {
                const data = JSON.parse(savedAnswers);
                currentIndex = data.currentIndex || 0; reviewMode = data.reviewMode || false; reviewIndices = data.reviewIndices || [];
                answers = (data.answers || new Array(questions.length).fill(null)).map((a, i) => {
                    if (isTextInputType(questions[i]) && a && a.submitted) return { userInput: a.userInput || '', submitted: true, hitRate: a.hitRate || 0, hitKeywords: a.hitKeywords || [], missedKeywords: a.missedKeywords || [], totalKeywords: a.totalKeywords || 0 };
                    if (isChoiceType(questions[i]) && typeof a === 'number') return a;
                    return null;
                });
            }
            const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
            if (savedSettings) { const settings = JSON.parse(savedSettings); fontSize = settings.fontSize || 16; document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`); document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`); document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`); }
            const drafts = getDrafts();
            if (Object.keys(drafts).length > 0) {
                Object.keys(drafts).forEach(idx => {
                    const i = parseInt(idx);
                    if (i >= 0 && i < questions.length && isTextInputType(questions[i]) && !isAnswered(i)) {
                        if (!answers[i] || !answers[i].submitted) { if (!answers[i]) answers[i] = { userInput: drafts[idx], submitted: false, hitRate: 0, hitKeywords: [], missedKeywords: [], totalKeywords: 0 }; else if (!answers[i].submitted) answers[i].userInput = drafts[idx]; }
                    }
                });
            }
        }

        function restartQuiz() {
            if (!confirm('确定要重新开始吗？当前进度将被清除。')) return;
            currentIndex = 0; answers = new Array(questions.length).fill(null); reviewMode = false; reviewIndices = [];
            localStorage.removeItem(STORAGE_KEY_ANSWERS); localStorage.removeItem(STORAGE_KEY_DRAFTS);
            currentPage = 'quiz';
            document.getElementById('knowledgePage').classList.add('hidden');
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('questionInfo').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            renderQuestion(); updateNavButtons();
        }

        function showHome() {
            if (confirm('返回主页将丢失当前进度，确定吗？')) {
                currentIndex = 0; answers = new Array(questions.length).fill(null); reviewMode = false; reviewIndices = [];
                localStorage.removeItem(STORAGE_KEY_ANSWERS); localStorage.removeItem(STORAGE_KEY_DRAFTS);
                switchToKnowledgePage(); window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function showToast(message) {
            const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = message;
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 1800);
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
        }
    </script>
</body>
</html>
