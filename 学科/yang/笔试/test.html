    判断题:[

      {q:"C语言不区分大小写。",a:"错误",e:"C语言严格区分大小写，例如变量a和A是两个不同的变量。"},

      {q:"在标准C中，变量可以先使用再定义。",a:"错误",e:"C语言要求变量必须先定义后使用，否则编译时会报错。"},
      {q:"一个算法应该具备有穷性、确定性、输入、输出和有效性。",a:"正确",e:"算法的五大特性：有穷性、确定性、可行性、输入（零个或多个）、输出（至少一个）。"},
      {q:"\"A\"是一个字符常量。",a:"错误",e:"\"A\"用双引号括起来，是字符串常量。'A'用单引号才是字符常量。"},
      {q:"在标准C中，整型变量与字符变量是可以通用的。",a:"正确",e:"char类型本质上存储的是整数（ASCII码值），可以和整型数据相互转换和运算。"},
      {q:"\"%\"运算两侧的数据可以是任意类型的数据。",a:"错误",e:"%（取模）运算符只能用于整型数据，不能用于浮点型数据。"},
      {q:"在求C语言的表达式时，只需考虑运算符的优先级。",a:"错误",e:"求表达式值时，除了优先级，还需要考虑运算符的结合性。"},
      {q:"\"++\"运算符的优先级比\"+\"运算符的优先级低。",a:"错误",e:"++（自增）运算符的优先级高于+（加法）运算符。"},
      {q:"逗号运算符的求值顺序是从左到右的，逗号表达式的值为第一个表达式的值。",a:"错误",e:"逗号表达式从左到右依次求值，但整个表达式的值为最后一个表达式的值。"},
      {q:"C语言程序中的注释会影响程序的执行结果。",a:"错误",e:"注释在编译时被忽略，不影响程序的执行结果。"}

  "基本函数调用": {
    desc:"scanf、printf函数调用", ics: "⌨️",
    选择题:[
      {q:"以下哪个语句用于向屏幕输出信息？",o:["A. input","B. output","C. printf","D. print"],a:"C",e:"printf是C语言标准库中的格式化输出函数，用于向标准输出设备（屏幕）输出信息。"},
      {q:"有如下程序，输入数据：12345M678<CR>后，x的值是（ ）。\n#include<stdio.h>\nmain(){ int x; float y; scanf(\"%3d%f\",&x,&y); }",o:["A. 12345","B. 123","C. 45","D. 345"],a:"B",e:"scanf中的%3d表示读取3位整数赋给x，所以从输入中读取前3位'123'赋给x。"},
      {q:"在printf()中，若使用格式符\"%6.2f\"，则要求对应输出的数据占用的字符位置个数为（ ）。",o:["A. 5","B. 6","C. 4","D. 2"],a:"B",e:"%6.2f中，6表示输出数据占用的最小总宽度为6个字符位置，2表示保留2位小数。"},
      {q:"在printf()中，格式符\"%6.2f\"要求小数部分占用的字符位置个数为（ ）。",o:["A. 5","B. 6","C. 4","D. 2"],a:"D",e:"%6.2f中的.2表示小数部分保留2位，即小数部分占2个字符位置。"},
      {q:"在scanf函数中，输入数据时地址列表中的参数应使用（ ）运算符。",o:["A. *","B. &","C. %","D. #"],a:"B",e:"scanf函数要求传入变量的地址，使用&取地址运算符获取变量的内存地址。"},
      {q:"以下程序的执行结果是（ ）。\n#include<stdio.h>\nmain(){\n  int i=10,j=10;\n  printf(\"%d,%d\\n\",++i,j--);\n}",o:["A. 11,10","B. 9,10","C. 11,9","D. 10,9"],a:"A",e:"++i是先自增再使用，i变为11后输出；j--是先使用再自减，先输出j的值10，然后j变为9。"},
      {q:"已知字母A的ASCII码是65，以下程序的执行结果是（ ）。\n#include<stdio.h>\nmain(){\n  char c1='A',c2='Y';\n  printf(\"%d,%d\\n\",c1,c2);\n}",o:["A. A,Y","B. 65,65","C. 65,90","D. 65,89"],a:"D",e:"用%d格式输出字符型变量时，输出的是其ASCII码值。'A'的ASCII码为65，'Y'的ASCII码为89。"}
    ],
    判断题:[
      {q:"C语言本身并不提供输入输出语句，但可以通过输入输出函数来实现数据的输入输出。",a:"正确",e:"C语言本身没有输入输出语句，输入输出功能通过标准库函数（如scanf、printf）实现。"},
      {q:"在标准C中，使用所有输入输出函数必须包含\"stdio.h\"文件。",a:"正确",e:"stdio.h是标准输入输出头文件，包含scanf、printf等函数的声明。"},
      {q:"在C语言中输入数据时可以指定数据的精度。",a:"错误",e:"scanf函数中输入数据时不能指定精度（如%6.2f是错误的），但printf函数输出时可以指定精度。"},
      {q:"在标准C中，在使用函数scanf输入数据时必须同函数中输入格式一致。",a:"正确",e:"scanf函数要求输入的数据格式必须与格式控制字符串中指定的格式一致。"},
      {q:"在标准C中，以\"%f\"形式输出的所有数字都是有效数字。",a:"错误",e:"浮点数在计算机中的存储精度有限，%f输出的数字不一定全部是有效数字。"}
    ],
    填空题:[
      {q:"C语言的输入输出功能通过调用库【______】实现。",a:"函数",e:"C语言的输入输出不是语言本身的一部分，而是通过调用标准库中的函数来实现的。"},
      {q:"一个#include命令只能指定【______】个被包含文件。",a:"1",e:"每个#include预处理命令只能包含一个头文件。如需包含多个文件，需要多条#include命令。"}
    ]

  "选择控制结构": {
    desc:"if语句、switch语句", ics: "🔀",
    选择题:[
      {q:"当a=1、b=2、c=3、d=4时，执行下面程序段后，x的值是（ ）。\nif(a<b)\n  if(c<d) x=1;\n  else if(a<c)\n    if(b<d) x=2;\n    else x=3;\n  else x=6;\nelse x=7;",o:["A. 3","B. 1","C. 2","D. 6"],a:"B",e:"a<b(1<2)成立，进入第一个if；c<d(3<4)成立，执行x=1。注意else与最近的if配对。"},
      {q:"C语言中用于结构化程序设计的3种基本结构是（ ）。",o:["A. 顺序结构、选择结构、循环结构","B. if、switch、break","C. for、while、do-while","D. if、for、continue"],a:"A",e:"结构化程序设计的三种基本结构是顺序结构、选择结构（分支结构）和循环结构。"},
      {q:"在while(!x)语句中的!x与下面条件表达式等价的是（ ）。",o:["A. x!=0","B. x==1","C. x!=1","D. x==0"],a:"D",e:"!x表示x的逻辑非，当x==0时!x为真(1)，循环执行；当x!=0时!x为假(0)。等价于x==0。"},
      {q:"有以下程序：\n#include <stdio.h>\nvoid main(){\n  int i=1,j=1,k=2;\n  if((j++||k++)&&i++)\n    printf(\"%d,%d,%d\\n\",i,j,k);\n}\n执行后的输出结果是（ ）。",o:["A. 1,1,2","B. 2,2,1","C. 2,2,2","D. 2,2,3"],a:"C",e:"j++值为1(真)，||短路k++不执行，k仍为2。整体为真，输出i=2,j=2,k=2。"},
      {q:"判断char型变量c1是否为小写字母的正确表达式为（ ）。",o:["A. 'a'<=c1<='z'","B. (c1>=a)&&(c1<=z)","C. ('a'>=c1)||('z'<=c1)","D. (c1>='a')&&(c1<='z')"],a:"D",e:"A在C语言中语法错误(不能连续比较)；B中a和z未加引号；C逻辑错误；D正确。"},
      {q:"C语言的switch语句中，case后（ ）。",o:["A. 只能为常量","B. 只能为常量或常量表达式","C. 可为常量及表达式或有确定值的变量及表达式","D. 可为任何量或表达式"],a:"B",e:"switch语句中case后面必须是整型常量或整型常量表达式，不能是变量。"},
      {q:"下列叙述中正确的是（ ）。",o:["A. 在switch语句中，不一定使用break语句","B. 在switch语句中必须使用default","C. break语句必须与switch语句中的case配对使用","D. break语句只能用于switch语句"],a:"A",e:"B: default是可选的；C: break也可用于循环中；D: break还可用于循环。A正确，不使用break时会发生\"穿透\"现象。"},
      {q:"if语句的基本形式是：if(表达式)语句，以下关于\"表达式\"值的叙述中正确的是（ ）。",o:["A. 必须是逻辑值","B. 必须是整数值","C. 必须是正数","D. 可以是任意合法的数值"],a:"D",e:"C语言中if语句的条件表达式可以是任意合法的数值表达式，非零即为真，零为假。"},
      {q:"以下4个选项中，不能看作一条语句的是（ ）。",o:["A. ;","B. a=0,b=0,c=0;","C. if(a>0);","D. if(b==0) m=1;n=2;"],a:"D",e:"D中if(b==0) m=1;n=2;实际包含两条语句：if语句和赋值语句n=2。A是空语句，B是逗号表达式语句，C是if语句。"},
      {q:"有以下程序，switch嵌套，x=1,y=0,a=0,b=0：\nswitch(x){ case 1: switch(y){ case 0: a++; break; case 1: b++; break; } case 2: a++; b++; break; case 3: a++; b++; }\n输出a和b的值是（ ）。",o:["A. a=2,b=2","B. a=2,b=1","C. a=1,b=1","D. a=1,b=0"],a:"B",e:"x=1进入case1，内层switch y=0执行a++(a=1)后break跳出；外层case1没有break，继续执行case2: a++(a=2),b++(b=1)后break。"},
      {q:"以下关于if语句和switch语句的说法正确的是（ ）。",o:["A. if语句和switch语句都可以实现多分支选择结构","B. if语句可以嵌套，switch语句不能嵌套","C. switch语句中不能使用break语句","D. if语句不能实现多分支选择结构"],a:"A",e:"if-else if和switch都可以实现多分支。switch可以嵌套，switch中可以使用break。"},
      {q:"在if语句中，else和（ ）配对。",o:["A. 最近的未配对的if","B. 第一个if","C. 最后一个if","D. 任意if"],a:"A",e:"C语言规定else总是与它前面最近的、尚未配对的if配对。"},
      {q:"有以下程序，输入5时，输出结果是（ ）。\nmain(){ int x; scanf(\"%d\",&x); if(x--<5) printf(\"%d\",x); else printf(\"%d\",x++); }",o:["A. 3","B. 4","C. 5","D. 6"],a:"B",e:"x--<5：先比较5<5? 不成立，然后x自减为4。执行else分支，先输出x的当前值4，然后x自增为5。"},
      {q:"两次运行下面的程序，如果分别输入6和4，则输出结果是（ ）。\nmain(){ int x; scanf(\"%d\",&x); if(x++>5) printf(\"%d\",x); else printf(\"%d\\n\",x--); }",o:["A. 7和5","B. 6和3","C. 7和4","D. 6和4"],a:"A",e:"输入6：6>5成立，x自增为7，输出7。输入4：4>5不成立，x自增为5，执行else，输出5后x自减为4。"},
      {q:"能表示x为偶数的表达式是（ ）。",o:["A. x%2==0","B. x%2==1","C. x%2","D. x%2!=0"],a:"A",e:"当x为偶数时，x%2的结果为0，所以x%2==0为真。B/D表示奇数，C表示奇数时非零为真。"}
    ],
    判断题:[
      {q:"在if语句中，else前一个语句可不加分号。",a:"错误",e:"if-else结构中，if子句的语句末尾必须有分号，但else前不能直接加分号，否则会断开if-else的配对关系。"},
      {q:"在if-else语句中，配对规则是else总是与最近的未配对的if配对。",a:"正确",e:"C语言规定else与它前面最近的、尚未与其他else配对的if配对。"},
      {q:"在switch语句中，case后可不加\"{、}\"。",a:"正确",e:"case后面不需要加大括号，多个语句可以直接跟在case后面，直到遇到break为止。"},
      {q:"在标准C中，所有的if-else语句都可以用条件语句替换。",a:"错误",e:"条件运算符(?:)可以替换简单的if-else，但复杂嵌套的if-else不一定能完全用条件表达式替换。"},
      {q:"在标准C中，没有逻辑型数据，故不能使用逻辑表达式。",a:"错误",e:"C语言虽然没有专门的逻辑类型，但可以使用逻辑表达式，逻辑表达式的结果用整数0和1表示。"}
    ],
    填空题:[
      {q:"比较两个量的运算符称为【______】运算符。",a:"关系",e:"关系运算符用于比较两个量的大小关系，包括>、<、>=、<=、==、!=。"},
      {q:"当a=5,b=4,c=2时，表达式a>b!=c的值是【______】。",a:"1",e:"先计算a>b得1（真），再计算1!=c即1!=2得1（真），所以整个表达式值为1。"},
      {q:"表达式-2<x<3【______】表示条件：x大于-2且小于3。（填\"能\"或\"不能\"）",a:"不能",e:"C语言中不能连续比较。正确写法应为-2<x&&x<3。"}
    ]
  },
  "循环控制结构": {
    desc:"while、do-while、for、break、continue", ics: "🔄",
    选择题:[
      {q:"C语言中的循环类语句有3条，它们是（ ）。",o:["A. for,if,while","B. for,while,do","C. while,do,switch","D. for,break,do"],a:"B",e:"C语言中的三种循环语句是for循环、while循环和do-while循环。"},
      {q:"C语言中的跳转类语句有四条，它们是goto、return和（ ）。",o:["A. break,const","B. static,continue","C. break,continue","D. while,extern"],a:"C",e:"C语言中四条跳转语句是goto、return、break和continue。"},
      {q:"下面有关for循环的正确描述是（ ）。",o:["A. for循环只能用于循环次数已经确定的情况","B. for循环是先执行循环体语句，后判定表达式","C. 在for循环中，不能用break语句跳出循环体","D. for循环体语句中，可以包含多条语句，但要用花括号括起来"],a:"D",e:"A: for也可用于次数不确定的情况；B: for先判断后执行；C: for中可以使用break。D正确。"},
      {q:"下面程序的运行结果是（ ）。\n#include<stdio.h>\nmain(){ int num=0; while(num<=2){ num++; printf(\"%d\",num); } }",o:["A. 1","B. 12","C. 123","D. 1234"],a:"C",e:"num初值0。第1次：num++为1输出1；第2次：num++为2输出2；第3次：num++为3输出3；第4次：num<=2不成立退出。输出123。"},
      {q:"以下描述正确的是（ ）。",o:["A. 由于do-while循环中循环体语句只能是一条可执行语句，所以循环体内不能使用复合语句","B. do-while循环由do开始，用while结束，在while(表达式)后面不能写分号","C. 在do-while循环体中，一定要有能使while后面表达式的值变成零（\"假\"）的操作","D. do-while循环中，根据情况可以省略while"],a:"C",e:"A: do-while可以使用复合语句；B: while(表达式)后面必须有分号；D: while不能省略。C正确。"},
      {q:"有以下程序：\n#include <stdio.h>\nvoid main(){\n  int i,s=0;\n  for(i=1;i<10;i+=2)\n    s+=i+1;\n  printf(\"%d\\n\",s);\n}\n程序执行后的输出结果是（ ）。",o:["A. 自然数1~9的累加和","B. 自然数1~10的累加和","C. 自然数1~9中奇数之和","D. 自然数1~10中偶数之和"],a:"D",e:"i依次取1,3,5,7,9。s=0+(1+1)+(3+1)+(5+1)+(7+1)+(9+1)=2+4+6+8+10=30，即1~10中偶数之和。"},
      {q:"在标准C中，while和do-while的功能（ ）。",o:["A. 完全相同","B. 不相同，do-while至少执行一次循环体","C. 不相同，while至少执行一次循环体","D. 完全相同，只是语法不同"],a:"B",e:"while先判断后执行，可能一次都不执行；do-while先执行后判断，至少执行一次循环体。"},
      {q:"for循环的循环体（ ）。",o:["A. 至少会执行一次","B. 可能一次也不执行","C. 一定会执行指定次数","D. 执行次数由循环变量决定"],a:"B",e:"for循环先判断条件再执行循环体，如果初始条件不满足，循环体可能一次都不执行。"},
      {q:"在while循环中，break语句的作用是（ ）。",o:["A. 结束本次循环，继续下一次循环","B. 跳出当前循环","C. 结束程序运行","D. 跳转到循环开始处"],a:"B",e:"break语句用于立即终止当前循环（跳出循环体）。continue是结束本次循环继续下一次。"},
      {q:"在while循环中，continue语句的作用是（ ）。",o:["A. 结束本次循环，进行下一次循环条件判断","B. 跳出当前循环","C. 结束程序运行","D. 无条件继续执行"],a:"A",e:"continue语句用于跳过循环体中continue之后的语句，直接进入下一次循环的条件判断。"},
      {q:"有以下程序段，当产生的随机数n为0时，程序会（ ）。\nint i,n; for(i=0;i<8;i++){ n=rand()%5; switch(n){ case 1: case 3: printf(...); break; case 2: case 4: printf(...); continue; case 0: exit(0); } }",o:["A. 继续下一次循环","B. 跳出switch继续循环","C. 结束程序运行","D. 输出0并继续"],a:"C",e:"n为0时进入case 0，执行exit(0)直接终止整个程序的运行，不会继续循环。"},
      {q:"以下关于循环结构的叙述中，正确的是（ ）。",o:["A. while循环先执行循环体，后判断条件","B. do-while循环先执行循环体，后判断条件","C. for循环的初始化部分可以省略但分号不能省略","D. 可以在循环中使用break跳出循环"],a:"B",e:"A: while先判断后执行；B正确；C也正确；D也正确。B是最佳单选答案。"}
    ],
    判断题:[
      {q:"在标准C中，while和do-while的功能完全相同。",a:"错误",e:"while先判断后执行，可能一次都不执行；do-while先执行后判断，至少执行一次。"},
      {q:"在标准C中，while后表达式只能是逻辑或关系表达式。",a:"错误",e:"while后的表达式可以是任意合法的表达式，包括算术表达式、赋值表达式等，非零即为真，零为假。"},
      {q:"for循环的循环体至少会执行一次。",a:"错误",e:"for循环先判断条件，如果初始条件不满足，循环体可能一次都不执行。"},
      {q:"可以用break语句跳出循环。",a:"正确",e:"break语句可以用于switch语句和循环语句中，用于跳出当前循环或switch结构。"}
    ],
    填空题:[
      {q:"C语言中，循环语句包括for、while和【______】三种。",a:"do-while",e:"C语言提供了三种循环语句：for循环、while循环和do-while循环。"},
      {q:"【______】语句用于结束本次循环，进入下一次循环条件判断。",a:"continue",e:"continue语句跳过循环体中剩余语句，直接进入下一次循环的条件判断。"},
      {q:"语句while(!e);中的条件!e等价于e【______】0。（填\"==\"或\"!=\"）",a:"==",e:"!e表示e的逻辑非。当e==0时!e为真(1)，循环执行；当e!=0时!e为假(0)。所以!e等价于e==0。"}
    ]
  }
};

// ==================== APP STATE ====================
var S = {
  screen: 'home',
  cats: [],
  type: 'all',
  qs: [],
  idx: 0,
  ans: {},
  done: {},
  res: {},
  wrong: new Set(),
  seed: Date.now()
};

function load() {
  try {
    var s = JSON.parse(localStorage.getItem('cquiz'));
    if (s) { if (s.cats) S.cats = s.cats; if (s.type) S.type = s.type; if (s.wrong) S.wrong = new Set(s.wrong); }
  } catch(e) {}
}
function save() {
  try { localStorage.setItem('cquiz', JSON.stringify({cats:S.cats,type:S.type,wrong:Array.from(S.wrong)})); } catch(e) {}
}

function shuf(arr, seed) {
  var a = arr.slice(), s = seed || Date.now();
  for (var i = a.length-1; i > 0; i--) { s = (s*1103515245+12345)&0x7fffffff; var j = s%(i+1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'info') + ' show';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.className = 'toast'; }, 1800);
}
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function swScreen(n) {
  S.screen = n;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('screen' + n.charAt(0).toUpperCase() + n.slice(1)).classList.add('active');
  document.getElementById('btnAnswerCard').style.display = (n === 'quiz') ? '' : 'none';
  document.getElementById('btnHome').style.display = (n === 'quiz' || n === 'result') ? '' : 'none';
  document.getElementById('headerTitle').textContent = n === 'home' ? 'C语言期末刷题' : (n === 'quiz' ? '刷题中' : '答题结果');
}

function buildQs() {
  var qs = [];
  var cats = S.cats.length ? S.cats : Object.keys(Q);
  cats.forEach(function(cat) {
    var d = Q[cat]; if (!d) return;
    ['选择题','判断题','填空题'].forEach(function(t) {
      if (S.type !== 'all' && S.type !== t) return;
      (d[t]||[]).forEach(function(item) {
        qs.push({cat:cat,type:t,q:item.q,o:item.o||null,a:item.a,e:item.e});
      });
    });
  });
  S.qs = shuf(qs, S.seed);
  S.idx = 0; S.ans = {}; S.done = {}; S.res = {};
}

function renderHome() {
  var grid = document.getElementById('catGrid'); grid.innerHTML = '';
  Object.keys(Q).forEach(function(cat) {
    var d = Q[cat];
    var total = (d['选择题']||[]).length + (d['判断题']||[]).length + (d['填空题']||[]).length;
    var div = document.createElement('div');
    div.className = 'cat-item' + (S.cats.indexOf(cat) >= 0 ? ' selected' : '');
    div.innerHTML = '<div class="cat-icon">' + d.ics + '</div><div class="cat-name">' + cat + '</div><div class="cat-count">' + total + ' 题</div>';
    div.onclick = function() {
      var idx = S.cats.indexOf(cat);
      if (idx >= 0) S.cats.splice(idx, 1); else S.cats.push(cat);
      save(); renderHome();
    };
    grid.appendChild(div);
  });
  document.querySelectorAll('#typeRow .type-chip').forEach(function(chip) {
    chip.className = 'type-chip' + (chip.dataset.type === S.type ? ' selected' : '');
    chip.onclick = function() { S.type = this.dataset.type; save(); renderHome(); };
  });
  updateStats();
}

function updateStats() {
  buildQs();
  document.getElementById('statTotal').textContent = S.qs.length;
  document.getElementById('statWrong').textContent = S.wrong.size;
  var done = 0;
  try { var p = JSON.parse(localStorage.getItem('cquiz_prog')); if (p && p.done) done = p.done; } catch(e) {}
  document.getElementById('statDone').textContent = done;
}

function renderQuiz() {
  var c = document.getElementById('quizContainer');
  var q = S.qs[S.idx];
  if (!q) { showResult(); return; }
  var total = S.qs.length, i = S.idx;
  var answered = S.done[i], userAns = S.ans[i], result = S.res[i];
  var tbc = q.type === '选择题' ? 'choice' : (q.type === '判断题' ? 'judge' : 'fill');

  var h = '<div class="quiz-top"><div class="quiz-progress"><span class="current">' + (i+1) + '</span> / ' + total + '</div>';
  h += '<span class="quiz-type-badge ' + tbc + '">' + q.type + '</span></div>';
  h += '<div class="question-card"><div class="question-num">' + q.cat + ' · 第' + (i+1) + '题</div>';
  h += '<div class="question-text">' + esc(q.q).replace(/【______】/g,'<code>______</code>') + '</div>';

  if (q.type === '选择题') {
    h += '<div class="options">';
    q.o.forEach(function(opt) {
      var label = opt.substring(0, opt.indexOf('.') >= 0 ? opt.indexOf('.') : 2);
      var text = opt.substring(opt.indexOf('.') >= 0 ? opt.indexOf('.')+1 : 2).trim();
      var cls = 'option';
      if (answered) { cls += ' disabled'; if (label === q.a) cls += ' correct'; if (userAns === label && label !== q.a) cls += ' wrong'; }
      else if (userAns === label) cls += ' selected';
      h += '<div class="' + cls + '" data-opt="' + label + '"><span class="opt-label">' + label + '</span><span>' + text + '</span></div>';
    });
    h += '</div>';
  } else if (q.type === '判断题') {
    h += '<div class="judge-options">';
    ['正确','错误'].forEach(function(ans) {
      var cls = 'judge-btn';
      if (answered) { cls += ' disabled'; if (ans === q.a) cls += ' correct'; else if (userAns === ans && ans !== q.a) cls += ' wrong'; }
      else if (userAns === ans) cls += ' selected';
      h += '<div class="' + cls + '" data-opt="' + ans + '">' + (ans === '正确' ? '✓ ' : '✗ ') + ans + '</div>';
    });
    h += '</div>';
  } else {
    var icls = 'fill-input';
    if (answered) { icls += ' disabled'; icls += result === 'correct' ? ' correct' : ' wrong'; }
    h += '<input type="text" class="' + icls + '" id="fi" placeholder="请输入答案" value="' + (userAns||'') + '" ' + (answered?'disabled':'') + ' autocomplete="off">';
    if (!answered) h += '<button class="fill-submit" id="fs">提交答案</button>';
  }

  h += '<div class="explanation' + (answered ? ' show' : '') + '">';
  h += '<div class="exp-title">正确答案：<span class="exp-answer">' + esc(q.a) + '</span></div>';
  h += '<div class="exp-text">' + esc(q.e) + '</div>';
  h += '</div></div>';

  h += '<div class="quiz-nav">';
  h += '<button class="nav-btn" id="btnPrev"' + (i===0?' disabled':'') + '>上一题</button>';
  h += (i < total-1) ? '<button class="nav-btn primary" id="btnNext">下一题</button>' : '<button class="nav-btn primary" id="btnFinish">完成答题</button>';
  h += '</div>';
  c.innerHTML = h;

  if (!answered) {
    if (q.type === '选择题') {
      c.querySelectorAll('.option').forEach(function(o) { o.onclick = function() { submit(this.dataset.opt); }; });
    } else if (q.type === '判断题') {
      c.querySelectorAll('.judge-btn').forEach(function(b) { b.onclick = function() { submit(this.dataset.opt); }; });
    } else {
      var sb = document.getElementById('fs'); if (sb) sb.onclick = function() { var v = document.getElementById('fi').value.trim(); if (!v) { toast('请输入答案','info'); return; } submit(v); };
    }
  }
  document.getElementById('btnPrev').onclick = function() { if (S.idx > 0) { S.idx--; renderQuiz(); document.getElementById('quizContainer').scrollIntoView({behavior:'smooth',block:'start'}); } };
  var nb = document.getElementById('btnNext'); if (nb) nb.onclick = function() { if (S.idx < total-1) { S.idx++; renderQuiz(); document.getElementById('quizContainer').scrollIntoView({behavior:'smooth',block:'start'}); } };
  var fb = document.getElementById('btnFinish'); if (fb) fb.onclick = showResult;
}

function submit(u) {
  var i = S.idx, q = S.qs[i];
  S.ans[i] = u; S.done[i] = true;
  var ok = false;
  if (q.type === '填空题') { ok = q.a.replace(/\s+/g,'').toLowerCase() === u.replace(/\s+/g,'').toLowerCase(); }
  else { ok = u === q.a; }
  S.res[i] = ok ? 'correct' : 'wrong';
  if (!ok) { S.wrong.add(i); save(); }
  try { var p = JSON.parse(localStorage.getItem('cquiz_prog')) || {}; p.done = (p.done||0)+1; localStorage.setItem('cquiz_prog',JSON.stringify(p)); } catch(e) {}
  renderQuiz(); updateStats();
  setTimeout(function() { var e = document.querySelector('.explanation'); if (e) e.scrollIntoView({behavior:'smooth',block:'center'}); }, 100);
}

function showResult() {
  swScreen('result');
  var total = S.qs.length, correct = 0;
  Object.keys(S.res).forEach(function(k) { if (S.res[k] === 'correct') correct++; });
  var score = Object.keys(S.done).length > 0 ? Math.round(correct/total*100) : 0;
  var h = '<div class="score-circle">' + score + '</div>';
  h += '<div class="score-label">答对 ' + correct + ' / ' + total + ' 题</div>';
  h += '<div class="result-actions">';
  h += '<button class="primary" id="btnRW">重做错题 (' + S.wrong.size + '题)</button>';
  h += '<button id="btnRA">重新刷题</button>';
  h += '<button id="btnBH">返回首页</button></div>';
  document.getElementById('resultContainer').innerHTML = h;
  document.getElementById('btnRW').onclick = function() {
    if (S.wrong.size === 0) { toast('没有错题！','success'); return; }
    var wi = Array.from(S.wrong); S.qs = wi.map(function(i) { return S.qs[i]; });
    S.idx = 0; S.ans = {}; S.done = {}; S.res = {}; S.wrong = new Set(); save();
    swScreen('quiz'); renderQuiz();
  };
  document.getElementById('btnRA').onclick = function() {
    S.seed = Date.now(); buildQs(); S.idx = 0; S.ans = {}; S.done = {}; S.res = {}; save();
    swScreen('quiz'); renderQuiz();
  };
  document.getElementById('btnBH').onclick = function() { swScreen('home'); renderHome(); };
}

function showCard() {
  var ov = document.getElementById('modalAnswerCard'), ct = document.getElementById('modalAnswerCardContent');
  var total = S.qs.length;
  var h = '<h3>答题卡</h3><div class="modal-sub">共 ' + total + ' 题 · 绿=正确 · 红=错误</div><div class="answer-grid">';
  for (var i = 0; i < total; i++) {
    var cls = 'answer-cell';
    if (S.res[i] === 'correct') cls += ' correct'; else if (S.res[i] === 'wrong') cls += ' wrong';
    if (i === S.idx) cls += ' current';
    h += '<div class="' + cls + '" data-idx="' + i + '">' + (i+1) + '</div>';
  }
  h += '</div><button class="modal-close" id="mcClose">关闭</button>';
  ct.innerHTML = h; ov.classList.add('show');
  ct.querySelectorAll('.answer-cell').forEach(function(cell) {
    cell.onclick = function() { S.idx = parseInt(this.dataset.idx); ov.classList.remove('show'); renderQuiz(); };
  });
  document.getElementById('mcClose').onclick = function() { ov.classList.remove('show'); };
}

function showWrong() {
  var ov = document.getElementById('modalWrongBook'), ct = document.getElementById('modalWrongBookContent');
  var wi = Array.from(S.wrong);
  var h = '<h3>错题本</h3><div class="modal-sub">共 ' + wi.length + ' 道错题</div>';
  if (wi.length === 0) {
    h += '<div class="wrong-empty"><div class="empty-icon">🎉</div><div>暂无错题，继续保持！</div></div>';
  } else {
    h += '<div class="wrong-list">';
    wi.forEach(function(i) {
      var q = S.qs[i]; if (!q) return;
      h += '<div class="wrong-item" data-idx="' + i + '"><div class="wq-num">' + q.cat + ' · ' + q.type + '</div>';
      h += '<div class="wq-text">' + esc(q.q).substring(0,80) + (q.q.length>80?'...':'') + '</div>';
      h += '<div class="wq-answer">正确答案：' + esc(q.a) + '</div></div>';
    });
    h += '</div><div class="wrong-actions"><button class="btn-clear" id="btnCW">清空错题本</button><button class="btn-retry" id="btnRWB">重做错题</button></div>';
  }
  h += '<button class="modal-close" id="mwClose">关闭</button>';
  ct.innerHTML = h; ov.classList.add('show');

  ct.querySelectorAll('.wrong-item').forEach(function(item) {
    item.onclick = function() {
      var idx = parseInt(this.dataset.idx);
      var wi2 = Array.from(S.wrong); S.qs = wi2.map(function(i) { return S.qs[i]; });
      S.idx = wi2.indexOf(idx); if (S.idx < 0) S.idx = 0;
      S.ans = {}; S.done = {}; S.res = {};
      ov.classList.remove('show'); swScreen('quiz'); renderQuiz();
    };
  });
  var bc = document.getElementById('btnCW'); if (bc) bc.onclick = function() { S.wrong = new Set(); save(); toast('错题本已清空','success'); showWrong(); };
  var br = document.getElementById('btnRWB'); if (br) br.onclick = function() {
    var wi2 = Array.from(S.wrong); S.qs = wi2.map(function(i) { return S.qs[i]; });
    S.idx = 0; S.ans = {}; S.done = {}; S.res = {}; S.wrong = new Set(); save();
    ov.classList.remove('show'); swScreen('quiz'); renderQuiz();
  };
  document.getElementById('mwClose').onclick = function() { ov.classList.remove('show'); };
}

function init() {
  load(); renderHome();
  document.getElementById('btnStart').onclick = function() {
    if (S.cats.length === 0) S.cats = Object.keys(Q);
    S.seed = Date.now(); buildQs();
    if (S.qs.length === 0) { toast('没有匹配的题目','info'); return; }
    S.idx = 0; S.ans = {}; S.done = {}; S.res = {}; save();
    try { localStorage.setItem('cquiz_prog', JSON.stringify({done:0})); } catch(e) {}
    swScreen('quiz'); renderQuiz();
  };
  document.getElementById('btnAnswerCard').onclick = showCard;
  document.getElementById('btnWrongBook').onclick = showWrong;
  document.getElementById('btnHome').onclick = function() { swScreen('home'); renderHome(); };
  document.querySelectorAll('.modal-overlay').forEach(function(ov) {
    ov.onclick = function(e) { if (e.target === ov) ov.classList.remove('show'); };
  });
  document.addEventListener('keydown', function(e) {
    if (S.screen !== 'quiz') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); if (S.idx < S.qs.length-1) { S.idx++; renderQuiz(); } }
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (S.idx > 0) { S.idx--; renderQuiz(); } }
  });
}
init();
</script>
