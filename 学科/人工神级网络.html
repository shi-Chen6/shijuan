<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人工神经网络刷题练习</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary-color: #4a90e2;
            --primary-light: #e6f7ff;
            --success-color: #52c41a;
            --success-light: #f6ffed;
            --error-color: #f5222d;
            --error-light: #fff2f0;
            --warning-color: #faad14;
            --warning-light: #fffbe6;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --border-color: #e8e8e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.12);
            --font-size-base: 16px;
            --font-size-small: 14px;
            --font-size-large: 18px;
            --radius: 12px;
            --radius-sm: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            transition: font-size 0.3s ease;
        }
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            z-index: 200;
            box-shadow: var(--shadow);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .left-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn,
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:active,
        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
        .question-info {
            text-align: center;
            flex: 1;
        }
        .question-number {
            font-size: 18px;
            font-weight: 600;
        }
        .progress-text {
            font-size: 12px;
            opacity: 0.9;
        }
        .right-section {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 140px;
        }
        .knowledge-page {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .knowledge-page.hidden {
            display: none;
        }
        .knowledge-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .knowledge-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }
        .knowledge-content {
            font-size: var(--font-size-base);
            line-height: 1.8;
            color: var(--text-primary);
        }
        .knowledge-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 18px 0 8px;
            color: var(--primary-color);
            padding-left: 10px;
            border-left: 4px solid var(--primary-color);
        }
        .knowledge-content p {
            margin-bottom: 10px;
        }
        .knowledge-content ul {
            margin: 8px 0 12px 18px;
        }
        .knowledge-content li {
            margin-bottom: 6px;
        }
        .knowledge-content .highlight {
            background: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
        }
        .knowledge-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 4px;
            font-size: 13px;
        }
        .knowledge-table th,
        .knowledge-table td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }
        .knowledge-table th {
            background: #f5f7fb;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .start-quiz-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .start-quiz-btn:active {
            transform: scale(0.98);
        }
        .question-card,
        .analysis-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-type {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-light);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .question-stem {
            font-size: var(--font-size-large);
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .formula {
            background: #fafafa;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            font-family: 'Courier New', monospace;
            text-align: center;
            border-left: 4px solid var(--primary-color);
            overflow-x: auto;
        }
        .question-image {
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            display: block;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 56px;
            position: relative;
        }
        .option-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--radius-sm);
            pointer-events: none;
        }
        .option-item:hover {
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: scale(1.01);
        }
        .option-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
        }
        .option-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
        }
        .option-label {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
            transition: all 0.3s ease;
        }
        .selected .option-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .correct .option-label {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
        .wrong .option-label {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }
        .option-text {
            flex: 1;
            padding-top: 2px;
        }
        .analysis-card {
            padding: 0;
            margin-top: 16px;
            overflow: hidden;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 2000px; }
        }
        .analysis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #fafafa;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .analysis-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-primary);
            flex-wrap: wrap;
        }
        .result-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .result-badge.correct {
            background: var(--success-light);
            color: var(--success-color);
        }
        .result-badge.wrong {
            background: var(--error-light);
            color: var(--error-color);
        }
        .result-badge.partial {
            background: var(--warning-light);
            color: #d48806;
        }
        .toggle-icon {
            transition: transform 0.3s ease;
        }
        .toggle-icon.expanded {
            transform: rotate(180deg);
        }
        .analysis-content {
            padding: 20px;
            font-size: var(--font-size-small);
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .analysis-content p {
            margin-bottom: 10px;
        }
        .analysis-content strong {
            color: var(--text-primary);
            font-size: 15px;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.08);
            z-index: 150;
        }
        .footer.hidden {
            transform: translateY(100%);
        }
        .footer-content {
            max-width: 430px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 80px;
        }
        .nav-btn:active {
            transform: scale(0.98);
        }
        .prev-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .prev-btn:not(:disabled):hover {
            background: #e8e8e8;
        }
        .next-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sheet-overlay,
        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sheet-overlay.show,
        .history-overlay.show {
            display: block;
            opacity: 1;
        }
        .sheet-panel,
        .history-panel {
            position: fixed;
            background: var(--bg-card);
            z-index: 400;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sheet-panel {
            bottom: 0;
            left: 50%;
            right: auto;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            transform: translate(-50%, 100%);
            max-height: 70vh;
            width: min(430px, 100%);
        }
        .sheet-panel.show {
            transform: translate(-50%, 0);
        }
        .history-panel {
            top: 0;
            right: 0;
            bottom: 0;
            width: 85%;
            max-width: 360px;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            transform: translateX(100%);
        }
        .history-panel.show {
            transform: translateX(0);
        }
        .sheet-header,
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-title,
        .history-title {
            font-size: 18px;
            font-weight: 600;
        }
        .close-sheet {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 50%;
            cursor: pointer;
        }
        .sheet-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-btn,
        .clear-history {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .clear-history {
            background: #fff2f0;
            color: var(--error-color);
        }
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }
        .sheet-item {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--border-color);
            background: white;
            font-size: 12px;
        }
        .sheet-item.unanswered {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .sheet-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
            color: var(--success-color);
        }
        .sheet-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
            color: var(--error-color);
        }
        .sheet-item.current {
            border-width: 3px;
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .sheet-number {
            font-size: 16px;
        }
        .sheet-status {
            font-size: 10px;
            margin-top: 2px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            background: #fafafa;
            border-radius: var(--radius-sm);
            padding: 16px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        .history-item:active {
            transform: scale(0.98);
        }
        .history-date {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .history-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-stat {
            text-align: center;
        }
        .history-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .history-label {
            font-size: 11px;
            color: var(--text-light);
        }
        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .history-action-btn {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .review-btn {
            background: var(--primary-color);
            color: white;
        }
        .delete-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .completion-screen {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        .completion-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--success-color), #73d13d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        .completion-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .history-view-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .review-wrong-btn {
            background: linear-gradient(135deg, #f5222d, #ff7875);
            color: white;
        }
        .export-btn {
            background: #fff7e6;
            color: #d48806;
            border: 2px solid #faad14;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        /* 新增题型样式 */
        .text-answer-area {
            margin-top: 16px;
        }
        .text-answer-area textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-base);
            font-family: inherit;
            line-height: 1.7;
            resize: vertical;
            background: #fafbfc;
            transition: all 0.3s ease;
            color: var(--text-primary);
            box-sizing: border-box;
        }
        .text-answer-area textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        .text-answer-area textarea:disabled {
            background: #f5f5f5;
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        .text-answer-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .text-answer-buttons button {
            flex: 1;
            min-width: 70px;
            height: 42px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .btn-draft {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .btn-clear {
            background: #fff2f0;
            color: var(--error-color);
        }
        .text-answer-buttons button:active {
            transform: scale(0.96);
        }
        .tasks-list {
            margin: 16px 0;
            padding: 0;
            list-style: none;
        }
        .tasks-list li {
            background: #fafbfc;
            border-left: 4px solid var(--primary-color);
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .tasks-list li .task-id {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
        }
        .keyword-match-result {
            margin-top: 12px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);

            "answer": 0,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>A. 人脑的结构和功能</strong>。人工神经网络（ANN）的设计灵感直接来源于生物大脑的神经元连接结构和信息处理方式。<br><strong>📚 知识点讲解：</strong>人工神经网络是一种模仿生物大脑神经元连接结构和信息处理方式的计算模型，是深度学习的基础。它通过调整神经元之间的连接权重来学习数据中的规律。<br><strong>💡 解题思路：</strong>选项B、C、D都不准确——ANN模仿的是人脑而非计算机结构，也不是动物行为或人类语言。核心关键词是“模仿生物大脑”。<br><strong>🧠 记忆口诀：</strong>人脑结构是蓝本，人工神经元来模拟，连接权重勤调整，深度学习靠它起。"

            "answer": 1,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>B. 人工神经元</strong>。就像细胞是生物体的基本组成单位一样，人工神经元是人工神经网络的基本组成单位。<br><strong>📚 知识点讲解：</strong>人工神经元包含输入、权重、求和、激活函数和输出五个部分，多个神经元相互连接构成了神经网络。<br><strong>💡 解题思路：</strong>晶体管和芯片是硬件层面的组件，程序是软件指令，它们都不是神经网络的组成单位。只有人工神经元才是神经网络的基本结构单元。<br><strong>🧠 记忆口诀：</strong>神经网络神经元，五大部分组成它——输入权重求和值，激活函数出结果。"

            "answer": 2,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>C. 硬盘</strong>。硬盘是计算机的存储设备，不属于人工神经元的组成部分。<br><strong>📚 知识点讲解：</strong>人工神经元由输入、权重、求和、激活函数和输出五个部分组成。权重表示输入信号的重要程度，激活函数引入非线性因素。<br><strong>💡 解题思路：</strong>A、B、D都是神经元的核心组成部分，而硬盘属于计算机硬件存储设备，与神经元结构无关。<br><strong>🧠 记忆口诀：</strong>输入权重求和值，激活输出五要素，硬盘存储不相干，分清结构和硬件。"

            "stem": "在人工神经网络中，表示输入信号重要程度的参数是（ ）",

            "answer": 1,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>B. 权重</strong>。权重表示每个输入信号对输出结果的影响程度，是神经网络在训练过程中需要不断调整的核心参数。<br><strong>📚 知识点讲解：</strong>权重是神经网络学习的核心参数。训练过程本质上就是不断调整权重的过程，使得网络能够更好地拟合数据。<br><strong>💡 解题思路：</strong>输入值是原始数据，输出值是计算结果，激活函数引入非线性——它们都不表示“重要程度”。只有权重才体现了不同输入的相对重要性。<br><strong>🧠 记忆口诀：</strong>权重决定重要性，训练调整靠它变，输入乘权重再求和，核心参数记心间。"

            "answer": 2,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>C. 激活函数</strong>。如果没有激活函数，神经网络只能处理线性问题，激活函数引入了非线性因素。<br><strong>📚 知识点讲解：</strong>激活函数（如Sigmoid、ReLU、Tanh等）是神经网络中至关重要的组件，它使神经网络能够拟合复杂的非线性函数，处理非线性可分问题。<br><strong>💡 解题思路：</strong>输入层和输出层是结构概念，权重是线性参数。只有激活函数专门负责引入非线性变换。<br><strong>🧠 记忆口诀：</strong>激活函数真奇妙，非线性全靠它，没有它来只能线，复杂问题解不了。"
        }, {

            "difficulty": "基础",
            "stem": "下列不属于神经网络基本层次的是（ ）",
            "options": [{ "label": "A", "text": "输入层" }, { "label": "B", "text": "隐藏层" }, { "label": "C", "text": "输出层" }, { "label": "D", "text": "存储层" }],
            "answer": 3,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>D. 存储层</strong>。神经网络的基本层次包括输入层、隐藏层和输出层，不存在“存储层”这一层次。<br><strong>📚 知识点讲解：</strong>输入层接收原始数据，隐藏层提取和转换特征，输出层产生最终预测结果。这三个层次构成了神经网络的基本架构。<br><strong>💡 解题思路：</strong>A、B、C都是神经网络的标准层次名称。存储层是数据库或计算机存储的概念，与神经网络结构无关。<br><strong>🧠 记忆口诀：</strong>三层架构记清楚——输入接收原始数，隐藏提取转特征，输出预测出结果。"

            "answer": 0,
            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>A. 输入层</strong>。输入层负责接收原始数据，每个神经元对应数据的一个特征。<br><strong>📚 知识点讲解：</strong>输入层是神经网络的第一层，它将原始数据（如图像像素、文本词向量等）传递给后续的隐藏层进行处理。<br><strong>💡 解题思路：</strong>隐藏层负责特征提取和转换，输出层产生预测结果，它们都不直接接收原始数据。<br><strong>🧠 记忆口诀：</strong>输入层在最前，接收数据第一关，一个特征一neuron，传给后面去处理。"

            "answer": 1,

            "analysis": "<strong>🎯 答案解析：</strong>正确答案是<strong>B. 卷积神经网络（CNN）</strong>。CNN具有局部感受野和权值共享的特点，特别适合处理图像数据。<br><strong>📚 知识点讲解：</strong>CNN通过卷积层提取图像的局部特征（边缘、纹理等），池化层降低数据维度，全连接层进行分类。典型应用包括手写数字识别、人脸识别等。<br><strong>💡 解题思路：</strong>感知机太简单无法处理复杂图像，RNN适合序列数据。CNN专为图像设计。<br><strong>🧠 记忆口诀：</strong>CNN看图像，局部感受野共享权重，卷积池化全连接，图像识别它最强。"

                        <div class="analysis-title">📝 答案分析 <span class="result-badge ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓ 回答正确' : '✗ 回答错误'}</span></div>
                        <div class="toggle-icon expanded">▼</div>
                    </div>
                    <div class="analysis-content" style="display: block;">${analysisHtml}</div>
                </div>
            `;
        }

        function buildTextResultCard(actualIdx, q, result) {
            const badgeClass = result.level === 'good' ? 'correct' : (result.level === 'partial' ? 'partial' : 'wrong');
            const badgeText = result.level === 'good' ? '✓ 回答较好' : (result.level === 'partial' ? '△ 部分正确' : '✗ 需加强');
            let html = `
                <div class="analysis-card">
                    <div class="analysis-header" onclick="toggleAnalysis(this)">
                        <div class="analysis-title">📝 作答评估 <span class="result-badge ${badgeClass}">${badgeText}</span></div>
                        <div class="toggle-icon expanded">▼</div>
                    </div>
                    <div class="analysis-content" style="display: block;">
                        <p><strong>📋 你的作答：</strong></p>
                        <div style="background:#fafbfc;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(result.userAnswer || '（空）')}</div>
                        <p><strong>✅ 标准答案：</strong></p>
                        <div style="background:#f6ffed;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(result.referenceAnswer)}</div>
                        <p><strong>🔑 关键词命中：</strong>命中 ${result.hitCount}/${result.totalKeywords} 个（${result.hitRate}%）</p>
                        <div class="score-progress"><div class="score-progress-fill ${result.progressClass}" style="width:${result.hitRate}%;"></div></div>
                        <span class="score-tag ${result.progressClass}">${result.levelLabel}</span>
                        <p style="margin-top:8px;"><strong>命中关键词：</strong>${result.hitKeywords.length > 0 ? result.hitKeywords.map(k => '<span class="keyword-highlight">' + k + '</span>').join('、') : '无'}</p>
                        <p><strong>未命中关键词：</strong>${result.missedKeywords.length > 0 ? result.missedKeywords.map(k => '<span class="keyword-missed">' + k + '</span>').join('、') : '无'}</p>
                        <hr style="border:none;border-top:1px solid #e8e8e8;margin:12px 0;">
                        ${q.analysis}
                    </div>
                </div>
            `;
            return html;
        }

        function buildCompletionScreen(correctCount, accuracy, wrongCount, allDone) {
            let html = `
                <div class="completion-screen">
                    <div class="completion-icon">${accuracy >= 80 ? '🎉' : accuracy >= 60 ? '👍' : '💪'}</div>
                    <h1 class="completion-title">${reviewMode ? '错题回顾完成！' : '刷题完成！'}</h1>
                    <p style="color: var(--text-secondary);">${reviewMode ? '你已经回顾了所有错题' : '太棒了！你已经完成了所有题目'}</p>
                    <div class="stats">
                        <div class="stat-item"><div class="stat-value">${correctCount}/${questions.length}</div><div class="stat-label">答对题数</div></div>
                        <div class="stat-item"><div class="stat-value">${accuracy}%</div><div class="stat-label">正确率</div></div>
                        <div class="stat-item"><div class="stat-value">${wrongCount}</div><div class="stat-label">错题数</div></div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn restart-btn" onclick="restartQuiz()">重新开始</button>
                        <button class="action-btn history-view-btn" onclick="toggleHistory()">查看历史</button>
            `;
            if (wrongCount > 0 && !reviewMode) {
                html += `<button class="action-btn review-wrong-btn" onclick="startReviewWrong()"><i class="fas fa-redo"></i> 回看错题</button>`;
                html += `<button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>`;
            }
            if (reviewMode && wrongCount > 0) {
                html += `<button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题</button>`;

            html += `</div></div>`;

        }

        function selectOption(idx) {
            const actualIdx = getActualIndex();
            if (answers[actualIdx] !== null) return;
            if (!isChoiceType(questions[actualIdx])) return;
            answers[actualIdx] = idx;
            saveAnswers();
            renderQuestion();
            renderAnswerSheet();
            updateNavButtons();
            const isCorrect = idx === questions[actualIdx].answer;
            showToast(isCorrect ? '回答正确！✓' : '回答错误 ✗');
        }

        function submitTextAnswer(actualIdx) {
            if (answers[actualIdx] !== null && typeof answers[actualIdx] === 'string') return;
            const ta = document.getElementById('textAnswerInput');
            if (!ta) return;
            const userAnswer = ta.value.trim();
            if (!userAnswer) {
                showToast('请先输入你的回答');
                return;
            }
            answers[actualIdx] = userAnswer;
            clearDraft(actualIdx);
            saveAnswers();
            renderQuestion();
            renderAnswerSheet();
            updateNavButtons();
            const result = evaluateTextAnswer(actualIdx, questions[actualIdx]);
            const msg = result.level === 'good' ? '回答较好！✓' : (result.level === 'partial' ? '部分正确 △' : '需加强 ✗');
            showToast(msg);
        }

        function saveDraftOnly(actualIdx) {
            const ta = document.getElementById('textAnswerInput');
            if (!ta) return;
            const val = ta.value.trim();
            if (val) {
                saveDraft(actualIdx, val);
                showToast('草稿已保存 ✓');
            } else {
                clearDraft(actualIdx);
                showToast('草稿已清空');
            }
        }

        function clearTextInput(actualIdx) {
            const ta = document.getElementById('textAnswerInput');
            if (ta) ta.value = '';
            clearDraft(actualIdx);
            showToast('输入已清空');
        }

        function evaluateTextAnswer(actualIdx, q) {
            const userAnswer = (answers[actualIdx] && typeof answers[actualIdx] === 'string') ? answers[actualIdx] : '';
            const allKeywords = [];
            let referenceAnswer = '';

            if (q.type === '简答题') {
                if (q.keywords) allKeywords.push(...q.keywords);
                referenceAnswer = q.answer || '';
            } else if (q.type === '综合应用题') {
                if (q.keywords) allKeywords.push(...q.keywords);
                referenceAnswer = q.answer || '';
            }

            const totalKeywords = allKeywords.length;
            const hitKeywords = [];
            const missedKeywords = [];
            const userLower = userAnswer.toLowerCase();

            allKeywords.forEach(kw => {
                if (userLower.includes(kw.toLowerCase())) {
                    hitKeywords.push(kw);
                } else {
                    missedKeywords.push(kw);
                }
            });

            const hitCount = hitKeywords.length;
            const hitRate = totalKeywords > 0 ? Math.round((hitCount / totalKeywords) * 100) : 0;

            let level, levelLabel, progressClass;
            if (q.type === '简答题') {
                if (hitRate >= 60) { level = 'good'; levelLabel = '回答较好'; progressClass = 'excellent'; }
                else if (hitRate >= 30) { level = 'partial'; levelLabel = '部分正确'; progressClass = 'pass'; }
                else { level = 'weak'; levelLabel = '需加强'; progressClass = 'fail'; }
            } else {
                if (hitRate >= 80) { level = 'good'; levelLabel = '优秀'; progressClass = 'excellent'; }
                else if (hitRate >= 60) { level = 'good'; levelLabel = '良好'; progressClass = 'good'; }
                else if (hitRate >= 40) { level = 'partial'; levelLabel = '合格'; progressClass = 'pass'; }
                else { level = 'weak'; levelLabel = '需加强'; progressClass = 'fail'; }
            }

            return {
                userAnswer,
                referenceAnswer,
                totalKeywords,
                hitCount,
                hitRate,
                hitKeywords,
                missedKeywords,
                level,
                levelLabel,
                progressClass
            };
        }

        function getCorrectCount() {
            let count = 0;
            questions.forEach((q, i) => {
                if (answers[i] === null) return;
                if (isChoiceType(q)) {
                    if (answers[i] === q.answer) count++;
                } else if (isTextType(q)) {
                    const result = evaluateTextAnswer(i, q);
                    if (result.level === 'good') count++;
                }
            });
            return count;
        }

        function getWrongCount() {
            let count = 0;
            questions.forEach((q, i) => {
                if (answers[i] === null) return;
                if (isChoiceType(q)) {
                    if (answers[i] !== q.answer) count++;
                } else if (isTextType(q)) {
                    const result = evaluateTextAnswer(i, q);
                    if (result.level === 'weak') count++;
                }
            });
            return count;
        }

        function getWrongIndicesArray() {
            const arr = [];
            questions.forEach((q, i) => {
                if (answers[i] === null) return;
                if (isChoiceType(q)) {
                    if (answers[i] !== q.answer) arr.push(i);
                } else if (isTextType(q)) {
                    const result = evaluateTextAnswer(i, q);
                    if (result.level === 'weak') arr.push(i);
                }
            });
            return arr;
        }

        function checkAllAnsweredInMode() {
            if (reviewMode && wrongIndices.length > 0) {
                return wrongIndices.every(wi => answers[wi] !== null);
            }
            return answers.every(a => a !== null);
        }

        function startReviewWrong() {
            wrongIndices = getWrongIndicesArray();
            if (wrongIndices.length === 0) {
                showToast('没有错题可回顾');
                return;
            }
            reviewMode = true;
            reviewIndex = 0;
            currentPage = 'quiz';
            document.getElementById('knowledgePage').classList.add('hidden');
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('questionInfo').style.display = 'block';
            document.getElementById('pageTitle').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            renderQuestion();
            updateNavButtons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(`进入错题回顾模式，共 ${wrongIndices.length} 题`);
        }

        function exitReviewMode() {
            reviewMode = false;
            wrongIndices = [];
            currentIndex = 0;
            currentPage = 'quiz';
            renderQuestion();
            updateNavButtons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('已退出错题回顾模式');
        }

        function exportWrongCSV() {
            const wrongArr = getWrongIndicesArray();
            if (wrongArr.length === 0) {
                showToast('没有错题可导出');
                return;
            }
            const moduleName = '人工神经网络';
            const dateStr = new Date().toISOString().slice(0, 10);
            const fileName = `错题本_${moduleName}_${dateStr}.csv`;

            const rows = [];
            rows.push(['题型', '题目', '用户答案', '正确答案', '关键词命中率', '结果', '解析']);

            wrongArr.forEach(i => {
                const q = questions[i];
                const qType = getQuestionTypeLabel(q);
                const stem = q.stem.replace(/"/g, '""');
                let userAns = '';
                let correctAns = '';
                let hitRate = '';
                let result = '';

                if (isChoiceType(q)) {
                    userAns = (answers[i] !== null && answers[i] !== undefined) ? (q.options[answers[i]] ? q.options[answers[i]].text : String(answers[i])) : '';
                    correctAns = q.options[q.answer] ? q.options[q.answer].text : String(q.answer);
                    result = answers[i] === q.answer ? '正确' : '错误';
                    hitRate = answers[i] === q.answer ? '100%' : '0%';
                } else if (isTextType(q)) {
                    userAns = (answers[i] && typeof answers[i] === 'string') ? answers[i] : '';
                    correctAns = q.answer || '';
                    const evalResult = evaluateTextAnswer(i, q);
                    hitRate = evalResult.hitRate + '%';
                    result = evalResult.levelLabel;
                }

                const analysisText = q.analysis ? q.analysis.replace(/<[^>]+>/g, '').replace(/"/g, '""') : '';

                rows.push([
                    qType,
                    '"' + stem + '"',
                    '"' + userAns.replace(/"/g, '""') + '"',
                    '"' + correctAns.replace(/"/g, '""') + '"',
                    hitRate,
                    result,
                    '"' + analysisText + '"'
                ]);
            });

            const csvContent = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('错题CSV已导出：' + fileName);
        }

        function toggleAnalysis(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.toggle-icon');
            if (content.style.display === 'none') { content.style.display = 'block'; icon.classList.add('expanded'); }
            else { content.style.display = 'none'; icon.classList.remove('expanded'); }
        }

        function prevQuestion() {
            if (reviewMode && wrongIndices.length > 0) {
                if (reviewIndex > 0) { reviewIndex--; renderQuestion(); updateNavButtons(); }
            } else if (!reviewMode && currentIndex > 0) {
                currentIndex--; renderQuestion(); updateNavButtons();
            }
        }

        function nextQuestion() {
            if (reviewMode && wrongIndices.length > 0) {
                if (reviewIndex < wrongIndices.length - 1) { reviewIndex++; renderQuestion(); updateNavButtons(); }
            } else if (!reviewMode && currentIndex < questions.length - 1) {
                currentIndex++; renderQuestion(); updateNavButtons();
            }
        }

        function updateHeader() {
            if (currentPage !== 'quiz') return;
            const totalInMode = getTotalInMode();
            const currentPos = getCurrentPosition();
            document.getElementById('currentNum').textContent = currentPos;
            const answeredCount = answers.filter(a => a !== null).length;
            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('totalCount').textContent = questions.length;
            document.getElementById('progressFill').style.width = `${(answeredCount / questions.length) * 100}%`;
        }

        function updateNavButtons() {
            const footerContent = document.getElementById('footerContent');
            if (currentPage !== 'quiz') return;
            const totalInMode = getTotalInMode();
            const currentPos = getCurrentPosition();
            const isFirst = currentPos <= 1;
            const isLast = currentPos >= totalInMode;
            const allDone = checkAllAnsweredInMode();

            footerContent.innerHTML = `
                <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> 上一题</button>
                <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()" ${isLast && allDone ? 'disabled' : ''}>下一题 <i class="fas fa-chevron-right"></i></button>
            `;
        }

        function changeFontSize(delta) {
            fontSize = Math.max(14, Math.min(22, fontSize + delta));
            document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`);
            document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`);
            document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`);
            saveSettings();
        }

        function toggleSheet() {
            const overlay = document.getElementById('sheetOverlay');
            const panel = document.getElementById('sheetPanel');
            if (panel.classList.contains('show')) { overlay.classList.remove('show'); panel.classList.remove('show'); }
            else { overlay.classList.add('show'); panel.classList.add('show'); renderAnswerSheet(); }
        }

        function renderAnswerSheet() {
            const grid = document.getElementById('sheetGrid');
            let html = '';
            questions.forEach((q, index) => {
                let statusClass = 'unanswered';
                let statusText = '未答';
                if (answers[index] !== null) {
                    if (isChoiceType(q)) {
                        if (answers[index] === q.answer) { statusClass = 'correct'; statusText = '正确'; }
                        else { statusClass = 'wrong'; statusText = '错误'; }
                    } else if (isTextType(q)) {
                        const result = evaluateTextAnswer(index, q);
                        if (result.level === 'good') { statusClass = 'correct'; statusText = '较好'; }
                        else if (result.level === 'partial') { statusClass = 'correct'; statusText = '部分'; }
                        else { statusClass = 'wrong'; statusText = '加强'; }
                    }
                }
                if (index === getActualIndex() && !reviewMode) { statusClass += ' current'; }
                if (reviewMode && wrongIndices.includes(index) && wrongIndices[reviewIndex] === index) { statusClass += ' current'; }
                if (currentFilter !== 'all') {
                    if (currentFilter === 'unanswered' && answers[index] !== null) return;
                    if (currentFilter === 'correct') {
                        if (answers[index] === null) return;
                        if (isChoiceType(q) && answers[index] !== q.answer) return;
                        if (isTextType(q)) { const r = evaluateTextAnswer(index, q); if (r.level === 'weak') return; }
                    }
                    if (currentFilter === 'wrong') {
                        if (answers[index] === null) return;
                        if (isChoiceType(q) && answers[index] === q.answer) return;
                        if (isTextType(q)) { const r = evaluateTextAnswer(index, q); if (r.level !== 'weak') return; }
                    }
                }
                html += `<div class="sheet-item ${statusClass}" onclick="jumpToQuestion(${index})"><div class="sheet-number">${index + 1}</div><div class="sheet-status">${statusText}</div></div>`;
            });
            grid.innerHTML = html;
        }

        function filterQuestions(filter, e) {
            currentFilter = filter;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (e && e.target) e.target.classList.add('active');
            renderAnswerSheet();
        }

        function jumpToQuestion(index) {
            reviewMode = false;
            wrongIndices = [];
            currentIndex = index;
            renderQuestion();
            updateNavButtons();
            toggleSheet();
        }

        function toggleHistory() {
            const overlay = document.getElementById('historyOverlay');
            const panel = document.getElementById('historyPanel');
            if (panel.classList.contains('show')) { overlay.classList.remove('show'); panel.classList.remove('show'); }
            else { overlay.classList.add('show'); panel.classList.add('show'); renderHistory(); }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = getHistory();
            if (history.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div>暂无历史记录</div><div style="font-size: 12px; margin-top: 8px;">完成一套题后会自动保存记录</div></div>`;
                return;
            }
            let html = '';
            history.forEach((record, index) => {
                const dateStr = new Date(record.timestamp).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                html += `<div class="history-item"><div class="history-date">${dateStr}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${record.correctCount}/${record.totalCount}</div><div class="history-label">答对题数</div></div><div class="history-stat"><div class="history-value">${record.accuracy}%</div><div class="history-label">正确率</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${index})">回顾</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${index})">删除</button></div></div>`;
            });
            list.innerHTML = html;
        }

        function saveToHistory(correctCount, accuracy) {
            const history = getHistory();
            history.unshift({ timestamp: new Date().getTime(), totalCount: questions.length, correctCount: correctCount, accuracy: accuracy, answers: [...answers] });
            if (history.length > 50) history.pop();
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        }

        function getHistory() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_HISTORY);
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.warn('历史记录数据异常，已重置');
                localStorage.removeItem(STORAGE_KEY_HISTORY);
                return [];
            }
        }

        function reviewHistory(index) {
            const history = getHistory();
            if (index >= 0 && index < history.length) {
                answers = [...history[index].answers];
                currentIndex = 0;
                reviewMode = false;
                wrongIndices = [];
                saveAnswers();
                renderQuestion();
                updateNavButtons();
                toggleHistory();
                showToast('已加载历史记录');
            }
        }

        function deleteHistory(index) {
            if (!confirm('确定要删除这条记录吗？')) return;
            const history = getHistory();
            if (index >= 0 && index < history.length) {
                history.splice(index, 1);
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
                renderHistory();
                showToast('记录已删除');
            }
        }

        function clearAllHistory() {
            if (!confirm('确定要清空所有历史记录吗？')) return;
            localStorage.removeItem(STORAGE_KEY_HISTORY);
            renderHistory();
            showToast('历史记录已清空');
        }

        function saveAnswers() {
            localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify({ currentIndex, answers, reviewMode, wrongIndices, reviewIndex }));
        }

        function saveSettings() { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ fontSize })); }

        function loadAllData() {
            try {
                const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS);
                if (savedAnswers) {
                    const data = JSON.parse(savedAnswers);
                    currentIndex = data.currentIndex || 0;
                    answers = data.answers || new Array(questions.length).fill(null);
                    reviewMode = data.reviewMode || false;
                    wrongIndices = data.wrongIndices || [];
                    reviewIndex = data.reviewIndex || 0;
                }
            } catch (e) {
                console.warn('答题进度数据解析失败，已重置');
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                answers = new Array(questions.length).fill(null);
            }
            try {
                const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
                if (savedSettings) {
                    const settings = JSON.parse(savedSettings);
                    fontSize = settings.fontSize || 16;
                    document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`);
                    document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`);
                    document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`);
                }
            } catch (e) {
                console.warn('设置数据解析失败，已重置');
                localStorage.removeItem(STORAGE_KEY_SETTINGS);
            }
        }

        function saveDraft(index, value) {
            const drafts = getDrafts();
            drafts[index] = value;
            localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts));
        }

        function getDraft(index) {
            const drafts = getDrafts();
            return drafts[index] || null;
        }

        function clearDraft(index) {
            const drafts = getDrafts();
            delete drafts[index];
            localStorage.setItem(STORAGE_KEY_DRAFTS, JSON.stringify(drafts));
        }

        function getDrafts() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_DRAFTS);
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                console.warn('草稿数据异常，已重置');
                localStorage.removeItem(STORAGE_KEY_DRAFTS);
                return {};
            }
        }

        function restartQuiz() {
            if (confirm('确定要重新开始吗？当前进度将被清除。')) {
                currentIndex = 0;
                reviewMode = false;
                wrongIndices = [];
                reviewIndex = 0;
                answers = new Array(questions.length).fill(null);
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                localStorage.removeItem(STORAGE_KEY_DRAFTS);
                renderQuestion();
                updateNavButtons();
                renderAnswerSheet();
            }
        }

        function showHome() {
            if (confirm('返回主页将丢失当前进度，确定吗？')) {
                currentIndex = 0;
                reviewMode = false;
                wrongIndices = [];
                reviewIndex = 0;
                answers = new Array(questions.length).fill(null);
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                localStorage.removeItem(STORAGE_KEY_DRAFTS);
                switchToKnowledgePage();
                renderAnswerSheet();
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
