<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深度学习刷题练习</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary-color: #4a90e2; --primary-light: #e6f7ff; --success-color: #52c41a; --success-light: #f6ffed;
            --error-color: #f5222d; --error-light: #fff2f0; --warning-color: #faad14; --warning-light: #fffbe6;
            --text-primary: #333333; --text-secondary: #666666; --text-light: #999999; --bg-main: #f5f7fa;
            --bg-card: #ffffff; --border-color: #e8e8e8; --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.12); --font-size-base: 16px; --font-size-small: 14px;
            --font-size-large: 18px; --radius: 12px; --radius-sm: 8px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-main); color: var(--text-primary); font-size: var(--font-size-base); line-height: 1.6; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); transition: font-size 0.3s ease; }
        .app-container { max-width: 430px; margin: 0 auto; background-color: var(--bg-main); min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        .header { position: sticky; top: 0; background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); z-index: 200; box-shadow: var(--shadow); }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .left-section { display: flex; align-items: center; gap: 12px; }
        .back-btn, .icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); border-radius: 50%; cursor: pointer; transition: all 0.3s ease; }
        .back-btn:active, .icon-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
        .question-info { text-align: center; flex: 1; }
        .question-number { font-size: 18px; font-weight: 600; }
        .progress-text { font-size: 12px; opacity: 0.9; }
        .right-section { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: white; border-radius: 2px; transition: width 0.3s ease; }
        .content-area { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 140px; }
        .knowledge-page { display: block; animation: fadeIn 0.3s ease; }
        .knowledge-page.hidden { display: none; }
        .knowledge-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
        .knowledge-title { font-size: 20px; font-weight: 700; color: var(--primary-color); margin-bottom: 16px; text-align: center; line-height: 1.4; }
        .knowledge-content { font-size: var(--font-size-base); line-height: 1.8; color: var(--text-primary); }
        .knowledge-content h3 { font-size: 16px; font-weight: 700; margin: 18px 0 8px; color: var(--primary-color); padding-left: 10px; border-left: 4px solid var(--primary-color); }
        .knowledge-content p { margin-bottom: 10px; }
        .knowledge-content ul { margin: 8px 0 12px 18px; }
        .knowledge-content li { margin-bottom: 6px; }
        .knowledge-content .highlight { background: var(--primary-light); padding: 2px 6px; border-radius: 4px; margin: 0 2px; }
        .knowledge-table { width: 100%; border-collapse: collapse; margin: 12px 0 4px; font-size: 13px; }
        .knowledge-table th, .knowledge-table td { border: 1px solid var(--border-color); padding: 8px 6px; text-align: center; }
        .knowledge-table th { background: #f5f7fb; font-weight: 700; color: var(--text-secondary); }
        .start-quiz-btn { width: 100%; height: 56px; background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; border: none; border-radius: var(--radius-sm); font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .start-quiz-btn:active { transform: scale(0.98); }
        .question-card, .analysis-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .question-type { display: inline-block; padding: 4px 12px; background: var(--primary-light); color: var(--primary-color); border-radius: 20px; font-size: 12px; font-weight: 500; margin-bottom: 12px; }
        .question-stem { font-size: var(--font-size-large); font-weight: 500; line-height: 1.7; margin-bottom: 16px; color: var(--text-primary); }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .option-item { display: flex; align-items: flex-start; padding: 16px; background: var(--bg-card); border: 2px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.3s ease; min-height: 56px; position: relative; }
        .option-item:hover { border-color: var(--primary-color); }
        .option-item.selected { border-color: var(--primary-color); background: var(--primary-light); transform: scale(1.01); }
        .option-item.correct { border-color: var(--success-color); background: var(--success-light); }
        .option-item.wrong { border-color: var(--error-color); background: var(--error-light); }
        .option-label { width: 28px; height: 28px; min-width: 28px; border: 2px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; margin-right: 12px; transition: all 0.3s ease; }
        .selected .option-label { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .correct .option-label { background: var(--success-color); color: white; border-color: var(--success-color); }
        .wrong .option-label { background: var(--error-color); color: white; border-color: var(--error-color); }
        .option-text { flex: 1; padding-top: 2px; }
        .analysis-card { padding: 0; margin-top: 16px; overflow: hidden; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 2000px; } }
        .analysis-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #fafafa; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .analysis-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-primary); flex-wrap: wrap; }
        .result-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .result-badge.correct { background: var(--success-light); color: var(--success-color); }
        .result-badge.wrong { background: var(--error-light); color: var(--error-color); }
        .result-badge.partial { background: var(--warning-light); color: #d48806; }
        .toggle-icon { transition: transform 0.3s ease; }
        .toggle-icon.expanded { transform: rotate(180deg); }
        .analysis-content { padding: 20px; font-size: var(--font-size-small); color: var(--text-secondary); line-height: 1.8; }
        .analysis-content strong { color: var(--text-primary); font-size: 15px; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -2px 16px rgba(0,0,0,0.08); z-index: 150; }
        .footer-content { max-width: 430px; margin: 0 auto; display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-btn { flex: 1; height: 48px; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 80px; }
        .nav-btn:active { transform: scale(0.98); }
        .prev-btn { background: #f5f5f5; color: var(--text-secondary); }
        .next-btn { background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; }
        .next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .sheet-overlay, .history-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 300; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .sheet-overlay.show, .history-overlay.show { display: block; opacity: 1; }
        .sheet-panel, .history-panel { position: fixed; background: var(--bg-card); z-index: 400; transition: transform 0.3s ease; overflow-y: auto; }
        .sheet-panel { bottom: 0; left: 50%; right: auto; border-radius: 20px 20px 0 0; padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 100%); max-height: 70vh; width: min(430px, 100%); }
        .sheet-panel.show { transform: translate(-50%, 0); }
        .history-panel { top: 0; right: 0; bottom: 0; width: 85%; max-width: 360px; padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); transform: translateX(100%); }
        .history-panel.show { transform: translateX(0); }
        .sheet-header, .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .sheet-title, .history-title { font-size: 18px; font-weight: 600; }
        .close-sheet { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; border-radius: 50%; cursor: pointer; }
        .sheet-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-btn, .clear-history { padding: 6px 12px; border-radius: 20px; font-size: 12px; border: none; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn { background: #f5f5f5; color: var(--text-secondary); }
        .filter-btn.active { background: var(--primary-color); color: white; }
        .clear-history { background: #fff2f0; color: var(--error-color); }
        .sheet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .sheet-item { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; transition: all 0.3s ease; border: 2px solid var(--border-color); background: white; font-size: 12px; }
        .sheet-item.unanswered { border-color: var(--border-color); color: var(--text-secondary); }
        .sheet-item.correct { border-color: var(--success-color); background: var(--success-light); color: var(--success-color); }
        .sheet-item.wrong { border-color: var(--error-color); background: var(--error-light); color: var(--error-color); }
        .sheet-item.current { border-width: 3px; border-color: var(--primary-color); transform: scale(1.05); }
        .sheet-number { font-size: 16px; }
        .sheet-status { font-size: 10px; margin-top: 2px; }
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .history-item { background: #fafafa; border-radius: var(--radius-sm); padding: 16px; border-left: 4px solid var(--primary-color); transition: all 0.3s ease; }
        .history-item:active { transform: scale(0.98); }
        .history-date { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
        .history-stats { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .history-stat { text-align: center; }
        .history-value { font-size: 18px; font-weight: 700; color: var(--primary-color); }
        .history-label { font-size: 11px; color: var(--text-light); }
        .history-actions { display: flex; gap: 8px; margin-top: 12px; }
        .history-action-btn { flex: 1; padding: 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s ease; }
        .review-btn { background: var(--primary-color); color: white; }
        .delete-btn { background: #f5f5f5; color: var(--text-secondary); }
        .completion-screen { text-align: center; padding: 40px 20px; animation: fadeIn 0.5s ease; }
        .completion-icon { width: 80px; height: 80px; background: linear-gradient(135deg, var(--success-color), #73d13d); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 40px; color: white; }
        .completion-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); }
        .stats { display: flex; justify-content: center; gap: 24px; margin: 24px 0; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary-color); }
        .stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
        .action-buttons { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
        .action-btn { flex: 1; height: 48px; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; min-width: 100px; }
        .restart-btn { background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; }
        .history-view-btn { background: #f5f5f5; color: var(--text-secondary); }
        .review-wrong-btn { background: linear-gradient(135deg, #f5222d, #ff7875); color: white; }
        .export-btn { background: #fff7e6; color: #d48806; border: 2px solid #faad14; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 1000; animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.9); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .text-answer-area { margin-top: 16px; }
        .text-answer-area textarea { width: 100%; min-height: 120px; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: var(--radius-sm); font-size: var(--font-size-base); font-family: inherit; line-height: 1.7; resize: vertical; background: #fafbfc; transition: all 0.3s ease; color: var(--text-primary); box-sizing: border-box; }
        .text-answer-area textarea:focus { outline: none; border-color: var(--primary-color); background: var(--bg-card); box-shadow: 0 0 0 3px rgba(74,144,226,0.1); }
        .text-answer-area textarea:disabled { background: #f5f5f5; color: var(--text-secondary); cursor: not-allowed; }
        .text-answer-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .text-answer-buttons button { flex: 1; min-width: 70px; height: 42px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-submit { background: linear-gradient(135deg, var(--primary-color), #6ba8ff); color: white; }
        .btn-draft { background: #f5f5f5; color: var(--text-secondary); }
        .btn-clear { background: #fff2f0; color: var(--error-color); }
        .tasks-list { margin: 16px 0; padding: 0; list-style: none; }
        .tasks-list li { background: #fafbfc; border-left: 4px solid var(--primary-color); padding: 12px 16px; margin-bottom: 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-weight: 500; color: var(--text-primary); line-height: 1.6; }
        .tasks-list li .task-id { display: inline-block; background: var(--primary-color); color: white; width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-size: 12px; font-weight: 700; margin-right: 8px; }
        .keyword-highlight { background: #ffd591; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
        .keyword-missed { background: #ffccc7; padding: 2px 6px; border-radius: 3px; text-decoration: line-through; }
        .score-progress { width: 100%; height: 10px; background: #e8e8e8; border-radius: 5px; margin: 8px 0 4px; overflow: hidden; }
        .score-progress-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
        .score-progress-fill.excellent { background: linear-gradient(90deg, #52c41a, #73d13d); }
        .score-progress-fill.good { background: linear-gradient(90deg, #4a90e2, #6ba8ff); }
        .score-progress-fill.pass { background: linear-gradient(90deg, #faad14, #ffc53d); }
        .score-progress-fill.fail { background: linear-gradient(90deg, #f5222d, #ff7875); }
        .score-tag { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-top: 6px; }
        .score-tag.excellent { background: #f6ffed; color: #237804; border: 1px solid #b7eb8f; }
        .score-tag.good { background: #e6f7ff; color: #096dd9; border: 1px solid #91d5ff; }
        .score-tag.pass { background: #fffbe6; color: #ad6800; border: 1px solid #ffe58f; }
        .score-tag.fail { background: #fff2f0; color: #a8071a; border: 1px solid #ffa39e; }
        .review-mode-banner { background: #fff7e6; border: 1px solid #ffd591; border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: 16px; font-weight: 600; color: #ad6800; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .review-mode-banner .exit-review { margin-left: auto; background: #fff; border: 1px solid #ffd591; padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; color: #ad6800; }
        @media (min-width: 768px) { .app-container { border-radius: 20px; margin: 20px auto; min-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); } .footer { position: static; border-radius: 0 0 20px 20px; } .sheet-panel { border-radius: 20px; bottom: 20px; max-height: 60vh; } }
        @media (max-width: 360px) { .sheet-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; } }
    </style>
</head>

<div class="app-container">
<header class="header"><div class="header-top"><div class="left-section"><div class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i></div><div class="question-info" id="questionInfo"><div class="question-number">第 <span id="currentNum">1</span> 题</div><div class="progress-text"><span id="answeredCount">0</span>/<span id="totalCount">0</span> 已答</div></div><div class="question-info" id="pageTitle" style="display:none;"><div class="question-number">深度学习</div><div class="progress-text">高中信息科技 · 核心考点</div></div></div><div class="right-section"><div class="icon-btn" onclick="toggleSheet()"><i class="fas fa-th-large"></i></div><div class="icon-btn" onclick="toggleHistory()"><i class="fas fa-history"></i></div><div class="icon-btn" onclick="changeFontSize(-1)"><i class="fas fa-font"></i>-</div><div class="icon-btn" onclick="changeFontSize(1)"><i class="fas fa-font"></i>+</div></div></div><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div></header>
<main class="content-area" id="contentArea"><div class="knowledge-page" id="knowledgePage"><div class="knowledge-card"><div class="knowledge-title" id="knowledgeTitle"></div><div class="knowledge-content" id="knowledgeContent"></div></div></div><div id="quizContent" style="display:none;"></div></main>
<footer class="footer"><div class="footer-content" id="footerContent"></div></footer>
<div class="sheet-overlay" id="sheetOverlay" onclick="toggleSheet()"></div><div class="sheet-panel" id="sheetPanel"><div class="sheet-header"><div class="sheet-title">答题卡</div><div class="close-sheet" onclick="toggleSheet()"><i class="fas fa-times"></i></div></div><div class="sheet-filters"><button class="filter-btn active" onclick="filterQuestions('all',event)">全部</button><button class="filter-btn" onclick="filterQuestions('unanswered',event)">未答</button><button class="filter-btn" onclick="filterQuestions('correct',event)">正确</button><button class="filter-btn" onclick="filterQuestions('wrong',event)">错误</button></div><div class="sheet-grid" id="sheetGrid"></div></div>
<div class="history-overlay" id="historyOverlay" onclick="toggleHistory()"></div><div class="history-panel" id="historyPanel"><div class="history-header"><div class="history-title">历史记录</div><button class="clear-history" onclick="clearAllHistory()">清空</button></div><div class="history-list" id="historyList"></div></div>
</div>
<script>
    const questions = [
        {"type":"单选题","difficulty":"基础","stem":"深度学习属于下列哪个技术领域的子集（ ）","options":[{"label":"A","text":"人工智能"},{"label":"B","text":"机器学习"},{"label":"C","text":"神经网络"},{"label":"D","text":"专家系统"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 机器学习</strong>。深度学习是机器学习的一个重要分支，机器学习又是人工智能的主流实现途径。<br><strong>📚 知识点讲解：</strong>正确的层级关系是：人工智能 \u2287 机器学习 \u2287 深度学习。深度学习基于多层神经网络，属于机器学习的子集。<br><strong>💡 解题思路：</strong>A范围太大，C是深度学习的基础技术而非上层分类，D是人工智能的早期技术路线。<br><strong>🧠 记忆口诀：</strong>AI最大ML中间，DL最小最前沿，三层包含关系清，深度学习ML子集。"},
        {"type":"单选题","difficulty":"基础","stem":"深度学习的核心架构是（ ）","options":[{"label":"A","text":"单层感知机"},{"label":"B","text":"多层人工神经网络"},{"label":"C","text":"决策树"},{"label":"D","text":"支持向量机"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 多层人工神经网络</strong>。深度学习以多层人工神经网络为核心架构，通过多层非线性变换自动学习特征。<br><strong>📚 知识点讲解：</strong>单层感知机是神经网络的雏形但非深度学习；决策树和SVM是传统机器学习算法。<br><strong>💡 解题思路：</strong>深度学习的关键就是\u201C深度\u201D\u2014\u2014多层网络结构。<br><strong>🧠 记忆口诀：</strong>深度学习多层网，层层提取特征强，单层不是深度学，决策树SVM传统。"},
        {"type":"单选题","difficulty":"基础","stem":"深度学习与传统机器学习最核心的区别是（ ）","options":[{"label":"A","text":"处理数据量更大"},{"label":"B","text":"自动提取特征"},{"label":"C","text":"计算速度更快"},{"label":"D","text":"应用范围更广"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 自动提取特征</strong>。传统机器学习需要人工设计特征，深度学习能自动从数据中学习分层特征表示。<br><strong>📚 知识点讲解：</strong>这是深度学习最核心的优势\u2014\u2014端到端学习，无需人工特征工程。<br><strong>💡 解题思路：</strong>A、C、D都不是本质区别，有些传统ML也能处理大量数据。<br><strong>🧠 记忆口诀：</strong>传统人工设特征，深度学习自动学，核心区别在特征，端到端无需手工。"},
        {"type":"单选题","difficulty":"基础","stem":"下列不属于深度学习三大核心要素的是（ ）","options":[{"label":"A","text":"数据"},{"label":"B","text":"算法"},{"label":"C","text":"算力"},{"label":"D","text":"人力"}],"answer":3,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>D. 人力</strong>。深度学习的三大核心要素是数据（燃料）、算法（引擎）和算力（加速器），人力不属于核心要素。<br><strong>📚 知识点讲解：</strong>大数据提供训练样本，算法决定模型能力，算力支撑大规模计算。<br><strong>💡 解题思路：</strong>三要素：数据、算法、算力，简称\u201C数算算\u201D。<br><strong>🧠 记忆口诀：</strong>数据燃料算法引擎，算力加速三要素，人力虽重非核心，记住数算算就行。"},
        {"type":"单选题","difficulty":"基础","stem":"卷积神经网络（CNN）最擅长处理的数据类型是（ ）","options":[{"label":"A","text":"文本数据"},{"label":"B","text":"表格数据"},{"label":"C","text":"图像数据"},{"label":"D","text":"时间序列数据"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. 图像数据</strong>。CNN通过卷积核提取空间特征，特别擅长处理图像等网格结构数据。<br><strong>📚 知识点讲解：</strong>CNN具有局部感受野和权值共享特点，在图像识别、目标检测等领域表现优异。<br><strong>💡 解题思路：</strong>CNN\u2192图像，RNN\u2192序列，Transformer\u2192通用。<br><strong>🧠 记忆口诀：</strong>CNN图像RNN序，Transformer通用强，各有所长选对模型，图像识别CNN当。"},
        {"type":"单选题","difficulty":"基础","stem":"适合处理语音、文本等序列数据的深度学习模型是（ ）","options":[{"label":"A","text":"CNN"},{"label":"B","text":"RNN"},{"label":"C","text":"GAN"},{"label":"D","text":"决策树"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. RNN</strong>。循环神经网络具有循环连接结构，能捕捉序列数据中的时间依赖关系。<br><strong>📚 知识点讲解：</strong>RNN通过隐藏状态在时间步之间传递信息，适合语音识别、文本生成等任务。<br><strong>💡 解题思路：</strong>序列数据\u2192RNN，图像\u2192CNN。<br><strong>🧠 记忆口诀：</strong>RNN处理序列强，语音文本时间序，循环结构记前后，机器翻译和生成。"},
        {"type":"单选题","difficulty":"基础","stem":"深度学习模型训练需要大量标注数据的主要原因是（ ）","options":[{"label":"A","text":"提高模型的可解释性"},{"label":"B","text":"让模型自动学习更全面的特征"},{"label":"C","text":"降低计算复杂度"},{"label":"D","text":"减少模型参数数量"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 让模型自动学习更全面的特征</strong>。大量标注数据能让模型学到更丰富、更准确的特征表示。<br><strong>📚 知识点讲解：</strong>数据越多，模型泛化能力越强，能覆盖更多场景。<br><strong>💡 解题思路：</strong>深度学习是数据驱动的，数据质量决定模型上限。<br><strong>🧠 记忆口诀：</strong>数据越多特征全，泛化能力强上强，数据驱动深度学，标注质量是关键。"},
        {"type":"单选题","difficulty":"基础","stem":"下列应用中，没有使用深度学习技术的是（ ）","options":[{"label":"A","text":"手机人脸识别解锁"},{"label":"B","text":"智能语音助手"},{"label":"C","text":"手写数字识别"},{"label":"D","text":"简单计算器"}],"answer":3,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>D. 简单计算器</strong>。计算器基于固定算法规则，不使用深度学习技术。A、B、C都使用了深度学习。<br><strong>📚 知识点讲解：</strong>人脸识别用CNN，语音助手用RNN/Transformer，手写数字识别是CNN经典案例。<br><strong>💡 解题思路：</strong>计算器是规则程序，不需要学习。<br><strong>🧠 记忆口诀：</strong>计算器规则程序，不需学习固定算，人脸语音手写识，深度学习显身手。"},
        {"type":"单选题","difficulty":"基础","stem":"Transformer模型的核心机制是（ ）","options":[{"label":"A","text":"卷积操作"},{"label":"B","text":"池化操作"},{"label":"C","text":"注意力机制"},{"label":"D","text":"循环连接"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C. 注意力机制</strong>。注意力机制是Transformer的核心，让模型关注输入中的重要部分。<br><strong>📚 知识点讲解：</strong>Transformer基于自注意力机制，并行处理能力强，是大语言模型的基础架构。<br><strong>💡 解题思路：</strong>Transformer=注意力机制，CNN=卷积，RNN=循环。<br><strong>🧠 记忆口诀：</strong>Transformer注意力，并行处理效率高，大模型基础架构，GPT BERT都靠它。"},
        {"type":"单选题","difficulty":"基础","stem":"生成对抗网络（GAN）的主要应用是（ ）","options":[{"label":"A","text":"图像分类"},{"label":"B","text":"图像生成"},{"label":"C","text":"语音识别"},{"label":"D","text":"文本翻译"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 图像生成</strong>。GAN通过生成器和判别器对抗训练，可生成逼真的图像、视频等。<br><strong>📚 知识点讲解：</strong>GAN广泛应用于图像生成、风格迁移、数据增强等领域。<br><strong>💡 解题思路：</strong>GAN名字中的\u201C生成\u201D就是其核心功能。<br><strong>🧠 记忆口诀：</strong>GAN生成对抗网络，生成器和判别器，两者对抗共进步，图像生成最擅长。"},
        {"type":"单选题","difficulty":"中档","stem":"下列关于人工智能、机器学习、深度学习关系的说法正确的是（ ）","options":[{"label":"A","text":"人工智能包含机器学习，机器学习包含深度学习"},{"label":"B","text":"机器学习包含人工智能，人工智能包含深度学习"},{"label":"C","text":"深度学习包含机器学习，机器学习包含人工智能"},{"label":"D","text":"三者相互独立，没有包含关系"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A</strong>。正确的层级关系是：人工智能\u2287机器学习\u2287深度学习，是逐层包含的关系。<br><strong>📚 知识点讲解：</strong>AI是总称，ML是主流实现途径，DL是ML中基于神经网络的分支。<br><strong>💡 解题思路：</strong>记住\u201CAI\u2192ML\u2192DL\u201D的包含顺序。<br><strong>🧠 记忆口诀：</strong>AI最大ML居中，DL最内层包含，人工智能是总称，机器学习实现它，深度学习更前沿。"},
        {"type":"单选题","difficulty":"中档","stem":"传统机器学习中需要人工完成的工作，在深度学习中由模型自动完成的是（ ）","options":[{"label":"A","text":"数据采集"},{"label":"B","text":"特征提取"},{"label":"C","text":"模型训练"},{"label":"D","text":"结果评估"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B. 特征提取</strong>。深度学习能自动从原始数据中提取分层特征，无需人工设计特征。<br><strong>📚 知识点讲解：</strong>传统ML需要领域专家设计特征，DL通过多层网络自动学习特征表示。<br><strong>💡 解题思路：</strong>特征工程是传统ML最耗时的步骤，DL自动化了这一过程。<br><strong>🧠 记忆口诀：</strong>传统人工提特征，深度学习自动学，端到端从原始数据，特征工程不再难。"},
        {"type":"单选题","difficulty":"中档","stem":"下列关于深度学习模型的说法错误的是（ ）","options":[{"label":"A","text":"CNN适合处理图像数据，提取空间特征"},{"label":"B","text":"RNN适合处理序列数据，捕捉时间依赖"},{"label":"C","text":"Transformer只能处理文本数据，不能处理图像"},{"label":"D","text":"GAN可以生成逼真的图像和视频"}],"answer":2,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>C</strong>。Transformer不仅可以处理文本，还可以处理图像、语音等多模态数据，如Vision Transformer(ViT)。<br><strong>📚 知识点讲解：</strong>Transformer的注意力机制具有通用性，已扩展到计算机视觉等领域。<br><strong>💡 解题思路：</strong>A、B、D都是正确的。C过于绝对，Transformer是多模态的。<br><strong>🧠 记忆口诀：</strong>Transformer不限于文本，图像语音也能行，多模态处理能力强，并非文本独享。"},
        {"type":"单选题","difficulty":"中档","stem":"深度学习对算力要求高的主要原因是（ ）","options":[{"label":"A","text":"模型参数数量巨大，计算复杂度高"},{"label":"B","text":"需要处理的数据量小"},{"label":"C","text":"模型结构简单，容易训练"},{"label":"D","text":"可解释性差，需要更多计算验证"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>A</strong>。深度学习模型通常包含数百万甚至数十亿个参数，计算复杂度极高。<br><strong>📚 知识点讲解：</strong>大模型如GPT-3有1750亿参数，训练需要大量GPU/TPU资源。<br><strong>💡 解题思路：</strong>参数多\u2192计算量大\u2192需要高算力。<br><strong>🧠 记忆口诀：</strong>模型参数数十亿，计算复杂度极高，GPU TPU齐上阵，算力需求大如天。"},
        {"type":"单选题","difficulty":"中档","stem":"深度学习的\u201C黑箱问题\u201D指的是（ ）","options":[{"label":"A","text":"模型训练过程不可见"},{"label":"B","text":"模型的决策过程难以解释"},{"label":"C","text":"模型只能处理黑色图像"},{"label":"D","text":"模型训练需要在黑暗环境中进行"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>正确答案是<strong>B</strong>。\u201C黑箱问题\u201D指深度学习的决策过程难以解释，人们不清楚模型为什么做出某个判断。<br><strong>📚 知识点讲解：</strong>这是深度学习的主要局限之一，可解释性AI是当前研究热点。<br><strong>💡 解题思路：</strong>A不完全准确，C和D是错误理解。<br><strong>🧠 记忆口诀：</strong>黑箱问题解释难，模型决策看不清，输入输出中间暗，可解释AI在攻关。"},
        {"type":"判断题","difficulty":"基础","stem":"深度学习是机器学习的一个重要分支。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。深度学习是机器学习的一个子领域，基于多层神经网络实现自动特征学习。<br><strong>📚 知识点讲解：</strong>深度学习是机器学习中发展最快的分支之一。<br><strong>💡 解题思路：</strong>符合人工智能技术层级关系。<br><strong>🧠 记忆口诀：</strong>深度学习ML分支，神经网络多层搭，自动特征学习强，AI领域最前沿。"},
        {"type":"判断题","difficulty":"基础","stem":"深度学习需要人工设计特征才能进行学习。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。深度学习的核心优势就是能自动提取特征，无需人工设计。<br><strong>📚 知识点讲解：</strong>传统机器学习才需要人工特征工程。<br><strong>💡 解题思路：</strong>深度学习=自动特征提取。<br><strong>🧠 记忆口诀：</strong>深度学习自动学，不需人工设特征，传统ML才需要，这是两者核心别。"},
        {"type":"判断题","difficulty":"基础","stem":"卷积神经网络是专门用于处理图像的深度学习模型。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。CNN专为处理网格结构数据设计，图像是最典型的应用场景。<br><strong>📚 知识点讲解：</strong>CNN通过卷积核提取局部特征，在计算机视觉领域取得巨大成功。<br><strong>💡 解题思路：</strong>CNN=图像处理专家。<br><strong>🧠 记忆口诀：</strong>CNN图像处理王，卷积核提取特征，人脸识别和检测，计算机视觉称雄。"},
        {"type":"判断题","difficulty":"基础","stem":"深度学习模型训练需要大量的标注数据。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。深度学习是数据驱动的，需要大量标注数据才能训练出效果好的模型。<br><strong>📚 知识点讲解：</strong>数据量不足容易导致过拟合，影响模型泛化能力。<br><strong>💡 解题思路：</strong>数据是深度学习的\u201C燃料\u201D。<br><strong>🧠 记忆口诀：</strong>深度学需要数据，标注质量定效果，数据燃料不可少，越多越全模型好。"},
        {"type":"判断题","difficulty":"基础","stem":"语音识别和机器翻译都使用了深度学习技术。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。语音识别、机器翻译等自然语言处理领域广泛使用了深度学习技术。<br><strong>📚 知识点讲解：</strong>深度学习在NLP领域取得了革命性突破。<br><strong>💡 解题思路：</strong>这是深度学习的典型应用。<br><strong>🧠 记忆口诀：</strong>语音识别机器译，深度学习显威力，RNN Transformer齐上阵，NLP领域革命新。"},
        {"type":"判断题","difficulty":"基础","stem":"深度学习模型的层数越多，识别准确率一定越高。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。层数过多可能导致梯度消失、过拟合等问题，准确率反而下降。<br><strong>📚 知识点讲解：</strong>网络深度需要根据任务复杂度和数据量合理选择。<br><strong>💡 解题思路：</strong>更多层\u2260更好，需要权衡。<br><strong>🧠 记忆口诀：</strong>层多不一定好，梯度消失过拟合，合理选择深度，任务数据定结构。"},
        {"type":"判断题","difficulty":"基础","stem":"GPU比CPU更适合用于深度学习模型训练。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。GPU具有强大的并行计算能力，比CPU更适合深度学习的大规模矩阵运算。<br><strong>📚 知识点讲解：</strong>深度学习训练需要大量矩阵乘法，GPU的并行架构天然适合。<br><strong>💡 解题思路：</strong>GPU=并行计算专家。<br><strong>🧠 记忆口诀：</strong>GPU并行计算强，矩阵乘法它擅长，深度学习训练快，CPU不如GPU。"},
        {"type":"判断题","difficulty":"中档","stem":"传统机器学习比深度学习更适合处理复杂非结构化数据。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。深度学习比传统机器学习更适合处理图像、语音、文本等复杂非结构化数据。<br><strong>📚 知识点讲解：</strong>深度学习能自动从非结构化数据中提取特征，是其主要优势。<br><strong>💡 解题思路：</strong>深度学习\u2192非结构化数据专家。<br><strong>🧠 记忆口诀：</strong>非结构化深度强，图像语音文本通，传统ML需特征，复杂数据深度胜。"},
        {"type":"判断题","difficulty":"中档","stem":"Transformer模型是当前大语言模型的核心基础架构。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":0,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>正确</strong>。GPT、BERT等主流大语言模型都基于Transformer架构。<br><strong>📚 知识点讲解：</strong>Transformer的自注意力机制使其成为大模型的首选架构。<br><strong>💡 解题思路：</strong>大模型=Transformer时代。<br><strong>🧠 记忆口诀：</strong>Transformer大模型基，GPT BERT都靠它，注意力机制核心，大语言模型时代。"},
        {"type":"判断题","difficulty":"中档","stem":"深度学习模型的可解释性比传统机器学习模型更好。","options":[{"label":"A","text":"正确"},{"label":"B","text":"错误"}],"answer":1,"analysis":"<strong>🎯 答案解析：</strong>本题说法<strong>错误</strong>。深度学习模型的可解释性比传统机器学习差，存在\u201C黑箱问题\u201D。<br><strong>📚 知识点讲解：</strong>传统ML如决策树可解释性强，深度网络参数众多难以解释。<br><strong>💡 解题思路：</strong>深度学习\u2192黑箱，传统ML\u2192可解释。<br><strong>🧠 记忆口诀：</strong>深度黑箱解释难，传统ML看得清，决策树逻辑明，深度网络难追溯。"},
        {"type":"简答题","difficulty":"中档","stem":"简述人工智能、机器学习、深度学习三者的层级关系。","answer":"三者是层层包含的关系：人工智能是让机器模拟人类智能的技术总称，范围最广；机器学习是实现人工智能的主流途径，让机器从数据中学习规律；深度学习是机器学习的一个重要分支，基于多层人工神经网络实现自动特征学习，是当前人工智能技术突破的核心。","keywords":["人工智能","机器学习","深度学习","包含","神经网络","特征学习"],"analysis":"<strong>🎯 答案解析：</strong>AI\u2287ML\u2287DL，是逐层包含的关系，范围从大到小，技术从泛到专。<br><strong>📚 知识点讲解：</strong>理解层级关系是掌握深度学习概念的基础。<br><strong>💡 解题思路：</strong>用\u201C包含\u201D关系说明，突出每层的核心特征。<br><strong>🧠 记忆口诀：</strong>AI最大总称，ML实现途径，DL神经网络，三层包含记心间。"},
        {"type":"简答题","difficulty":"中档","stem":"对比说明深度学习与传统机器学习在特征提取方式上的区别。","answer":"传统机器学习：高度依赖人工设计特征，需要领域专家根据任务需求提取关键特征，特征工程的质量直接影响模型效果。深度学习：通过多层神经网络自动完成从低维到高维的特征学习，无需人工干预特征提取过程，能够从原始数据中自动发现隐藏的模式和规律。","keywords":["人工设计","特征工程","自动提取","多层神经网络","端到端"],"analysis":"<strong>🎯 答案解析：</strong>核心区别在于特征提取方式：传统ML人工设计，DL自动学习。<br><strong>📚 知识点讲解：</strong>这是深度学习最重要的优势\u2014\u2014端到端学习。<br><strong>💡 解题思路：</strong>从\u201C谁来做特征工程\u201D的角度对比。<br><strong>🧠 记忆口诀：</strong>传统人工设特征，深度学习自动学，端到端无需手工，特征工程不再难。"},
        {"type":"简答题","difficulty":"提高","stem":"分析深度学习技术快速发展的主要原因。","answer":"深度学习快速发展的主要原因有三个方面：（1）数据爆发式增长：互联网、移动设备、传感器等产生了海量数据，为深度学习模型训练提供了充足的\u201C燃料\u201D；（2）算力大幅提升：GPU、TPU等高性能计算设备的出现，解决了深度学习模型训练计算量大的问题；（3）算法不断创新：卷积神经网络、循环神经网络、Transformer等新算法的提出，不断提升深度学习模型的性能和适用范围。","keywords":["数据","算力","算法","GPU","爆发式增长","创新"],"analysis":"<strong>🎯 答案解析：</strong>三大核心要素（数据、算力、算法）的同步发展推动了深度学习的快速进步。<br><strong>📚 知识点讲解：</strong>三者缺一不可，形成了深度学习发展的\u201C三驾马车\u201D。<br><strong>💡 解题思路：</strong>从数据、算力、算法三个维度分别阐述。<br><strong>🧠 记忆口诀：</strong>数据爆发算力强，算法创新三驾马车，深度学习快发展，三要素齐头并进。"},
        {"type":"综合应用题","difficulty":"提高","stem":"学校要开发一个校园智能门禁系统，计划使用深度学习技术实现人脸识别功能。请回答：（1）该系统适合使用哪种深度学习模型？说明理由。（2）简述该系统识别人脸的完整工作流程。（3）为了提高模型的识别准确率，需要注意哪些问题？","tasks":[{"id":1,"stem":"该系统适合使用哪种深度学习模型？说明理由。","answer":"适合使用卷积神经网络（CNN）。理由：CNN擅长处理图像数据，能够自动提取人脸的面部特征，在人脸识别任务中具有很高的准确率。","keywords":["CNN","卷积神经网络","图像","人脸识别","特征提取"]},{"id":2,"stem":"简述该系统识别人脸的完整工作流程。","answer":"工作流程：①摄像头采集人脸图像；②对图像进行预处理（裁剪、归一化）；③将图像输入CNN模型；④模型提取人脸特征并与数据库中的人脸特征进行比对；⑤输出识别结果，匹配成功则开门，失败则拒绝。","keywords":["采集","预处理","CNN","特征提取","比对","识别"]},{"id":3,"stem":"为了提高模型的识别准确率，需要注意哪些问题？","answer":"注意事项：①收集足够多、不同角度、不同光照条件下的人脸图像作为训练数据；②对图像进行数据增强（旋转、翻转、亮度调整），增加数据多样性；③选择合适的CNN模型架构（如ResNet、FaceNet）；④优化训练参数，避免过拟合。","keywords":["数据量","数据增强","模型架构","过拟合","训练参数"]}],"answer":"（1）选CNN，擅长图像特征提取；（2）采集\u2192预处理\u2192CNN提取\u2192比对\u2192输出；（3）多数据、数据增强、好模型、防过拟合。","keywords":["CNN","人脸识别","预处理","数据增强","过拟合"],"analysis":"<strong>🎯 答案解析：</strong>校园门禁系统适合使用CNN进行人脸识别，需要充分的数据和合理的模型设计。<br><strong>📚 知识点讲解：</strong>人脸识别是CNN的典型应用场景，涉及图像采集、预处理、特征提取、比对等步骤。<br><strong>💡 解题思路：</strong>从模型选择、工作流程、优化措施三方面回答。<br><strong>🧠 记忆口诀：</strong>门禁人脸CNN，采集预处理特征，数据增强防过拟合，模型选择重准确。"},
        {"type":"综合应用题","difficulty":"提高","stem":"某同学想使用深度学习技术实现猫狗图像分类，收集了1000张猫和狗的图片作为训练数据。请回答：（1）该任务适合使用哪种深度学习模型？（2）如果训练后模型的准确率只有70%，可能的原因有哪些？（3）可以采取哪些措施来提高模型的准确率？","tasks":[{"id":1,"stem":"该任务适合使用哪种深度学习模型？","answer":"适合使用卷积神经网络（CNN）。猫狗分类是典型的图像分类任务，CNN能够自动提取猫和狗的图像特征进行分类。","keywords":["CNN","图像分类","猫狗","特征提取"]},{"id":2,"stem":"准确率只有70%可能的原因有哪些？","answer":"可能原因：①训练数据量不足（1000张偏少）；②数据质量不高（模糊、标注错误）；③模型结构过于简单；④训练参数设置不合理（学习率过高/过低、训练轮数不足）；⑤没有进行数据增强，泛化能力差。","keywords":["数据量","数据质量","模型结构","学习率","数据增强"]},{"id":3,"stem":"可以采取哪些措施来提高模型的准确率？","answer":"措施：①收集更多猫狗图片扩充数据集；②清洗数据去除模糊、标注错误的图片；③使用更复杂的CNN模型（如VGG、ResNet）；④调整训练参数（降低学习率、增加训练轮数）；⑤进行数据增强（旋转、翻转、裁剪）；⑥使用预训练模型进行迁移学习。","keywords":["扩充数据","清洗","复杂模型","参数调整","数据增强","迁移学习"]}],"answer":"（1）选CNN；（2）数据少、质量差、模型简单、参数不当、无增强；（3）扩数据、清洗、复杂模型、调参、数据增强、迁移学习。","keywords":["CNN","数据量","数据增强","迁移学习","过拟合"],"analysis":"<strong>🎯 答案解析：</strong>猫狗分类是CNN的入门任务，准确率低通常与数据量和质量有关，可通过多种手段优化。<br><strong>📚 知识点讲解：</strong>数据增强和迁移学习是提高小数据集模型效果的有效方法。<br><strong>💡 解题思路：</strong>从数据、模型、训练三个维度分析原因并提出对策。<br><strong>🧠 记忆口诀：</strong>猫狗分类CNN，数据少质量差导致低，增数据增强迁移学，复杂模型调参数。"}

    const APP_ID = 'deep_learning_quiz_1';
    const STORAGE_KEY_ANSWERS = APP_ID + '_answers';

    let currentIndex = 0, currentPage = 'learn', answers = new Array(questions.length).fill(null), fontSize = 16, currentFilter = 'all', reviewMode = false, wrongIndices = [], reviewIndex = 0;
    function renderKnowledgePage(){document.getElementById('knowledgeTitle').textContent='深度学习（高中信息科技）';document.getElementById('knowledgeContent').innerHTML=`<h3>\uD83D\uDCD6 核心定义</h3><p>深度学习是<strong>机器学习的一个重要分支</strong>，以<strong>多层人工神经网络</strong>为核心架构，通过模拟人类大脑的信息处理机制，从海量数据中自动学习分层特征表示，无需人工设计特征，是当前人工智能技术突破的核心驱动力。</p><h3>\uD83D\uDD0D 核心要点拆解</h3><p><strong>1. 技术层级关系</strong>：人工智能 \u2287 机器学习 \u2287 深度学习 \u2287 神经网络</p><p><strong>2. 核心思想：自动分层特征提取</strong></p><ul><li>第一层：低级特征（边缘、线条）</li><li>第二层：中级特征（纹理、形状）</li><li>第三层及以上：高级特征（器官、物体）</li></ul><p><strong>3. 三大核心要素</strong>：数据（燃料）、算法（引擎）、算力（加速器）</p><p><strong>4. 主流模型及适用场景</strong></p><table class="knowledge-table"><tr><th>模型</th><th>特点</th><th>应用</th></tr><tr><td>CNN</td><td>提取空间特征</td><td>图像识别、人脸识别</td></tr><tr><td>RNN</td><td>捕捉时间依赖</td><td>语音识别、文本生成</td></tr><tr><td>Transformer</td><td>注意力机制</td><td>大语言模型、机器翻译</td></tr><tr><td>GAN</td><td>对抗训练</td><td>图像生成、风格迁移</td></tr></table><p><strong>5. 典型应用</strong>：计算机视觉、自然语言处理、推荐系统、工业制造</p><h3>\u26A0\uFE0F 易错点</h3><ul><li>\u274C 混淆AI/ML/DL层级关系</li><li>\u274C 认为深度学习需要人工设计特征</li><li>\u274C 将CNN用于文本、RNN用于图像</li><li>\u274C 认为深度学习无所不能</li></ul>`;}
    function switchToKnowledgePage(){currentPage='learn';reviewMode=false;document.getElementById('knowledgePage').classList.remove('hidden');document.getElementById('quizContent').style.display='none';document.getElementById('questionInfo').style.display='none';document.getElementById('pageTitle').style.display='block';document.querySelector('.progress-bar').style.display='none';document.getElementById('footerContent').innerHTML=`<button class="start-quiz-btn" onclick="startQuiz()"><i class="fas fa-play-circle"></i> \u6211\u5DF2\u5B66\u5B8C\uFF0C\u5F00\u59CB\u5237\u9898</button>`;}
    function startQuiz(){currentPage='quiz';reviewMode=false;wrongIndices=[];document.getElementById('knowledgePage').classList.add('hidden');document.getElementById('quizContent').style.display='block';document.getElementById('questionInfo').style.display='block';document.getElementById('pageTitle').style.display='none';document.querySelector('.progress-bar').style.display='block';currentIndex=0;renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});}
    function getQuestionTypeLabel(q){return{'单选题':'单选题','判断题':'判断题','简答题':'简答题','综合应用题':'综合应用题'}[q.type]||q.type;}
    function isChoiceType(q){return q.type==='单选题'||q.type==='判断题';}
    function isTextType(q){return q.type==='简答题'||q.type==='综合应用题';}
    function getActualIndex(){return reviewMode&&wrongIndices.length?wrongIndices[reviewIndex]:currentIndex;}
    function getTotalInMode(){return reviewMode&&wrongIndices.length?wrongIndices.length:questions.length;}
    function getCurrentPosition(){return reviewMode&&wrongIndices.length?reviewIndex+1:currentIndex+1;}
    function renderQuestion(){const ai=getActualIndex(),q=questions[ai],area=document.getElementById('quizContent');const tim=getTotalInMode(),cp=getCurrentPosition();let h='';if(reviewMode)h+=`<div class="review-mode-banner">\uD83D\uDD01 \u9519\u9898\u56DE\u987E\u6A21\u5F0F \u2014 \u7B2C ${cp}/${tim} \u9898 <span class="exit-review" onclick="exitReviewMode()">\u9000\u51FA\u56DE\u987E</span></div>`;h+=`<div class="question-card"><span class="question-type">${getQuestionTypeLabel(q)}${q.difficulty?' · '+q.difficulty:''}</span><div class="question-stem">${q.stem}</div>`;if(q.image)h+=`<img src="${q.image}" class="question-image">`;if(isChoiceType(q)){h+=`<div class="options-container">`;q.options.forEach((o,i)=>{const sel=answers[ai]===i,cor=q.answer===i;let cls=['option-item'];if(answers[ai]!==null){if(sel&&cor)cls.push('correct');else if(sel&&!cor)cls.push('wrong');else if(cor)cls.push('correct');}else if(sel)cls.push('selected');h+=`<div class="${cls.join(' ')}" onclick="selectOption(${i})"><div class="option-label">${o.label}</div><div class="option-text">${o.text}</div></div>`;});h+=`</div>`;}else if(q.type==='简答题'){h+=renderTextAnswerArea(ai,q);}else if(q.type==='综合应用题'){h+=renderComprehensiveArea(ai,q);}h+=`</div>`;if(answers[ai]!==null){if(isChoiceType(q)){const cor=answers[ai]===q.answer;h+=`<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">\uD83D\uDCDD \u7B54\u6848\u5206\u6790 <span class="result-badge ${cor?'correct':'wrong'}">${cor?'\u2713 \u56DE\u7B54\u6B63\u786E':'\u2717 \u56DE\u7B54\u9519\u8BEF'}</span></div><div class="toggle-icon expanded">\u25BC</div></div><div class="analysis-content" style="display:block;">${q.analysis}</div></div>`;}else if(isTextType(q)){const res=evaluateTextAnswer(ai,q);h+=buildTextResultCard(ai,q,res);}}const done=checkAllAnsweredInMode();if((reviewMode&&reviewIndex>=wrongIndices.length-1&&done)||(!reviewMode&&currentIndex===questions.length-1&&answers.every(a=>a!==null))){const cc=getCorrectCount(),ac=Math.round(cc/questions.length*100),wc=getWrongCount();if(!reviewMode)saveToHistory(cc,ac);h+=buildCompletionScreen(cc,ac,wc);}area.innerHTML=h;updateHeader();setTimeout(()=>{if(isTextType(q)){const ta=document.getElementById('textAnswerInput');if(ta&&answers[ai]!==null&&typeof answers[ai]==='string')ta.value=answers[ai];const dr=getDraft(ai);if(ta&&answers[ai]===null&&dr)ta.value=dr;}},50);if(window.MathJax)MathJax.typeset();}
    function renderTextAnswerArea(ai,q){const saved=answers[ai],draft=getDraft(ai);const dv=(saved!==null&&typeof saved==='string')?saved:(draft||'');const dis=saved!==null&&typeof saved==='string';let h=`<div class="text-answer-area"><textarea id="textAnswerInput" placeholder="\u8BF7\u5728\u6B64\u8F93\u5165\u4F60\u7684\u56DE\u7B54..." ${dis?'disabled':''}>${escapeHtml(dv)}</textarea><div class="text-answer-buttons">`;if(!dis)h+=`<button class="btn-draft" onclick="saveDraftOnly(${ai})"><i class="fas fa-save"></i> \u4FDD\u5B58\u8349\u7A3F</button><button class="btn-clear" onclick="clearTextInput(${ai})"><i class="fas fa-eraser"></i> \u6E05\u7A7A\u8F93\u5165</button><button class="btn-submit" onclick="submitTextAnswer(${ai})"><i class="fas fa-check-circle"></i> \u63D0\u4EA4\u4F5C\u7B54</button>`;else h+=`<button class="btn-submit" disabled style="opacity:0.6;"><i class="fas fa-check-circle"></i> \u5DF2\u63D0\u4EA4</button>`;return h+`</div></div>`;}
    function renderComprehensiveArea(ai,q){let h='';if(q.tasks&&q.tasks.length){h+=`<ul class="tasks-list">`;q.tasks.forEach(t=>h+=`<li><span class="task-id">${t.id}</span> ${t.stem}</li>`);h+=`</ul>`;}return h+renderTextAnswerArea(ai,q);}
    function buildTextResultCard(ai,q,res){const bc=res.level==='good'?'correct':(res.level==='partial'?'partial':'wrong');const bt=res.level==='good'?'\u2713 \u56DE\u7B54\u8F83\u597D':(res.level==='partial'?'\u25B3 \u90E8\u5206\u6B63\u786E':'\u2717 \u9700\u52A0\u5F3A');return `<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">\uD83D\uDCDD \u4F5C\u7B54\u8BC4\u4F30 <span class="result-badge ${bc}">${bt}</span></div><div class="toggle-icon expanded">\u25BC</div></div><div class="analysis-content" style="display:block;"><p><strong>\uD83D\uDCCB \u4F60\u7684\u4F5C\u7B54\uFF1A</strong></p><div style="background:#fafbfc;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(res.userAnswer||'\uFF08\u7A7A\uFF09')}</div><p><strong>\u2705 \u6807\u51C6\u7B54\u6848\uFF1A</strong></p><div style="background:#f6ffed;padding:12px;border-radius:8px;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(res.referenceAnswer)}</div><p><strong>\uD83D\uDD11 \u5173\u952E\u8BCD\u547D\u4E2D\uFF1A</strong>\u547D\u4E2D ${res.hitCount}/${res.totalKeywords} \u4E2A\uFF08${res.hitRate}%\uFF09</p><div class="score-progress"><div class="score-progress-fill ${res.progressClass}" style="width:${res.hitRate}%;"></div></div><span class="score-tag ${res.progressClass}">${res.levelLabel}</span><p style="margin-top:8px;"><strong>\u547D\u4E2D\uFF1A</strong>${res.hitKeywords.length?res.hitKeywords.map(k=>'<span class="keyword-highlight">'+k+'</span>').join('\u3001'):'\u65E0'}</p><p><strong>\u672A\u547D\u4E2D\uFF1A</strong>${res.missedKeywords.length?res.missedKeywords.map(k=>'<span class="keyword-missed">'+k+'</span>').join('\u3001'):'\u65E0'}</p><hr style="border:none;border-top:1px solid #e8e8e8;margin:12px 0;">${q.analysis}</div></div>`;}
    function buildCompletionScreen(cc,ac,wc){let h=`<div class="completion-screen"><div class="completion-icon">${ac>=80?'\uD83C\uDF89':ac>=60?'\uD83D\uDC4D':'\uD83D\uDCAA'}</div><h1 class="completion-title">${reviewMode?'\u9519\u9898\u56DE\u987E\u5B8C\u6210\uFF01':'\u5237\u9898\u5B8C\u6210\uFF01'}</h1><p style="color:var(--text-secondary);">${reviewMode?'\u4F60\u5DF2\u7ECF\u56DE\u987E\u4E86\u6240\u6709\u9519\u9898':'\u592A\u68D2\u4E86\uFF01\u4F60\u5DF2\u7ECF\u5B8C\u6210\u4E86\u6240\u6709\u9898\u76EE'}</p><div class="stats"><div class="stat-item"><div class="stat-value">${cc}/${questions.length}</div><div class="stat-label">\u7B54\u5BF9\u9898\u6570</div></div><div class="stat-item"><div class="stat-value">${ac}%</div><div class="stat-label">\u6B63\u786E\u7387</div></div><div class="stat-item"><div class="stat-value">${wc}</div><div class="stat-label">\u9519\u9898\u6570</div></div></div><div class="action-buttons"><button class="action-btn restart-btn" onclick="restartQuiz()">\u91CD\u65B0\u5F00\u59CB</button><button class="action-btn history-view-btn" onclick="toggleHistory()">\u67E5\u770B\u5386\u53F2</button>`;if(wc>0&&!reviewMode){h+=`<button class="action-btn review-wrong-btn" onclick="startReviewWrong()"><i class="fas fa-redo"></i> \u56DE\u770B\u9519\u9898</button><button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> \u5BFC\u51FA\u9519\u9898</button>`;}if(reviewMode&&wc>0)h+=`<button class="action-btn export-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> \u5BFC\u51FA\u9519\u9898</button>`;return h+`</div></div>`;}
    function selectOption(i){const ai=getActualIndex();if(answers[ai]!==null||!isChoiceType(questions[ai]))return;answers[ai]=i;saveAnswers();renderQuestion();renderAnswerSheet();updateNavButtons();showToast(i===questions[ai].answer?'\u56DE\u7B54\u6B63\u786E\uFF01\u2713':'\u56DE\u7B54\u9519\u8BEF \u2717');}
    function submitTextAnswer(ai){if(answers[ai]!==null&&typeof answers[ai]==='string')return;const ta=document.getElementById('textAnswerInput');if(!ta)return;const ua=ta.value.trim();if(!ua){showToast('\u8BF7\u5148\u8F93\u5165\u4F60\u7684\u56DE\u7B54');return;}answers[ai]=ua;clearDraft(ai);saveAnswers();renderQuestion();renderAnswerSheet();updateNavButtons();const res=evaluateTextAnswer(ai,questions[ai]);showToast(res.level==='good'?'\u56DE\u7B54\u8F83\u597D\uFF01\u2713':(res.level==='partial'?'\u90E8\u5206\u6B63\u786E \u25B3':'\u9700\u52A0\u5F3A \u2717'));}
    function saveDraftOnly(ai){const ta=document.getElementById('textAnswerInput');if(!ta)return;const v=ta.value.trim();if(v){saveDraft(ai,v);showToast('\u8349\u7A3F\u5DF2\u4FDD\u5B58 \u2713');}else{clearDraft(ai);showToast('\u8349\u7A3F\u5DF2\u6E05\u7A7A');}}
    function clearTextInput(ai){const ta=document.getElementById('textAnswerInput');if(ta)ta.value='';clearDraft(ai);showToast('\u8F93\u5165\u5DF2\u6E05\u7A7A');}
    function evaluateTextAnswer(ai,q){const ua=(answers[ai]&&typeof answers[ai]==='string')?answers[ai]:'';const ak=[];let ra='';if(q.type==='简答题'){if(q.keywords)ak.push(...q.keywords);ra=q.answer||'';}else if(q.type==='综合应用题'){if(q.keywords)ak.push(...q.keywords);ra=q.answer||'';}const tk=ak.length,hk=[],mk=[],ul=ua.toLowerCase();ak.forEach(k=>{if(ul.includes(k.toLowerCase()))hk.push(k);else mk.push(k);});const hc=hk.length,hr=tk>0?Math.round((hc/tk)*100):0;let l,ll,pc;if(q.type==='简答题'){if(hr>=60){l='good';ll='\u56DE\u7B54\u8F83\u597D';pc='excellent';}else if(hr>=30){l='partial';ll='\u90E8\u5206\u6B63\u786E';pc='pass';}else{l='weak';ll='\u9700\u52A0\u5F3A';pc='fail';}}else{if(hr>=80){l='good';ll='\u4F18\u79C0';pc='excellent';}else if(hr>=60){l='good';ll='\u826F\u597D';pc='good';}else if(hr>=40){l='partial';ll='\u5408\u683C';pc='pass';}else{l='weak';ll='\u9700\u52A0\u5F3A';pc='fail';}}return{userAnswer:ua,referenceAnswer:ra,totalKeywords:tk,hitCount:hc,hitRate:hr,hitKeywords:hk,missedKeywords:mk,level:l,levelLabel:ll,progressClass:pc};}
    function getCorrectCount(){let c=0;questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]===q.answer)c++;}else{const r=evaluateTextAnswer(i,q);if(r.level==='good')c++;}});return c;}
    function getWrongCount(){let c=0;questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]!==q.answer)c++;}else{const r=evaluateTextAnswer(i,q);if(r.level==='weak')c++;}});return c;}
    function getWrongIndicesArray(){const a=[];questions.forEach((q,i)=>{if(answers[i]===null)return;if(isChoiceType(q)){if(answers[i]!==q.answer)a.push(i);}else{const r=evaluateTextAnswer(i,q);if(r.level==='weak')a.push(i);}});return a;}
    function checkAllAnsweredInMode(){if(reviewMode&&wrongIndices.length)return wrongIndices.every(wi=>answers[wi]!==null);return answers.every(a=>a!==null);}
    function startReviewWrong(){wrongIndices=getWrongIndicesArray();if(!wrongIndices.length){showToast('\u6CA1\u6709\u9519\u9898\u53EF\u56DE\u987E');return;}reviewMode=true;reviewIndex=0;currentPage='quiz';document.getElementById('knowledgePage').classList.add('hidden');document.getElementById('quizContent').style.display='block';document.getElementById('questionInfo').style.display='block';document.getElementById('pageTitle').style.display='none';document.querySelector('.progress-bar').style.display='block';renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});showToast(`\u8FDB\u5165\u9519\u9898\u56DE\u987E\u6A21\u5F0F\uFF0C\u5171 ${wrongIndices.length} \u9898`);}
    function exitReviewMode(){reviewMode=false;wrongIndices=[];currentIndex=0;currentPage='quiz';renderQuestion();updateNavButtons();window.scrollTo({top:0,behavior:'smooth'});showToast('\u5DF2\u9000\u51FA\u9519\u9898\u56DE\u987E\u6A21\u5F0F');}
    function exportWrongCSV(){const wa=getWrongIndicesArray();if(!wa.length){showToast('\u6CA1\u6709\u9519\u9898\u53EF\u5BFC\u51FA');return;}const mn='\u6DF1\u5EA6\u5B66\u4E60',ds=new Date().toISOString().slice(0,10),fn=`\u9519\u9898\u672C_${mn}_${ds}.csv`;const rows=[['\u9898\u578B','\u9898\u76EE','\u7528\u6237\u7B54\u6848','\u6B63\u786E\u7B54\u6848','\u5173\u952E\u8BCD\u547D\u4E2D\u7387','\u7ED3\u679C','\u89E3\u6790']];wa.forEach(i=>{const q=questions[i],qt=getQuestionTypeLabel(q);const stem=q.stem.replace(/"/g,'""');let ua='',ca='',hr='',res='';if(isChoiceType(q)){ua=(answers[i]!==null&&answers[i]!==undefined)?(q.options[answers[i]]?q.options[answers[i]].text:String(answers[i])):'';ca=q.options[q.answer]?q.options[q.answer].text:String(q.answer);res=answers[i]===q.answer?'\u6B63\u786E':'\u9519\u8BEF';hr=answers[i]===q.answer?'100%':'0%';}else{ua=(answers[i]&&typeof answers[i]==='string')?answers[i]:'';ca=q.answer||'';const er=evaluateTextAnswer(i,q);hr=er.hitRate+'%';res=er.levelLabel;}const at=q.analysis?q.analysis.replace(/<[^>]+>/g,'').replace(/"/g,'""'):'';rows.push([qt,'"'+stem+'"','"'+ua.replace(/"/g,'""')+'"','"'+ca.replace(/"/g,'""')+'"',hr,res,'"'+at+'"']);});const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=fn;document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);showToast('\u9519\u9898CSV\u5DF2\u5BFC\u51FA\uFF1A'+fn);}
    function toggleAnalysis(h){const c=h.nextElementSibling,i=h.querySelector('.toggle-icon');if(c.style.display==='none'){c.style.display='block';i.classList.add('expanded');}else{c.style.display='none';i.classList.remove('expanded');}}
    function prevQuestion(){if(reviewMode&&wrongIndices.length){if(reviewIndex>0){reviewIndex--;renderQuestion();updateNavButtons();}}else if(!reviewMode&&currentIndex>0){currentIndex--;renderQuestion();updateNavButtons();}}
    function nextQuestion(){if(reviewMode&&wrongIndices.length){if(reviewIndex<wrongIndices.length-1){reviewIndex++;renderQuestion();updateNavButtons();}}else if(!reviewMode&&currentIndex<questions.length-1){currentIndex++;renderQuestion();updateNavButtons();}}
    function updateHeader(){if(currentPage!=='quiz')return;document.getElementById('currentNum').textContent=getCurrentPosition();const ac=answers.filter(a=>a!==null).length;document.getElementById('answeredCount').textContent=ac;document.getElementById('totalCount').textContent=questions.length;document.getElementById('progressFill').style.width=`${(ac/questions.length)*100}%`;}
    function updateNavButtons(){const fc=document.getElementById('footerContent');if(currentPage!=='quiz')return;const tim=getTotalInMode(),cp=getCurrentPosition(),isF=cp<=1,isL=cp>=tim,ad=checkAllAnsweredInMode();fc.innerHTML=`<button class="nav-btn prev-btn" onclick="prevQuestion()" ${isF?'disabled':''}><i class="fas fa-chevron-left"></i> \u4E0A\u4E00\u9898</button><button class="nav-btn next-btn" onclick="nextQuestion()" ${isL&&ad?'disabled':''}>\u4E0B\u4E00\u9898 <i class="fas fa-chevron-right"></i></button>`;}
    function changeFontSize(d){fontSize=Math.max(14,Math.min(22,fontSize+d));document.documentElement.style.setProperty('--font-size-base',`${fontSize}px`);document.documentElement.style.setProperty('--font-size-small',`${fontSize-2}px`);document.documentElement.style.setProperty('--font-size-large',`${fontSize+2}px`);saveSettings();}
    function toggleSheet(){const o=document.getElementById('sheetOverlay'),p=document.getElementById('sheetPanel');if(p.classList.contains('show')){o.classList.remove('show');p.classList.remove('show');}else{o.classList.add('show');p.classList.add('show');renderAnswerSheet();}}
    function renderAnswerSheet(){const g=document.getElementById('sheetGrid');let h='';questions.forEach((q,i)=>{let sc='unanswered',st='\u672A\u7B54';if(answers[i]!==null){if(isChoiceType(q)){if(answers[i]===q.answer){sc='correct';st='\u6B63\u786E';}else{sc='wrong';st='\u9519\u8BEF';}}else{const r=evaluateTextAnswer(i,q);if(r.level==='good'){sc='correct';st='\u8F83\u597D';}else if(r.level==='partial'){sc='correct';st='\u90E8\u5206';}else{sc='wrong';st='\u52A0\u5F3A';}}}if(i===getActualIndex()&&!reviewMode)sc+=' current';if(reviewMode&&wrongIndices.includes(i)&&wrongIndices[reviewIndex]===i)sc+=' current';if(currentFilter!=='all'){if(currentFilter==='unanswered'&&answers[i]!==null)return;if(currentFilter==='correct'){if(answers[i]===null)return;if(isChoiceType(q)&&answers[i]!==q.answer)return;if(isTextType(q)){const r=evaluateTextAnswer(i,q);if(r.level==='weak')return;}}if(currentFilter==='wrong'){if(answers[i]===null)return;if(isChoiceType(q)&&answers[i]===q.answer)return;if(isTextType(q)){const r=evaluateTextAnswer(i,q);if(r.level!=='weak')return;}}}h+=`<div class="sheet-item ${sc}" onclick="jumpToQuestion(${i})"><div class="sheet-number">${i+1}</div><div class="sheet-status">${st}</div></div>`;});g.innerHTML=h;}
    function filterQuestions(f,e){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');renderAnswerSheet();}
    function jumpToQuestion(i){reviewMode=false;wrongIndices=[];currentIndex=i;renderQuestion();updateNavButtons();toggleSheet();}
    function toggleHistory(){const o=document.getElementById('historyOverlay'),p=document.getElementById('historyPanel');if(p.classList.contains('show')){o.classList.remove('show');p.classList.remove('show');}else{o.classList.add('show');p.classList.add('show');renderHistory();}}
    function renderHistory(){const l=document.getElementById('historyList'),h=getHistory();if(!h.length){l.innerHTML=`<div class="empty-state"><div class="empty-icon">\uD83D\uDCCA</div><div>\u6682\u65E0\u5386\u53F2\u8BB0\u5F55</div></div>`;return;}let ht='';h.forEach((r,i)=>{const ds=new Date(r.timestamp).toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});ht+=`<div class="history-item"><div class="history-date">${ds}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${r.correctCount}/${r.totalCount}</div><div class="history-label">\u7B54\u5BF9\u9898\u6570</div></div><div class="history-stat"><div class="history-value">${r.accuracy}%</div><div class="history-label">\u6B63\u786E\u7387</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${i})">\u56DE\u987E</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${i})">\u5220\u9664</button></div></div>`;});l.innerHTML=ht;}
    function saveToHistory(cc,ac){const h=getHistory();h.unshift({timestamp:Date.now(),totalCount:questions.length,correctCount:cc,accuracy:ac,answers:[...answers]});if(h.length>50)h.pop();localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(h));}
    function getHistory(){try{const s=localStorage.getItem(STORAGE_KEY_HISTORY);return s?JSON.parse(s):[];}catch(e){localStorage.removeItem(STORAGE_KEY_HISTORY);return[];}}
    function reviewHistory(i){const h=getHistory();if(i>=0&&i<h.length){answers=[...h[i].answers];currentIndex=0;reviewMode=false;wrongIndices=[];saveAnswers();renderQuestion();updateNavButtons();toggleHistory();showToast('\u5DF2\u52A0\u8F7D\u5386\u53F2\u8BB0\u5F55');}}
    function deleteHistory(i){if(!confirm('\u786E\u5B9A\u5220\u9664\uFF1F'))return;const h=getHistory();if(i>=0&&i<h.length){h.splice(i,1);localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(h));renderHistory();showToast('\u8BB0\u5F55\u5DF2\u5220\u9664');}}
    function clearAllHistory(){if(!confirm('\u786E\u5B9A\u6E05\u7A7A\u6240\u6709\u5386\u53F2\u8BB0\u5F55\uFF1F'))return;localStorage.removeItem(STORAGE_KEY_HISTORY);renderHistory();showToast('\u5386\u53F2\u8BB0\u5F55\u5DF2\u6E05\u7A7A');}
    function saveAnswers(){localStorage.setItem(STORAGE_KEY_ANSWERS,JSON.stringify({currentIndex,answers,reviewMode,wrongIndices,reviewIndex}));}
    function saveSettings(){localStorage.setItem(STORAGE_KEY_SETTINGS,JSON.stringify({fontSize}));}
    function loadAllData(){try{const s=localStorage.getItem(STORAGE_KEY_ANSWERS);if(s){const d=JSON.parse(s);currentIndex=d.currentIndex||0;answers=d.answers||new Array(questions.length).fill(null);reviewMode=d.reviewMode||false;wrongIndices=d.wrongIndices||[];reviewIndex=d.reviewIndex||0;}}catch(e){localStorage.removeItem(STORAGE_KEY_ANSWERS);answers=new Array(questions.length).fill(null);}try{const ss=localStorage.getItem(STORAGE_KEY_SETTINGS);if(ss){const st=JSON.parse(ss);fontSize=st.fontSize||16;document.documentElement.style.setProperty('--font-size-base',`${fontSize}px`);document.documentElement.style.setProperty('--font-size-small',`${fontSize-2}px`);document.documentElement.style.setProperty('--font-size-large',`${fontSize+2}px`);}}catch(e){localStorage.removeItem(STORAGE_KEY_SETTINGS);}}
    function saveDraft(i,v){const d=getDrafts();d[i]=v;localStorage.setItem(STORAGE_KEY_DRAFTS,JSON.stringify(d));}
    function getDraft(i){const d=getDrafts();return d[i]||null;}
    function clearDraft(i){const d=getDrafts();delete d[i];localStorage.setItem(STORAGE_KEY_DRAFTS,JSON.stringify(d));}
    function getDrafts(){try{const s=localStorage.getItem(STORAGE_KEY_DRAFTS);return s?JSON.parse(s):{};}catch(e){localStorage.removeItem(STORAGE_KEY_DRAFTS);return{};}}
    function restartQuiz(){if(confirm('\u786E\u5B9A\u91CD\u65B0\u5F00\u59CB\uFF1F\u8FDB\u5EA6\u5C06\u88AB\u6E05\u9664\u3002')){currentIndex=0;reviewMode=false;wrongIndices=[];reviewIndex=0;answers=new Array(questions.length).fill(null);localStorage.removeItem(STORAGE_KEY_ANSWERS);localStorage.removeItem(STORAGE_KEY_DRAFTS);renderQuestion();updateNavButtons();renderAnswerSheet();}}
    function showHome(){if(confirm('\u8FD4\u56DE\u4E3B\u9875\u5C06\u4E22\u5931\u8FDB\u5EA6\uFF0C\u786E\u5B9A\u5417\uFF1F')){currentIndex=0;reviewMode=false;wrongIndices=[];reviewIndex=0;answers=new Array(questions.length).fill(null);localStorage.removeItem(STORAGE_KEY_ANSWERS);localStorage.removeItem(STORAGE_KEY_DRAFTS);switchToKnowledgePage();renderAnswerSheet();}}
    function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
    function escapeHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    renderKnowledgePage();switchToKnowledgePage();renderQuestion();renderAnswerSheet();renderHistory();updateNavButtons();
</script>
