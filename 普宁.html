let userAnswers = {};   // { questionIndex: "A" or ["A","B"] for multi }
let timerSeconds = 0;
let timerInterval = null;
let examStarted = false;
let currentFilter = 'all';

let studyMode = false; // false = 做题模式, true = 背题模式
let fontScale = 1.0;
const MODE_KEY = 'puning_quiz_mode';
const FONT_KEY = 'puning_quiz_font';

// ==================== INIT ====================
function init() {
  loadMode();
  loadFontSize();
  renderHomeCards();
  restoreState();
}

function renderHomeCards() {
  const container = document.getElementById('homeCards');
  container.innerHTML = ALL_EXAMS.map((exam, idx) => {
    const year = exam.year;
    return '' +
      '<div class="year-card" onclick="startExam(' + idx + ')">' +
        '<div class="year-badge">' + year + '</div>' +
        '<div class="card-info">' +
          '<div class="exam-name">' + escapeHtml(exam.exam_name) + '</div>' +
          '<div class="question-count">&#x1F4DD; ' + exam.total_questions + ' 题</div>' +
        '</div>' +
        '<div class="card-arrow">&#x203A;</div>' +
      '</div>';
  }).join('');
}

// ==================== NAVIGATION ====================
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function goHome() {
  stopTimer();
  clearState();
  showPage('homePage');
}

function startExam(index) {
  currentExamIndex = index;
  currentQuestionIndex = 0;
  userAnswers = {};
  timerSeconds = 0;
  examStarted = true;

  const exam = ALL_EXAMS[index];
  document.getElementById('quizYear').textContent = exam.year + '年';
  document.getElementById('quizExamName').textContent = exam.exam_name;
  document.getElementById('timerDisplay').textContent = '00:00';

  showPage('quizPage');
  updateModeUI();
  applyFontSize();
  renderQuestion();
  updateBottomNav();
  updateProgressBar();
  if (!studyMode) startTimer();
  saveState();
}

// ==================== TIMER ====================
function startTimer() {
  stopTimer();
  timerInterval = setInterval(function() {
    timerSeconds++;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ==================== QUESTION RENDERING ====================
function getCurrentExam() {
  return ALL_EXAMS[currentExamIndex];
}

function getTotalQuestions() {
  return getCurrentExam().total_questions;
}

function getCurrentQuestion() {
  return getCurrentExam().questions[currentQuestionIndex];
}

function renderQuestion() {
  const q = getCurrentQuestion();
  const total = getTotalQuestions();
  const area = document.getElementById('questionArea');

  let typeClass = 'type-single';
  let typeLabel = q.type;
  if (q.type === '多选') { typeClass = 'type-multi'; typeLabel = '多选题'; }
  else if (q.type === '判断') { typeClass = 'type-judge'; typeLabel = '判断题'; }
  else if (q.type === '单选') { typeLabel = '单选题'; }

  // 检查用户是否已作答
  const hasAnswered = (function() {
    const ans = userAnswers[currentQuestionIndex];
    if (ans === undefined || ans === null || ans === '') return false;
    if (Array.isArray(ans) && ans.length === 0) return false;
    return true;
  })();

  let optionsHtml = '';
  if (studyMode) {
    // 背题模式：用户作答后可看到答案和解析
    if (hasAnswered) {
      // 已作答：显示正确/错误判断，并高亮显示正确答案
      if (q.type === '判断') {
        const userAns = userAnswers[currentQuestionIndex];
        const isCorrect = userAns === q.answer;
        optionsHtml = '' +
          '<div class="judge-options">' +
            '<div class="judge-btn' + (userAns === 'A' ? (isCorrect ? ' correct' : ' wrong') : (q.answer === 'A' ? ' correct' : '')) + '">&#x2705; 正确</div>' +
            '<div class="judge-btn' + (userAns === 'B' ? (isCorrect ? ' correct' : ' wrong') : (q.answer === 'B' ? ' correct' : '')) + '">&#x274C; 错误</div>' +
          '</div>';
      } else if (q.type === '多选') {
        const userArr = Array.isArray(userAnswers[currentQuestionIndex]) ? userAnswers[currentQuestionIndex] : [];
        const correctArr = q.answer.split('').filter(function(c) { return c.trim() !== ''; });
        const keys = Object.keys(q.options).sort();
        optionsHtml = '<div class="options-list">' + keys.map(function(k) {
          const inUser = userArr.indexOf(k) !== -1;
          const inCorrect = correctArr.indexOf(k) !== -1;
          let cls = '';
          if (inUser && inCorrect) cls = ' correct';
          else if (inUser && !inCorrect) cls = ' wrong';
          else if (!inUser && inCorrect) cls = ' correct';
          return '' +
            '<div class="option-item' + cls + '">' +
              '<div class="option-marker square' + cls + '">' + k + '</div>' +
              '<div class="option-text">' + escapeHtml(q.options[k]) + '</div>' +
            '</div>';
        }).join('') + '</div>';
      } else {
        const userAns = userAnswers[currentQuestionIndex];
        const isCorrect = userAns === q.answer;
        const keys = Object.keys(q.options).sort();
        optionsHtml = '<div class="options-list">' + keys.map(function(k) {
          let cls = '';
          if (k === userAns && k === q.answer) cls = ' correct';
          else if (k === userAns && k !== q.answer) cls = ' wrong';
          else if (k === q.answer) cls = ' correct';
          return '' +
            '<div class="option-item' + cls + '">' +
              '<div class="option-marker' + cls + '">' + k + '</div>' +
              '<div class="option-text">' + escapeHtml(q.options[k]) + '</div>' +
            '</div>';
        }).join('') + '</div>';
      }
    } else {
      // 未作答：显示可点击的选项
      if (q.type === '判断') {
        optionsHtml = '' +
          '<div class="judge-options">' +
            '<div class="judge-btn' + '" onclick="selectAnswer(\'A\')">&#x2705; 正确</div>' +
            '<div class="judge-btn' + '" onclick="selectAnswer(\'B\')">&#x274C; 错误</div>' +
          '</div>';
      } else if (q.type === '多选') {
        const keys = Object.keys(q.options).sort();
        optionsHtml = '<div class="options-list">' + keys.map(function(k) {
          return '' +
            '<div class="option-item' + '" onclick="selectMultiAnswer(\'' + k + '\')">' +
              '<div class="option-marker square">' + k + '</div>' +
              '<div class="option-text">' + escapeHtml(q.options[k]) + '</div>' +
            '</div>';
        }).join('') + '</div>';
      } else {
        const keys = Object.keys(q.options).sort();
        optionsHtml = '<div class="options-list">' + keys.map(function(k) {
          return '' +
            '<div class="option-item' + '" onclick="selectAnswer(\'' + k + '\')">' +
              '<div class="option-marker">' + k + '</div>' +
              '<div class="option-text">' + escapeHtml(q.options[k]) + '</div>' +
            '</div>';
        }).join('') + '</div>';
      }
    }
  } else {
    // 做题模式：原有逻辑不变
    if (q.type === '判断') {
      const selected = userAnswers[currentQuestionIndex] || '';
      optionsHtml = '' +
        '<div class="judge-options">' +
          '<div class="judge-btn' + (selected === 'A' ? ' selected' : '') + '" onclick="selectAnswer(\'A\')">&#x2705; 正确</div>' +
          '<div class="judge-btn' + (selected === 'B' ? ' selected' : '') + '" onclick="selectAnswer(\'B\')">&#x274C; 错误</div>' +
        '</div>';
    } else if (q.type === '多选') {
      const selected = userAnswers[currentQuestionIndex] || [];
      const keys = Object.keys(q.options).sort();
      optionsHtml = '<div class="options-list">' + keys.map(function(k) {
        const isSel = selected.indexOf(k) !== -1;
        return '' +
          '<div class="option-item' + (isSel ? ' selected' : '') + '" onclick="selectMultiAnswer(\'' + k + '\')">' +
            '<div class="option-marker square">' + k + '</div>' +
            '<div class="option-text">' + escapeHtml(q.options[k]) + '</div>' +
          '</div>';
      }).join('') + '</div>';
    } else {
      const selected = userAnswers[currentQuestionIndex] || '';
      const keys = Object.keys(q.options).sort();
      optionsHtml = '<div class="options-list">' + keys.map(function(k) {
        return '' +
          '<div class="option-item' + (selected === k ? ' selected' : '') + '" onclick="selectAnswer(\'' + k + '\')">' +
            '<div class="option-marker">' + k + '</div>' +
            '<div class="option-text">' + escapeHtml(q.options[k]) + '</div>' +
          '</div>';
      }).join('') + '</div>';
    }
  }

  // 背题模式：作答后显示答案和解析
  let studyInfo = '';
  if (studyMode && hasAnswered) {
    let isCorrect = false;
    if (q.type === '多选') {
      const userArr = Array.isArray(userAnswers[currentQuestionIndex]) ? userAnswers[currentQuestionIndex].slice().sort() : [];
      const correctArr = q.answer.split('').filter(function(c) { return c.trim() !== ''; }).sort();
      isCorrect = arraysEqual(userArr, correctArr);
    } else {
      isCorrect = userAnswers[currentQuestionIndex] === q.answer;
    }
    
    let ansText = q.answer;
    if (q.type === '判断') ansText = q.answer === 'A' ? '正确' : '错误';
    
    studyInfo = '' +
      '<div class="study-answer" style="margin-top:16px;padding:14px 16px;background:' + (isCorrect ? 'var(--success-bg)' : 'var(--danger-bg)') + ';border-radius:var(--radius);border-left:4px solid ' + (isCorrect ? 'var(--success)' : 'var(--danger)') + ';">' +
        '<div class="study-answer-label" style="font-size:13px;font-weight:700;color:' + (isCorrect ? 'var(--success)' : 'var(--danger)') + ';margin-bottom:4px;">' + (isCorrect ? '&#x2713; 回答正确' : '&#x2717; 回答错误') + '</div>' +
        '<div class="study-answer-text" style="font-size:14px;color:var(--gray-700);">正确答案：<strong>' + ansText + '</strong></div>' +
      '</div>';
    if (q.explanation) {
      studyInfo += '' +
        '<div class="study-explanation" style="margin-top:12px;">' +
          '<div class="study-explanation-label" style="font-size:13px;font-weight:700;color:var(--gray-500);margin-bottom:6px;">&#x1F4DD; 解析</div>' +
          escapeHtml(q.explanation) +
        '</div>';
    }
  }

  const slideClass = 'slide-right'; // 简化，统一使用右滑入

  area.innerHTML = '' +
    '<div class="question-card ' + slideClass + '">' +
      '<div class="question-header">' +
        '<div class="question-number">第 ' + (currentQuestionIndex + 1) + '/' + total + ' 题</div>' +
        '<div class="question-type-tag ' + typeClass + '">' + typeLabel + '</div>' +
      '</div>' +
      '<div class="question-stem">' + escapeHtml(q.stem) + '</div>' +
      optionsHtml +
      studyInfo +
    '</div>';

  updateBottomNav();
  updateProgressBar();
  saveState();
}

function selectAnswer(key) {
  userAnswers[currentQuestionIndex] = key;
  renderQuestion();
  updateAnswerCardIfOpen();
}

function selectMultiAnswer(key) {
  let selected = userAnswers[currentQuestionIndex] || [];
  if (!Array.isArray(selected)) selected = [];
  const idx = selected.indexOf(key);
  if (idx !== -1) {
    selected.splice(idx, 1);
  } else {
    selected.push(key);
  }
  userAnswers[currentQuestionIndex] = selected;
  renderQuestion();
  updateAnswerCardIfOpen();
}

function updateBottomNav() {
  const total = getTotalQuestions();
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const cardBtn = document.querySelector('.answer-card-btn');

  btnPrev.disabled = currentQuestionIndex === 0;

  if (cardBtn) {
    cardBtn.textContent = studyMode ? '题号列表' : '答题卡';
  }

  if (currentQuestionIndex >= total - 1) {
    btnNext.textContent = studyMode ? '完成' : '交卷';
    btnNext.className = 'nav-btn nav-btn-submit';
    btnNext.onclick = studyMode ? finishStudy : submitExam;
  } else {
    btnNext.textContent = '下一题';
    btnNext.className = 'nav-btn nav-btn-next';
    btnNext.onclick = nextQuestion;
  }
}

function updateProgressBar() {
  const answered = Object.keys(userAnswers).filter(function(k) {
    const v = userAnswers[k];
    if (Array.isArray(v)) return v.length > 0;
    return v !== '' && v !== null && v !== undefined;
  }).length;
  const total = getTotalQuestions();
  const pct = total > 0 ? (answered / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function prevQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuestion();
  }
}

function nextQuestion() {
  const total = getTotalQuestions();
  if (currentQuestionIndex < total - 1) {
    currentQuestionIndex++;
    renderQuestion();
  }
}

// ==================== ANSWER CARD ====================
function showAnswerCard() {
  document.getElementById('answerCardOverlay').classList.add('show');
  document.getElementById('answerCardPanel').classList.add('show');
  renderAnswerCard();
}

function hideAnswerCard() {
  document.getElementById('answerCardOverlay').classList.remove('show');
  document.getElementById('answerCardPanel').classList.remove('show');
}

function updateAnswerCardIfOpen() {
  if (document.getElementById('answerCardPanel').classList.contains('show')) {
    renderAnswerCard();
  }
}

function renderAnswerCard() {
  const total = getTotalQuestions();
  const answered = Object.keys(userAnswers).filter(function(k) {
    const v = userAnswers[k];
    if (Array.isArray(v)) return v.length > 0;
    return v !== '' && v !== null && v !== undefined;
  }).length;

  if (studyMode) {
    document.getElementById('panelStats').innerHTML = '第 <span>' + (currentQuestionIndex + 1) + '</span> / <span>' + total + '</span> 题';
  } else {
    document.getElementById('panelStats').innerHTML = '已答 <span>' + answered + '</span> / 总题数 <span>' + total + '</span>';
  }

  const grid = document.getElementById('panelGrid');
  let html = '';
  for (let i = 0; i < total; i++) {
    let cls = 'panel-number';
    if (!studyMode) {
      const isAnswered = userAnswers[i] !== undefined && userAnswers[i] !== null && userAnswers[i] !== '' &&
        (!Array.isArray(userAnswers[i]) || userAnswers[i].length > 0);
      if (isAnswered) cls += ' answered';
    }
    if (i === currentQuestionIndex) cls += ' current';
    html += '<div class="' + cls + '" onclick="jumpToQuestion(' + i + ')">' + (i + 1) + '</div>';
  }
  grid.innerHTML = html;
}

function jumpToQuestion(index) {
  currentQuestionIndex = index;
  renderQuestion();
  hideAnswerCard();
}

// ==================== SUBMIT ====================
function submitExam() {
  const total = getTotalQuestions();
  const answered = Object.keys(userAnswers).filter(function(k) {
    const v = userAnswers[k];
    if (Array.isArray(v)) return v.length > 0;
    return v !== '' && v !== null && v !== undefined;
  }).length;
  const unanswered = total - answered;

  let msg = '';
  if (unanswered > 0) {
    msg = '您还有 <b>' + unanswered + '</b> 道题未作答，确定要交卷吗？';
  } else {
    msg = '您已完成所有题目，确定要交卷吗？';
  }
  document.getElementById('confirmMsg').innerHTML = msg;
  document.getElementById('confirmDialog').classList.add('show');
}

function hideConfirmDialog() {
  document.getElementById('confirmDialog').classList.remove('show');
}

function confirmSubmit() {
  hideConfirmDialog();
  hideAnswerCard();
  stopTimer();
  examStarted = false;
  clearState();
  showResults();
}

function showResults() {
  const exam = getCurrentExam();
  const questions = exam.questions;
  const total = questions.length;
  let correctCount = 0;
  const results = [];

  questions.forEach(function(q, i) {
    const userAns = userAnswers[i] || '';
    const correctAns = q.answer;
    let isCorrect = false;

    if (q.type === '多选') {
      const userArr = Array.isArray(userAns) ? userAns.slice().sort() : [];
      const correctArr = correctAns.split('').filter(function(c) { return c.trim() !== ''; }).sort();
      isCorrect = arraysEqual(userArr, correctArr);
    } else {
      isCorrect = (userAns === correctAns);
    }

    if (isCorrect) correctCount++;
    results.push({
      question: q,
      userAnswer: userAns,
      isCorrect: isCorrect
    });
  });

  const rate = total > 0 ? Math.round(correctCount / total * 100) : 0;

  document.getElementById('resultsTitle').textContent = exam.year + '年 ' + exam.exam_name;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statRate').textContent = rate + '%';
  document.getElementById('statTime').textContent = formatTime(timerSeconds);

  // Reset filter
  currentFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.filter === 'all');
  });

  renderResultsList(results);
  showPage('resultsPage');

  // Update export button
  const wrongCount = results.filter(function(r) { return !r.isCorrect; }).length;
  document.getElementById('exportBtn').disabled = wrongCount === 0;
}

function renderResultsList(results) {
  const list = document.getElementById('resultsList');
  let filtered = results;
  if (currentFilter === 'wrong') {
    filtered = results.filter(function(r) { return !r.isCorrect; });
  } else if (currentFilter === 'correct') {
    filtered = results.filter(function(r) { return r.isCorrect; });
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400);">暂无数据</div>';
    return;
  }

  list.innerHTML = filtered.map(function(r) {
    const q = r.question;
    const isCorrect = r.isCorrect;
    const userAns = r.userAnswer;
    const correctAns = q.answer;

    let typeClass = 'type-single';
    let typeLabel = q.type;
    if (q.type === '多选') { typeClass = 'type-multi'; typeLabel = '多选题'; }
    else if (q.type === '判断') { typeClass = 'type-judge'; typeLabel = '判断题'; }
    else if (q.type === '单选') { typeLabel = '单选题'; }

    // Render options
    let optionsHtml = '';
    const keys = Object.keys(q.options).sort();

    if (q.type === '判断') {
      const userKey = userAns;
      const correctKey = correctAns;
      const correctLabel = correctKey === 'A' ? '正确' : '错误';
      const userLabel = userKey === 'A' ? '正确' : (userKey === 'B' ? '错误' : '未作答');

      optionsHtml = '<div style="font-size:13px;margin-bottom:8px;">' +
        '<span style="color:var(--gray-500);">你的答案：</span>' +
        '<span style="color:' + (isCorrect ? 'var(--success)' : 'var(--danger)') + ';font-weight:600;">' + userLabel + '</span>' +
        (isCorrect ? '' : ' <span style="color:var(--success);font-weight:600;">正确：' + correctLabel + '</span>') +
        '</div>';
    } else if (q.type === '多选') {
      const userArr = Array.isArray(userAns) ? userAns : [];
      const correctArr = correctAns.split('').filter(function(c) { return c.trim() !== ''; });

      optionsHtml = '<div class="result-options">' + keys.map(function(k) {
        let cls = '';
        const inUser = userArr.indexOf(k) !== -1;
        const inCorrect = correctArr.indexOf(k) !== -1;

        if (inUser && inCorrect) cls = 'user-correct';
        else if (inUser && !inCorrect) cls = 'user-wrong';
        else if (!inUser && inCorrect) cls = 'is-answer';

        return '' +
          '<div class="result-option ' + cls + '">' +
            '<div class="ro-marker">' + k + '</div>' +
            '<div>' + escapeHtml(q.options[k]) + '</div>' +
          '</div>';
      }).join('') + '</div>';
    } else {
      // 单选
      optionsHtml = '<div class="result-options">' + keys.map(function(k) {
        let cls = '';
        if (k === userAns && k === correctAns) cls = 'user-correct';
        else if (k === userAns && k !== correctAns) cls = 'user-wrong';
        else if (k === correctAns) cls = 'is-answer';

        return '' +
          '<div class="result-option ' + cls + '">' +
            '<div class="ro-marker">' + k + '</div>' +
            '<div>' + escapeHtml(q.options[k]) + '</div>' +
          '</div>';
      }).join('') + '</div>';
    }

    let answerLine = '';
    if (q.type !== '判断') {
      answerLine = '<div class="result-answer-line">正确答案：' + correctAns + '</div>';
    }

    let explanationHtml = '';
    if (q.explanation) {
      explanationHtml = '<div class="result-explanation">' + escapeHtml(q.explanation) + '</div>';
    }

    return '' +
      '<div class="result-item ' + (isCorrect ? 'is-correct' : 'is-wrong') + '">' +
        '<div class="result-item-header">' +
          '<div class="result-item-number">第 ' + (q.number || (results.indexOf(r) + 1)) + ' 题</div>' +
          '<div class="question-type-tag ' + typeClass + '">' + typeLabel + '</div>' +
          '<div style="font-size:12px;color:' + (isCorrect ? 'var(--success)' : 'var(--danger)') + ';font-weight:600;margin-left:auto;">' +
            (isCorrect ? '&#x2713; 正确' : '&#x2717; 错误') +
          '</div>' +
        '</div>' +
        '<div class="result-item-stem">' + escapeHtml(q.stem) + '</div>' +
        optionsHtml +
        answerLine +
        explanationHtml +
      '</div>';
  }).join('');
}

function filterResults(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.filter === type);
  });
  // Re-render results - need to recalculate
  const exam = getCurrentExam();
  const results = exam.questions.map(function(q, i) {
    const userAns = userAnswers[i] || '';
    const correctAns = q.answer;
    let isCorrect = false;
    if (q.type === '多选') {
      const userArr = Array.isArray(userAns) ? userAns.slice().sort() : [];
      const correctArr = correctAns.split('').filter(function(c) { return c.trim() !== ''; }).sort();
      isCorrect = arraysEqual(userArr, correctArr);
    } else {
      isCorrect = (userAns === correctAns);
    }
    return { question: q, userAnswer: userAns, isCorrect: isCorrect };
  });
  renderResultsList(results);
}

function exportWrongQuestions() {
  const exam = getCurrentExam();
  const results = exam.questions.map(function(q, i) {
    const userAns = userAnswers[i] || '';
    const correctAns = q.answer;
    let isCorrect = false;
    if (q.type === '多选') {
      const userArr = Array.isArray(userAns) ? userAns.slice().sort() : [];
      const correctArr = correctAns.split('').filter(function(c) { return c.trim() !== ''; }).sort();
      isCorrect = arraysEqual(userArr, correctArr);
    } else {
      isCorrect = (userAns === correctAns);
    }
    return { question: q, userAnswer: userAns, isCorrect: isCorrect };
  });

  const wrongOnes = results.filter(function(r) { return !r.isCorrect; });
  if (wrongOnes.length === 0) {
    alert('没有错题，太棒了！');
    return;
  }

  let text = exam.year + '年 ' + exam.exam_name + ' - 错题集\n';
  text += '='.repeat(50) + '\n\n';

  wrongOnes.forEach(function(r, idx) {
    const q = r.question;
    text += '【第 ' + (idx + 1) + ' 题】' + ' [' + q.type + ']\n';
    text += '题干：' + q.stem + '\n';

    const keys = Object.keys(q.options).sort();
    keys.forEach(function(k) {
      text += '  ' + k + '. ' + q.options[k] + '\n';
    });

    text += '你的答案：' + (Array.isArray(r.userAnswer) ? r.userAnswer.join('') : (r.userAnswer || '未作答')) + '\n';
    text += '正确答案：' + q.answer + '\n';
    if (q.explanation) {
      text += '解析：' + q.explanation + '\n';
    }
    text += '\n' + '-'.repeat(50) + '\n\n';
  });

  const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = exam.year + '年错题集.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ==================== STATE PERSISTENCE ====================
function saveState() {
  if (!examStarted) return;
  const state = {
    examIndex: currentExamIndex,
    questionIndex: currentQuestionIndex,
    answers: userAnswers,
    seconds: timerSeconds,
    mode: studyMode,
    font: fontScale
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function restoreState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (state.examIndex === null || state.examIndex === undefined) return;
    if (state.examIndex >= ALL_EXAMS.length) return;

    currentExamIndex = state.examIndex;
    currentQuestionIndex = state.questionIndex || 0;
    userAnswers = state.answers || {};
    timerSeconds = state.seconds || 0;
    if (state.mode !== undefined) studyMode = state.mode;
    if (state.font !== undefined) { fontScale = state.font; applyFontSize(); }
    examStarted = true;

    const exam = ALL_EXAMS[currentExamIndex];
    document.getElementById('quizYear').textContent = exam.year + '年';
    document.getElementById('quizExamName').textContent = exam.exam_name;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);

    showPage('quizPage');
    updateModeUI();
    applyFontSize();
    renderQuestion();
    updateBottomNav();
    updateProgressBar();
    if (!studyMode) startTimer();
  } catch(e) {}
}

function clearState() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) {}
}

// ==================== MODE & FONT ====================
function loadMode() {
  try {
    const m = localStorage.getItem(MODE_KEY);
    if (m !== null) studyMode = (m === 'true');
  } catch(e) {}
}

function saveMode() {
  try {
    localStorage.setItem(MODE_KEY, String(studyMode));
  } catch(e) {}
}

function toggleMode() {
  studyMode = !studyMode;
  saveMode();
  updateModeUI();
  if (examStarted) {
    renderQuestion();
    updateBottomNav();
  }
}

function updateModeUI() {
  const btn = document.getElementById('modeToggle');
  if (btn) {
    btn.textContent = studyMode ? '背题模式' : '做题模式';
    btn.classList.toggle('active', studyMode);
  }
  const timer = document.querySelector('.timer');
  if (timer) timer.style.display = studyMode ? 'none' : 'flex';
  const progressWrap = document.querySelector('.progress-bar-wrap');
  if (progressWrap) progressWrap.style.display = studyMode ? 'none' : 'block';
}

function loadFontSize() {
  try {
    const f = localStorage.getItem(FONT_KEY);
    if (f !== null) fontScale = parseFloat(f);
    if (isNaN(fontScale) || fontScale < 0.8) fontScale = 0.8;
    if (fontScale > 1.4) fontScale = 1.4;
  } catch(e) { fontScale = 1.0; }
  applyFontSize();
}

function saveFontSize() {
  try {
    localStorage.setItem(FONT_KEY, String(fontScale));
  } catch(e) {}
}

function changeFontSize(delta) {
  fontScale += delta;
  if (fontScale < 0.8) fontScale = 0.8;
  if (fontScale > 1.4) fontScale = 1.4;
  applyFontSize();
  saveFontSize();
}

function applyFontSize() {
  document.documentElement.style.setProperty('--font-scale', fontScale);
}

function finishStudy() {
  goHome();
}

// ==================== UTILS ====================
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return false;
  }
  return true;
}

// ==================== STARTUP ====================
init();
</script>
