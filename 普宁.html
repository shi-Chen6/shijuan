  transition: all var(--transition);
  flex-shrink: 0;
}
.mode-toggle.active {
  background: var(--primary);
  color: var(--white);
}

/* Font size controls */
.font-ctrl {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.font-btn {
  width: 32px;
  height: 32px;
  border: 2px solid var(--gray-200);
  border-radius: 50%;
  background: var(--white);
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-600);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.font-btn:active { background: var(--gray-100); }

/* Study mode styles */
.study-answer {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--success-bg);
  border-radius: var(--radius);
  border-left: 4px solid var(--success);
}
.study-answer-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--success);
  margin-bottom: 4px;
}
.study-answer-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--gray-800);
}
.study-explanation {
  margin-top: 12px;
  padding: 14px 16px;
  background: var(--gray-50);
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.7;
  color: var(--gray-600);
  white-space: pre-wrap;
  word-break: break-word;
}
.study-explanation-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-500);
  margin-bottom: 6px;
}

/* Slide animations */
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}
.slide-right { animation: slideInRight 0.25s ease; }
.slide-left { animation: slideInLeft 0.25s ease; }

/* Font scaling */
.question-stem { font-size: calc(16px * var(--font-scale)); }
.option-text { font-size: calc(15px * var(--font-scale)); }
.result-item-stem { font-size: calc(14px * var(--font-scale)); }
.study-explanation { font-size: calc(14px * var(--font-scale)); }
.study-answer-text { font-size: calc(15px * var(--font-scale)); }

/* Safe area for content above bottom nav */
.safe-area {
  padding-bottom: 80px;
}

/* ========== Mobile responsive ========== */
@media (max-width: 480px) {
  .home-header { padding: 30px 16px 16px; }
  .home-header h1 { font-size: 24px; }
  .year-card { padding: 14px 16px; }
  .year-card .year-badge { width: 52px; height: 52px; font-size: 18px; }

  .option-item { padding: 16px 14px; min-height: 56px; }
  .option-text { font-size: calc(14px * var(--font-scale)); }
  .question-stem { font-size: calc(15px * var(--font-scale)); }
  .bottom-nav { padding: 8px 12px; }
  .nav-btn { padding: 12px 16px; font-size: 15px; min-height: 44px; }
  .answer-card-btn { padding: 12px; font-size: 15px; min-height: 44px; }
  .answer-card-panel { max-height: 80vh; }
  .judge-btn { padding: 18px; font-size: 17px; }
  .mode-toggle { font-size: 11px; padding: 5px 10px; }
  .font-btn { width: 28px; height: 28px; font-size: 12px; }
  .stats-row { gap: 16px; }
  .stat-value { font-size: 26px; }
}
</style>

<script>
// ==================== DATA ====================
const ALL_EXAMS = [{"year":"2019","exam_name":"2019年广东省普宁市教师招聘考试真题卷","total_questions":74,"questions":[{"number":1,"type":"单选","stem":"广义的教育制度是指()。","options":{"A":"国民教育制度","B":"教育规章制度","C":"社会教育制度","D":"学校教育制度"},"answer":"A","explanation":"本题考查的是教育制度的概念。A项，广义的教育制度指国民教育制度，是一个国家为实 现其国民目的，从组织系统上建立起来的一切教育设施和有关规章制度，A项符合题意。B项，教育规章制度 是指教育系统、教育部门、教育单位内部制定的具有特殊目的指向性和一定约束力的各类行为准则，包括有关 的规定、办法、规则、章程、条例、守则、细则、准则、规范、公约、须知等，是广义教育制度的下位概念， 故排除。c项，社会教育制度是教育科技制度、教育人才就业制度、教育行政管理制度、教育人才开发制度和 学校教育制度的整体表述，是广义教育制度的上位概念，故排除。D项，学校教育制度是狭义的教育制度，简 称学制，是一个国家各级各类学校的总体系，具体规定各级各类学校的性质、任务、目的、入学条件、修业年 限以及它们(学校)之间的关系，是广义教育制度的下位概念。因此本题选择A项"},{"number":2,"type":"单选","stem":"在下列主张中比较集中体现了启发性教学原则的是 ()。","options":{"A":"开而弗达","B":"因材施教","C":"学不踹等","D":"温故而知新"},"answer":"A","explanation":"本题考查的是启发性教学原则。启发性教学原则的基本含义是：教师在教学工作中依据 学习过程的客观规律，运用各种教学手段充分调动学生学习主动性、积极性，引导他们独立思考，积极探索， 生动活泼地学习，自觉地掌握科学知识和提高分析问题和解决问题的能力的教学原则。A项，“开而弗达”的 意思是启发学生而不能直接向学生灌输知识，强调“启发”，体现了启发式教学原则，A项符合题意。B项， “因材施教”指针对学习的人的志趣、能力等具体情况进行不同的教育，体现因材施教的教学原则———即教 师要从课程计划、学科课程标准的统一要求出发，面向全体学生，同时要根据学生的实际情况、个别差异，有 的放矢地进行教学，使每个学生都能扬长避短，获得最佳发展，没有体现“启发”，故排除。C项，“学不瞩 等”的意思是学习不能超越次第，体现循序渐进教学原则——即教师严格按照科学知识的内在逻辑体系和学生 认识能力发展的顺序进行教学，没有体现“启发”，故排除。D项，“温故而知新”指温习旧知识从而得知新 的理解与体会，体现巩固性原则———即教师要引导学生在理解的基础上牢固地掌握知识和基本技能，而且在 需要的时候，能够准确无误地呈现出来，以利于知识、技能的运用，没有体现“启发”，故排除。因此本题选 择A项。"},{"number":3,"type":"单选","stem":"在教育目的问题上，法国教育家卢梭的主张显示了 ()。","options":{"A":"社会本位论思想","B":"个人本位论思想","C":"社会效益论思想","D":"教育无目的论思想"},"answer":"B","explanation":"本题考查的是有关教育目的的理论。卢梭提倡自然主义教育思想，认为开创新教育的目 标和根本原则是“归于自然”。个人本位论从个体本能需要出发，强调教育要服从人的成长规律和满足人的需 要；注重教育对个人的价值；主张教育的目的是培养“自然人”，发展人的个性，增进人的价值，促使个人自 我实现，其观点与卢梭的主张基本一致，B项符合题意。A项，社会本位论从社会发展需要出发，注重教育的 社会价值；主张教育的目的是培养合格公民和社会成员；教育是国家的事业；评价教育要看其对社会的发展贡 献的指标，正与卢梭的观点相反，故排除c项，社会效益论是对风险投资实施监管的主要理论之一。该理论认 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 31 为，监管是政府提供的为满足公众要求，用来矫正市场失灵的一种方法通过监管，能够取得公共福利，提高潜 在福利，该理论与卢梭的教育主张无关，故排除。D项，教育无目的论否定教育的一般的、抽象的目的，强调 教育过程内有的目的，即每一次教育活动的具体目的，属于杜威的观点，与卢梭的教育主张不同，故排除。因 此本题选择B项。"},{"number":4,"type":"单选","stem":"教育史上最早提出教学的教育性原则的教育家是()。","options":{"A":"裴斯泰洛奇","B":"赫尔巴特","C":"夸美纽斯","D":"柏拉图"},"answer":"B","explanation":"本题考查的是赫尔巴特的教育性原则。教学的教育性原则强调任何教学都必须同时进行 道德教育。赫尔巴特提出教育性教学原则：“我想不到有任何无教学的教育，正如相反方面，我不承认有任何 无教育的教学。”B项符合题意。A项，裴斯泰洛奇最早提出“教育心理学化”的主张，也是西方教育史上第 一位将“教育与生产劳动相结合”这一思想付诸实践的教育家，但没有提出教学的教育性原则，故排除。c 项，夸美纽斯首次系统论述班级授课制方法和实施内容，但没有提出教学的教育性原则，故排除。D项，柏拉 图写出了《理想国》，最早提倡“寓学习于游戏”的观点，但没有提出教学的教育性原则，故排除。因此本题 选择B项"},{"number":5,"type":"单选","stem":"在情境教学中，教学环境是一种人为设计的问题情境，它与现实问题情境","options":{"A":"有所不同","B":"相类似","C":"有一定联系","D":"没有必然联系"},"answer":"B","explanation":"本题考查的是情境教学。情境教学指在应用知识的具体情境中进行知识的教学的 一种教学策略。在情境教学中，教学的环境是与现实情境相类似的问题情境。ACD与概念不符。因此本题 选择B项。"},{"number":6,"type":"单选","stem":"终身教育的本质在于现代人的一生应该是终身学习、终身发展的一生。请问“终身教育”的提出者 是( )。","options":{"A":"保罗·郎格朗","B":"杨贤江","C":"杜威","D":"孟禄"},"answer":"A","explanation":"本题考查的是终身教育思想。终身教育指人从出生到死亡为止的整个一生的教育。 保罗·朗格朗曾于20世纪60年代发《论终身教育》报告书，标志着终身教育的概念化和体系化形成，A 项符合题意。B项，杨贤江是我国第一部以马克思主义为指导的教育学著作《新教育大纲》的作者，并非 “终身教育”的提出者，故排除。c 项，杜威是实用主义学派的创始人，也是《民主主义与教育》的作 者，并非“终身教育”的提出者，故排除。D项，孟禄是教育心理起源论的代表人物，并非“终身教育” 的提出者，故排除。因此本题选择A项"},{"number":7,"type":"单选","stem":"被形象地比喻为“帮助少年起飞”的教育阶段是 ()。","options":{"A":"小学教育","B":"初中教育","C":"高中教育","D":"大学教育"},"answer":"B","explanation":"本题考查的是初中阶段的个体发展。初中学生的年龄处于个体发展的少年期，即部 分心理学家所说的“危险期”或“心理断乳期”，这一时期的少年对人生似懂非懂，渴求自主，力求摆脱 成人束缚。因此初中教育在个体发展阶段是十分重要却又十分艰巨的。总的说来，初中教育在促进少年身 心发展方面的任务，可形象地比喻为“帮助少年起飞”。A在童年期，排除。CD在青年期，排除。故答案 选择B。"},{"number":8,"type":"单选","stem":"朱熹在《大学章句·序》中，论述道： “一有聪明睿智能尽其性者出於其间，则天必命之以为亿兆 之君师。 ”体现( )。","options":{"A":"神话起源论","B":"生物起源论","C":"心理起源论","D":"劳动起源论"},"answer":"A","explanation":"本题考查的是教育的起源。这句话译文为：“一旦在社会群体中出现了聪明智慧并 且能充分发展其善良本性的人，那么，上天必定赋予他一个使命，让他担当众人的君师(即领袖，或领导 人)，使其治理和教育众人，以恢复众人本来应有的善良和理性的本性”。认为教育来自上天。神话起源 论认为，教育是由人格化的神(上帝或天)所创造的，教育体现神或上天的意志，使人皈依于神或顺从于 天，A项符合题意。B项，生物起源论认为，教育的产生完全来自动物的生存本能，并不强调“上天”， 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 33 故排除。C 项，心理起源论认为，教育起源于日常生活中儿童对成人的无意识模仿，并不强调“上 天”，故排除。 D 项，劳动起源论认为，教育起源于劳动过程中社会生产需要和人的发展需要的辩证统一，并不强调 “上天”，故排除。因此本题选择A项"},{"number":9,"type":"单选","stem":"“君子欲化民成俗，其必由学乎”“古之王者，建国君民，教学为先”主张以社会的稳定和发展为 教育最高宗旨来确定教育目的，体现了()的教育目的观点。","options":{"A":"教育无目的论","B":"社会本位论","C":"科学本位论","D":"个人本位论"},"answer":"B","explanation":"本题考查的是教育目的理论。“君子欲化民成俗，其必由学乎”意思是君子如 果要教化人民，形成良好的风俗习惯，一定要从教育入手。“古之王者，建国君民，教学为先”意思 是古代的君王建立国家，治理民众，都把教育当作首要的事情。这两句话强调教育的政治功能。社会 本位论从社会发展需要出发，注重教育的社会价值；主张教育的目的是培养合格公民和社会成员；教 育是国家的事业；评价教育要看其对社会的发展贡献的指标，B 项符合题意。A 项，教育无目的论认 为，教育的目的就是它本身，否定教育的一般的、抽象的目的，强调教育过程内有的目的，即每一次 教育活动的具体目的，并不体现教育的政治功能，故排除。c 项，科学本位论是相对于艺术本位论而 言的，就教育领域而言，科学本位论认为教育是一门科学而不是艺术，因为它有客观规律可循，该观 点并不体现教育的政治功能，故排除。D 项，个人本位论从个体本能需要出发，强调教育要服从人的 成长规律和满足人的需要；注重教育对个人的价值；主张教育的目的是培养“自然人”，发展人的个 性，增进人的价值，促使个人自我实现，恰与题意相反，故排除。因此本题选择B项"},{"number":10,"type":"单选","stem":"在实际教学过程中，知识直观的方式主要有实物直观、模象直观和","options":{"A":"言语直观","B":"形象直观","C":"感知直观","D":"表象直观"},"answer":"A","explanation":"本题考查的是直观教学。直观教学可以分为三大种类：实物直观、模象直观 (图片幻灯片视频)和言语直观三大类。言语直观(PerceptiontoSpeech)指的是通过生动形象的语言使 学生获得感性认识的直观方式，A 项符合题意。B 项，形象直观指的是事物以形象的形态呈现进而被 认识、被直观到，它是客观事物直观的方式，故排除。c 项，感知直观源自《胡塞尔意识现象学》， 即“纯粹的感知”，意味着“对象完全而充分的自我呈现”，人们所认识的事物就是事物本身，在本 题题干中，它等同于“直观”的含义，故排除。D 项，表象直观源自费尔巴哈的《未来哲学原理》， 是一种认知形式，指人们最初看见的事物并不是事物本身，而是事物的表象。因而他自己的本质被保 留于表象之中，无法看见事物本身，进而无法确证自己的存在，表象直观无法使学生认识到事物本 身，因而不可能被运用于实际教学中，故排除。故答案选择A。"},{"number":11,"type":"单选","stem":"合作学习也是一种教学策略，它的特征是以学生主动合作学习的方式代替","options":{"A":"说理教育法","B":"榜样教育法","C":"陶冶教育法","D":"自我修养法"},"answer":"A","explanation":"本题考查的是合作学习。合作学习是相对于“个体学习”而言的一种学习组织 形式，是指学生们以主动合作学习的方式代替教师主导教学的一种策略。合作学习的目的不仅是培养 学生主动求知的能力，而且发展学生在合作过程中的人际交流能力。BCD不合题意。故答案选择A"},{"number":12,"type":"单选","stem":"“教育即生活” “学校即社会” “从做中学”是()的重要主张","options":{"A":"实践教育学派","B":"实证教育学派","C":"传统教育学派","D":"实用主义教育学派"},"answer":"D","explanation":"本题考查的是教育学的理论流派。“教育即生活”“学校即社会”和“从做中学” 杜威的教育主张。实用主义教育学的主要观点在于：教育即生活，教育即生长，教育即经验的不断改造和 改组；学校即社会；从做中学；以学生为中心，与题干主张相同，D项符合题意。A项，实践教育学是在 深厚的理论基础上，结合对中国教师发展和基础教育实践中的若干主要问题的思考，建构起来的一个理论 体系，有六大特色：情感先行、攻心为术、追求效率、追因溯源、操作指南、经验培育，与题干主张不 同，故排除。B项，实证教育学派的中心论点为事实必须是透过观察或感觉经验，去认识每个人身处的客 观环境和外在事物。实证主义的目的在于希望建立知识的客观性，与题干主张不同，故排除。c项，传统 教育学派强调教师中心，课堂中心和教材中心，与题干主张相反，故排除。因此本题选择D项。"},{"number":13,"type":"单选","stem":"教学的首要任务是()。","options":{"A":"引导学生掌握科学文化基础知识和基本技能","B":"发展学生智力、体力和创造才能\nc.培养社会主义品德和审美情趣，奠定学生的科学世界观基础","D":"关注学生个性发展"},"answer":"A","explanation":"本题考查的是教学任务。传授系统的科学基础知识和基本技能是教学的首要任务。 BCD是教学的任务，但不是首要任务，故答案选择A。"},{"number":14,"type":"单选","stem":"哪吒在天雷降临时喊出“我命由我不由天”，这是强调()的作用","options":{"A":"遗传素质","B":"主观能动性","C":"环境","D":"教育"},"answer":"B","explanation":"本题考查的是影响人身心发展的因素。A项，遗传素质是指从上代继承下来的生理 解剖上的特点。如机体的结构、形态、感官和神经系统的特点，“我命由天不由我”即强调遗传素质的作 用，故排除。B项，主观能动性是指通过自我意识、自我态度，根据自己的意愿和思想，主动、自觉地而 不是被动地按照自己的意愿进行认识和实践的特性。个体主观能动性是人的主体性的表现，其最高层次表 现为创造性，B项符合题意。C项，环境泛指个体生活中影响个体身心发展的一切外部因素，包括自然环 境和社会环境，能将遗传素质对个体的影响转化为现实，哪吒的话并不强调环境，故排除。D项，学校教 育在人的发展中起主导作用，哪吒的话并不强调环境，故排除。这句话指的是，我们可以按照自己的意愿 改造生活。因此本题选择B项。"},{"number":15,"type":"单选","stem":"在所要学习的新材料呈现前提供一种引导性材料，它在学习材料与学习者原有观念之间起认知桥梁 的作用，这种教学策略是()。","options":{"A":"先行组织者策略","B":"认知结构策略 c.比较性组织者策略","D":"固定点策略"},"answer":"A","explanation":"本题考查的是先行组织者策略。所谓“先行组织者”，是先于学习任务本身呈现的 一种引导性材料，它要比学习任务本身有较高的抽象、概括和综合水平，并且能够清晰地与认知结构中原 有观念和新任务关联起来。这种呈现“先行组织者”的教学策略即为先行组织者策略。故A选项正确。B 项，认知结构策略是内容型的教学策略，主张抓住主要知识，构建简明而有机的知识体系，与题干意思不 符，故排除。c项，比较性组织者策略是由先行组织者引申发展而来，旨在帮助学生分清新旧知识间的差 异，促使学生的原有知识向较高层次和精细化发展，与题干意思不符，故排除。D项，固定点策略并非专 业术语，而“原有知识固定点策略”是专业术语，其含义与先行组织者策略一致，故排除。因此本题选择 A项。"},{"number":16,"type":"单选","stem":"老师利用成长记录袋的方法对学生进行评价，这属于一种()。","options":{"A":"品德评价法","B":"榜样示范法","C":"道德修养法","D":"说服教育法"},"answer":"A","explanation":"本题考查的是德育方法。成长记录袋是从国外引进的一种新兴评价方式，是根据教 育教学目标，有意识地将各科有关学生表现的作品及其他证据收集起来，通过合理地分析与解析，反映学 生在学习与发展过程中的优势与不足，反映学生在达到目标的过程中付出的努力与进步，并通过学生的反 思与改进，激励学生取得更高的成就。品德评价法是通过对学生品德进行肯定或否定的评价而予以激励或 抑制，促使其品德健康形成和发展。它包括奖励、惩罚、评比和操行评定，A项符合题意。B项，榜样示 范法指的是用榜样人物的高尚思想、模范行为、优异成就来影响学生的思想、情感和行为的方法。 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 36 用来示范的榜样主要有家长和教师、同学、英雄人物、革命领袖、历史伟人和文艺形象，成长记录袋并不 体现榜样示范，故排除。C项，道德修养法指的是教师指导学生自觉主动地进行学习、自我反省，以实现 思想转化及行为控制。品德修养是建立在自我意识、自我评价能力发展基础上的人的自觉能动性的表现， 建立成长记录袋并不是一种自我反省的方式，排除。D项，说服教育法是通过摆事实、讲道理，使学生提 高认识、形成正确观点的方法，建立成长记录袋并不是说服教育的方式，故排除。因此本题选择A项。"},{"number":17,"type":"单选","stem":"教育自身的许多规律，是人类长期教育实践认识的结果，它们不会因政治经济制度和其他文化的发展而过 时，更不能随时代的发展而被否定，这说明教育具有()。","options":{"A":"不平衡性","B":"相对独立性","C":"历史继承性","D":"永恒性"},"answer":"B","explanation":"本题考查教育的社会属性。A项，不平衡性是指教育与社会生产力和政治经济制度 发展的不平衡性。教育与生产力的发展和政治经济制度的变革并非完全同步：教育相对独立于生产力的发 展水平；教育相对独立于政治经济制度，不符合题意，故排除。B项，教育的相对独立性是指教育具有自 身的运行规律和发展特点，即不会因政治经济制度和其他文化的发展而过时，更不能随时代的发展而被否 定，B项符合题意。c项，历史继承性指的是任何教育都具有历史继承性；教育要注意继承与发扬本民族 的传统，不符合题意，故排除。D项，永恒性指的是教育是人类所特有的社会现象，只要人类社会存在， 就存在教育，不符合题意，故排除。因此本题选择B项。"},{"number":18,"type":"判断","stem":"教育的显性功能与隐性功能的区分是相对的，一旦隐性的潜在功能被有意识地开发、利用，就可以转变成 显性功能。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是教育功能。教育的显性功能指教育活动依照教育目的，在实际运行中 所出现的与之相吻合的结果。如促进人的全面和谐发展、促进社会进步等，就是显性教育功能的表现。显 性功能的主要标志是计划性。教育的隐性功能指伴随显性教育功能所出现的非预期性的功能。显性功能与 隐性功能的区分是相对的，一旦隐性的潜在功能被有意识地开发、利用，就可以转变成显性教育功能。故 答案选择A。"},{"number":19,"type":"判断","stem":"科学技术对教育的影响，首先表现为对教育发展的动力作用，而且还能为教育的发展指明方向、预示结 果。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是科学技术对教育的影响。科学技术对教育的影响，首先表现为对教育 发展的动力作用。科学是活跃的、革命性的，科学的发展对教育提出新的要求和挑战，冲击教育的习惯领 域，导致教育中的新与旧、先进与落后的矛盾斗争，最终促成教育的革新与发展。其次，科学的发展不但 对教育的发展提供动力，而且还能为教育的发展指明方向、预示结果，引导教育遵循科学的发展规律前 进，故答案选择 Ao"},{"number":20,"type":"判断","stem":"颜回说： “夫子循循然善诱人，博我以文，约我以礼，欲罢不能。”这反映了德育的长善救失原则。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查的是德育原则。“夫子循循然善诱人，博我以文，约我以礼，欲罢不能” 译为：老师善于一步一步地诱导我，用各种典籍来丰富我的知识，又用各种礼节来约束我的言行，使我 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 37 想停止学习都不可能，直到我用尽了我的全力。这反映了德育的疏导原则——指进行德育要循循善诱，以理服 人，从提高学生认识入手，调动学生的主动性，使他们积极向上。而长善救失原则指教育者要善于依靠、发扬 学生自身的积极因素，调动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转化，故答案选 择B。"},{"number":21,"type":"判断","stem":"小学生的思维以具体形象思维方式为主，这是小学教学中必须贯彻直观性教学原则的依据。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是教学原则。小学基本处于具体运算阶段，思维需要依靠具体事物，教学需 要遵循直观性教学原则——利用学生的多种感官与已有经验，通过各种形式的感知，丰富学生的直接经验和感 性认识，使学生获得生动的表象，从而全面地掌握知识，故答案选择A。"},{"number":22,"type":"判断","stem":"班主任既通过对集体管理去间接影响个人，又通过对个人直接管理去影响集体，从而把对集体和个人的管 理结合起来的管理方式是班级平行管理。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是班级管理。班级平行管理是指班主任既通过对集体的管理去影响个人，又 通过对个人的直接管理去影响集体，从而把对集体和个人的管理结合起来的管理方式，是由马卡连柯提出的。 故答案选择A。 第二部分心理学 (占全卷 35分)"},{"number":23,"type":"判断","stem":"注意的分配就是注意的分散。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查的是注意的品质。注意的分散是指注意离开了心理活动所要指向的对象，而被 无关的对象吸引去的现象。注意的分配是在同一时间内把注意力集中于两种或两种以上对象或活动上的特性。 二者不同。故答案选择B。"},{"number":24,"type":"判断","stem":"过度学习就是超任务量地学习，次数越多越好。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查的是记忆过程。对识记材料的学习程度也在一定程度上影响遗忘，学习程度太 小或太大，都不利于对知识的记忆。实验证明，过度学习(指学习达到恰能背诵之后再继续学习)达到50%，即 学习的熟练程度达到150%时，记忆效果最好。故答案选择B。"},{"number":25,"type":"判断","stem":"当刺激停止后，视感觉并不立即消失而是逐渐减弱，这种视感觉残留的现象叫做感觉后效。 () 第38页","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是感觉后效。在刺激作用停止后暂时保留的感觉现象称之为感觉后效，也叫 感觉后像，故答案选择A"},{"number":26,"type":"判断","stem":"儿童多动综合征是小学生中最为常见的一种以注意力缺陷和活动过度为主要特征的行为障碍综合征， 其高峰发病年龄为6-8岁。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是多动症。儿童多动综合征又称“轻微脑功能障碍综合征”(MBD)，是儿童 时期一种较常见的行为异常性疾患。患儿智力正常或接近正常，以难以控制的动作过多，注意力不集中，情绪 不稳，冲动任性，并有不同程度学习困难为临床特征。本病男孩多于女孩，好发年龄为6-14 岁，国内外文献 报道，占学龄儿童的5%~10%。发病与遗传、环境、产伤等有一定关系。故答案选择A。"},{"number":27,"type":"判断","stem":"斯金纳在狗摇铃进食实验中发现了经典性条件反射原理。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查行为主义学习理论。巴普洛夫在狗摇铃进食实验中发现了经典性条件反射原 理，斯金纳发现了操作性条件反射原理。故答案选择 Bo"},{"number":28,"type":"判断","stem":"根据埃里克森的理论，2-3岁的发展任务是培养自主性。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是埃里克森人格发展阶段理论 18个月到3岁的时候的主要矛盾为自主对羞 怯与怀疑，发展任务是培养自主性，故答案选择A。"},{"number":29,"type":"判断","stem":"在学习过程中制定自我学习计划、实施自我监督以及自我调控的策略，一般称为组织策略。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查的是元认知策略。在学习过程中制定自我学习计划、实施自我监督以及自我调 控的策略，一般称为元认知策略，而非组织策略。组织策略是整合所学新知识之间、新旧知识之间的内在联 系，形成新的知识结构。故答案选择B。"},{"number":30,"type":"判断","stem":"人们在信息加工过程中倾向于依赖内在参照或内部感知线索作为指导的认知风格是场独立型。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是认知风格。场独立性的学生是“内部定向者”：对客观事物做判断时，常 常利用内在的参照(主体感觉)，不易受外来的因素影响和干扰，独立对事物作出判断；场独立性的人善于分析 和组织。场依存性的学生是“外部定向者”，对事物作出判断时倾向于以外部参照(身外的客观事物)作为信息 加工的依据，容易受周围人们，特别是权威人士的影响和干扰，善于察言观色。场依存性的人不能将一个模式 (或图式)分解成许多部分，或者只专注于情境的某一个方面。故答案选择A。 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 38"},{"number":31,"type":"判断","stem":"心理定势对问题解决的影响所起的作用或是积极的，或是消极的。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是定势。心理定势对问题解决的影响所起的作用或是积极的，或是消极 的。故答案选择A。"},{"number":32,"type":"判断","stem":"对于一个过分害怕猫的学生，我们可以让他先看猫的照片、谈论猫，再让他远远观看关在笼中的猫， 接着让他靠近笼中的猫，最后让他用手触摸猫，逐步消除对猫的惧怕反应。这种方法在心理治疗中称为系 统脱敏疗法。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查的是影响行为改变的方法。系统脱敏的含义是，当某些人对某事物、某环 境产生敏感反应(害怕、焦虑、不安)时，在当事人身上发展起一种不相容的反应，使对本来可引起敏感反 应的事物，不再发生敏感反应。包括几个步骤：①建立焦虑刺激等级表。焦虑等级评定以受辅导学生主观 感受为标准，排在最前面的是仅能引起最弱程度焦虑的刺激。②进行全身放松训练。③焦虑刺激与松弛活 动相配合。系统脱敏法由沃尔朴1958年首创。故答案选择A"},{"number":33,"type":"单选","stem":"学生的“向师性”和模仿性的心理特征决定了教师的劳动具有() A长期性","options":{"B":"复杂性 c.主体性","D":"示范性"},"answer":"D","explanation":"本题考查教师劳动的特点。A项，长期性指人才培养的周期比较长，教育的影响具 有迟效性。教师劳动的成效并不是一时就可以检验出来的，而是需要教师付出长期的大量的劳动才能看到 结果、得到验证，教师的某些影响对学生终身都会发生作用。 B项，教师劳动的复杂性主要表现在以下三个方面：(1)教育目的的全面性。(2)教育任务的多样性。(3) 劳动对象的差异性。c项，主体性指教师自身可以成为活生生的教育因素和具有影响力的榜样。对于教师 来说，首先教育教学过程就是教师直接用自身的知识、智慧、品德影响学生的过程。再者，教师劳动工具 的主体化也是教师劳动主体性的表现。教师所使用的教具、教材，也必须为教师自己所掌握，成为教师自 己的东西，才能向学生传授。D项，示范性指教师的言行举止，如人品、才能、治学态度等都会成为学生 学习的对象。题干中，向师性即学生尊重、崇敬教师，乐意接受教师教导的自然倾向性。模仿性，指中小 学生模仿性强，凡是他们崇拜的人物、他们认为值得仿效的行为、新奇有趣的东西、使他们受到激励的事 物等都是其模仿的对象。教师劳动的示范性特点是由学生的可塑性、向师性等心理特征决定的。因此答案 选择D项。"},{"number":34,"type":"单选","stem":"“一俊遮百丑”和“一坏百坏”体现的是()。","options":{"A":"量轮效应","B":"首因效应 c.刻板印象","D":"投射效应"},"answer":"A","explanation":"本题考查的是印象形成效应。A 项，晕轮效应是指当我们认为某人具有某种特征 时，就会对其他特征作相似判断，也称为光环效应。B项，首因效应是指在总体印象形成上，最初获得的 信息比后来获得的信息影响更大，也叫最初效应。c项，刻板印象是指对一群人的特征或动机加以概括， 把概括得出的群体的特征归属于团体的每一个人，认为他们都具有这种特征，而无视团体成员的个体差 异。D项，投射效应是指因个体具有某种特性而推断他人也具有与自己相同特性的社会心理现象，即“以 己度人”“将心比心”，认为自己的言行和需要，别人也一定会有类似的言行和需要。题干中，“一俊遮 百丑”“一坏百坏”是指我们认为这人有一个地方好看就觉得他哪里都好看，有一方面比较坏就哪里都 坏，说明当我们认为某人具有某种特征时，就会对其他特征作相似判断，体现了光环效应，因此正确答案 选A。"},{"number":35,"type":"单选","stem":"“将心比心”和“换位思考”所体现的心理机制是","options":{"A":"移情","B":"从众 c.期望","D":"顺从"},"answer":"A","explanation":"本题考查的是心理防御机制。A项，这里所说的移情实际上是共情的含义，共情是 一种认知和情感状态。共情是设身处地理解他人的想法，在智力上理解他人的一种情感状态。B项，从众 是指群体成员在真实的或想象的群体压力下其行为或信念上的改变，及其伴随的行为方式。c项，期望是 个体在动机的支配下，自我确定的结果的预期值或目标。D项，顺从是指选择听从施压一方的要求而采取 行为。题干中，“将心比心”“换位思考”是要求我们设身处地地为他人着想，故答案选择A。"},{"number":36,"type":"单选","stem":"对学习内容或学习结果感兴趣而形成的动机，可称为()。","options":{"A":"兴趣性动机","B":"间接性动机 c.情趣动机","D":"近景的直接性动机"},"answer":"A","explanation":"本题考查的是学习动机的分类。A项，兴趣性动机主要指人的兴趣、好奇心、价值 取向、信仰、理想等方面的意图和信念。B项，根据学习动机与学习活动的关系，可以分为直接动机和间 接动机。间接动机，与社会意义相联系，是社会观念、父母意愿以及教师期望在学生头脑中的反映。c 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 39 项，不存在情趣动机这种说法，干扰选项。D项，直接动机指由学习活动本身直接引起，表现为对所学习 的学科内容或学习活动的直接兴趣和爱好，近景性动机是指动机与近期目标相关联。题干无法体现近期目 标，故排除。故答案选择A。"},{"number":37,"type":"单选","stem":"有的心理学家把学生表现出的破坏课堂秩序、不遵守纪律和不道德等行为归纳为","options":{"A":"冲动型问题行为","B":"扰乱性的问题行为 c.多动型问题行为","D":"自律障碍行为"},"answer":"B","explanation":"本题考查的是问题行为的分类。B项，有人把破坏课堂秩序、不遵守纪律和不道德 的行为等归纳为扰乱性的问题行为；把退缩、神经过敏等行为归纳为心理问题行为。有人还把问题行为分 成品行性问题行为、性格性问题行为以及情绪上、社会上的不成熟行为三种类型。ACD为干扰项。故答案 选择B。"},{"number":38,"type":"单选","stem":"学生课前预习，带着不懂的问题去上课，以便更有针对性地注意听讲。这种注意方式属于","options":{"A":"有意注意","B":"无意注意 c.无意后注意","D":"有意后注意"},"answer":"A","explanation":"本题考查的是注意的分类。A项有意注意是指既有预定又需要意志努力的注意，也 称为随意注意。B 项，无意注意是指既没有预定目的又不需要意志努力的注意，也叫作不随意注意。C 项，无意后注意不存在。D项，有意后注意是指有预定目的但是不需要意志努力的注意。有意后注意是在 有意注意的基础上，并在有意注意之后产生的。题干中，关键信息“带着不懂的问题去上课，以便更有针 对性地注意听讲”，这种注意有目的也有意志努力。故答案选择A"},{"number":39,"type":"单选","stem":"离下课还有10分钟，这时候一些学生的注意力开始涣散，老师说： “如果大家认真听课，我就免 去今天的额外作业。”学生开始认真听课了。老师采取的措施是","options":{"A":"正强化","B":"负强化 c.惩罚","D":"消退"},"answer":"B","explanation":"本题考查的是强化理论。A项，正强化是指给予一个愉快刺激，使行为频率增强。B 项，负强化是指去掉一个厌恶刺激，使行为频率增强。c项，惩罚是指去掉一个愉快刺激或给予一个厌恶 刺激，使行为频率降低。D项，消退是指当某个已经被强化过的行为，不再给予其强化时，该行为会逐渐 减弱直至消失。题干中，关键信息“免去今天额外作业”，去掉作业这个厌恶刺激以增强认真听课这一行 为频率的，属于负强化。因此正确答案选择B。"},{"number":40,"type":"单选","stem":"小明能根据A>B， B>C，则A>C的原理，推出","options":{"A":"感知运动","B":"前运算","C":"具体运算","D":"形式运算"},"answer":"D","explanation":"本题考查的是皮亚杰认知发展阶段理论。A项，感知运动阶段的主要特点是低级的 行为图式以及产生客体永恒性。B项，前运算阶段的主要特点是自我中心、不守恒性、泛灵论、不可逆性 等。c项，具体运算阶段主要特点思维守恒、思维可逆、去自我中心等，可以进行简单的集群运算，但此 时的集群运算必须借助表象的帮助。D项，形式运算阶段的儿童可以理解比喻、隐喻、符号等，并且能够 借助符号进行集群运算。根据题意，已经可以通过符号进行集群运算，达到形式运算阶段，故答 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 40 案选择D。"},{"number":41,"type":"单选","stem":"放在水中的筷子，看上去是弯的，但我们认为它是直的，这是知觉的","options":{"A":"选择性","B":"理解性 c.整体性","D":"恒常性"},"answer":"D","explanation":"本题考查的是知觉的特性。A项，人在知觉过程中把知觉对象从背景中区分出来优 先加以清晰地反映的特性就叫知觉的选择性。B项，在知觉过程中，人们总是根据已有的知识经验来解释 当前知觉的对象，并用语言来描述它，使它具有一定的意义，就是知觉的理解性。c项，知觉的对象是由 不同部分和属性组成的，但我们总是把客观事物作为整体来感知，即把客观事物的个别特性综合为整体 来反映，这就是知觉的整体性 D项，当知觉的条件在一定范围内发生变化时，人的知觉的映象仍然保持 相对不变的特性就叫知觉的恒常性。题干中，筷子看上去是弯的，但我们对它的知觉映像保持不变，故 答案选择D。"},{"number":42,"type":"单选","stem":"丽丽认为这次考试取得好成绩是因为试题简单，依据维纳的归因理论，这属于","options":{"A":"稳定、外在、可控归因","B":"不稳定，外在、不可控归因\nc.不稳定、外在、可控归因","D":"稳定、外在、不可控归因"},"answer":"D","explanation":"本题考查的是维纳的归因理论。A项，根据维纳的归因理论，稳定、外在、可控的 因素不存在。B 项不稳定、外在、不可控因素有运气和环境。C 项不稳定、外在、可控因素不存在。D 项，稳定、外在、不可控因素是工作难度。题干中，“试题简单”属于工作难度，故答案选择D。"},{"number":43,"type":"单选","stem":"后学习的材料对保持和回忆先学习材料的干扰作用叫()。","options":{"A":"倒摄抑制","B":"前摄抑制 c.正迁移","D":"负迁移"},"answer":"A","explanation":"本题考查的是遗忘的原因。A项，倒摄抑制是指后面的学习内容会对先前的学习内 容产生干扰。B项，前摄抑制是指先前学习内容对后续学习内容造成干扰。c项，正迁移是指两种学习之 间产生积极影响。D项，负迁移是指两种学习之间产生消极影响。题干中，强调后面学习材料对先前的干 扰，故答案选择A。 第三部分教育法规与教师职业规范 (占全卷 35分)"},{"number":44,"type":"单选","stem":"《中华人民共和国义务教育法》颁布于","options":{"A":"1985 年","B":"1986 年","C":"1987 年","D":"1988年"},"answer":"B","explanation":"本题考查的是《中华人民共和国义务教育法》。该法于1986年4月12日第六届全国 人民代表大会第四次会议通过，自1986年7月1日起施行，2006年6月29日第十届全国人民代表大会常 务委员会第二十二次会议修订，2006年9月1日起实施。根据2015年4月24日第十二届全国人民代表大 会常务委员会第十四次会议全国人民代表大会常务委员会《关于修改〈中华人民共和国义务教育法〉等五 部法律的决定》修正。故答案选择B。"},{"number":45,"type":"单选","stem":"“明礼诚信”是中华民族的传统美德，而且也是现阶段我国《公民道德实施纲要》大力倡导的道德 规范，这说明道德具有()。","options":{"A":"社会性","B":"历史性 c.民族性","D":"继承性"},"answer":"D","explanation":"本题考查教师职业道德特点。题干关键信息为过去和现在在道德规范方面一脉相 承，“古今相似”，故答案选择D. A是指人格或者个人品德等方面的形成会受到社会环境的影响，和题 意中“古今需要明礼诚信”不一致，排除；B 是指过去和现在有所不同，即古今不同，并非“古今相 似”，排除；C是指不同民族有不同的文化特点，和题意中“古今需要明礼诚信”不一致，排除。故答案 选择D。"},{"number":46,"type":"单选","stem":"教师的职业形象中最基本的形象是","options":{"A":"道德形象","B":"管理形象 c.文化形象","D":"研究形象"},"answer":"A","explanation":"本题考查的是教师职业形象。职业形象是指个人在职场中公众面前树立的印象，具 体包括外在形象、品德修养、专业能力和知识结构这四大方面。教师职业形象包括道德形象，文化形象和 人格形象。教师的道德形象是最基本的形象，选择A符合题意。B项，为干扰项，排除B项。c项，教师 的文化形象是教师形象的核心，“才高八斗”“学富五车”皆是教师的典型的文化特征，并非最基本形 象，故排除 c项。D项，研究形象是中小学教师在进行教育研究中进行扮演的角色，主要为反思性实践 者、行动研究者、科学研究者，其中，反思性实践者应该是所有中小学教师持续扮演的研究形象，排除D 项。故答案选择A项。"},{"number":47,"type":"单选","stem":"当前，有少部分教师在课外从事有偿补课服务。这与《中小学教师职业道德规范》哪一项要求不相 符","options":{"A":"为人师表","B":"关爱学生 c.教书育人","D":"爱岗敬业"},"answer":"A","explanation":"本题考查教师职业道德的基本规范。A项，为人师表指的是坚守高尚情操，知荣明 耻，严于律己，以身作则。衣着得体，语言规范，举止文明。关心集体，团结协作，尊重同事，尊重家 长。作风正派，廉洁奉公。自觉抵制有偿家教，不利用职务之便谋取私利，和题干中“在课外从事有偿补 课服务”符合，故答案选择A。B项，关爱学生指的是关心爱护全体学生，尊重学生人格，平等公正对待 学生。对学生严慈相济，做学生良师益友。保护学生安全，关心学生健康，维护学生权益。不讽刺、挖 苦、歧视学生，不体罚或变相体罚学生，和题干中“在课外从事有偿补课服务”不符合，B错。C项，教 书育人指的是遵循教育规律，实施素质教育。循循善诱，诲人不倦，因材施教。培养学生良好品行，激发 学生创新精神，促进学生全面发展。不以分数作为评价学生的唯一标准，和题干中“在课外从事有偿补课 服务”不符合，c错。D项，爱岗敬业指的是忠诚于人民教育事业，志存高远，勤恳敬业，甘为人梯，乐 于奉献。对工作高度负责，认真备课上课，认真批改作业，认真辅导学生。不得敷衍塞责。和题干中“在 课外从事有偿补课服务”不符合，D错。所以答案选A。"},{"number":48,"type":"单选","stem":"正在读小学六年级的小刚经常无故旷课。依据《中华人民共和国未成年人保护法》的相关规定，学 校应当","options":{"A":"及时与监护人联系","B":"尊重小刚的选择 c.及时通报警方","D":"予以开除处理"},"answer":"A","explanation":"本题考查《中华人民共和国未成年人保护法》《中华人民共和国未成年人保护法》 第二十五条：对于在学校接受教育的有严重不良行为的未成年学生，学校和父母或者其他监护人应当互相 配合加以管教；无力管教或者管教无效的，可以按照有关规定将其送到专门学校继续接受教育。A项中和 监护人联系，相互配合进行管教，符合法律条文，A符合。B项意味着对小刚同学不管不顾，不符合法律 “学校和父母或者其他监护人应当互相配合加以管教”，B排除。c不合理，应该第一时间通知监护人。D 项学校不能随意开除学生，应该“无力管教或者管教无效的，可以按照有关规定将其送专门学校继续接受 教育”，D排除。故答案选择A。"},{"number":49,"type":"单选","stem":"班主任张老师按照学生的期中考试成绩调整座位，将考试成绩后5名的学生安排在教室的最后一排。 张老师的做法","options":{"A":"是激励学生的重要手段","B":"侵犯了学生的人格尊严权\nc.是管理班级的有效手段","D":"侵犯了学生的受教育权"},"answer":"B","explanation":"本题考查的是学生的权利。A项说明他是值得倡导的，并不符合题意，排除 A。B 学生享有人格尊严权，学校、教师应当尊重学生尊严，不得对学生实施体罚、变相体罚或其他侮辱人格 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 42 尊严的行为，和变相体罚的处理相一致，选择B。C项和针对变相体罚的态度不一致，c排除。D项学生 的受教育权包括受完法定年限教育权、学习权和公正评价权，不涉及变相体罚，D排除。将倒数5名同学 安排到教室最后，会伤害学生自尊心，属于变相体罚，不可取，故答案选择B。"},{"number":50,"type":"单选","stem":"小学生武某上课时，因起立回答问题，后排的同学陈某用脚将武某的椅子移开，结果武某重重地坐到 了地上。武某当时身体没有任何异样，老师也只批评了陈某几句，就继续上课。可是三天后，武某感到腿 脚发麻，后来发展为没办法正常坐着上课。父母将她送往医院诊断，经检查为尾锥受挫伤，导致下半身麻 痹，需要长期治疗。对这起事故， ()应该承担责任。","options":{"A":"陈某","B":"老师 c.陈某和老师","D":"陈某和学校"},"answer":"A","explanation":"本题考查《学生伤害事故处理办法》。《学生伤害事故处理办法》第十四条规定 因学校教师或者其他工作人员与其职务无关的个人行为，或者因学生、教师及其他个人故意实施的违法 犯罪行为，造成学生人身损害的，由致害人依法承担相应的责任。致害人为陈某。教师并不是导致武某 受伤的直接责任人，因此不用承担责任。故答案选择A。"},{"number":51,"type":"单选","stem":"临近期末考试，学校决定将音乐、体育、美术三门课程取消，让学生专心复习语文和数学等课程。 学校的做法","options":{"A":"正确，有利于学生集中精力复习","B":"不正确，侵犯了学生的受教育权\nc.正确，学校有权利进行课程调整","D":"不正确，侵犯了学生的休息权"},"answer":"B","explanation":"本题考查《中华人民共和国教育法》《中华人民共和国教育法》第四十三条规定 受教育者享有参加教育教学计划安排的各种活动，使用教育教学设施、设备、图书资料的权利。因此， 取消课程不可取。受教育权是公民的基本权利之一。由宪法确认和保障的公民受教育的权利。在我国， 宪法确认公民有受教育的权利和义务，这里指公民有获得文化科学知识和不断提高思想觉悟、道德水平 的权利，而且每个公民都必须按照法律要求，接受教育，并规定，国家培养青年、少年、儿童在品德、 智力、体质等方面全面发展。取消相关课程不利于学生全面发展。故答案选择B。"},{"number":52,"type":"单选","stem":"教师应当忠诚于人民的教育事业。这是对教师职业性质的规定，也是对教师()作出的一种原则上的 规定。","options":{"A":"职业理想","B":"职业素养","C":"道德理想","D":"道德素养"},"answer":"A","explanation":"本题考查教师职业理想。目前，我国已经颁布的法律中，关于教师职业道德方面的 要求与规定主要体现在职业理想、职业责任、职业纪律和确立教师资格四个方面。教师职业理想是教师职 业道德修养的重要内容之一，它的树立与教师职业性质有着密切联系。《中华人民共和国教师法》第三条 规定：“教师是履行教育教学职责的专业人员，承担教书育人、培养社会主义事业建设者和接班人、提高 民族素质的使命。教师应当忠诚于人民的教育事业。”这不仅是对教师职业性质的规定，同时也是对教师 职业理想作出的一种原则上的规定。A项，教师的职业理想是教师对成为一个成熟的教育教学工作者的向 往和追求。职业理想为教师提供奋斗目标，是推动教师发展，并献身教育工作的根本动力，符合相关表 述，选A。B项，职业素养包括道德素养、知识素养、能力素养和心理素养，和“教师应当忠诚于人民的 教育事业”不匹配，B排除 C选项为干扰项。D项道德素养以师德涵盖，是指教师职业活动中的道德要求 和道德表现，是指教师在从事教育劳动时所应遵守的行为规范和必备的品德的总和，和“教师应当忠诚于 人民的教育事业”不匹配，B排除。故答案选择A。"},{"number":53,"type":"单选","stem":"教师的表率作用主要体现在","options":{"A":"言行一致","B":"衣着整洁 c.举止端庄","D":"谈吐文雅"},"answer":"A","explanation":"本题考查教师的表率作用。教师的表率作用主要体现在言行一致，教师应时刻用高 标准要求自己的一言一行，向学生展示世界的真、善、美，用自己的言行为学生树立起较为完美的职业形 象，所以A符合。B项，“衣着整洁”和“教师应时刻用高标准要求自己的一言一行，向学生展示世界的 真、善、美，用自己的言行为学生树立起较为完美的职业形象”不一致，排除B。C项，“举止端庄” 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 43 只有“行”没有“言”，和“教师应时刻用高标准要求自己的一言一行，向学生展示世界的真、善、 美，用自己的言行为学生树立起较为完美的职业形象”不一致，排除 C。D 项，“谈吐文雅”只有 “言”没有“行”，和“教师应时刻用高标准要求自己的一言一行，向学生展示世界的真、善、美， 用自己的言行为学生树立起较为完美的职业形象”不一致，排除D。故答案选择A。"},{"number":54,"type":"单选","stem":"根据我国教师法规的有关规定， “弄虚作假、骗取教师资格的”与“品德不良、侮辱学生，影响恶 劣的”教师，其教师资格将 ()。","options":{"A":"给予撤销","B":"宣告中止","C":"永远丧失","D":"公告无效"},"answer":"A","explanation":"本题考查《教师资格条例》《教师资格条例》第十九条规定有下列情形之一 的，由县级以上人民政府教育行政部门撤销其教师资格：(一)弄虚作假、骗取教师资格的；(二)品行 不良、侮辱学生，影响恶劣的。被撤销教师资格的，自撤销之日起 5 年内不得重新申请认定教师资 格，其教师资格证书由县级以上人民政府教育行政部门收缴。故答案选择 ABD为干扰项。C选项是在 教师“被剥夺政治权利”或者“故意犯罪受到有期徒刑以及刑事处罚”会永久丧失教师资格，和相关 法律不符合，排除D。"},{"number":55,"type":"单选","stem":"素质教育是以培养()为重点的教育。","options":{"A":"实践能力","B":"健康的体魄","C":"高尚的道德","D":"创新精神"},"answer":"D","explanation":"本题考查素质教育。素质教育是以培养学生的创新精神和实践能力为重点的教 育，BC 排除。创新教育是素质教育的核心，是教育对知识经济向人才培养提出挑战的回应。故答案 选择D。"},{"number":56,"type":"判断","stem":"按照《中华人民共和国教育法》的规定，对在校园内结伙斗殴，寻衅滋事，扰乱学校及其他教育机 构教育教学秩序或者破坏校舍、场地及其他财产的，由学校来处罚。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查《中华人民共和国教育法》《中华人民共和国教育法》第七十二条规 定：结伙斗殴，寻衅滋事，扰乱学校及其他教育机构教育教学秩序或者破坏校舍、场地及其他财产 的，由公安机关给予治安管理处罚；构成犯罪的，依法追究刑事责任，故答案选择 B。77.【答案】 B。解析：本题考查教师职业道德修养的方法。个人在单独活动、无人监督时，也能自觉按照一定的 道德原则和规范去行动，不做违背道德的事，这种使道德修养达到最高境界的途径和方法就是慎独。 故答案选择B。"},{"number":57,"type":"判断","stem":"在一定情况下，对个别学生的违法违纪现象，教师可以采用惩戒手段，以保证教育要求的实现，但 不能超越法律的限度。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查教师职业道德的基本规范。教师要关爱学生，不讽刺、挖苦、歧视学 生，不体罚或变相体罚学生，不私自让学生停课、停学。而对于个别学生的违法乱纪现象，惩罚是必 要的。但是体罚是违法的，应当避免，故答案选择A。"},{"number":58,"type":"判断","stem":"教育部印发《中小学班主任工作条例》，进一步推进未成年人的思想道德建设，加强中小学班主任 工作，充分发挥班主任在教育学生中的重要作用。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查《中小学班主任工作条例》。根据《中小学班主任工作条例》第一条 规定，为进一步推进未成年人思想道德建设，加强中小学班主任工作，充分发挥班主任在教育学生中 的重要作用，制定本规定。故答案选择A。"},{"number":59,"type":"判断","stem":"小张(10 岁)的父亲经常在家吸烟，小张也常模仿吸几口，父亲未加制止，小张的父亲做法不合理但 不违法。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查《中华人民共和国未成年人保护法》《中华人民共和国未成年人保护 法》第十一条规定，父母或者其他监护人应当关注未成年人的生理、心理状况和行为习惯，以健康的 思想、良好的品行和适当的方法教育和影响未成年人，引导其进行有益身心的活动，预防和制止其吸 烟、酗酒、流浪以及赌博、吸毒等行为 该行为不合法，故答案选择B。"},{"number":60,"type":"判断","stem":"俗话说：“严师出高徒”“严是爱，松是害，不管不问要变坏”，所以爱学生和严格要求学生是矛 盾的。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查德育原则。尊重学生与严格要求学生相结合的原则的基本含义是：既 要尊重信任学生，又要对学生提出严格的要求，把严和爱有机结合起来。苏联教育家马卡连柯说： “要尽量多地要求一个人，也要尽可能地尊重一个人。”二者缺一不可，相辅相成。尊重就必然对他 们提出严格要求，否则就会变成放任自流，没有严格的要求，尊重就是没有价值的；而没有尊重的严 格要求往往会抹杀学生的主体性，而倒退到传统教育“不见学生”的恶习中去。故答案选择B。"},{"number":61,"type":"判断","stem":"《国家中长期教育改革和发展规划纲要(2010-2020)》提出教育公平的关键是机会公平。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查《国家中长期教育改革和发展规划纲要(2010-202)》。促进公平是国家基 本教育政策。教育公平是社会公平的重要基础。教育公平的关键是机会公平，基本要求是保障公民依法享 有受教育的权利，重点是促进义务教育均衡发展和扶持困难群体，根本措施是合理配置教育资源，向农村 地区、边远贫困地区和民族地区倾斜，加快缩小教育差距。教育公平的主要责任在政府，全社会要 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 45 共同促进教育公平。故答案选择A。"},{"number":62,"type":"判断","stem":"新课改的教学观倡导“学习者中心”，所以教师应该给学生充分的信任，绝对的自由。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查新课程背景下的教学观。新课改的教学观倡导“学习者中心”体现在：(1) 鼓励学生参与教学。(2)创设智力操作活动。(3)教给学生思维的方法并加强训练。教师应该给学生充分的 信任，但是不是绝对的自由。故答案选择B。"},{"number":63,"type":"判断","stem":"生产力的发展要求教育的发展必须与其保持一致，绝对不可超越其发展的水平和速度87。我国新的 课程结构中，小学阶段课程以综合实践活动课程为主。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查教育与社会的关系。教育与生产力的发展和政治经济制度的变革并非完全 同步(可超前可滞后)：教育相对独立于生产力的发展水平；教育相对独立于政治经济制度。故答案选择 B。"},{"number":64,"type":"判断","stem":"多元智力理论是新课程改革的理论基础之一，其提出者为加德纳。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查新课程理论依据。多元智力理论其提出者为加德纳，该理论是新课程改 革的理论基础之一，故答案选择A。"},{"number":65,"type":"判断","stem":"同课异构是基于帮助教师理解教材、改变教学方式、形成教学风格的教学研究活动。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查同课异构。所谓同课异构，就是指针对相同的课题，同一个教学内容，采 用不同的构思、不同的教学方法、不同的设计风格、不同的实施途径，达到同样的效果。这里的“同”是 指内容的同，最终效果的同，即起点与终点的同，而这里的“异”是指方法、途径等具体过程的不同。特 别地，这里的“异”，既可以是同一位教师采取不同的方式、方法和途径，分析解决同一个教学问题，达 到相同的教学目标，也可以是不同的教师面对同一个课题、相同的内容，采取不同的思路、方法和风格各 异的教学策略，殊途同归。同课异构是基于帮助教师理解教材、改变教学方式、形成教学风格的教学研究 活动。故答案选择A。"},{"number":66,"type":"判断","stem":"备学生时必须坚持的几个基本原则是主体性原则、差异性原则和平等性原则","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"本题考查备课。教学的根本目的是促进学生的发展。教学过程中最重要的任务是 发展学生的主体性。备学生的过程就是深入研究学生的过程。为此，必须坚持几个基本原则：主体性原 则、差异性原则、发展性原则，故答案选择B。"},{"number":67,"type":"判断","stem":"以学习小组为教学活动的基本单位，通过小组内成员的分工协作达成小组共同目标，并以小组活动 的整体效果为教学评价主要指标的教学策略是合作学习策略。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查合作学习。合作学习是相对于“个体学习”而言的一种学习组织形式， 是指学生们以主动合作学习的方式代替教师主导教学的一种策略。合作学习的目的不仅是培养学生主动 求知的能力，而且发展学生在合作过程中的人际交流能力，故答案选择A。"},{"number":68,"type":"判断","stem":"在新课程理念下，中小学课堂教学的基本结构可以按照如下基本环节进行设计：问题情境一建立模 型一求解与解决一应用于拓展一回顾与反思。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查中小学课堂教学的基本结构。一般地，在新理念下，中小学课堂教学的基 本结构可以按照如下基本环节进行设计(以数学学科为例)：问题情境→建立模型(得出有关的数学概念、 法则、定理等结论)→求解与解释→应用与拓展→回顾与反思。故答案选择A。"},{"number":69,"type":"判断","stem":"新课程改革的基本理念是以学生发展为本。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"本题考查新课程的理念。教育改革的核心是课程改革。新课程改革的核心理念就 是教育“以人为本”，即：“一切为了每一位学生的发展”。故答案选择A。"},{"number":70,"type":"单选","stem":"将教学目标逐级细分成彼此相联的各种子目标的过程称之为","options":{"A":"目标分类","B":"目标表述","C":"任务分析","D":"任务执行"},"answer":"A","explanation":"本题考查识记类知识点。问题解决的过程为：发现问题一理解问题一提出假设一检 验假设，A符合顺序。故答案选择A。"},{"number":71,"type":"单选","stem":"解决问题的基本过程是","options":{"A":"发现问题——理解问题一提出假设——检查假设","B":"发现问题———研究问题———提出假设———检查假设","C":"发现问题———提出假设———理解问题———检查假设","D":"研究问题———发现问题———提出假设———检查假设"},"answer":"B","explanation":"本题考查义务教育。进入20世纪以后，世界出现了社会主义与资本主义两大阵营 的对垒，电器化革命在主要国家已经完成，两次世界大战深刻地改变了世界的格局，民主化、工业现代 化、国家主义成为世界三股最强大的潮流。在这样的背景下，教育在数量上获得更大的发展，义务教育普 遍向中等教育延伸，职业教育发展受到普遍重视，政治道德教育普遍呈现出国家主义特征，平民教育运 动、进步主义教育运动在世界各地都有不同程度展开。ACD不符合。故答案选择B。 99【答案】D。解析：本题考查教法。题干中，小明属于冲动型，小强属于沉思型。A项，认知风格没有好 坏，所以不应批评小明表扬小强，且这样的做法会导致小明不再举手。小强也没有克服自己的问题。B 项，会导致小明继续举手但依然出错，小强更不敢于发言。C项，没有利用孩子的优势弥补其劣势，反而 使其优点受到打击。D项，针对不同学生我们应当因材施教，实施鼓励教育，通过启发诱导帮助其实现发 展。故答案选择D。"},{"number":72,"type":"单选","stem":"董老师上游戏课时，小明总爱举手，但答题经常出错，小强不爱举手，但老师点名提问却总能答对。下列 做法中，最合适的是","options":{"A":"批评小明总出错。表扬小强爱思考","B":"表扬小明爱举手，批评小强不发言","C":"批评小明总出错，批评小强不发言","D":"激发小明勤思考，鼓励小强多举手"},"answer":"A","explanation":"本题考查行动研究法。A项，教育行动研究，亦称“教师行动研究”，是指教师在 现实教育教学情境中自主进行反思性探索，并以解决工作情境中特定的实际问题为主要目的，强调研究 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 47 与活动一体化，使教师从工作过程中学习、思考、尝试和解决问题。B项，是研究者在自然条件下，通过 感官或借助于一定的科学仪器，有目的、有计划地对研究对象进行系统考察，从而获取经验事实的研究方 法。c项，指的是研究者按照研究目的，合理地控制或创设一定的条件，人为地影响研究对象，而验证假 设，探讨条件和教育对象之间的因果关系的研究方法。D项，是研究者通过问卷、访谈等方式，有目的、 有计划地搜集研究对象的有关资料，对取得的第一手资料进行整理和分析，从而揭示事物本质和规律，寻 求解决实际问题的方案的研究方法。题干中，强调教师和科学研究者的合作，这种形式多用于行动研究 法，故答案选A。"},{"number":73,"type":"单选","stem":"身处教育实践第一线的研究者与受过专门训练的科学研究者密切合作，以教育实践中存在的某一问题作 为研究对象，通过合作研究，再把研究结果应用到自身从事的教育实践中去的研究方法属于()。","options":{"A":"行动研究法","B":"观察法","C":"实验法","D":"调查法"},"answer":"B","explanation":"本题考查教育本质。A项，强调社会经验的传递。B项，认为教育是一种培养人的 社会实践活动。C 项，认为教育是一种自然活动，是错误的说法。D 项，认为教育的目的是传承人类文 明。根据题干，而教育的本质是有目的地培养人的社会活动，因此答案选择B。"},{"number":74,"type":"单选","stem":"“人只有受过一种合适的教育后，才能成为一个人”，夸美纽斯的这句话旨在说明教育是()。","options":{"A":"传递社会经验的活动","B":"培养人的社会实践活动\nc.培养人的自然活动","D":"保存人类文明的活动"},"answer":"B","explanation":"本题考查教育与科技的关系。A项，生产力的发展是教育的决定性因素，但不是现 代教育发展的根本动因。B项，现代教育发展的根本动因是科技进步。科学技术对教育的影响，首先表现 为对教育的动力作用。C、D选项一般不作为教育的根本动因或决定因素，属于干扰项。因此，答案选择 B。"}]},{"year":"2020","exam_name":"2020年广东省普宁市教师招聘考试真题卷","total_questions":39,"questions":[{"number":1,"type":"单选","stem":"习近平总书记指出： “劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，只有通过诚实劳 动才能实现；发展中的各种难题，只有通过诚实劳动才能破解；生命里的一切辉煌，只有通过诚实劳动 才能铸就。”这是强调要()，对新时代劳动教育作出指示。","options":{"A":"坚持因地制宜","B":"把握育人导向","C":"体现时代特征","D":"强化综合实施"},"answer":"B","explanation":"《关于全面加强新时代大中小学劳动教育的意见》提出了把握育人导向、遵循教育规律、体 现时代特征、强化综合实施和坚持因地制宜五项基本原则。其中，“把握育人导向”要求坚持党的领导， 围绕培养担当民族复兴大任的时代新人，着力提升学生综合素质，促进学生全面发展、健康成长。把准劳 动教育价值取向，引导学生树立正确的劳动观，崇尚、尊重劳动，增强对劳动人民的感情，报效国家，奉 献社会。题干中，习近平总书记的话说明了劳动的重要意义和作用，强调了必须坚持崇尚劳动，树立正确 的劳动观念，与“把握育人导向”的要求相吻合。"},{"number":2,"type":"单选","stem":"下列行为中，需要加强“知、情、意、行”四个德育环节中的“知”的是","options":{"A":"小亮明知上课玩手机不对，但还是玩了","B":"小张身心尚未成熟，不能辨别是非善恶\nc.小赵对公交车上老人倚老卖老的行为感到愤怒","D":"小罗在生活中总是喜欢有意无意地拿同学东西"},"answer":"B","explanation":"道德认知(简称“知”)，是指对于行为规范及其意义的认识，是人的认知过程在品德上的表 现。道德认知是个体品德的基础，是道德情感、道德意志产生的依据，对道德行为具有定向的意义，是行 为的调节机制。B选项，学生无法明辨是非是因为道德认识水平不足，因此需加强其道德认识的培养。此 外，A、D选项中的学生应加强道德意志的培养，C选项中的学生应加强对道德情感调控能力的培养。"},{"number":3,"type":"单选","stem":"下图是某学校对学生采取的做法，对该校的行为评价最合理的是","options":{"A":"有利于激励成绩差的学生","B":"有利于学校选拔真正的人才","C":"没有做到因材施教","D":"没有做到教育公平"},"answer":"D","explanation":"教育公平有三层含义：(1)教育起点公平，主要是指国家为每个公民提供相同的教育机会，提 供相互之间进行学习竞赛的场所，制定相同的比赛规则，为每个公民获得良好的教育资源提供公平竞争的 机会，而不考虑结果是否公平；(2)教育过程公平，是指公民在接受教育过程中待遇的一致性；(3)教育结 果公平，是指每个公民最终所获得的教育资源是公平的。漫画中的学校以分数为标准将学生分类，将优质 教育资源分配给分数高的学生，这违背了教育公平的理念。"},{"number":4,"type":"单选","stem":"张老师在上《数与代数》一课时，把“在具体情境中能熟练认读，写20以内的数，能用数表示物体 的个数和事物的位置与顺序”作为教学目标。张老师拟定的这一教学目标属于三维目标中的","options":{"A":"知识与技能目标","B":"过程与方法目标","C":"思想与方法目标","D":"情感态度与价值观目标"},"answer":"A","explanation":"知识与技能目标主要包括适应终身学习要求的基础知识和基础技能，以及要加强培养学生收 集和处理信息的能力、获取新知识的能力、分析和解决问题的能力以及与人交流和合作的能力。题干中的 写数、认读等都是学生必须掌握的基础知识与技能，因此属于知识与技能目标。"},{"number":5,"type":"单选","stem":"学习物理、化学后解决各类实际问题，属于教学过程中()的基本阶段。","options":{"A":"巩固知识","B":"运用知识 c.检查效果","D":"理解教材"},"answer":"B","explanation":"教学过程的基本阶段包括激发学习动机、领会知识、巩固知识、运用知识、检查知识五个阶 段。其中，在运用知识阶段，学生能自主地将所学的知识运用于完成作业和分析、解决实际问题的活动中 去。运用知识有两个基本方式，一种是问题的解决只需要通过词的说明(包括口头语和书面语)就能完成； 另一种是通过实际操作才能完成。因此，题干中通过解决实际问题练习使 用学过的物理和化学知识，属于教学过程基本阶段中的运用知识。"},{"number":6,"type":"单选","stem":"在课堂上，刘老师向学生们提出了一个难题，没有人主动举手回答问题，于是刘老师点名让小汪回答。 刘老师点名让小汪回答的行为属于","options":{"A":"发问","B":"候答","C":"叫答","D":"理答"},"answer":"C","explanation":"根据教学实施流程，问答行为由发问、候答、叫答和理答四个环节组成。发问是教师向学生 提出问题；叫答是教师组织学生回答问题。考生需注意发问与叫答的区别。前者强调教师提出有待讨论 的问题，而后者强调提出问题后选择或组织学生来回答。题干中，刘老师点名小汪回答问题的行为属于 叫答。"},{"number":7,"type":"单选","stem":"历史老师在讲解“世界经济危机”时，先提到在大萧条时期，美国的资本家把玉米和小麦当柴烧，把 牛奶倒进河里，然后向学生提问“这是为什么呢”。这种课堂导入方法是","options":{"A":"直接导入法","B":"故事导入法","C":"设疑导入法","D":"直观导入法"},"answer":"C","explanation":"设疑导入法是教师根据教学内容，结合学生心理特征和各种知识之间的内在联系，提出与本 节课主题相关并带有悬念性的问题，引发学生思考，激发学生学习与探索欲望的方法。题干中的教师在 上课前先抛出悬念，引起学生的好奇心和求知欲，激发学生对课堂的兴趣，属于设疑导入法。"},{"number":8,"type":"单选","stem":"新课改后，教师开始改变以往教师讲学生听的灌输式教育，在课堂上积极引导学生自主思考，培养学 生自主学习的能力。这说明，教师扮演着()角色。","options":{"A":"知识创造者","B":"榜样示范者 c.学生学习促进者","D":"教学活动设计者"},"answer":"C","explanation":"现代教师观，从教师与学生的关系看，新课程要求教师应该是学生学习的促进者。当前学生 的学习方式正由传统的接受学习向探究式、研究式学习转变，这就要求教师必须从传授知识的角色向学 生学习促进者的角色转变。"},{"number":9,"type":"单选","stem":"语文课堂上，杨老师介绍一篇新的课文，他先借助手势、表情简要说明了要教的内容，然后播放优美的 音乐，并让学生跟着音乐的节奏，带着生动的表情和情感朗读课文。杨老师采用的这种教学模式是","options":{"A":"发现学习模式","B":"非指导性教学模式","C":"暗示教学模式","D":"范例教学模式\n根据以下材料，回答10~12题。\n张老师是一名英语老师，刚接任某一班级班主任一职，发现该班学生品德较差，学习态度比较消极，同\n学间几乎没有合作行为，而且谁也不知道该做什么。不少学生自由散漫，常常不遵守纪律，这让张老师\n很是头疼。"},"answer":"C","explanation":"暗示教学模式是由保加利亚的心理学家罗扎诺夫创立的一种学习语言的模式。该模式充分利 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 24 用环境的暗示信息和人的可暗示性，使理智与感情统一、有意识功能与无意识功能统一，能够充分调动和 发掘大脑无意识领域的潜能，使学生在轻松愉快的气氛中不知不觉地接受信息。题干中，杨老师通过表 情、音乐等的暗示，使学生在精神轻松的状态下学习的做法，符合暗示教学模式的内涵。"},{"number":10,"type":"单选","stem":"该班级出现上述表现是对()领导方式的典型反映。","options":{"A":"权威型","B":"溺爱型 c.民主型","D":"放任型"},"answer":"D","explanation":"采用放任型领导方式的班主任主张对班级管理不要过多地干预，以容忍的态度对待班级管理 中的冲突，不主动组织班级活动。在此领导方式下的学生表现出品德差、学习差、几乎没有合作行为，以 及谁也不知道该做什么等特征。"},{"number":11,"type":"单选","stem":"为改变这种局面，张老师接任班主任后，工作的中心环节应是","options":{"A":"组织和培养班集体","B":"了解和研究学生","C":"组织班会活动和课外活动","D":"明确方向并创造良好的班级舆论"},"answer":"A","explanation":"组织和培养班集体是班主任工作的中心环节，具体措施包括确立班集体的发展目标、建立得 力的班集体核心、培养正确的舆论和良好的班风、组织开展班级活动、建立严格的班集体纪律。"},{"number":12,"type":"单选","stem":"针对该班实际，张老师还打算进行个别教育工作，从后进生教育入手提高班级管理实效，下列不适 宜用于后进生教育的是","options":{"A":"严格要求，防止自满","B":"培养和激发其学习动机","C":"善于发掘其“闪光点”","D":"关心热爱与严格要求相结合"},"answer":"A","explanation":"后进生通常是指那些智力发育正常，但有品德不良行为或学习成绩差的学生。班主任做好后 进生的转化教育工作要注意三点：(1)以爱动其心；(2)以理服其人；(3)以智导其行。B、C、D项均适用于 后进生教育，而A选项是对优秀生的教育要求。"},{"number":13,"type":"单选","stem":"一位教师在讲到《司马光砸缸》这篇课文时，突然有一位同学提出问题： “司马光那时候还是个小 孩子，他哪有这么大的力气搬起大石头砸破水缸?”全班同学顿时议论纷纷。如果你是这位老师，下列 做法最合理的是","options":{"A":"暂停上课，引导学生讨论该问题","B":"忽略该同学的提问，继续上课","C":"稍作停顿，轻轻咳嗽两声提醒该同学不要说话","D":"维持课堂纪律，让学生课后去讨论该问题"},"answer":"D","explanation":"教育机智是一种对突发性教育情景做出迅速、恰当处理的随机应变能力。题干中，学生质疑 的问题与课堂教学内容本身关系不大，为了不影响课堂教学，又满足学生的好奇心，最合理的做法是维持 课堂纪律后，安排学生课后讨论该问题。"},{"number":14,"type":"单选","stem":"课程资源是课程实施所需要的一切资源，其中首要的基本条件资源是","options":{"A":"教师","B":"学生","C":"专用教室","D":"学校图书馆"},"answer":"A","explanation":"课程资源是课程设计、编制、实施过程中可利用的一切人力、物力以及自然资源的总和。在 所有的课程资源中，教师是起主导和决定性作用的资源。因为教师不仅决定着课程资源的开发、积累和利 用，是素材性课程资源的重要载体和创造者，还是课程实施首要的基本课程资源。"},{"number":15,"type":"单选","stem":"某班级学生为了获得流动红旗，便在早读课上认真读书，不离开座位嬉笑打闹。这种纪律属于()。","options":{"A":"教师促成的纪律","B":"集体促成的纪律","C":"任务促成的纪律","D":"自我促成的纪律"},"answer":"C","explanation":"任务促成的纪律是指某一具体任务对学生行为提出的具体要求。因此题干中的学生为了获得 流动红旗这一任务而形成的纪律属于任务促成的纪律。"},{"number":16,"type":"单选","stem":"以下活动中，不属于“正强化”过程的是","options":{"A":"妈妈答应明明，只要他回家积极完成作业，就可以看10分钟电视","B":"王老师上课时对积极回答问题的学生都给予一朵红花奖励\nc.安安发现坐车时只要系上安全带，刺耳的警示声音便会消失","D":"红红期末得了第一名，爸爸兑现承诺，带她去了迪士尼游玩"},"answer":"C","explanation":"正强化是通过呈现个体想要的愉快刺激来增强反应频率。有机体自发作出某种反应，得到正 强化物，那么此类反应发生的概率增加。c选项属于负强化。"},{"number":17,"type":"单选","stem":"课堂上，在儿童之前已经熟悉“胡萝卜” “白菜”“南瓜”等物品的情况下，教师再教儿童将其归 入“蔬菜”这一概念。这种学习方法被称为","options":{"A":"下位学习","B":"上位学习 c.组合学习","D":"发现学习"},"answer":"B","explanation":"上位学习也叫总括学习，即通过综合归纳获得意义的学习。即以概括程度较低的观念的学习 为基础再去学习一个概括和包容程度更高的概念或命题。题干中，“蔬菜”比“胡萝卜”等物品的概括程 度更高，因此属于上位学习。"},{"number":18,"type":"单选","stem":"将生物学的同化这一概念应用于心理学中，意指人们把知觉到的新鲜刺激融于原有的图式中，从而 达到了对事物的理解的心理学家是","options":{"A":"皮亚杰","B":"高尔顿 c.赫尔巴特","D":"桑代克"},"answer":"A","explanation":"皮亚杰在解释发生认识论时提出了四个概念：图式、同化、顺应、平衡。其中，同化是指在 有机体面对一个新的刺激情境时，把刺激整合到已有的图式或认知结构中。通过这一过程，主体才能对新 刺激做出反应，动作也得以加强和丰富。题干所述与同化的概念吻合。"},{"number":19,"type":"单选","stem":"高考前，小高的爸爸鼓励小高说： “只要你考上大学，暑假我就带你去海边玩。”小高为了暑假 和爸爸一起去海边而努力学习，小高的这种动机属于","options":{"A":"内部动机","B":"高尚动机","C":"认知内驱力","D":"外部动机"},"answer":"D","explanation":"根据动机产生的诱因来源，可以把学习动机分为内部学习动机和外部学习动机。外部学习动 机是指诱因来自学习者外部的某种因素，即在学习活动以外由外部的诱因激发出来的学习动机。题干中的 小高是为了暑假能去海边玩而不是对学习本身感兴趣才努力考上大学的，因而属于外部学习动机。"},{"number":20,"type":"单选","stem":"小明在学习化学元素“氢”时，总是忘记它的特性，于是他编了个顺口溜： “我是氢，我最轻， 火箭靠我运卫星。”自此以后，他对“氢”的特性记忆得非常深刻了。小明采取的学习策略是","options":{"A":"复述策略","B":"精加工策略 c.注意策略","D":"组织策略"},"answer":"D","explanation":"精加工策略是指把新信息与头脑中的旧信息联系起来从而增加新信息意义的深层加工策略。 常见的精加工策略包括做笔记、记忆术、生成性学习、提问等。题干中，小明编口诀记忆元素特性，运用 的是精加工策略中的记忆术。21. D解析：前后所学的信息之间存在相互影响。如果这种影响是消极的， 则称为抑制。如果这种影响是积极的，则称为促进。后学的信息对先前的信息产生积极影响，称为倒摄促 进。题干中，初中知识促进了对小学知识的理解，符合倒摄促进的定义。"},{"number":21,"type":"单选","stem":"课间，小刚在嬉笑时给小明起了难听的绰号，导致两人起了冲突。李老师在处理该事时，对小刚说： “你想想，如果是你被人叫了难听的绰号，你会有什么样的感受?”从道德培养的角度来看，李老师是在 培养小刚的()能力。","options":{"A":"移情","B":"共情 c.合理化","D":"升华"},"answer":"B","explanation":"同理心也称共情，是人本疗法的一个重要概念，它是指人能设身处地去体会当事人的内心感 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 25 受，达到对当事人境况的心领神会。共情包括同情和理解。题干所述是让小刚理解别人的情绪，是在培养 小刚共情的能力。"},{"number":22,"type":"单选","stem":"为了巧分“辨” “辩” “辫”与“瓣”四个字的用法，小雨编了一个顺口溜： “点撇为分辨，有 言是辩论，绞丝是辫子，瓜地开花有花瓣。”根据加涅对学习的分类，小雨的学习成果属于()的学习。","options":{"A":"言语信息","B":"智慧技能 c.认知策略","D":"态度"},"answer":"C","explanation":"认知策略是学习者信息加工的方法和技术。其基本功能有两个方面：一是对信息进行有效地 加工与整理；二是对信息进行分门别类的系统储存。题干中，小雨用编口诀的方式区分了四个形近字，是 对精加工策略的运用，体现了认知策略的学习。"},{"number":23,"type":"单选","stem":"在解决问题时，有的学生往往只看到某些事物的一些方面，而不善于发现这些事物不同寻常的方面。 如某学生知道笔是写字用的，却看不到笔也可以当短棍使用，这属于","options":{"A":"高原反应","B":"原型启发 c.粗心大意","D":"功能固着"},"answer":"D","explanation":"功能固着也可以看作是一种定势，即从物体的正常功能的角度考虑问题的定势。也就是说， 当一个人熟悉了某种物体的常用的或典型的功能时，就很难看出该物体所具有的其他潜在的功能。题干 中的学生只看到笔的写字功能而看不到它的其他用途，属于功能固着。"},{"number":24,"type":"单选","stem":"张飞作为一个粗人，没有太多的礼节，更多的是有话直说，而且性子比较急，对于事情的发展没有太 大的耐心。但是张飞的内心却是非常真诚的，无论是对主上刘备还是对自己的手下都能袒露赤诚。根据以 上对张飞个性的描述，他的气质类型应该为","options":{"A":"胆汁质","B":"黏液质","C":"神经质","D":"抑郁质"},"answer":"A","explanation":"胆汁质类型的人情绪体验强烈、爆发迅猛、平息快速，思维灵活，精力旺盛、争强好斗、勇 敢果断，为人热情直率、朴实真诚、表里如一，行动敏捷、生机勃勃、刚毅顽强；但这种人遇事常欠思 量，鲁莽冒失，易感情用事，刚愎自用。整个心理活动笼罩着迅速而突发的色彩。题干中，对张飞个性的 描述词“性子比较急”“宽厚、赤诚”“有话直说”等均符合胆汁质的特点。"},{"number":25,"type":"单选","stem":"在做二次函数习题时，王华头脑中便呈现出二次函数对称轴及顶点坐标公式，这种心理活动属于","options":{"A":"识记","B":"保持","C":"回忆","D":"再认"},"answer":"C","explanation":"回忆是指过去经历过的事物不在面前，人们在头脑中把它重新呈现出来的过程。题干中，王 华头脑中呈现出二次函数对称轴及顶点坐标公式的过程属于回忆。"},{"number":26,"type":"单选","stem":"小琼既想要参加合唱比赛，又怕耽误学习；但不参加合唱比赛，又怕朋友说她不合群。这样的 心理现象属于","options":{"A":"双趋式冲突","B":"双避式冲突 c.趋避式冲突","D":"双重趋避式冲突"},"answer":"C","explanation":"趋避式冲突是指对同一目的兼具好恶的矛盾心理。题干中，小琼因“是否参加合唱比赛”这 一件事而产生“既想参加又不想参加”的矛盾心理，属于趋避式冲突。"},{"number":27,"type":"单选","stem":"刘老师认为自己专业水平很高，所以拒绝参加市教育局在寒假期间组织的名师培训活动，刘老 师的做法","options":{"A":"正确，教师有不进行学术交流的权利","B":"正确，教师作为劳动者有休息的权利\nc.不正确，教师不能放弃培训权","D":"不正确，提高业务水平是教师的义务"},"answer":"D","explanation":"根据《中华人民共和国教师法》第八条规定，我国教师应当履行不断提高思想政治觉悟和教 育教学业务水平的义务。因此，刘老师拒绝参加培训活动的做法是不正确的。"},{"number":28,"type":"单选","stem":"吴老师是某小学的语文老师。她能把语文教学真正落到实处，用说文解字的形式去评价学生。还 能让学生去仔细琢磨，主动从自己的姓名中去探究中华文化渊源。上述案例中吴老师的行为践行了 《新时代中小学教师职业行为十项准则》中()的要求。","options":{"A":"坚定政治方向","B":"自觉爱国守法","C":"潜心教书育人","D":"秉持公平诚信"},"answer":"C","explanation":"《新时代中小学教师职业行为十项准则》中“潜心教书育人”要求教师：落实立德树人根本 任务，遵循教育规律和学生成长规律，因材施教，教学相长；不得违反教学纪律，敷衍教学，或擅自从事 影响教育教学本职工作的兼职兼薪行为。题干中的教师注重教书育人并将语文教学落到实处，符合该项要 求。"},{"number":29,"type":"单选","stem":"习近平曾指出，扎实的知识功底、过硬的教学技能、勤勉的教学态度、科学的教学方法是教师 的基本素质，并强调要把师德师风作为评价教师队伍素质的第一标准，这说明","options":{"A":"教师的基本素质让位于道德修养","B":"中华民族始终秉持尊师重道的优良传统\nc.教师的职业特点决定了教师必须是道德模范和时代楷模","D":"以德立身、以德立学、以德施教成为新时期培养教师的重要内容"},"answer":"D","explanation":"习近平总书记曾指出，“人才培养的关键在教师。师德师风是评价教师队伍素质的第一标 准，要做到以德立身、以德立学、以德施教。”题干提到师德师风应作为评价教师素质的第一标准，这强 调了师德师风的重要地位，并非要让基本素质让位于道德修养，因此A选项错误。题干也未涉及尊师重道 及教师职业道德的典范性、示范性，因此B、C选项与题意不符。"},{"number":30,"type":"判断","stem":"单一课一般指主要完成一项教学任务的课。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"单一课是在一节课主要完成一种教学任务的课，如新授课、复习课、练习课、检测课、实验 课、参观课、实习课。"},{"number":31,"type":"判断","stem":"板书的基本类型中，纲目式板书是以各种图形配以文字来阐释知识的联系、结构和象征意义的板书， 它能使知识的内在含义清楚地表现出来。此类板书直观具体、生动形象，能有效地增强课堂教学的吸引 力。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"纲目式板书是以文字表达为主，把教材内容纲目化，是应用得最为普遍的一种板书形式。运 用纲目式板书往往先书写知识点，然后再书写两三个层次的小纲目，并进行分析，最后再进行综合，得出 结论。这种板书的形式能使教学内容层次脉络清楚，利于学生全面认识问题，却不易明显地表达知识之间 的交叉关系，也缺乏形象生动性。题干表述的应是图画式板书。"},{"number":32,"type":"判断","stem":"学校固然要培养“负责任的公民”，但更多的是要培养杰出人才。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"“以学生为本，以学生发展为中心”，应更加注重面向每个学生。在现代化的社会中，每个 学生都是平等的，都应有人生出彩的机会。学校固然要培养杰出人才，但更多的是要培养“负责任的公 民”。杰出人才是在平等竞争中涌现、艰苦实践中成长起来的。这是人才成长的规律。"},{"number":33,"type":"判断","stem":"我国中小学生甚至大学生动手能力相对弱的原因，与我国重知识传授、轻知识运用的教学传统息息 相关。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"教学的理论联系实际原则是指教学要以学习基础知识为主导，从理论与实际的联系上去理解 知识，注意运用知识去分析问题和解决问题，达到学懂会用、学以致用。而我国传统教学重学不重用，过 于强调学习系统的书本知识，轻视知识运用，从而导致我国中小学生甚至大学生动手能力相对较弱。"},{"number":34,"type":"判断","stem":"班杜拉认为，个人对榜样行为的再现过程可以划分成：反应的认知组织、反应的发起和监控以及在 信息反馈基础上的精练。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"再现是指把记忆中的表象转换成行为，并根据反馈来调整行为以做出正确的反应。班杜拉认 为，个体对动作行为的再现过程包括反应的认知组织、反应的发起和监控以及在信息反馈基础上的精炼。"},{"number":35,"type":"判断","stem":"如果一个人将失败归因于缺少能力和努力，则会产生羞愧和内疚，而将失败归因于任务太难或运气 不好时，产生的羞愧则少。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"个人将成功归因于能力和努力等内部因素时，他会感到骄傲、满意、信心十足，而将成功归 因于任务容易和运气好等外部因素时，产生的满意感则较少。相反，如果一个人将失败归因于缺少能力或 努力，则会产生羞愧和内疚，而将失败归因于任务太难或运气不好时，产生的羞愧感则较少。"},{"number":36,"type":"判断","stem":"态度与能力都是内部倾向，都决定个体能否顺利完成某些任务，二者是等同的。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"能力决定个体能否顺利完成某些任务，是“能不能”的问题；态度决定个体是否愿意完成某 些任务，即决定行为的选择，是“愿不愿”的问题。态度和能力都是内部倾向，但态度不同于能力。"},{"number":37,"type":"判断","stem":"一般来说，女孩的攻击性比男孩的攻击性强，并更倾向于直接的身体攻击。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"学生的攻击性行为存在明显的性别差异。无论在实际的攻击行为还是在攻击的倾向性上，自 幼儿期起，男生都比女生表现出更强的攻击性。另外，在攻击的方式上，男生和女生也不同，男孩较喜欢 使用直接的身体攻击，而女孩则喜欢采用言语形式的攻击，而且年龄较大的女孩更多地采用间接的攻击。"},{"number":38,"type":"判断","stem":"学龄初期儿童的特征是身心急剧变化，自我意识增强，独立性增强，情感较丰富，不容易控制自己。","options":{"A":"正确","B":"错误"},"answer":"B","explanation":"学龄初期(即小学阶段)儿童的总特征是身体发展较缓慢，思维以形象思维为主；而学龄中期 (即初中阶段、少年期)儿童的特征是身心急剧变化，自我意识增强，独立性增强，特别是情感较丰富，又 不容易控制自己，有人称之为“危险期”。"},{"number":39,"type":"判断","stem":"教师职业道德是社会职业道德的有机组成部分，是教师行业特殊的道德要求。","options":{"A":"正确","B":"错误"},"answer":"A","explanation":"教师职业道德是教师在从事教育劳动时所应遵循的行为规范和必备的品德的总和，是调节教 师与他人、与社会等关系时所必须遵守的基本道德规范和行为准则，以及在此基础上所表现出来的道德观 念、情操和品质。它是一般社会道德在教师职业中的特殊体现，是社会职业道德的有机组成部分，也是教 师行业特殊的道德要求。 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 28"}]},{"year":"2022","exam_name":"2022年广东省普宁市教师招聘考试真题卷","total_questions":40,"questions":[{"number":1,"type":"单选","stem":"某小学班主任李某在家长群里通知： “小林，未佩戴红领巾、没带校卡，导致班级被扣一分，全体 学生的努力付诸东流，该生明天不准来上课，请家长知悉。若有异议，请家长明日到校说明原因。出现 这种低级错误，家长负第一责任，请反省。”李某的做法","options":{"A":"合理，教师有教育学生的义务和管理学生的权力。","B":"不合理，教师不让学生进入教室上课，侵犯了学生的受教育权。\nc.合理，教师进行了有效的家校沟通，有助于家长了解学生的在校表现","D":"不合理，学校教育是青少年教育最重要的组成部分，教师应对学生的行为负首要责任。"},"answer":"B","explanation":"本题考查教师违法(侵权)行为。受教育权是学生最基本的权利。学生的受教育权包括受完法 定年限教育权、学习权和公正评价权。侵犯学生上课学习的权利是侵犯学生受教育权的常见表现形式。故 题干中李某不让学生进入教室上课的行为侵犯了学生的受教育权。"},{"number":2,"type":"单选","stem":"下列是四位教师对板书书写顺序的看法，其中最恰当的是","options":{"A":"教师甲：先上后下，先右后左；先小结，后内容，再标题。","B":"教师乙：先下后上，先左后右；先标题，后小结，再内容。\nc.教师丙：先上后下，先左后右；先标题，后内容，再小结。","D":"教师丁：先下后上，先右后左；先内容，后标题，再小结。"},"answer":"C","explanation":"本题考查板书的书写顺序。板书之前要对板书内容有一个大致的安排通盘考虑。最好在书写 时把黑板分成三部分，重要内容写在黑板中央。书写时要注意先上后下，先左后右，先标题，后内容， 再小结。千万不要横七竖八，杂乱无章。"},{"number":3,"type":"单选","stem":"习近平总书记曾强调，做好教育工作， ()是根本保证。","options":{"A":"加强党的全面领导","B":"提高教师待遇 c.加强教师培训","D":"完善体制机制"},"answer":"A","explanation":"本题考查教育时政加强党对教育工作的全面领导是办好教育的根本保证。中国特色社会主义 最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领 导力量。习近平总书记强调，做好教育工作，加强党的领导是根本保证。"},{"number":4,"type":"单选","stem":"()是对同一学生继续发问。如果学生回答不正确，教师会对原问题重新措辞后提出一个与原问题相 关的问题；或者将原问题分解，简化为几个小问题逐一发问。","options":{"A":"转问","B":"探问","C":"质问","D":"询问"},"answer":"B","explanation":"本题考查理答的相关内容。转问和探问是在学生回答不正确或不确切的情况下教师的两种理 答方式。转问是就同一问题向另一同学发问。探问是对同一学生继续发问。如果学生回答不正确，教师会 对原问题重新措辞后提出一个与原问题相关的问题；或者将原问题分解，简化为几个小问题逐一发问；或 者提供回答线索；或者问一个与原问题相关的新问题。如果学生回答正确，教师也可再提一个问题，就正 确答案进行追问。"},{"number":5,"type":"单选","stem":"根据我国《中华人民共和国教师法》相关规定，下列属于教师应当履行的义务的是","options":{"A":"进行教育教学活动，开展教育教学改革和实验","B":"指导学生的学习和发展，评定学生的品行和学业成绩","C":"遵守宪法、法律和职业道德，为人师表","D":"按时获取工资报酬，享受国家规定的福利待遇以及寒暑假期的带薪休假"},"answer":"C","explanation":"本题考查《中华人民共和国教师法》根据我国《中华人民共和国教师法》第八条规定，教师应 当履行下列义务：(一)遵守宪法、法律和职业道德，为人师表；(二)贯彻国家的教育方针，遵守规章制 度，执行学校的教学计划，履行教师聘约，完成教育教学工作任务；(三)对学生进行宪法所确定的基本原 则的教育和爱国主义、民族团结的教育，法制教育以及思想品德、文化、科学技术教育，组织、带领学生 开展有益的社会活动；(四)关心、爱护全体学生，尊重学生人格，促进学生在品德、智力、体质等方面全 面发展；(五)制止有害于学生的行为或者其他侵犯学生合法权益的行为，批评和抵制有害于学生健康成长 的现象；(六)不断提高思想政治觉悟和教育教学业务水平。因此c项属于教师应当履行的义务。ABD三项 属于教师的权利。"},{"number":6,"type":"单选","stem":"小明先学习英语后学习数学，结果英语知识遗忘较多，数学知识记忆效果好。这是受()因素的干扰。","options":{"A":"前摄抑制","B":"兴奋 c.倒摄抑制","D":"消退"},"answer":"C","explanation":"本题考查前摄抑制和倒摄抑制。前摄抑制是先学习的材料对识记和回忆后学习的材料的干扰 作用。后学习的材料对识记和回忆先学习材料的干扰作用称为倒摄抑制。因此题干中后学习的数学知识对 先学习的英语知识的干扰属于倒摄抑制。"},{"number":7,"type":"单选","stem":"课堂学习测评方案的制订，必须立足于现实的需要和可能，简便易行，实施起来没有太多的困难。如 果测评方案操作起来太麻烦，学生不愿意配合，测评就很难成功。这说明课堂学习测评方案的制订应遵 循","options":{"A":"目的性原则","B":"主体多元化原则","C":"可行性原则","D":"变化性原则"},"answer":"C","explanation":"本题考查课堂学习测评方案的制订应遵循的原则。可行性原则是指课堂学习测评方案的制 订，必须立足于现实的需要和可能，简便易行，实施起来没有太多的困难。如果测评方案操作起来太麻 烦，学生不愿意配合，测评就很难成功。c项当选。目的性原则是指进行课堂学习测评，首先应有一个明 确的测评目的和预期效果。主体多元化原则是指学习测评主体的多元化，不仅教师是课堂学习测评的主 体，学生本人、学习同伴也应成为学习测评的主体。变化性原则是指课堂学习测评可采用多种方式进行， 可以口头，也可以书面；可以自评，也可以互评；可课上进行，也可课下进行；可分组讨论，也可全班一 起讨论，还可以师生一对一地面谈。"},{"number":8,"type":"单选","stem":"在总复习的初期，小贺对考试很有信心，学习效果也较明显，但在经历了一段时间的复习之后，成绩 就很难有较大提高，甚至忽高忽低沉浮不定；上课时，小贺总感觉头脑昏昏沉沉，什么事都不想干，看不 进去书也记不住内容，性情开始变得急躁烦闷。小贺此时最有可能进入了","options":{"A":"过度学习期","B":"高原期 c.分化期","D":"潜伏期"},"answer":"B","explanation":"本题考查高原期。在学生学习过程中，有一个明显的、暂时的停顿期，即高原期。通常把学 生在学习过程中出现一段时间的学习成绩和学习效率停滞不前，甚至学过的知识感觉模糊的现象，称为 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 16 “高原现象”。"},{"number":9,"type":"单选","stem":"军军最近废寝忘食地学习，为的是得到老师的认可和表扬。根据奥苏贝尔的理论，军军的学习动机属 于","options":{"A":"认知内驱力","B":"生理内驱力 c.附属内驱力","D":"自我提高内驱力"},"answer":"C","explanation":"本题考查学习动机的分类。根据学校情境中的学业成就动机，奥苏贝尔等人将动机分为认知 内驱力、自我提高内驱力和附属内驱力。其中，附属内驱力是指个体为了获得长者们(如家长、教师等)的 赞许或认可而表现出把工作、学习做好的一种需要。它既不直接指向学习任务本身，也不把学业成就看作 是赢得地位的手段，而是为了从长者或同伴那里获得赞许和接纳。题干中军军努力学习是为了得到老师的 认可和表扬，属于附属内驱力。"},{"number":10,"type":"单选","stem":"随着社会政治经济和科学文化的发展及其对培养人才要求的不断提高，教学组织形式不断演变和发 展。其中， ()又称为“灵活的课程表”，出现于20 世纪50年代的美国，这种教学组织形式试图把 大班上课、小班讨论和个人独立研究结合在一起，并采用灵活的时间单位代替固定划一的上课时间。","options":{"A":"道尔顿制","B":"特朗普制","C":"分组教学制","D":"个别教学制"},"answer":"B","explanation":"本题考查教学组织形式。特朗普制又称“灵活的课程表”，是美国教育家劳伊德·特朗普 于 20 世纪50 年代提出的一种教学组织形式。这种教学形式把大班、小班和个人三种教学形式结合起 来，以灵活的时间单位代替固定的上课时间。"},{"number":11,"type":"单选","stem":"教学是教师教和学生学的统一活动，是贯彻国家的教育方针，实现教育目的的基本途径。下列关于 教学的说法，错误的是","options":{"A":"教学是学校的中心工作","B":"教学能够促进学生身心发展\nc.教学是社会经验得以再生产的唯一手段","D":"教学能为个人未来进入社会提供科学的基础"},"answer":"C","explanation":"本题考查教学工作的意义。教学工作的意义具体表现在：(1)教学是传播系统知识、促进学 生发展的最有效的形式，是社会经验的再生产、适应并促进社会发展的有力手段。(2)教学是进行全面发 展教育、实现培养目标的基本途径，为个人全面发展提供科学的基础和实践，是培养学生个性全面发展的 重要环节 (3)教学是学校教育的中心工作，学校教育工作必须坚持以教学为主(教学的地位)。此外，教学 不仅促进个体实现社会化的进程，而且使人类文化一代代继承发展。教学是社会经验得以再生产的一种主 要手段而不是唯一手段。C项说法错误。"},{"number":12,"type":"单选","stem":"学生先知道“梧桐” “白杨”等概念，然后学习“树”的概念，明白“树”是各种树木的总括概 念。这属于","options":{"A":"下位学习","B":"上位学习 c.并列学习","D":"组合学习"},"answer":"B","explanation":"本题考查上位学习。上位学习又称总括学习，即以概括程度较低的观念的学习为基础再去学 习一个概括和包容程度更高的概念或命题。上位学习遵循从具体到一般的归纳概括过程。题干中学生学习 的“树”概念比先知道的“梧桐”“白杨”等概念概括程度更高，故属于上位学习。"},{"number":13,"type":"单选","stem":"小明每天放学回家不想写作业，但是又害怕妈妈发现他没写作业而骂他。小明的情况属于","options":{"A":"双趋冲突","B":"双避冲突 c.趋避冲突","D":"多重趋避冲突"},"answer":"B","explanation":"本题考查动机斗争。双避冲突，即从希望回避的两种事物中必取其一的心理状态。题干中小 明对“写作业”和“被妈妈骂”都是持回避态度，但是必须从中选择一个，故属于双避冲突。"},{"number":14,"type":"单选","stem":"高老师是某学校一班主任，她班上的学生喜欢与她作对，经常挑事情、制造混乱；高老师虽然很生 气，但时常感到无力制止混乱、管控好学生。根据沃贝尔斯等人的观点，高老师与她学生的交往类型属 于","options":{"A":"权威型","B":"压抑型 c.非决断/挑衅型","D":"非决断/容忍型"},"answer":"C","explanation":"本题考查师生交往的类型。沃贝尔斯等人从师生交往中教师行为的风格，总结出八种师生交 往类型：(1)指导型。(2)权威型。教师交往行为以任务为取向，课堂上有明确的规则且教师时常提醒学生 遵守；师生关系密切，课堂气氛令人愉快，教师十分关心学生的愿望和需要。(3)容忍和权威型。 (4)容忍型。(5)非决断/容忍型。强调师生合作，学生自由度较大，教师对学生十分关心，但教师领导力 较小，有时会产生一些混乱，教师往往不能决断性地制止混乱。(6)非决断/挑衅型。教师与学生处于一种 相互敌视和对抗的状况，学生常常挑衅性地制造混乱，教师无力制止混乱。(7)压抑型。课堂上有明确的 规则，教师对课堂的控制很严格，对学生要求苛刻，不满足学生的愿望；学生表现顺从，但没有积极性， 表现出对教师的恐惧，并不能专注于课堂活动。(8)辛劳型。故题干所述高老师与学生的交往类型属于非 决断/挑衅型。本题选C项。"},{"number":15,"type":"单选","stem":"生物老师唐老师在进行“人体与外界环境的气体交换”这一课的教学时，制作了一个模仿呼吸运动 的实验装置，在课堂上通过实验装置模仿呼吸运动中呼气和吸气两种状态的交替过程，使同学们能够直 观地感受到参与呼吸运动的各个结构在一呼一吸之间所起到的作用。唐老师采用的教学方法是","options":{"A":"演示法","B":"参观法","C":"实验法","D":"实践法"},"answer":"A","explanation":"本题考查教学方法。演示法是指教师在上课时，配合讲授、谈话向学生展示各种实物、教具 或示范性实验，指导学生通过观察，获得关于事物的感性认识，来说明、印证所传授的知识的方法。题干 中的唐老师在课堂上展示模仿呼吸运动的实验，让学生通过观察获得相关知识，其采用的教学方法是演示 法。"},{"number":16,"type":"单选","stem":"2021 年12 月22日，教育部表示，随着()的落实，在学生手机、睡眠、体质等方面管理成效初显， 全国98.7%的学校建立了睡眠状况监测制度。","options":{"A":"“双减”政策","B":"五项管理 c.营养改善计划","D":"义务教育质量评价指南"},"answer":"B","explanation":"本题考查教育时政。2021年12月22日，教育部表示，随着“五项管理”的落实，在学生手 机、睡眠、读物、作业、体质方面管理成效初显，全国98.7%的学校建立了睡眠状况监测制度。"},{"number":17,"type":"单选","stem":"在加德纳的多元智能理论中， ( )是指能正确建构自我的能力，知道如何利用这些意识察觉做出适 当的行为，并规划、引导自己的人生的能力。","options":{"A":"人际智能","B":"内省智能 c.自然观察智能","D":"逻辑一数学智能"},"answer":"B","explanation":"本题考查加德纳的多元智力理论。内省智能(内省智力、自知智力)是包括认识自己并选择 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 17 自己生活方向的能力，知道如何利用这些意识察觉做出适当的行为，并规划、引导自己的人生。"},{"number":18,"type":"单选","stem":"()从实用主义经验论出发，认为教育乃是经验的连续不断地改造和改组，一切真正的学习都是来自于 经验，都具有经验的意义。","options":{"A":"杜威","B":"桑代克 c.卢梭","D":"布鲁纳"},"answer":"A","explanation":"本题考查杜威的教育思想。杜威认为，教育即生活，教育即生长，教育即经验的改组或改 造。教育的过程是一个不断改组、不断改造和不断转化的过程。在经验的基础上，杜威提出了“从做中 学”，要求以活动性、经验性的主动作业取代传统的书本式教材的统治地位。故本题选A项。"},{"number":19,"type":"单选","stem":"课堂上纪律混乱，新来的小张老师担心自己严厉训斥学生后学生会不喜欢自己，就找教导主任来维 持秩序。这说明小张老师处于教师成长的()","options":{"A":"关注生存阶段","B":"关注学生阶段 c.关注情境阶段","D":"关注生命阶段"},"answer":"A","explanation":"本题考查傅乐与布朗的教师发展三阶段理论。傅乐和布朗根据教师的需要和不同时期所关注 的焦点问题，把教师的成长划分为教学前关注、关注生存、关注情境和关注学生四个阶段。其中，关注生 存阶段是初次接触实际教学的实习阶段。教师所关注的是自我胜任能力及自我的生存问题，即能否在这个 新环境中生存下来。所以，此时教师们关注的是班级的经营管理，对教学内容的精通熟练，以及上级的视 察评价，学生与同事的肯定、接纳等。因而，可能会把大量的时间花在如何与学生搞好个人关系上，想方 设法控制学生，而不是更多地考虑如何让学生取得学习上的进步。题干中小张老师关心的是学生是否喜欢 自己，说明他处于关注生存阶段。"},{"number":20,"type":"单选","stem":"杨老师班级的小李同学总是在学校穿一些“过于时髦” “非主流”的、不太符合学生角色的衣服， 在杨老师和他谈心后，小李同意在学校规章制度允许范围内选择自己喜欢的服饰。这属于心理学中的( ) 现象。","options":{"A":"从众行为","B":"服从行为","C":"社会惰化","D":"社会助长"},"answer":"B","explanation":"本题考查服从。服从是指在权威命令、社会舆论或群体气氛的压力下，放弃自己的意见而采 取与大多数人一致的行为。服从可能是出于自愿，也可能是被迫的。题干中小李同学在杨老师的要求下同 意遵守学校规章制度，体现的是服从。"},{"number":21,"type":"单选","stem":"刘老师热爱教育事业，平时认真备课，辅导学生，批改作业，勤于写教学反思、总结。除上班时间 外，还利用休息时间提升自己的教学能力。这主要体现的教师职业道德规范是()。","options":{"A":"爱国守法","B":"爱岗敬业","C":"廉洁奉公","D":"关爱学生"},"answer":"B","explanation":"本题考查2008年修订的《中小学教师职业道德规范》。2008年修订的《中小学教师职业道 德规范》中关于“爱岗敬业”方面所规定的具体职业行为要求包括：(1)对工作高度负责；(2)认真备课上 课；(3)认真批改作业；(4)认真辅导学生；(5)不得敷衍塞责。题干所述体现的教师职业道德规范是爱岗 敬业。"},{"number":22,"type":"单选","stem":"班主任是班集体的教育者和组织者，是学校进行教导工作的得力助手。下列关于班主任工作的基本 任务的描述有误的是","options":{"A":"对学生的课余生活全面负责","B":"做好学生的思想教育工作\nc.协调来自各方面对学生的要求","D":"使部分学生在德智体美等方面得到发展"},"answer":"D","explanation":"本题考查班主任工作的基本任务。班主任工作的基本任务是：依据我国教育目的和学校的教 育任务，协调来自各方面对学生的要求与影响，有计划地组织全班学生的教导活动，做好学生的思想教育 工作，并对他们的学习、劳动、工作课外活动、课余生活以及社会活动等全面负责，把班级培养成为积极 向上的集体，使每个学生在德智、体、美等方面都得到充分地发展。"},{"number":23,"type":"单选","stem":"教育要以人为本，促进人的发展，要关注过程、关注发展。为了体现这个基本理念，下列依法中不 可取的是","options":{"A":"适当调整教材单元之间的顺序","B":"调整教材的呈现方式","C":"适当删减教学内容","D":"布置高难度的课后练习"},"answer":"D","explanation":"本题考查体现教育以人为本的做法。教育以人为本要求教师应该根据学生的特点调整教学内 容、教学方法及作业难度，而不应该仅布置高难度的课后练习。"},{"number":24,"type":"单选","stem":"根据韦纳的归因理论，某学生认为自己期末考试获得全校第一名是自己努力的结果，其归因是","options":{"A":"内部、不稳定、不可控的","B":"外部、稳定、不可控的\nc.外部、稳定、可控的","D":"内部、不稳定、可控的"},"answer":"D","explanation":"本题考查维纳的归因理论。美国心理学家维纳把人经历过事情的成败归结为六种原因，即能 力高低、努力程度、任务难易、运气好坏、身心状态和外界环境。又把上述六项因素按各自的性质，分别 归入三个维度：内外性归因、稳定性与不稳定性归因、可控性与不可控性归因。其中，努力程度属于内 部、不稳定、可控的归因。"},{"number":25,"type":"单选","stem":"抛锚式教学模式有时也被称为“实例式教学”，其教学过程为","options":{"A":"创设情境一确定问题一自主学习一协作学习一效果评价","B":"效果评价一创设情境一自主学习一确定问题一协作学习\nc.确定问题一自主学习一创设情境一效果评价一协作学习","D":"确定问题一效果评价一自主学习一协作学习一创设情境"},"answer":"A","explanation":"本题考查抛锚式教学。抛锚式教学要求建立在有感染力的真实事件或真实问题的基础上，所 以有时也被称为“实例式教学”或“基于问题的教学”或“情境性教学”。抛锚式教学的理论基础是建构 主义。组成抛锚式教学的基本环节是创设情境一确定问题一自主学习一协作学习一效果评价。"},{"number":26,"type":"单选","stem":"每学期开学时，李老师都会对同学们假期的学习情况进行小测验。这种评价方式属于","options":{"A":"诊断性评价","B":"形成性评价 c.总结性评价","D":"绝对性评价"},"answer":"A","explanation":"本题考查教学评价的类型。诊断性评价指在教学计划实施的前期阶段开展的评价。重在对学 生已经形成的知识、能力、情感等发展状况做出合理的评价，从而为教学计划的有效实施提供可靠的信息 资源，以获得更好的效果。题干中，李老师在每学期开学时，为了解同学们假期的学习情况而进行的评价 属于诊断性评价。 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 18"},{"number":27,"type":"单选","stem":"情感领域的教育目标分类学按照价值内化的程度将教育目标分为五级，其中级别最低的是","options":{"A":"反应","B":"注意","C":"组织","D":"价值化"},"answer":"B","explanation":"本题考查情感领域的目标分类。美国著名心理学家克拉斯沃尔、布卢姆等人对情感领域目标 的分类，是以价值内化的程度为依据的。该领域的目标共分五类。由低到高依次是接受(注意)、反应、价 值评价、组织、由价值或价值复合体形成的性格化。"},{"number":28,"type":"单选","stem":"小慧从小就练习拉小提琴，所以她很快就学会了拉大提琴。这种现象属于","options":{"A":"逆向、正迁移","B":"逆向、负迁移 c.顺向、正迁移","D":"顺向、负迁移"},"answer":"C","explanation":"本题考查学习迁移的种类。根据迁移的性质和结果，学习迁移可分为正迁移和负迁移。其 中，正迁移也叫“助长性迁移”，是指一种学习对另一种学习的促进作用。负迁移也叫“抑制性迁移”， 是指一种学习对另一种学习产生阻碍作用。题干中小提琴的学习对大提琴的学习起促进作用，故属于正迁 移。根据迁移发生的方向，学习迁移可分为顺向迁移和逆向迁移。顺向迁移是指先前学习对后继学习产生 的影响。逆向迁移是指后继学习对先前学习产生的影响。题干中小提琴的学习在大提琴的学习之前，故属 于顺向迁移。故题干所述内容属于顺向、正迁移。"},{"number":29,"type":"单选","stem":"下列关于视觉教学与直观教学的说法错误的是","options":{"A":"它们的本质是一致的","B":"它们的区别在于所用媒体种类不同","C":"视觉教学很少重视教具和教材的选择应用","D":"直观教学强调教室要布满图画，书本要配有插图"},"answer":"C","explanation":"本题考查视觉教学与直观教学。直观教学是在感知实物的基础上提供感性材料的直观教学方 式。直观教学强调教室要布满图画，书本要配有插图，直观教具的呈现要放在学生面前合理的距离内，让 学生先看到整体，然后再分辨各个部分，并且要设法引起和保持学生的注意。D项正确。视觉教学与直观 教学在本质上是一致的，其区别在于所用媒体种类的不同。AB两项正确。视觉教学主要强调要向学生提供 生动的视觉形象，使抽象的概念以具体形式呈现。视觉教学重视视觉教具和教材的选择应用，而很少重视 教材的设计、开发、制作、评价和管理。故C项说法错误。"},{"number":30,"type":"单选","stem":"安排在学习任务之前呈现给学习者引导性材料，目的在于用先前学过的材料去解释、融合和联系当前学 习任务中的材料。这属于常用教学策略中的","options":{"A":"掌握学习教学策略","B":"先行组织者教学策略 c.情境陶冶教学策略","D":"示范模仿教学策略"},"answer":"B","explanation":"本题考查常用的教学策略。常用的教学策略包括先行组织者教学策略、掌握学习教学策略、 情境一陶冶教学策略和示范一模仿教学策略。其中，先行组织者教学策略是安排在学习任务之前呈现给学 习者的引导性材料。提供先行组织者的目的在于用先前学过的材料去解释、融合和联系当前学习任务中的 材料。"},{"number":31,"type":"判断","stem":"陈述性知识主要是有关“怎么办”的知识，教学设计时要将设计的重点放在如何帮助学生有效地理 解、掌握这些知识上，注重学生对其符号或词语意义的获取。","options":{"A":"正确","B":"错误"},"answer":"×","explanation":"本题考查陈述性知识。陈述性知识也叫描述性知识，是个人能用言语进行直接陈述的知 识，主要用于区别和辨别事物。陈述性知识主要说明事物“是什么”“为什么”“怎么样”。在陈述 性知识的教学设计中，要将设计的重点放在如何帮助学生有效地理解、掌握这类知识上，注重学生对 其符号或词语意义的获取。程序性知识是关于事物“做什么”和“怎么做”的知识。故题干说法错 误。"},{"number":32,"type":"判断","stem":"系列学习是学习运用一类事物的关键特征对事物进行分类。","options":{"A":"正确","B":"错误"},"answer":"×","explanation":"本题考查概念学习。概念是意义形成和思维的基本结构 概念学习是意义学习中的一种 较高形式的学习，是一切高级学习的基础。概念学习实质上是掌握同类事物共同的关键特征和本质 属性，是学习运用一类事物的本质特征对事物进行分类。"},{"number":33,"type":"判断","stem":"学生自主制订科学的时间表，对学习时间进行合理的规划。这种学习策略属于资源管理策略。","options":{"A":"正确","B":"错误"},"answer":"✔","explanation":"本题考查资源管理策略。资源管理策略中的时间管理策略要求学生做到：第一，统筹安 排学习时间；第二，高效利用最佳时间；第三，灵活利用零碎时间。题干中学生的做法符合时间管理 策略 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 20 的要求。故题干所述内容正确。"},{"number":34,"type":"判断","stem":"教育工作者在教育科研的过程中不要受制于某种理论或模式，要坚持实践是检验真理的唯一标准的 原则。","options":{"A":"正确","B":"错误"},"answer":"✔","explanation":"本题考查教育科研的创新性。教育工作者在科研的过程中不要受制于某种理论或模式，限制 大脑思维。要坚持实践是检验真理的唯一标准的原则。凡是在实践当中反复验证了的认识就是正确的，就 应该承认它，并要勇敢地发表出去，这也就是教育科研过程中的创新性。"},{"number":35,"type":"判断","stem":"英国教育家洛克倡导教育的目的就是要培养雄辩家。","options":{"A":"正确","B":"错误"},"answer":"×","explanation":"本题考查洛克的教育思想。洛克认为，教育目的就是培养绅士，而这种培养只能通过家庭教 育来实行，由此提出了“绅士教育论”。昆体良是西方教育史上第一个专门论述教育问题的教育家，其代 表作《雄辩术原理》(或曰《论演说家的教育》是西方最早的教育著作，也被誉为古代西方的第一部教学 法论著。昆体良认为教育的最终目的就是要培养演说家、雄辩家。"},{"number":36,"type":"判断","stem":"效度是衡量一个测验正确性的重要指标，即一个测验能够测量出其所要测量的东西的程度。","options":{"A":"正确","B":"错误"},"answer":"✔","explanation":"本题考查效度。效度是指一个测验工具希望测到某种行为特征的有效性与准确程度。"},{"number":37,"type":"判断","stem":"2021 年12月16日，教育部、国家发展改革委、财政部等九部门联合印发《“十四五”学前教育发 展提升行动计划》《“十四五”县域普通高中发展提升行动计划》，意味着我国基础教育在巩固义务教 育普及水平的基础上，进一步向两端延伸。","options":{"A":"正确","B":"错误"},"answer":"✔","explanation":"本题考查教育时政。2021 年12月16日，教育部公布与国家发展改革委、财政部等九部门联 合印发的《“十四五”学前教育发展提升行动计划》《“十四五”县域普通高中发展提升行动计划》学前 教育和普通高中提升计划同步出台，意味着我国基础教育在巩固义务教育普及水平的基础上，进一步向两 端延伸。"},{"number":38,"type":"判断","stem":"在新的课程计划和课程标准下，教材管理由“国审制”转变成“国编制”。","options":{"A":"正确","B":"错误"},"answer":"×","explanation":"本题考查教材的管理。在新课改中，教材管理由“国编制”转变为“国审制”，教材的选择 余地更为广泛，呈现方式也多样化；适当降低教材知识的难度，大量引入现代信息；密切生活联系，关注 学生个体的成长经验；重视活动设计，鼓励学生探究创造；尊重师生个性，给师生更广阔的发展空间。"},{"number":39,"type":"判断","stem":"做好美育工作，要坚持立德树人，扎根时代生活，遵循美育特点，弘扬中华美育精神，让祖国青年 一代身心都健康成长。","options":{"A":"正确","B":"错误"},"answer":"✔","explanation":"本题考查教育时政。2018 年8月30 日，习近平总书记在给中央美术学院老教授的回信中指 出：“做好美育工作，要坚持立德树人，扎根时代生活，遵循美育特点，弘扬中华美育精神，让祖国青年 一代身心都健康成长。”"},{"number":40,"type":"判断","stem":"在运用练习指导时，座位模式安排要便于教师监控全班学生。 () 四、主观题 (本大题共5小题，共60分) 简答题(2小题每题10分)","options":{"A":"正确","B":"错误"},"answer":"✔","explanation":"本题考查练习指导的运用策略。练习指导的运用策略包括：(1)独立练习前，帮助学生做好对 知识、技能理解和运用的准备；(2)均衡安排独立练习的题量和题型；(3)座位模式安排要便于教师监控全 班学生；(4)沿教室巡视，监控学生练习；(5)建立起独立练习的常规。"}]},{"year":"2023","exam_name":"2023年广东省普宁市教师招聘考试真题卷","total_questions":79,"questions":[{"number":1,"type":"单选","stem":"王羲之在练字的时候总是练到忘我的境界，有一次吃饭，王羲之一边吃一边练字，错把墨汁当成赫 泥，拿馒头蘸着吃了，结果吃得满嘴都是黑色。这一现象体现了注意的()特点。","options":{"A":"指向性","B":"集中性","C":"调节性","D":"维持性"},"answer":"B","explanation":"注意的集中性是指当心理活动或意识指向某个对象时，它们便会在这个对象上集中起来。如 果说注意的指向性是方向的朝向问题，那么注意的集中性就是注意力在这个方向上活动的强度或紧张度。"},{"number":2,"type":"单选","stem":"李老师是一名新手教师，他工作非常认真，常向学校老教师请教教学经验，他认为只要他积极投入教 学，认真钻研教学，主动了解学生的情况，一定可以使学生的成绩获得提升。这说明李老师具有较好的","options":{"A":"教学效能感","B":"教学认知能力 c.教学实践能力","D":"教学处理能力"},"answer":"A","explanation":"教学效能感一般指教师对自己影响学生行为和学习结果的能力的一种主观判断，教学效能感 分为一般教学效能感和个人教学效能感两部分。李老师认为只要他积极投入教学，认真钻研教学，主动了 解学生的情况，一定可以使学生的成绩获得提升是教学效能感的体现。"},{"number":3,"type":"单选","stem":"编舞师在熟练掌握几种舞蹈类型后，可以根据歌曲编成一支融合多种类型的舞蹈，编舞师在其中运用 到了学习迁移中的","options":{"A":"重组迁移","B":"同化迁移","C":"顺应迁移","D":"逆向迁移"},"answer":"A","explanation":"重组性迁移是指重新组合原有经验系统中的某些构成要素或成分，调整各成分之间的关系或 建立新的联系，从而应用于新的情境。这种经验的整合过程即重组性迁移在重组过程中，基本经验成分不 变，只是各成分间的结合关系进行了调整或重新组合。对一些原有舞蹈或体操的动作进行调整或重新组合 后，编排出新的舞蹈或体操动作。对网络、战争、游戏等概念进行重新组合，就会形成网络战争游戏的新 概念。对知识和技能的重新组合， 能产生出新的知识和技能，如把蜂鸣器和水壶组合在一起，成为蜂鸣器报警水壶，把眼镜片放入眼睛中， 形成新产品即隐形眼镜。可以看出，通过重组性迁移，不仅扩大了基本经验的适用范围，还包含有创造性 的成分。"},{"number":4,"type":"单选","stem":"2021 年至2022年期间，F市某育才小学教师徐某某多次收受学生家长礼品礼金徐某某的行为违反了 《新时代中小学教师职业行为十项准则》中的() 秉持公平诚信","options":{"B":"潜心教书育人 c.坚定政治方向","D":"坚守廉洁自律"},"answer":"D","explanation":"本题考查《新时代中小学教师职业行为十项准则》。坚守廉洁自律要求：严于律己，清廉从 教；不得索要、收受学生及家长财物或参加由学生及家长付费的宴请、旅游、娱乐休闲等活动，不得向学 生推销图书报刊、教辅材料、社会保险或利用家长资源谋取私利。"},{"number":5,"type":"单选","stem":"到了儿童后期和少年期，强度有所减弱的成就动机是()。在这期间，来自同伴，集体的赞许和认可逐 渐替代了对长者的依附。","options":{"A":"认知内驱力","B":"附属内驱力","C":"心理内驱力","D":"生理内驱力"},"answer":"B","explanation":"在儿童早期，附属内驱力最为突出，他们努力获得学业成就，主要是为了实现家长的期待， 并得到家长的赞许。到了儿童后期和少年期，附属内驱力的强度有所减弱，来自同伴、集体的赞许和认可 逐渐替代了对长者的依附。"},{"number":6,"type":"单选","stem":"教育虽是文化传递的手段，但教育又不等同于文化传递，因为教育不是对所有文化的传承，人们总是 要把最基本的、最为精华的文化确定为教育的内容传授给年轻一代。这主要体现了教育的","options":{"A":"文化更新与创造功能","B":"文化交流吸收功能 c.文化选择功能","D":"文化激活功能"},"answer":"C","explanation":"本题考查文化功能。杜威对文化的选择功能有精辟的论述，他认为文化过分庞杂，不能全部吸 收，必须通过教育进行“简化”吸取其基本内容；文化中存在丑陋现象必须通过教育“净化”，清除不良 的东西，选择最优秀的东西；社威所讲的教育对文化的简化、净化、平衡作用，就是教育对文化的选择功 能。"},{"number":7,"type":"单选","stem":"学情分析的方法中， ()是目前多用于学生在升入新的年级之后开始新的学习层次之前，教师必须对 学生在前期学习阶段的学习情况进行检测，以确定学生是否具备进入新学习领域的能力。","options":{"A":"观察法","B":"预测法","C":"访谈法","D":"问卷调查法"},"answer":"B","explanation":"学情分析的方法中，预测法是目前多用于学生在升入新的年级之后开始新的学习层次之前， 教师必须对学生在前期学习阶段的学习情况进行检测，以确定学生是否具备进入新学习领域的能力。"},{"number":8,"type":"单选","stem":"如今国家已经开始在很多省份试点新高考政策，新高考一个重要的突破就是打破了多年的文理分科， 使学生能较为全面地学习到科学文化知识。这一做法与培养“百科全书式”的学习者的观点不谋而合。 最早提出该观点的学者是","options":{"A":"卢梭","B":"赫尔巴特 c.夸美纽斯","D":"杜威"},"answer":"C","explanation":"夸美纽斯提出了“百科全书式”的教学内容观。"},{"number":9,"type":"单选","stem":"()指的是人们对自己的行为所产生的评价反应，也会调节可观察到的习得行为，他们倾向于做出令自 己满意的行为，拒绝那些个人厌恶的东西。","options":{"A":"直接强化","B":"自我强化 c.外部强化","D":"替代强化"},"answer":"B","explanation":"自我强化人指的是能观察自己的行为，并根据自己的标准进行判断，由此强化或处罚自己。 自我强化是自己对自己行为的一种肯定和否定，有着自己的评判标准。比如自己按时完成作业，自己给自 己一个表扬。"},{"number":10,"type":"单选","stem":"随着科学技术的发展，教学媒体在不断更新，从简单的实物、口头语言、书本、录音、录像到多媒 体计算机网络，教学媒体已成为教学中一个具有独特意义的因素。下列关于教学媒体的说法错误的是","options":{"A":"教学媒体是教学内容的载体","B":"教学媒体是教学内容的表现形式\nc.教学媒体是师生之间传递信息的工具","D":"教学媒体是学与教的过程中有意传递的主要信息部分"},"answer":"D","explanation":"本题考查教育心理学研究。教育心理学研究包含五大要素：(1)学生。学生是学习的主体， 任何教学手段必须通过学生而起作用。(2)教师。教师是教学组织的主要负责人，在教学中起关键作用。 (3)教学内容。教学内容是学与教的过程中有意传递的主要信息部分，一般表现为课程、教材、教学目标 等。(4)教学媒体。教学媒体是教学内容的载体、教学内容的表现形式以及师生之间传递信息的工具，如 口头语言、板书、图像等。(5)教学环境。教学环境包括物质环境、社会环境。物质环境有教学设施 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 6 (如桌椅、黑板)、空间布置(如座位)、自然条件(如温度、照明)；社会环境有课堂纪律、课堂气氛、师生 关系等。"},{"number":11,"type":"单选","stem":"灾祸本身或许不足以致命，但是它带来的伤害却能变成长期的阴影。这是因为人的内心会被植入一 种叫作“恐惧”的东西，下次遇到类似的事件时，内心的“恐惧”又会浮出来了。这一现象产生的原因 是","options":{"A":"语义记忆","B":"逻辑记忆","C":"情绪记忆","D":"动作记忆"},"answer":"C","explanation":"情绪记忆意指对曾经体验过的情绪和情感的记忆。引起情绪和情感的事件已经过去，但情绪 和情感的体验可保存在记忆中。在一定条件下，这种情绪和情感又会重新被体验到。例如，当某人回想起 以前一次战斗胜利的情景时，当时的情绪和情感也会再现，他好像再一次体验到了胜利的喜悦和欢快。比 较强烈的、对人有重大意义的情绪和情感保持较久并容易再现。"},{"number":12,"type":"单选","stem":"体育课上，敏敏学会了“投掷铅球”根据加涅依据学习结果而对学习进行的分类，这属于典型的() 的学习。","options":{"A":"言语信息","B":"智慧技能 c.认知策略","D":"动作技能"},"answer":"D","explanation":"动作技能指通过练习巩固下来的、自动化的、完善的动作活动方式。如日常生活方面的写 字、行走、骑自行车；体育运动方面的游泳、体操、打球；生产劳动方面的锯、刨、车等活动方式，都属 动作技能。题干中投掷铁饼属于动作技能。"},{"number":13,"type":"单选","stem":"下图所示是一张“双关图形”，同一张图，不同的人可能会看出不同的内容。例如，有人会看成树 和鸟，也有人看成一张美丽的面孔。这主要反映的是知觉的","options":{"B":"理解性","D":"整体性","A":"选择性"},"answer":"B","explanation":"本题考查知觉的理解性。知觉的理解性是指人以知识经验为基础对感知的事物加工处理，并 用语词加以概括赋予说明的加工过程。题干中表述“同一张图，不同的人可能会看出不同的内容”，即不 同经验的人对同一刺激有不同的理解，是理解性的体现。"},{"number":14,"type":"单选","stem":"学生的()是自主性最强、选择性最大的生活方式。","options":{"A":"校园生活","B":"班级生活 c.个人生活","D":"家庭生活"},"answer":"C","explanation":"学生的个人生活是自主性最强、选择性最大的生活方式。"},{"number":15,"type":"单选","stem":"下列教师的做法符合《新时代中小学教师职业行为十项准则》的是","options":{"A":"陈老师让学生购买其编写的散文集","B":"李老师经常参加资深教师组织的工作坊\nc.张老师通过信息网络匿名发表错误的观点","D":"王老师每天晚上兼职开网约车，白天上课时精神不济"},"answer":"B","explanation":"本题考查《新时代中小学教师职业行为十项准则》。A选项违背坚守廉洁自律；C选项违背 传播优秀文化：D选项违背潜心教书育人。"},{"number":16,"type":"单选","stem":"暑假是学生最向往的假期，也是最易“变质”的旺季，因为许多家庭长期失管脱管，导致孩子沉迷 于电脑游戏、手机视频等。每年暑假过后，总有不少班主任对 的怪象进行各式吐槽。这启 示教师要注重() \u0000\u0000൅\u0000 ͳ \u0000\u0000","options":{"A":"长善救失原则","B":"因材施教原则\n\nc.教育影响的一致性与连贯性原则","D":"尊重学生与严格要求学生相结合的原则\n根据以下材料，回答17~19题。\n这个班是由刚刚步入初中的新同学组成的，新的班级刚刚建立，班里的每一件事情都需要教师自己做，\n时间表的编制、班里功能区的划分、个人工作区的设计，还要自己边看书边制作出更适合学生的各种程\n序，自己订立适合学生学习的主题，准备教案等。刚开始上课，有的学生上课走神，有的坐不住，有的\n搞小动作，学生要适应新的环境、新的课程、新的老师、新的教育教学方式，确实需要一定的时间。这\n就要求班主任应该先从宏观管理入手，把班级管理科学地划分为几个阶段，逐步向学生自主管理过渡。"},"answer":"C","explanation":"本题考查德育原则。在德育工作中，教育者应主动协调多方面教育力量，统一认识和步调， 有计划、有系统、前后连贯地教育学生，发挥教育的整体功能，培养学生正确的思想品德。“1+1=0”的 怪象违背了一致性与连贯性的德育原则。"},{"number":17,"type":"单选","stem":"关于自主管理，下列说法错误的是","options":{"A":"自主管理有助于提高学生的管理能力","B":"自主管理有助于增强学生辨别是非的能力\nc.在自主管理模式下，学生们有展现自我能力的空间和平台","D":"班级自主管理会在一定程度上限制教师自身的专业发展"},"answer":"D","explanation":"现代教育观要求学校教育必须以人为本，重视人的自我发展和完善。“班级自主管理”就是 通过班主任的指导，学生实现对班级的自治，不会限制教师自身的专业发展"},{"number":18,"type":"单选","stem":"材料中班主任进行班级管理时，可采取的方法不包括","options":{"A":"发挥学生的主导作用，同时加强教师的辅助作用","B":"安排学生座位的排列时应兼顾好四周、男女生等情况\nc.策划好班级组织，并明确分工，让他们各司其职","D":"利用好开展各项活动的机会在做好总指挥员的同时，寓管理于活动之中"},"answer":"C","explanation":"材料中班主任进行班级管理时，应当培养学生自主管理班级的能力，让学生成为班级管理的 “小主人”。同时，也要发挥教师的主导能力。因此，“明确分工，让他们各司其职”依然是在班级管理 中以教师为主，忽略了学生的自主性。"},{"number":19,"type":"单选","stem":"材料中的班级属于班级发展的四个过程中的","options":{"A":"形成期的合作群体阶段","B":"初建期的松散群体阶段","C":"发展阶段","D":"成熟阶段"},"answer":"B","explanation":"本题考查班集体的发展阶段。松散期。刚组建的班级，尤其是学生刚刚入学的新班级，学生 之间互不认识、缺乏了解，彼此之间尚存一种孤独感，此时一切行动都服从教师的指挥。“新的班级刚刚 建立“属于初建期的松散群体阶段。"},{"number":20,"type":"单选","stem":"班级授课制是学校教育发展到一定历史阶段的产物。在它产生之前，无论是中国还是外国的古代教育 (奴隶社会和封建社会的教育)均采用个别教学的形式。关于班级授课制的特点，下列说法正确的有() 项。 ①学生的独立性与自主性受到很大限制 ②有利于发挥班集体的教育作用，促进学生个性健康发展和学生的社会化进程 ③教学时间和教学内容预先设计，不能及时吸纳一些新的、必要的科学成果 ④相同年龄和相近知识水平的学生编入一个班级，其心理水平、自觉程度和认识水平相近，因此便于教 学管理","options":{"A":"4","B":"3","C":"2","D":"1"},"answer":"A","explanation":"本题考查班级授课制的优点与不足。班级授课制的优点：(1)有利于扩大教学规模，提高教 学效率；(2)有利于发挥教师的优势，突出教师的主导作用；(3)有利于发挥班集体的教育作用，促进学生 个性健康的发展和学生的社会化进程；(4)有利于科学文化知识的传授，确保学生获得系统的连贯的知 识，保证教学质量；(5)有利于进行教学管理和教学检查。班级授课制这一教学组织形式的形成和完善， 使得教学活动日益正规化、系统化、科学化。相同年龄和相近知识水平的学生，编入一个班级，其心理水 平、自觉程度和认识水平相近，因此便于教学管理。同一年级的学生使用相同教材，按照同一进度上课， 有统一的教学要求，关于教学质量的评价标准基本相同，对教师的要求也大体一致，因此便于对教师的教 学活动进行检查，评价教师的教学质量。班级授课制的缺点：(1)学生的独立性与自主性受到很大限制； (2)学生主要是接受性学习，不利于培养学生的创新精神和实践能力；(3)教学内容固定化、程序化，不能 反映学生的实际需要，脱离学生的现实生活；(4)教学时间和教学内容预先设计， 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 7 不能及时吸纳一些新的必要的科学成果。"},{"number":21,"type":"单选","stem":"异地读书的刘娜总是希望在学校有个团体能够接纳她、包容她，于是积极地加入了学校社团。由此 可见，刘娜最缺少马斯洛需要层次理论中的","options":{"A":"安全的需求","B":"归属和爱的需求","C":"物质的需求","D":"生理的需求"},"answer":"B","explanation":"归属与爱的需要，也称社交需要，是指每个人都有被他人或群体接纳、爱护、关注、鼓励及 支持的需要。它是生理和安全需要满足之后的更高一级的需要，包括被人爱与热爱他人、希望交友融洽、 保持友谊、人际关系和谐、被团体接纳、成为团体一员、有归属感等。"},{"number":22,"type":"单选","stem":"下列选项中，主要体现了教学过程的是","options":{"A":"张老师经常在课堂上向学生进行提问与答疑","B":"学生小梁经常自觉完成自己的作业\nc.何老师下班后在家里研读教育学著作","D":"学生小斌经常与妹妹一起扮演老师教学生的游戏"},"answer":"A","explanation":"一般认为，教师、学生、教学内容和教学手段是构成教学过程的基本要素。A选项符合基本 要素的要求。"},{"number":23,"type":"单选","stem":"古代书生学习的目的，大多是考取功名，入朝为官，这都是受到了()的“学而优则仕”这一教育思 想的影响。","options":{"A":"儒家","B":"释家","C":"法家","D":"道家"},"answer":"A","explanation":"“学而优则仕”是儒家教育思想。"},{"number":24,"type":"单选","stem":"陈老师的课堂常常被学生描述为“一言堂”，她的教育管理主要是命令式。这种权威式话语还表现在 她的教学中，她对成绩好的学生表现出过度偏爱，剥夺了其他学生在课堂上的发言权。陈老师的这种课 堂管理类型属于","options":{"A":"民主型","B":"专制型","C":"理智型","D":"情感型"},"answer":"B","explanation":"“一言堂”“命令式”属于专制型的管理方式。"},{"number":25,"type":"单选","stem":"在义务教育阶段，学校分设重点班和非重点班的，由()责令限期改正。","options":{"A":"县级人民政府教育行政部门","B":"县级人民政府\nc.省级人民政府教育行政部门","D":"省级人民政府"},"answer":"A","explanation":"本题考查《中华人民共和国义务教育法》。第五十七条学校有下列情形之一的，由县级人民 政府教育行政部门责令限期改正；情节严重的，对直接负责的主管人员和其他直接责任人员依法给予处 分；(一)拒绝接收具有接受普通教育能力的残疾适龄儿童、少年随班就读的；(二)分设重点班和非重点 班的；(三)违反本法规定开除学生的；(四)选用未经审定的教科书的。"},{"number":26,"type":"单选","stem":"自习课上，学生们在预习新课或者复习掌握不到位的知识点。下列情境中未使用精细加工策略的是","options":{"A":"金刚石和石墨因碳原子的排列方式不同具有不同的物理性质，红红将其类比成同样的砖头可以搭成\n房子，也可以铺成地板，呈现出不同的外观和功能","B":"秦国灭六国的顺序是韩赵魏楚燕齐，明明将其以顺口溜的形式记忆\nc.在学习完《观沧海》后琳琳用自己的话将诗歌描述的景象重新叙述","D":"浩浩将英语中人称代词与物主代词列成方阵表"},"answer":"D","explanation":"本题考查学习策略中的精细加工策略。精细加工策略是指把新信息与头脑中的旧信息联系起 来从而增加新信息意义的深层加工策略。它常被描述成一种理解记忆的策略，其要旨在于建立信息间的联 系。如记忆术，做笔记，提问，生成性学习，运用背景知识、联系客观实际都属于精加工策略。A、B、C 项均是精加工策略，D项是组织策略。"},{"number":27,"type":"单选","stem":"某实验中学生物课堂上，张老师向同学们讲解光合作用需要光和光合色素的知识点时，以投影仪展示 光合作用实验，使学生能清楚地看到实验的过程，更形象直观地理解该知识点。这种教学方法属于","options":{"A":"实验法","B":"讨论法","C":"练习法","D":"演示法"},"answer":"D","explanation":"本题考查教学方法。演示法是指教师通过展示实物、教具和示范性的实验来说明、印证某一 事物和现象，使学生掌握新知识的一种教学方法。“以投影仪展示光合作用实验”属于演示法。"},{"number":28,"type":"单选","stem":"苏霍姆林斯基曾说： “如果你不想使知识变成僵死的、静止的学问，就要把语言变成一个主要的 创造工具。”这句话体现了教育者须具有较强的","options":{"A":"了解和研究学习者的能力","B":"钻研和处理教育媒介的能力\nc.组织管理能力","D":"语言表达能力"},"answer":"D","explanation":"本题考查语言运用技能。苏霍姆林斯基说：“如果你不想使知识变成僵死的、静止的方向， 就要把语言变成一个最主要的创造工具。”他认为教师的语言修养在极大程度上决定着学生在课堂上的脑 力劳动的效率。"},{"number":29,"type":"单选","stem":"王某想要当一名小学教师，但是由于自身的原因无法取得教师资格。下列选项中最可能是其无法取 得教师资格的原因的是","options":{"A":"中等师范学校毕业","B":"非党员 c.大学期间有科目挂科","D":"政治权利被剥夺"},"answer":"D","explanation":"本题考查《中华人民共和国教师法》。第十四条规定：受到剥夺政治权利或者故意犯罪受 到有期徒刑以上刑事处罚的，不能取得教师资格；已经取得教师资格的，丧失教师资格。"},{"number":30,"type":"单选","stem":"下列选项中，体现了有意后注意的是","options":{"A":"甲正在学习一门新的语言，经过一段时间的学习后，已经能够流利地与母语人士进行对话","B":"乙在看电影时，突然收到领导发来的重要短信，于是他暂停观看电影，立即回复信息\nc.丙正在专心致志地画画，但是听到旁边的人提到一个感兴趣的话题，就忍不住去听","D":"丁正在思考一道难题，突然意识到已经过了很长时间，于是决定休息一下"},"answer":"A","explanation":"本题考查有意后注意的理解。有意后注意也叫随意后注意，是指有预定目的，但不需要意志 努力的注意。它是在有意注意的基础上经过学习、训练或培养个人对事物的直接兴趣达到的。"},{"number":31,"type":"单选","stem":"某高校教师为了评选职称，将其学生所撰写的论文占为己用，在该学生不知情的情况下以自己第一 作者的形式在某期刊上进行发表。这种行为","options":{"A":"可以，学生应报答老师，所以老师用一下学生的论文无伤大雅","B":"可以，老师因为评选职称而占用学生的论文，这是情有可原的\nc.不可以，老师可以使用学生的论文，但是必须提前告知该学生","D":"不可以，这属于侵吞他人学术成果，是不遵守学术规范的行为"},"answer":"D","explanation":"题干中老师的做法是不正确的，属于侵吞他人学术成果，是不遵守学术规范的行为。"},{"number":32,"type":"单选","stem":"教师在无人监督时，也应自觉履行师德规范，养成良好的师德行为习惯，这说明教师应当","options":{"A":"自省慎独","B":"注重细节 c.加强学习","D":"躬身实践"},"answer":"A","explanation":"本题考查“慎独”的概念。教师职业道德修养的最高层次就是“慎独”“慎独”一词最早出 自儒家经典《礼记·中庸》。“慎独”用我们现代语言来表述，就是指在没有外界监督、独自一人的情况 下，也能自觉遵守道德规则，不做任何对国家、对社会、对他人不道德的事情。显然，这既是一种崇高的 道德境界，又是一种重要的职业道德修养方法"},{"number":33,"type":"单选","stem":"进入中学的小兰最近有些迷茫和压抑，她一直困惑于“我是一个什么样的人”“我的未来会怎样” 等问题。按照埃里克森的理论，此阶段小兰的主要任务是获得","options":{"A":"信任感","B":"主动性","C":"勤奋性","D":"自我同一性\n请根据以下所学知识，回答34~35 题。\n学习动机是指直接推动学生进行学习的一种内部行为，是激励和指引学生进行学习活动，维持和调节学\n习活动达到一定目标的内部力量。它是一种复杂的、综合性的心理性动机或社会性动机。"},"answer":"D","explanation":"心理学家埃里克森认为，青少年在成长的过程中面对的最大的困难就是建立关于自我的同一 性，这一种关于自己是谁，要朝什么方向发展的坚定的、一贯的认识。要形成同一性就必须为自己的人生 做出许多重要的选择：高考后我要选择什么样的专业?我想从事什么职业?我在未来想和什么样的人在一起? 这些问题都是青少年所担心的，当我们思考我是谁?以及努力决定我要成为什么样的人?时，我们会感受到 混乱、焦虑甚至抑郁，而这种情况就被称为同一性危机。"},{"number":34,"type":"单选","stem":"有些学生在准备竞赛的过程中，学习的积极性会高涨起来，但竞赛一结束这种积极性就不复存在了。 这说明()对学习的影响较小，维持的时间也比较短暂。","options":{"A":"内部动机","B":"外部动机","C":"远景性动机","D":"间接性动机"},"answer":"B","explanation":"外部学习动机：往往由外部诱因引起，与外部奖励相联系。比如为了获得表扬和鼓励、某一 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 8 物质奖励、地位等都是外部学习动机。题干中为了竞赛获奖属于外部学习动机，不稳定不持久。"},{"number":35,"type":"单选","stem":"对于学习动机与学习的关系，下列说法错误的是","options":{"A":"学习动机不是学习的必要条件","B":"学习动机与学习之间是相辅相成的\nc.学习动机是影响学习的唯一因素","D":"对于长期的学习来说，学习动机是绝对必要的"},"answer":"C","explanation":"本题考查的是学习动机与学习效果的关系。学习动机是影响学习行为、提高学习效果的一个 重要因素，但不是决定学习活动的唯一条件。比如，学习行为的好坏也会影响学习效果。故c选项表述错 误。"},{"number":36,"type":"单选","stem":"()的盛行直接导致了传统教育实践具有重视教师权威、书本知识和学校纪律等特点，其目的就是希望 通过控制儿童学习活动的内容、方式等来达到控制儿童发展的目的。","options":{"A":"遗传决定论","B":"教育万能论","C":"环境决定论","D":"内发论"},"answer":"C","explanation":"本题考查环境决定论。环境决定论的盛行直接导致了传统教育实践具有重视教师权威、书本 知识和学校纪律等特点。其目的就是希望通过控制儿童学习活动的环境、内容和方式来达到控制儿童发展 的目的。“严师出高徒”“棍棒底下出孝子”等谚语在我国广为流传，就是环境决定论对人们的教育方式 选择潜移默化影响的结果。"},{"number":37,"type":"单选","stem":"俗话说“上梁不正下梁歪”，如果父母某些行为不妥当，孩子在耳濡目染中，也可能会效仿这些行 为，养成坏习惯。孩子这样的学习属于","options":{"A":"试误学习","B":"深度学习","C":"顿悟学习","D":"观察学习"},"answer":"D","explanation":"观察学习是指人通过观察他人(榜样)的行为及其结果而习得新行为的过程。在观察学习中， 观察学习的对象称为榜样或示范者。比如：“向雷锋同志学习”就是一种对榜样行为进行的观察学习。"},{"number":38,"type":"单选","stem":"肖老师因家长收入水平低质疑家长素质，并在课堂上发表歧视、侮辱学生的言论。肖老师的行为违 反了教师职业道德规范中()的要求","options":{"A":"爱岗敬业","B":"遵纪守法","C":"关爱学生","D":"诚实守信"},"answer":"C","explanation":"《规范》中关于“关爱学生”方面所规定的具体职业行为要求有以下几点：(1)关心爱护全体 学生，尊重学生人格，平等公正对待学生；(2)对学生严慈相济，做学生的良师益友；(3)保护学生安全， 关心学生健康，维护学生权益；(4)不讽刺、挖苦、歧视学生，不体罚或变相体罚学生。"},{"number":39,"type":"单选","stem":"读初三的小润成绩很差，他对家长表示想放弃读书。其家长认为反正孩子不喜欢读书，成绩这么差 也考不上高中，于是同意其退学，让他外出打工挣钱。小润家长的行为侵犯了小润的","options":{"A":"受教育权","B":"荣誉权","C":"隐私权","D":"人格尊严权"},"answer":"A","explanation":"本题考查受教育权的理解。受教育权是学生最基本的权利。学生的受教育权包括受完法定年 限教育权、学习权和公正评价权。题干说法违反了“受完法定年限教育权”，。"},{"number":40,"type":"单选","stem":"对内向、认真吃苦的学生，要想方设法教给他们活学活用、融会贯通的方法，使他们变苦学为巧学。 对活泼、兴趣广泛的学生，要教给他们深化知识、夯实基础的方法，使其变浅学为深学。对学习勤奋、成 绩优异的学生，要教给他们博学多思、扩大知识面的方法。对基础薄弱自卑感强的学生，要教给他们制定 目标、改进策略的方法，使他们变厌学为愿学。这是","options":{"A":"根据学生的性格差异，因材施教","B":"根据学生的智力差异，因材施教\nc.根据学生的情感差异，因材施教","D":"根据学生的认知差异，因材施教"},"answer":"A","explanation":"题干中的描述说明了根据学生的性格的不同，展开不同的教学。"},{"number":41,"type":"单选","stem":"一个基本的事实是，教育是人必不可少的走向生活的通行证，它使享受教育的人能够选择自己将要 从事的职业，参与建设集体的未来和继续学习，这表明教育与()密不可分","options":{"A":"政治发展","B":"经济发展","C":"文化发展","D":"生态文明发展"},"answer":"A","explanation":"教育维系社会政治稳定主要通过两方面实现：(1)为社会培养各种政治人才。教育通过选拔 和培养专门的政治人才促进社会政治的稳定、完善和发展。(2)培养具有一定政治素质的社会公民。通过 培养人才实现对政治经济制度的影响，是教育作用于政治经济制度的主要途径。"},{"number":42,"type":"单选","stem":"学生经过学习，知道了地球公转轨道是非常接近正圆的椭圆，平均角速度是每年360 度的知识，该 知识类型是","options":{"A":"概念性知识","B":"元认知知识","C":"程序性知识","D":"事实性知识"},"answer":"A","explanation":"事实性知识包括学科专家用于学术交流、理解及系统地组织学科的基本要素，也就是基础知 识。概念性知识包括关于分类、类别及它们之间的关系的知识，是更为复杂、结构化的知识形式。概念性 知识分为三个亚类：分类和类别知识，原理和通则知识，理论、模型和结构知识，题干描述为概念性知 识。"},{"number":43,"type":"单选","stem":"根据《中华人民共和国教育法》，下列说法正确的有()项 ①学校可以对受教育者进行学籍管理，实施奖励或者处分 ②学校应当维护受教育者、教师及其他职工的合法权益 ③受教育者享有使用教育教学设施、设备、图书资料的权利 ④受教育者应当遵守学生行为规范，尊敬师长，养成良好的思想品德和行为习惯","options":{"A":"4","B":"3","C":"2","D":"1"},"answer":"A","explanation":"本题考查《中华人民共和国教育法》第二十九条规定：学校及其他教育机构行使下列权利： 对受教育者进行学籍管理，实施奖励或者处分；第三十条规定：学校及其他教育机构应当履行下列义务： 维护受教育者、教师及其他职工的合法权益；第四十三条规定：受教育者享有下列权利：参加教育教学计 划安排的各种活动，使用教育教学设施、设备、图书资料；第四十四条规定：受教育者应当履行下列义务 遵守学生行为规范，尊敬师长，养成良好的思想品德和行为习惯。"},{"number":44,"type":"单选","stem":"()成立于1862年洋务运动时期，为培养译员“通事”的外语学校。它是中国近代最早的外语专科学 校，也是近代第一所官办学校 京师同文馆","options":{"B":"天津水师学堂","C":"湖北自强学堂","D":"福建船政学堂"},"answer":"A","explanation":"本题考查京师同文馆。1862年8月24日，总理衙门开办“京师同文馆”，建成中国近代最 早的外语专科学校，也是近代第一所官办新学。"},{"number":45,"type":"单选","stem":"某同学认为她此次考试失败的原因是运气不好，试卷中没有出现自己复习过的知识点，根据成败归 因理论，该同学将失败归结于 ()的因素。","options":{"A":"稳定、外在、可控","B":"不稳定、内在、可控\nc.稳定、 内在、不可控","D":"不稳定、外在、不可控"},"answer":"D","explanation":"运气是外部、不可控、不稳定的归因。"},{"number":46,"type":"单选","stem":"美术老师通过讲授美学的力量概念，观察多媒体图片、视频，引导学生对美学有初步的了解后，让 学生根据自己的理解，设计一幅关于“美学力量”的主题海报。这一目标属于","options":{"A":"表现性目标","B":"体验性目标 c.结果性目标","D":"形成性目标"},"answer":"A","explanation":"本题考查课程目标设计的基本方式。(1)结果性目标，即明确告诉人们学生的学习结果是什 么。(2)体验性目标，即描述学生自己的心理感受、情绪体验应达成的标准。(3)表现性目标，即明确安排 学生各种各样的个性化的发展机会和发展程度。它在设计中所采用的行为动词通常是与学生表现什么有关 的或者结果是开放性的。题干描述属于表现性目标。"},{"number":47,"type":"单选","stem":"根据《新时代中小学教师职业行为十项准则》的相关内容，下列漫画中教师的做法明显违背了() 的内容。","options":{"A":"关心爱护学生","B":"坚定政治方向 c.坚守廉洁自律","D":"加强安全防范"},"answer":"C","explanation":"《新时代中小学教师职业行为十项准则》中，坚守廉洁自律即严于律己，清廉从教；不得索 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 9 要、收受学生及家长财物或参加由学生及家长付费的宴请、旅游、娱乐休闲等活动，不得向学生推销图书 报刊、教辅材料、社会保险或利用家长资源谋取私利。漫画中教师的做法明显违背了坚守廉洁自律的教师 职业行为。"},{"number":48,"type":"单选","stem":"开发大脑潜能课堂策略有多种，下列属于身体活动的直接刺激模式的是","options":{"A":"脑珠算锻炼","B":"形象思维训练","C":"暗示教育","D":"艺术教育"},"answer":"A","explanation":"身体活动的直接刺激，它包括身体肢体的训练、脑珠算锻炼、汉字书法练习和怀抱大自然活 动。身体的肢体训练，就是通过身体的各种动作训练，来刺激大脑相应部位，开发大脑的潜能。可以做手 指操、眼动操、健脑操这些都对开发人脑潜能有明显的作用。"},{"number":49,"type":"单选","stem":"开学初张老师通过调查问卷、个别谈话等方式了解班级学生的性格、学习态度等。这种评价方式属 于","options":{"A":"诊断性评价","B":"内部评价","C":"绝对性评价","D":"终结性评价"},"answer":"A","explanation":"本题考查教学评价的类型。(1)诊断性评价是在学期开始或一个单元教学开始时，为了了解 学生的学习准备状况及影响学习的因素而进行的评价。(2)总结性评价也称为终结性评价，是在一个大的 学习阶段、一个学期或一门课程结束时对学生学习结果的评价。(3)绝对性评价又称为目标参照性评价(标 准参照评价)，是运用目标参照性测验对学生的学习成绩进行的评价，它主要依据教学目标和教材编制试 题来测量学生的学业成绩，判断学生是否达到了教学目标的要求，而不以评定学生之间的差异为目的。(4) 内部人员评价，其主要目的在于改进课程开发设计的过程，首要任务是弄清预先设定的目标是否已经实 现。"},{"number":50,"type":"单选","stem":"()是在思想，情感、态度和行为上主动接受他人的影响，使自己的态度和行为与他人相接近，其实质 上是对榜样的模仿，其出发点就是试图与榜样一致。","options":{"A":"同化","B":"认同 c.服从","D":"顺从"},"answer":"B","explanation":"认同指的是对自己所认可、仰慕的榜样的遵从和模仿，个体在思想、情感和态度上主动地接 受了规范，从而试图与之保持一致。所以认同实质上就是对榜样的模仿，其出发点就是试图和榜样一致。"},{"number":51,"type":"单选","stem":"小军是名小学生，因逃课去网吧被学校勒令退学。该校的做法","options":{"A":"合法，有利于保护其他学生的权利","B":"合法，学校有选择学生的权利\nc.不合法，对违反学校管理制度的学生，学校应当予以批评教育，不得开除","D":"不合法，学校应尊重学生的差异"},"answer":"C","explanation":"本题考查《中华人民共和国义务教育法》。第二十七条规定：对违反学校管理制度的学 生，学校应当予以批评教育，不得开除。"},{"number":52,"type":"单选","stem":"当教师严格遵守教师职业道德，以优秀的道德面貌出现在社会活动中时，他们的道德风貌、素质表 现、人格形象便会对社会各方面产生积极影响，这体现了教师职业道德的","options":{"A":"教育功能","B":"示范功能","C":"调节功能","D":"评价功能"},"answer":"B","explanation":"本题考查教师职业道德的示范功能。教师要做好教育工作必然要与社会及家长打交道，以实 现社会教育、家庭教育与学校教育的统一。当教师严格遵循教师职业道德，以高尚的道德面貌出现在社会 活动中时，他们的道德风貌、人格形象便会对社会各方面产生积极的影响。这些都体现了教师职业道德对 社会文明的示范功能。"},{"number":53,"type":"单选","stem":"习近平总书记曾指出，要培养德智体美劳全面发展的社会主义建设者和接班人，在“五育”中， () 是其他各育的认识基础，是其他各育的知识因素。","options":{"A":"德育","B":"美育 c.劳动教育","D":"智育"},"answer":"D","explanation":"本题考查五育的关系。德育对其他各育起着保证方向和保持动力的作用，它体现了社会主义 教育的方向，是“五育”的灵魂；智育是认识基础；体育是物质前提；美育是动力；劳动技术教育则是各 教育育的综合体现。同时，美育和劳动技术教育是德育、智育、体育的具体运用和实施。"},{"number":54,"type":"单选","stem":"()的斯金纳第一个提出了较系统的教学理论。他认为，应该以操作性条件作用和积极强化为原则来安 排教学的程序。新的教学改革必须在教材的安排上注重学生的自我强化，发挥学生的积极性；必须使学 生学习的每一步都受到强化，使之形成复杂的行为模式并保持一定的行为强度。","options":{"A":"人本主义学派","B":"行为主义学派","C":"建构主义学派","D":"认知主义学派"},"answer":"B","explanation":"斯金纳属于行为主义。"},{"number":55,"type":"单选","stem":"付老师在写“匀速圆周运动”这节课的教案时，首先明确教学目标，然后计划采用多媒体教学，向 学生展示电风扇的运动过程，从而引导学生快速掌握知识，最后通过随堂测验来检验学生的掌握情况。 这说明付老师扮演的教师角色是","options":{"A":"设计者","B":"促进者","C":"管理者","D":"研究者"},"answer":"B","explanation":"促进者是促进以学习能力为重心的学生整个个性的和谐、健康地发展。"},{"number":56,"type":"单选","stem":"归因倾向影响学习动机，下列归因中最容易导致学生形成习得性无助的是","options":{"A":"将考试失利归因于自己粗心大意","B":"将考试失利归因于考前感冒影响发挥\nc.将考试失利归因于题目难度较大","D":"将英语不及格归因于自己不具备学习英语的能力"},"answer":"D","explanation":"一个总是失败并把失败归因于内部的、稳定的和不可控的因素(即能力低)的学生会形成一种 习得性无助的自我感觉。习得性无力感简称无力感，指由于连续的失败体验而导致个体产生的对行为结果 感到无力控制、无能为力的心理状态。"},{"number":57,"type":"单选","stem":"“从北京出发乘火车到广州，最好的路线是什么?”根据问题的分类，该问题属于","options":{"A":"概括性问题","B":"结构不良问题 c.结构良好问题","D":"解释性问题"},"answer":"C","explanation":"有结构的问题是指已知条件和要达到的目标都非常明确，个体按照一定的思维方式即可获得 答案的问题，即有结构的问题。教科书上的练习题多属于有结构的问题。例如，π从北京出发乘火车到香 港，最好的路线应该怎么走?”“求边长为2厘米的正方形的面积”。"},{"number":58,"type":"单选","stem":"获得“2017 年度中国残疾人事业新闻人物”的画家毕昌煜，患有自闭症，说话和行动都很迟缓，但 是他绘画天赋极高，其画作常在世界各地进行展览。这主要说明个体身心发展具有","options":{"A":"顺序性","B":"不平衡性 c.互补性","D":"阶段性"},"answer":"C","explanation":"本题考查互补性规律。(1)互补性是指机体某一方面的机能受损甚至缺失后，可通过其他方 面的超常发展得到部分补偿。机体各部分存在着互补的可能，为人在自身某方面缺失的情况下能与环境协 调，从而继续生存与发展提供条件。(2)互补性也存在于心理机能与生理机能之间，人的精神力量、意 志、情绪状态对整个机能起到调节作用，能帮助人战胜疾病和残缺，使身心依然得到发展。 24年潮南教招面试取得佳绩，含全区第一，第三，第四名 10"},{"number":59,"type":"单选","stem":"某学校在开展教师考核工作时，要求对所有教师一视同仁，不偏不倚，不能有亲有疏，不能宽严不 一。这主要是遵循()的体现。","options":{"A":"客观性原则","B":"公正性原则","C":"准确性原则","D":"科学性原则"},"answer":"B","explanation":"本题考查教师考核。考核应当公正是指对教师的考核要按照规定的标准统一进行，考核执行 者应当对所有教师一视同仁，不偏不倚，不能有亲疏之分，宽严之别，充分体现考核的权威。"},{"number":60,"type":"单选","stem":"参观是现代教学的辅助组织形式之一，下列不属于参观时需要注意的事项是","options":{"A":"参观活动出发前，教师要向学生宣布参观计划","B":"教师应回避参观中的指导工作，由有关人员担任\nc.参观结束后，教师应进行小结","D":"教师可安排学生在参观结束后各自写出参观的心得体会"},"answer":"B","explanation":"本题考查参观法的运用要求。第一，参观前，教师要根据教学的目的和要求，做好准备工 作；第二，参观时，教师要引导学生收集资料，做好必要的记录，也可以请有关人员进行讲解或指导；第 三，参观结束后，教师要组织学生及时进行小结。"},{"number":61,"type":"单选","stem":"在近代西欧社会，学校教育制度是双轨学制，双轨学制传到美国后发展成了单轨学制，而我国当今 的学校教育制度是分支型学制。这体现出学校教育制度具有","options":{"A":"客观性","B":"规范性","C":"历史性","D":"强制性"},"answer":"C","explanation":"本题考查教育学教育制度的特点。(1)客观性。教育制度的制定虽然反映着人们的一些主观 愿望和特殊的价值需要，但是，人们并不是也不可能随心所欲地制定或废止教育制度，某种教育制度的制 定或废止，有它的客观基础和发展的规律性。(2)规范性。在阶级社会中，教育制度的规范性主要表现为 其阶级性，即教育制度总是体现着某一阶级的价值取向，总是为某一阶级的利益服务的。(3)历史性。教 育制度是随着时代和文化背景的变化而不断创新的。教育制度创新是教育改革的一项重要内容，也是教育 实践得以深化的一个重要条件。(4)强制性。只要是制度，在没有被废除之前，都不管个人的好恶，都要 求个体无条件地去适应和遵守。"},{"number":62,"type":"单选","stem":"天赋优异的儿童比较容易成才，存在智力缺陷的儿童教育起来比较困难。这主要说明","options":{"A":"遗传素质决定人的发展","B":"环境是推动人身心发展的动力之一","C":"教育加速个体发展","D":"遗传素质的个别差异是人的身心发展的个别差异的原因之一"},"answer":"D","explanation":"本题考查遗传素质。遗传素质的个别差异是人的身心发展的个别差异的原因之一。遗传素质 存在着个别差异，表现在高级神经活动类型、感觉器官的结构和机能方面。这些差异是个性形成的生理基 础，是人的个性差异的最初原因。天赋优异的儿童比较容易成才，而存在智力缺陷的儿童教育起来就比较 困难。"},{"number":63,"type":"单选","stem":"2023年全国教育数字化现场推进会议在湖北武汉召开，会议指出，在党中央、国务院的高度重视和坚 强领导下，在教育系统和社会各界的共同努力下，教育部启动实施国家文化数字化战略行动，以()为先手 棋和重要抓手，全面优化优质资源供给服务，支撑教育重大改革任务实施、持续提升国际影响力， 走出了一条中国特色的教育数字化发展道路。","options":{"A":"慕课MOO","C":"","B":"国家智慧教育平台 c.国教祥云","D":"学习强国平台"},"answer":"B","explanation":"本题考查2023 年全国教育数字化现场推进会议。会议指出，在党中央、国务院的高度重视 和坚强领导下，在教育系统和社会各界的共同努力下，教育部启动实施国家教育数字化战略行动，以国家 智慧教育平台为先手棋和重要抓手，全面优化优质资源供给服务，支撑教育重大改革任务实施、持续提升 国际影响力，走出了一条中国特色的教育数字化发展道路。平台累计浏览量达 260亿次，访客量超19.2 亿人次，访问用户覆盖了200多个国家和地区。"},{"number":64,"type":"单选","stem":"美国教育评价专家布卢姆非常重视形成性评价，他认为形成性评价的开发与使用，实现了教育评价 观的转轨。下列有关形成性评价的说法错误的是","options":{"A":"其重要特性是静态性、即时性","B":"能为学生的学习确定恰当的步调","C":"可以关注学生的学习过程","D":"是人本教育理念的体现"},"answer":"A","explanation":"形成性评价不是静态的。"},{"number":65,"type":"单选","stem":"当狗对节拍器每分钟发出70次的滴答声建立条件反应后，对钟表发出的滴答声也会产生条件反应。 这属于条件作用的","options":{"A":"消退","B":"泛化","C":"分化","D":"恢复"},"answer":"B","explanation":"刺激泛化：对于相似刺激做出了相同的反应，分不清楚相似刺激。比如，曾经被大狗咬过的 孩子，后来看见非常小的狗也可能产生恐惧。"},{"number":66,"type":"判断"
