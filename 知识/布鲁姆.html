<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>布鲁姆教育思想刷题训练</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary-color: #4a90e2;
            --primary-light: #e6f7ff;
            --success-color: #52c41a;
            --success-light: #f6ffed;
            --error-color: #f5222d;
            --error-light: #fff2f0;
            --warning-color: #faad14;
            --warning-light: #fffbe6;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --border-color: #e8e8e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.12);
            --font-size-base: 16px;
            --font-size-small: 14px;
            --font-size-large: 18px;
            --radius: 12px;
            --radius-sm: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            transition: font-size 0.3s ease;
        }
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            z-index: 200;
            box-shadow: var(--shadow);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .left-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn,
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:active,
        .icon-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
        .question-info {
            text-align: center;
            flex: 1;
        }
        .question-number {
            font-size: 18px;
            font-weight: 600;
        }
        .progress-text {
            font-size: 12px;
            opacity: 0.9;
        }
        .right-section {
            display: flex;
            gap: 8px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 140px;
        }
        .knowledge-page {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .knowledge-page.hidden {
            display: none;
        }
        .knowledge-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .knowledge-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }
        .knowledge-content {
            font-size: var(--font-size-base);
            line-height: 1.8;
            color: var(--text-primary);
        }
        .knowledge-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 18px 0 8px;
            color: var(--primary-color);
            padding-left: 10px;
            border-left: 4px solid var(--primary-color);
        }
        .knowledge-content p {
            margin-bottom: 10px;
        }
        .knowledge-content ul {
            margin: 8px 0 12px 18px;
        }
        .knowledge-content li {
            margin-bottom: 6px;
        }
        .knowledge-content .highlight {
            background: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
        }
        .knowledge-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 4px;
            font-size: 13px;
        }
        .knowledge-table th,
        .knowledge-table td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }
        .knowledge-table th {
            background: #f5f7fb;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .start-quiz-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .start-quiz-btn:active {
            transform: scale(0.98);
        }
        .question-card,
        .analysis-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .question-type {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary-light);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .question-stem {
            font-size: var(--font-size-large);
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .formula {
            background: #fafafa;
            padding: 16px;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            font-family: 'Courier New', monospace;
            text-align: center;
            border-left: 4px solid var(--primary-color);
            overflow-x: auto;
        }
        .question-image {
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            display: block;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 56px;
            position: relative;
        }
        .option-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--radius-sm);
            pointer-events: none;
        }
        .option-item:hover {
            border-color: var(--primary-color);
        }
        .option-item.selected {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: scale(1.01);
        }
        .option-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
        }
        .option-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
        }
        .option-label {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
            transition: all 0.3s ease;
        }
        .selected .option-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .correct .option-label {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
        .wrong .option-label {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }
        .option-text {
            flex: 1;
            padding-top: 2px;
        }
        .analysis-card {
            padding: 0;
            margin-top: 16px;
            overflow: hidden;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 800px;
            }
        }
        .analysis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #fafafa;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .analysis-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .result-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .result-badge.correct {
            background: var(--success-light);
            color: var(--success-color);
        }
        .result-badge.wrong {
            background: var(--error-light);
            color: var(--error-color);
        }
        .toggle-icon {
            transition: transform 0.3s ease;
        }
        .toggle-icon.expanded {
            transform: rotate(180deg);
        }
        .analysis-content {
            padding: 20px;
            font-size: var(--font-size-small);
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .analysis-content p {
            margin-bottom: 10px;
        }
        .analysis-content strong {
            color: var(--text-primary);
            font-size: 15px;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.08);
            z-index: 150;
        }
        .footer.hidden {
            transform: translateY(100%);
        }
        .footer-content {
            max-width: 430px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-btn:active {
            transform: scale(0.98);
        }
        .prev-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .prev-btn:not(:disabled):hover {
            background: #e8e8e8;
        }
        .next-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sheet-overlay,
        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sheet-overlay.show,
        .history-overlay.show {
            display: block;
            opacity: 1;
        }
        .sheet-panel,
        .history-panel {
            position: fixed;
            background: var(--bg-card);
            z-index: 400;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sheet-panel {
            bottom: 0;
            left: 50%;
            right: auto;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            transform: translate(-50%, 100%);
            max-height: 70vh;
            width: min(430px, 100%);
        }
        .sheet-panel.show {
            transform: translate(-50%, 0);
        }
        .history-panel {
            top: 0;
            right: 0;
            bottom: 0;
            width: 85%;
            max-width: 360px;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            transform: translateX(100%);
        }
        .history-panel.show {
            transform: translateX(0);
        }
        .sheet-header,
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .sheet-title,
        .history-title {
            font-size: 18px;
            font-weight: 600;
        }
        .close-sheet {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 50%;
            cursor: pointer;
        }
        .sheet-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .filter-btn,
        .clear-history {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .filter-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .clear-history {
            background: #fff2f0;
            color: var(--error-color);
        }
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }
        .sheet-item {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--border-color);
            background: white;
        }
        .sheet-item.unanswered {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .sheet-item.correct {
            border-color: var(--success-color);
            background: var(--success-light);
            color: var(--success-color);
        }
        .sheet-item.wrong {
            border-color: var(--error-color);
            background: var(--error-light);
            color: var(--error-color);
        }
        .sheet-item.current {
            border-width: 3px;
            border-color: var(--primary-color);
            transform: scale(1.05);
        }
        .sheet-number {
            font-size: 16px;
        }
        .sheet-status {
            font-size: 10px;
            margin-top: 2px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            background: #fafafa;
            border-radius: var(--radius-sm);
            padding: 16px;
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        .history-item:active {
            transform: scale(0.98);
        }
        .history-date {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .history-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-stat {
            text-align: center;
        }
        .history-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .history-label {
            font-size: 11px;
            color: var(--text-light);
        }
        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .history-action-btn {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .review-btn {
            background: var(--primary-color);
            color: white;
        }
        .delete-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .completion-screen {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        .completion-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--success-color), #73d13d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        .completion-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 24px 0;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            flex: 1;
            min-width: 90px;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 10px;
        }
        .restart-btn {
            background: linear-gradient(135deg, var(--primary-color), #6ba8ff);
            color: white;
        }
        .history-view-btn {
            background: #f5f5f5;
            color: var(--text-secondary);
        }
        .wrong-review-btn {
            background: linear-gradient(135deg, #f5222d, #ff7875);
            color: white;
        }
        .export-csv-btn {
            background: linear-gradient(135deg, #52c41a, #73d13d);
            color: white;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        @media (min-width: 768px) {
            .app-container {
                border-radius: 20px;
                margin: 20px auto;
                min-height: calc(100vh - 40px);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            }
            .footer {
                position: static;
                border-radius: 0 0 20px 20px;
            }
            .sheet-panel {
                border-radius: 20px;
                bottom: 20px;
                max-height: 60vh;
            }
        }
        @media (max-width: 360px) {
            .sheet-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-top">
                <div class="left-section">
                    <div class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i></div>
                    <div class="question-info" id="questionInfo">
                        <div class="question-number">第 <span id="currentNum">1</span> 题</div>
                        <div class="progress-text"><span id="answeredCount">0</span>/<span id="totalCount">0</span> 已答</div>
                    </div>
                    <div class="question-info" id="pageTitle" style="display: none;">
                        <div class="question-number">布鲁姆教育目标分类</div>
                        <div class="progress-text">教育心理学 · 高频考点</div>
                    </div>
                </div>
                <div class="right-section">
                    <div class="icon-btn" onclick="toggleSheet()"><i class="fas fa-th-large"></i></div>
                    <div class="icon-btn" onclick="toggleHistory()"><i class="fas fa-history"></i></div>
                    <div class="icon-btn" onclick="changeFontSize(-1)"><i class="fas fa-font"></i>-</div>
                    <div class="icon-btn" onclick="changeFontSize(1)"><i class="fas fa-font"></i>+</div>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 5%"></div></div>
        </header>

        <main class="content-area" id="contentArea">
            <div class="knowledge-page" id="knowledgePage">
                <div class="knowledge-card">
                    <div class="knowledge-title" id="knowledgeTitle"></div>
                    <div class="knowledge-content" id="knowledgeContent"></div>
                </div>
            </div>
            <div id="quizContent" style="display: none;"></div>
        </main>

        <footer class="footer"><div class="footer-content" id="footerContent"></div></footer>

        <div class="sheet-overlay" id="sheetOverlay" onclick="toggleSheet()"></div>
        <div class="sheet-panel" id="sheetPanel">
            <div class="sheet-header">
                <div class="sheet-title">答题卡</div>
                <div class="close-sheet" onclick="toggleSheet()"><i class="fas fa-times"></i></div>
            </div>
            <div class="sheet-filters">
                <button class="filter-btn active" onclick="filterQuestions('all')">全部</button>
                <button class="filter-btn" onclick="filterQuestions('unanswered')">未答</button>
                <button class="filter-btn" onclick="filterQuestions('correct')">正确</button>

        const questions = [ { "type": "单选题", "stem": "教育目标分类学的提出者是（  ）", "options": [{"label":"A","text":"布鲁姆"},{"label":"B","text":"布鲁纳"},{"label":"C","text":"加涅"},{"label":"D","text":"奥苏贝尔"}], "answer": 0, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>A</strong>。布鲁姆提出教育目标分类学；布鲁纳提出认知发现学习理论；加涅提出学习结果分类；奥苏贝尔提出有意义接受学习理论。<br><strong>📚 知识点讲解：</strong>布鲁姆（Benjamin Bloom）是美国当代著名教育家、心理学家，教育目标分类学创始人。注意区分名字相近的人物：布鲁姆（目标分类）vs 布鲁纳（发现学习）。<br><strong>💡 解题思路：</strong>题干问教育目标分类学的提出者，直接对应布鲁姆。B项布鲁纳是认知发现学习；C项加涅是学习结果分类；D项奥苏贝尔是有意义接受学习。记住\u201c布鲁姆=目标分类\u201d即可。<br><strong>🧠 记忆口诀：</strong>\u201c布鲁姆目标分类学，认知情感动作域；布鲁纳发现学习论，加涅结果分类明。\u201d" }, { "type": "单选题", "stem": "布鲁姆将教育目标分为三大领域，不包括下列哪一项（  ）", "options": [{"label":"A","text":"认知领域"},{"label":"B","text":"情感领域"},{"label":"C","text":"动作技能领域"},{"label":"D","text":"意志领域"}], "answer": 3, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>D</strong>。布鲁姆将教育目标分为认知、情感、动作技能三大领域，不包括意志领域。<br><strong>📚 知识点讲解：</strong>布鲁姆教育目标分类的三大领域：认知领域（知识智力技能）、情感领域（态度价值观）、动作技能领域（操作技能）。意志领域不属于布鲁姆的分类框架。<br><strong>💡 解题思路：</strong>A、B、C都是布鲁姆的三大领域。D项意志领域是干扰项，不属于布鲁姆分类。<br><strong>🧠 记忆口诀：</strong>\u201c认知情感动作技，三大领域布鲁姆；意志不在分类中，熟记三域不混淆。\u201d" }, { "type": "单选题", "stem": "布鲁姆认知领域目标中，最低水平的认知是（  ）", "options": [{"label":"A","text":"知识"},{"label":"B","text":"领会"},{"label":"C","text":"应用"},{"label":"D","text":"评价"}], "answer": 0, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>A</strong>。知识（识记）是布鲁姆认知领域的最低水平，仅需回忆、重现已学内容。<br><strong>📚 知识点讲解：</strong>认知领域六级从低到高：知识→领会→应用→分析→综合→评价。知识层级仅涉及记忆重现，不需要理解或应用。<br><strong>💡 解题思路：</strong>题干问\u201c最低水平的认知\u201d，直接对应知识。B项领会是最低水平的理解，但知识比领会更低。<br><strong>🧠 记忆口诀：</strong>\u201c知识识记最低层，回忆重现仅记忆；领会理解始入门，六级递进认知深。\u201d" }, { "type": "单选题", "stem": "布鲁姆认知领域目标中，最高水平的认知是（  ）", "options": [{"label":"A","text":"分析"},{"label":"B","text":"综合"},{"label":"C","text":"评价"},{"label":"D","text":"应用"}], "answer": 2, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>C</strong>。评价是布鲁姆认知领域的最高水平，需要对事物做出价值判断，是最高级的认知技能。<br><strong>📚 知识点讲解：</strong>布鲁姆原版分类中，评价位于金字塔顶端。安德森修订版将创造列为最高，但教综考试以布鲁姆原版为准，评价为最高。<br><strong>💡 解题思路：</strong>认知六级顺序：知识→领会→应用→分析→综合→评价。评价是最后一级。A分析、B综合都低于评价。<br><strong>🧠 记忆口诀：</strong>\u201c评价认知最高阶，价值判断定优劣；知领应分综评序，六级递进记心间。\u201d" }, { "type": "单选题", "stem": "学生能够背诵古诗、默写数学公式，这属于布鲁姆认知目标中的（  ）", "options": [{"label":"A","text":"知识"},{"label":"B","text":"领会"},{"label":"C","text":"应用"},{"label":"D","text":"分析"}], "answer": 0, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>A</strong>。背诵、默写属于记忆重现，是知识层级的典型表现，对应最低认知水平。<br><strong>📚 知识点讲解：</strong>知识层级的核心行为动词：背诵、说出、识别、默写、复述。这些行为都只需回忆信息，不涉及理解或应用。<br><strong>💡 解题思路：</strong>\u201c背诵\u201d\u201c默写\u201d是典型的记忆行为，直接对应知识层级。B领会需要用自己的话解释；C应用需要解决问题；D分析需要拆解结构。<br><strong>🧠 记忆口诀：</strong>\u201c背诵默写属知识，识记重现最低层；若要理解需领会，应用解题更高层。\u201d" }, { "type": "单选题", "stem": "学生能用自己的话解释课文大意、概括文章主旨，这属于布鲁姆认知目标中的（  ）", "options": [{"label":"A","text":"知识"},{"label":"B","text":"领会"},{"label":"C","text":"应用"},{"label":"D","text":"分析"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。用自己的话解释、概括，说明学生理解了知识的含义，属于领会层级，是最低水平的理解。<br><strong>📚 知识点讲解：</strong>领会（理解）的核心行为动词：解释、概括、转述、换算、推断。学生能用自己的语言重新表述信息，表明已把握内在含义。<br><strong>💡 解题思路：</strong>\u201c用自己的话解释\u201d是领会的标志性行为。A知识只需背诵；C应用要解决问题；D分析要拆解结构。解释课文大意属于领会。<br><strong>🧠 记忆口诀：</strong>\u201c领会理解转述释，概括推断明含义；最低理解是领会，高于知识需转译。\u201d" }, { "type": "单选题", "stem": "布鲁姆认知领域中，最低水平的理解是（  ）", "options": [{"label":"A","text":"知识"},{"label":"B","text":"领会"},{"label":"C","text":"应用"},{"label":"D","text":"分析"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。领会是最低水平的理解，仅要求把握知识含义；知识仅需记忆，不涉及理解。<br><strong>📚 知识点讲解：</strong>认知领域层级中，知识是纯记忆（不涉及理解），领会是理解的起点。因此最低水平的理解是领会。<br><strong>💡 解题思路：</strong>题干问\u201c最低水平的理解\u201d，知识不涉及理解，排除A。领会是理解的最低层次。C应用是高水平理解；D分析更高。<br><strong>🧠 记忆口诀：</strong>\u201c知识仅记非理解，领会方为理解初；最低理解是领会，应用分析更高层。\u201d" }, { "type": "单选题", "stem": "学生运用课堂上学到的公式解应用题，这属于布鲁姆认知目标中的（  ）", "options": [{"label":"A","text":"领会"},{"label":"B","text":"应用"},{"label":"C","text":"分析"},{"label":"D","text":"综合"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。将学到的公式用到新的应用题情境中，解决具体问题，属于应用层级。<br><strong>📚 知识点讲解：</strong>应用的核心是将所学知识迁移到新情境中解决实际问题。行为动词：运用、解决、计算、操作、证明。<br><strong>💡 解题思路：</strong>\u201c用公式解应用题\u201d是典型的应用。A领会只是理解公式；C分析是拆解题目结构；D综合是整合创造新方案。<br><strong>🧠 记忆口诀：</strong>\u201c应用知识解新题，迁移情境是关键；领会只是懂含义，应用方能解决问题。\u201d" }, { "type": "单选题", "stem": "学生能够分析文章的段落结构、区分事件的因果关系，这属于布鲁姆认知目标中的（  ）", "options": [{"label":"A","text":"应用"},{"label":"B","text":"分析"},{"label":"C","text":"综合"},{"label":"D","text":"评价"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。拆解文章结构、区分因果关系，是将整体拆分为部分并分析逻辑，属于分析层级。<br><strong>📚 知识点讲解：</strong>分析的核心是将整体材料拆解为组成部分，理解其结构、逻辑与内在关系。行为动词：分析、区分、辨别、梳理、找出。<br><strong>💡 解题思路：</strong>\u201c分析段落结构\u201d\u201c区分因果关系\u201d直接对应分析层级。A应用是解决问题；C综合是整合创新；D评价是价值判断。<br><strong>🧠 记忆口诀：</strong>\u201c分析拆解明结构，区分因果辨逻辑；应用解决分析拆，综合整合评价判。\u201d" }, { "type": "单选题", "stem": "学生自主设计一份实验方案、撰写一篇原创作文，这属于布鲁姆认知目标中的（  ）", "options": [{"label":"A","text":"分析"},{"label":"B","text":"综合"},{"label":"C","text":"评价"},{"label":"D","text":"应用"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。设计方案、创作作文，是将零散要素整合为新的产物，属于综合层级，强调创造性。<br><strong>📚 知识点讲解：</strong>综合的核心是将零散知识、要素整合为新的整体，形成新的方案或产物。行为动词：编写、设计、创作、拟定、构建。<br><strong>💡 解题思路：</strong>\u201c自主设计\u201d\u201c原创撰写\u201d是典型的综合行为。A分析是拆解；C评价是判断优劣；D应用是运用已有知识解决问题。<br><strong>🧠 记忆口诀：</strong>\u201c综合整合创新物，设计方案原创作；分析拆解评价判，综合创造更高阶。\u201d" }, { "type": "单选题", "stem": "学生能够评判一篇文章的优劣、评价一个实验方案的合理性，这属于布鲁姆认知目标中的（  ）", "options": [{"label":"A","text":"综合"},{"label":"B","text":"评价"},{"label":"C","text":"分析"},{"label":"D","text":"应用"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。评判优劣、评价合理性，是做出价值判断，属于评价层级，是最高认知水平。<br><strong>📚 知识点讲解：</strong>评价的核心是对材料、方案做出价值判断，评定其优劣、合理性。行为动词：评价、评判、鉴赏、比较、证明。<br><strong>💡 解题思路：</strong>\u201c评判优劣\u201d\u201c评价合理性\u201d直接对应评价层级。A综合是创造新产物；C分析是拆解结构；D应用是解决问题。<br><strong>🧠 记忆口诀：</strong>\u201c评价判断定优劣，价值评判最高层；综合创造评价判，认知六级评价顶。\u201d" }, { "type": "单选题", "stem": "下列认知目标层级中，水平最高的是（  ）", "options": [{"label":"A","text":"领会"},{"label":"B","text":"应用"},{"label":"C","text":"分析"},{"label":"D","text":"综合"}], "answer": 3, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>D</strong>。认知领域从低到高依次为：知识→领会→应用→分析→综合→评价，四个选项中综合水平最高。<br><strong>📚 知识点讲解：</strong>六级顺序需牢记：知识(识记) < 领会(理解) < 应用 < 分析 < 综合 < 评价。综合高于分析、应用、领会。<br><strong>💡 解题思路：</strong>按顺序排列：领会(2) < 应用(3) < 分析(4) < 综合(5)，因此综合最高。<br><strong>🧠 记忆口诀：</strong>\u201c知领应分综评序，综合高于分析层；评价最高综合次，六级递进要记清。\u201d" }, { "type": "单选题", "stem": "下列认知目标层级中，水平最低的是（  ）", "options": [{"label":"A","text":"应用"},{"label":"B","text":"分析"},{"label":"C","text":"领会"},{"label":"D","text":"知识"}], "answer": 3, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>D</strong>。四个选项中，知识是最低水平的认知，仅需记忆重现。<br><strong>📚 知识点讲解：</strong>知识层级位于认知领域金字塔最底层，只需要回忆和重现已学过的信息，不涉及任何理解或应用。<br><strong>💡 解题思路：</strong>顺序：知识 < 领会 < 应用 < 分析，所以知识最低。<br><strong>🧠 记忆口诀：</strong>\u201c知识识记最底层，领会理解上一层；应用更高分析上，六级递进步步升。\u201d" }, { "type": "单选题", "stem": "布鲁姆情感领域目标中，最低水平是（  ）", "options": [{"label":"A","text":"接受"},{"label":"B","text":"反应"},{"label":"C","text":"价值化"},{"label":"D","text":"组织"}], "answer": 0, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>A</strong>。接受（注意）是情感领域的最低水平，仅要求学生愿意关注、留意。<br><strong>📚 知识点讲解：</strong>情感领域五级从低到高：接受→反应→价值化→组织→价值体系个性化。接受只是被动留意，尚未主动参与。<br><strong>💡 解题思路：</strong>情感领域以\u201c接受\u201d为起点。B反应是主动参与；C价值化是认可价值观；D组织是整合价值观。<br><strong>🧠 记忆口诀：</strong>\u201c接受最低仅留意，反应主动参与来；价值化认组织整，个性化成最高阶。\u201d" }, { "type": "单选题", "stem": "布鲁姆情感领域目标中，最高水平是（  ）", "options": [{"label":"A","text":"价值化"},{"label":"B","text":"组织"},{"label":"C","text":"价值体系个性化"},{"label":"D","text":"反应"}], "answer": 2, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>C</strong>。价值体系个性化是情感领域的最高水平，价值观念完全内化为稳定的人格特质。<br><strong>📚 知识点讲解：</strong>价值体系个性化意味着价值观已融入个人性格和行为方式，成为稳定的品质，如一贯诚实守信。<br><strong>💡 解题思路：</strong>五级顺序：接受→反应→价值化→组织→价值体系个性化。最后一级最高。<br><strong>🧠 记忆口诀：</strong>\u201c价值个性化最高，内化性格行为稳；接受反应价值化，组织个性五级成。\u201d" }, { "type": "单选题", "stem": "学生主动 <strong>🧠 记忆口诀：</strong>\u201c知觉最低知要领，模仿照做准确低；操作独立准确高，连贯习惯化最高。\u201d" }, { "type": "单选题", "stem": "布鲁姆动作技能领域中，最高水平是（  ）", "options": [{"label":"A","text":"准确"},{"label":"B","text":"连贯"},{"label":"C","text":"习惯化"},{"label":"D","text":"操作"}], "answer": 2, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>C</strong>。习惯化是动作技能领域的最高水平，动作达到自动化、下意识的程度。<br><strong>📚 知识点讲解：</strong>习惯化意味着动作已高度熟练，无需刻意注意就能自动完成，如熟练体操动作可下意识完成。<br><strong>💡 解题思路：</strong>六级顺序最后一级是习惯化。A准确是第四级；B连贯是第五级；D操作是第三级。<br><strong>🧠 记忆口诀：</strong>\u201c习惯化最高自动，无需注意下意识；准确连贯依次进，六级技能习惯顶。\u201d" }, { "type": "单选题", "stem": "学生看着老师的示范，了解体操动作的要领，这属于动作技能目标的（  ）", "options": [{"label":"A","text":"知觉"},{"label":"B","text":"模仿"},{"label":"C","text":"操作"},{"label":"D","text":"准确"}], "answer": 0, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>A</strong>。看示范、了解动作要领，属于认知层面的知觉阶段，尚未开始模仿动作。<br><strong>📚 知识点讲解：</strong>知觉阶段是通过观察、听讲等方式了解动作要领和相关知识，产生动作意向。这是动作学习的起点。<br><strong>💡 解题思路：</strong>\u201c看示范\u201d\u201c了解要领\u201d属于知觉。B模仿是照着做动作；C操作是独立完成。<br><strong>🧠 记忆口诀：</strong>\u201c知觉观摹知要领，模仿照做动作生；操作独立准确精，连贯习惯化自动。\u201d" }, { "type": "单选题", "stem": "学生能照着老师的样子，重复做出体操动作，熟练度低，这属于动作技能目标的（  ）", "options": [{"label":"A","text":"知觉"},{"label":"B","text":"模仿"},{"label":"C","text":"操作"},{"label":"D","text":"准确"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。照着示范重复动作，是模仿层级的典型表现，动作熟练度、准确度较低。<br><strong>📚 知识点讲解：</strong>模仿阶段学生根据示范重复动作，但动作生硬、不熟练、误差较大。这是动作技能学习的第二步。<br><strong>💡 解题思路：</strong>\u201c照着做\u201d\u201c熟练度低\u201d对应模仿。A知觉只是了解；C操作是独立完成且基本正确。<br><strong>🧠 记忆口诀：</strong>\u201c模仿照做熟练低，动作生硬误差大；知觉了解模仿做，操作独立准确来。\u201d" }, { "type": "单选题", "stem": "学生能独立、准确地完成整套体操动作，误差很少，这属于动作技能目标的（  ）", "options": [{"label":"A","text":"操作"},{"label":"B","text":"准确"},{"label":"C","text":"连贯"},{"label":"D","text":"习惯化"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>正确答案为<strong>B</strong>。独立完成且误差少、动作精准，属于准确层级。<br><strong>📚 知识点讲解：</strong>准确阶段动作已熟练掌握，能够独立完成且精度高、误差少，但尚未达到流畅连贯的程度。<br><strong>💡 解题思路：</strong>\u201c误差很少\u201d强调 、情感、<strong>动作技能</strong>三大领域，不包括意志领域。<br><strong>📚 知识点讲解：</strong>三大领域：认知（知识智力）、情感（态度价值观）、动作技能（操作技能）。意志不属于布鲁姆分类。<br><strong>💡 解题思路：</strong>\u201c意志\u201d是干扰项，正确应为\u201c动作技能\u201d。<br><strong>🧠 记忆口诀：</strong>\u201c认知情感动作技，三大领域布鲁姆；意志不在分类中，熟记三域不混淆。\u201d" }, { "type": "判断题", "stem": "布鲁姆认知领域目标中，最低水平的理解是知识。（  ）", "options": [{"label":"A","text":"正确"},{"label":"B","text":"错误"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>答案为<strong>错误</strong>。最低水平的理解是<strong>领会</strong>；知识是最低认知水平，仅涉及记忆，不涉及理解。<br><strong>📚 知识点讲解：</strong>知识层级只需回忆重现，不要求理解。领会才是理解的起点，是最低水平的理解。<br><strong>💡 解题思路：</strong>题干混淆了\u201c最低认知水平\u201d和\u201c最低理解水平\u201d。知识是认知最低层，但不属于理解层次。<br><strong>🧠 记忆口诀：</strong>\u201c知识识记非理解，领会方为理解初；最低理解是领会，知识仅记不需懂。\u201d" }, { "type": "判断题", "stem": "学生能够默写单词、背诵定义，属于认知目标中的领会层级。（  ）", "options": [{"label":"A","text":"正确"},{"label":"B","text":"错误"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>答案为<strong>错误</strong>。默写、背诵属于记忆重现，对应<strong>知识</strong>层级；领会是理解层面的目标。<br><strong>📚 知识点讲解：</strong>知识层级的行为动词：背诵、默写、复述、识别。领会的行为动词：解释、概括、转述。<br><strong>💡 解题思路：</strong>\u201c默写\u201d\u201c背诵\u201d是典型的记忆行为，属于知识而非领会。<br><strong>🧠 记忆口诀：</strong>\u201c背诵默写属知识，理解转述方领会；知识记忆最低层，领会理解上一层。\u201d" }, { "type": "判断题", "stem": "应用是布鲁姆认知领域中最高水平的认知目标。（  ）", "options": [{"label":"A","text":"正确"},{"label":"B","text":"错误"}], "answer": 1, "analysis": "<strong>🎯 答案解析：</strong>答案为<strong>错误</strong>。认知领域最高水平的目标是<strong>评价</strong>，而非应用。应用只是第三层级。<br><strong>📚 知识点讲解：</strong>认知六级：知识(1)→领会(2)→应用(3)→分析(4)→综合(5)→评价(6)。评价是最高层。<br><strong>💡 解题思路：</strong>应用只是中等层级，上面还有分析、综合、评价。<br><strong>🧠 记忆口诀：</strong>\u201c评价认知最高层，应用仅第三层级；知领应分综评价，六级递进记顺序。\u201d" }, { "type": "判断题", "stem": "学生能用自己的话转述物理概念的含义，属于领会层级的目标。（  ）", "options": [{"label":"A","text":"正确"},{"label":"B","text":"错误"}], "answer": 0, "analysis": "<strong>🎯 答案解析：</strong>答案为<strong>正确</strong>。用自己的话转述概念，说明学生理解了知识含义，属于领会层级。<br><strong>📚 知识点讲解：</strong>领会（理解）的核心行为包括解释、转述、概括、推断。转述是理解的直接表现。<br><strong>💡 解题思路：</strong>题干描述与领会的定义完全吻合。<br><strong>🧠 记忆口诀：</s         function isAnswered(index) { if (isMultiSelect(questions[index])) return multiSelectAnswers[index] !== null && multiSelectAnswers[index].length > 0; return answers[index] !== null; }
        function isAnswerCorrect(index) { const q = questions[index]; const userAns = getUserAnswer(index); if (userAns === null) return false; if (isMultiSelect(q)) { if (!Array.isArray(userAns) || userAns.length === 0) return false; const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer]; if (userAns.length !== correctArr.length) return false; const sortedUser = [...userAns].sort(); const sortedCorrect = [...correctArr].sort(); return sortedUser.every((v, i) => v === sortedCorrect[i]); } return userAns === q.answer; }

        function renderQuestion() {
            let idx = currentIndex; let q;
            if (wrongReviewMode && wrongReviewIndices.length > 0) { idx = wrongReviewIndices[wrongReviewCurrentIndex]; q = questions[idx]; } else { q = questions[currentIndex]; }
            const actualIndex = wrongReviewMode ? wrongReviewIndices[wrongReviewCurrentIndex] : currentIndex;
            const contentArea = document.getElementById('quizContent'); const isMulti = isMultiSelect(q);
            let html = `<div class="question-card"><span class="question-type">${q.type}</span><div class="question-stem">${q.stem}</div>`;
            if (q.image) { html += `<img src="${q.image}" alt="题目图片" class="question-image">`; }
            html += `<div class="options-container">`;
            q.options.forEach((opt, optIdx) => { let isSelected = false; if (isMulti) { const msa = multiSelectAnswers[actualIndex]; isSelected = (msa && msa.includes(optIdx)); } else { isSelected = (answers[actualIndex] === optIdx); } const userAns = getUserAnswer(actualIndex); const answered = (userAns !== null && (isMulti ? userAns.length > 0 : true)); let isCorrectOption = false; if (isMulti) { const correctArr = Array.isArray(q.answer) ? q.answer : [q.answer]; isCorrectOption = correctArr.includes(optIdx); } else { isCorrectOption = (q.answer === optIdx); } let classes = ['option-item']; if (answered) { if (isSelected && isCorrectOption) classes.push('correct'); else if (isSelected && !isCorrectOption) classes.push('wrong'); else if (isCorrectOption) classes.push('correct'); } else if (isSelected) { classes.push('selected'); } html += `<div class="${classes.join(' ')}" onclick="selectOption(${optIdx}, ${actualIndex})"><div class="option-label">${opt.label}</div><div class="option-text">${opt.text}</div></div>`; });
            html += '</div></div>';
            const userAns = getUserAnswer(actualIndex); const answered = (userAns !== null && (isMulti ? userAns.length > 0 : true));
            if (answered) { const correct = isAnswerCorrect(actualIndex); html += `<div class="analysis-card"><div class="analysis-header" onclick="toggleAnalysis(this)"><div class="analysis-title">📝 答案分析 <span class="result-badge ${correct ? 'correct' : 'wrong'}">${correct ? '✓ 回答正确' : '✗ 回答错误'}</span></div><div class="toggle-icon expanded">▼</div></div><div class="analysis-content" style="display: block;">${q.analysis}</div></div>`; }
            const totalForCheck = wrongReviewMode ? wrongReviewIndices.length : questions.length;
            const allDone = wrongReviewMode ? wrongReviewIndices.every(wi => isAnswered(wi)) : answers.every((a, i) => isAnswered(i));
            if ((wrongReviewMode && wrongReviewCurrentIndex >= wrongReviewIndices.length - 1 && allDone) || (!wrongReviewMode && currentIndex === questions.length - 1 && allDone)) { const allIndices = wrongReviewMode ? wrongReviewIndices : [...Array(questions.length).keys()]; const correctCount = allIndices.filter(i => isAnswerCorrect(i)).length; const total = allIndices.length; const accuracy = Math.round(correctCount / total * 100); if (!wrongReviewMode) { saveToHistory(correctCount, accuracy); } html += `<div class="completion-screen"><div class="completion-icon">🎉</div><h1 class="completion-title">${wrongReviewMode ? '错题回顾完成！' : '刷题完成！'}</h1><p style="color: var(--text-secondary);">${wrongReviewMode ? '你已经回顾了所有错题，继续加油！' : '太棒了！你已经完成了所有题目'}</p><div class="stats"><div class="stat-item"><div class="stat-value">${correctCount}/${total}</div><div class="stat-label">答对题数</div></div><div class="stat-item"><div class="stat-value">${accuracy}%</div><div class="stat-label">正确率</div></div></div><div class="action-buttons"><button class="action-btn restart-btn" onclick="restartQuiz()">重新开始</button><button class="action-btn history-view-btn" onclick="toggleHistory()">查看历史</button>${!wrongReviewMode ? `<button class="action-btn wrong-review-btn" onclick="startWrongReview()">回看错题</button>` : ''}${wrongReviewMode ? `<button class="action-btn export-csv-btn" onclick="exportWrongCSV()"><i class="fas fa-download"></i> 导出错题CSV</button>` : ''}${wrongReviewMode ? `<button class="action-btn history-view-btn" onclick="exitWrongReview()">退出回顾</button>` : ''}</div></div>`; }
            contentArea.innerHTML = html; updateHeader(); if (window.MathJax) { MathJax.typeset(); }
        }

        function selectOption(optIdx, actualIndex) { if (isAnswered(actualIndex)) return; const q = questions[actualIndex]; if (isMultiSelect(q)) { if (!multiSelectAnswers[actualIndex]) multiSelectAnswers[actualIndex] = []; const msa = multiSelectAnswers[actualIndex]; const pos = msa.indexOf(optIdx); if (pos >= 0) msa.splice(pos, 1); else msa.push(optIdx); if (msa.length === 0) multiSelectAnswers[actualIndex] = null; } else { answers[actualIndex] = optIdx; } saveAnswers(); renderQuestion(); renderAnswerSheet(); updateNavButtons(); if (!isMultiSelect(q) || multiSelectAnswers[actualIndex] === null) { const correct = isAnswerCorrect(actualIndex); if (!isMultiSelect(q)) showToast(correct ? '回答正确！✓' : '回答错误 ✗'); } }
        function toggleAnalysis(header) { const content = header.nextElementSibling; const icon = header.querySelector('.toggle-icon'); if (content.style.display === 'none') { content.style.display = 'block'; icon.classList.add('expanded'); } else { content.style.display = 'none'; icon.classList.remove('expanded'); } }
        function prevQuestion() { if (wrongReviewMode) { if (wrongReviewCurrentIndex > 0) { wrongReviewCurrentIndex--; renderQuestion(); updateNavButtons(); } } else { if (currentIndex > 0) { currentIndex--; renderQuestion(); updateNavButtons(); } } }
        function nextQuestion() { if (wrongReviewMode) { if (wrongReviewCurrentIndex < wrongReviewIndices.length - 1) { wrongReviewCurrentIndex++; renderQuestion(); updateNavButtons(); } } else { if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); updateNavButtons(); } } }
        function updateHeader() { if (currentPage !== 'quiz') return; const displayNum = wrongReviewMode ? wrongReviewCurrentIndex + 1 : currentIndex + 1; const totalNum = wrongReviewMode ? wrongReviewIndices.length : questions.length; document.getElementById('currentNum').textContent = displayNum; const answeredCount = (wrongReviewMode ? wrongReviewIndices : [...Array(questions.length).keys()]).filter(i => isAnswered(i)).length; document.getElementById('answeredCount').textContent = answeredCount; document.getElementById('totalCount').textContent = totalNum; document.getElementById('progressFill').style.width = `${(answeredCount / totalNum) * 100}%`; if (wrongReviewMode) { document.querySelector('.progress-text').innerHTML = `<span style="color:#ff7875;">错题回顾模式</span> | ${answeredCount}/${totalNum} 已答`; } else { document.querySelector('.progress-text').innerHTML = `<span id="answeredCount">${answeredCount}</span>/<span id="totalCount">${totalNum}</span> 已答`; } }
        function updateNavButtons() { const footerContent = document.getElementById('footerContent'); if (currentPage !== 'quiz') return; const totalForCheck = wrongReviewMode ? wrongReviewIndices.length : questions.length; const allDone = wrongReviewMode ? wrongReviewIndices.every(wi => isAnswered(wi)) : answers.every((a, i) => isAnswered(i)); const atEnd = wrongReviewMode ? wrongReviewCurrentIndex >= wrongReviewIndices.length - 1 : currentIndex >= questions.length - 1; const atStart = wrongReviewMode ? wrongReviewCurrentIndex === 0 : currentIndex === 0; footerContent.innerHTML = `<button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()" ${atStart ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> 上一题</button><button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()" ${atEnd && allDone ? 'disabled' : ''}>下一题 <i class="fas fa-chevron-right"></i></button>`; }
        function changeFontSize(delta) { fontSize = Math.max(14, Math.min(22, fontSize + delta)); document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`); document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`); document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`); saveSettings(); }
        function toggleSheet() { const overlay = document.getElementById('sheetOverlay'); const panel = document.getElementById('sheetPanel'); if (panel.classList.contains('show')) { overlay.classList.remove('show'); panel.classList.remove('show'); } else { overlay.classList.add('show'); panel.classList.add('show'); renderAnswerSheet(); } }
        function renderAnswerSheet() { const grid = document.getElementById('sheetGrid'); const indices = wrongReviewMode ? wrongReviewIndices : [...Array(questions.length).keys()]; let html = ''; indices.forEach((qIndex, displayIdx) => { let statusClass = 'unanswered'; let statusText = '未答'; if (isAnswered(qIndex)) { if (isAnswerCorrect(qIndex)) { statusClass = 'correct'; statusText = '正确'; } else { statusClass = 'wrong'; statusText = '错误'; } } const currentActualIdx = wrongReviewMode ? wrongReviewIndices[wrongReviewCurrentIndex] : currentIndex; if (qIndex === currentActualIdx) statusClass += ' current'; if (currentFilter !== 'all') { if (currentFilter === 'unanswered' && isAnswered(qIndex)) return; if (currentFilter === 'correct' && (!isAnswered(qIndex) || !isAnswerCorrect(qIndex))) return; if (currentFilter === 'wrong' && (!isAnswered(qIndex) || isAnswerCorrect(qIndex))) return; } html += `<div class="sheet-item ${statusClass}" onclick="jumpToQuestion(${qIndex})"><div class="sheet-number">${displayIdx + 1}</div><div class="sheet-status">${statusText}</div></div>`; }); grid.innerHTML = html; }
        function filterQuestions(filter) { currentFilter = filter; document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); renderAnswerSheet(); }
        function jumpToQuestion(index) { if (wrongReviewMode) { const pos = wrongReviewIndices.indexOf(index); if (pos >= 0) { wrongReviewCurrentIndex = pos; } else { currentIndex = index; wrongReviewMode = false; document.querySelector('.progress-text').innerHTML = `<span id="answeredCount">${answers.filter(a=>a!==null).length}</span>/<span id="totalCount">${questions.length}</span> 已答`; } } else { currentIndex = index; } renderQuestion(); updateNavButtons(); toggleSheet(); }
        function toggleHistory() { const overlay = document.getElementById('historyOverlay'); const panel = document.getElementById('historyPanel'); if (panel.classList.contains('show')) { overlay.classList.remove('show'); panel.classList.remove('show'); } else { overlay.classList.add('show'); panel.classList.add('show'); renderHistory(); } }
        function renderHistory() { const list = document.getElementById('historyList'); const history = getHistory(); if (history.length === 0) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div>暂无历史记录</div><div style="font-size: 12px; margin-top: 8px;">完成一套题后会自动保存记录</div></div>`; return; } let html = ''; history.forEach((record, index) => { const dateStr = new Date(record.timestamp).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); html += `<div class="history-item"><div class="history-date">${dateStr}</div><div class="history-stats"><div class="history-stat"><div class="history-value">${record.correctCount}/${record.totalCount}</div><div class="history-label">答对题数</div></div><div class="history-stat"><div class="history-value">${record.accuracy}%</div><div class="history-label">正确率</div></div></div><div class="history-actions"><button class="history-action-btn review-btn" onclick="reviewHistory(${index})">回顾</button><button class="history-action-btn delete-btn" onclick="deleteHistory(${index})">删除</button></div></div>`; }); list.innerHTML = html; }
        function saveToHistory(correctCount, accuracy) { const history = getHistory(); history.unshift({ timestamp: new Date().getTime(), totalCount: questions.length, correctCount: correctCount, accuracy: accuracy, answers: [...answers], multiSelectAnswers: multiSelectAnswers.map(m => m ? [...m] : null) }); if (history.length > 50) history.pop(); localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history)); }
        function getHistory() { const saved = localStorage.getItem(STORAGE_KEY_HISTORY); return saved ? JSON.parse(saved) : []; }
        function reviewHistory(index) { const history = getHistory(); if (index >= 0 && index < history.length) { answers = [...history[index].answers]; if (history[index].multiSelectAnswers) multiSelectAnswers = history[index].multiSelectAnswers.map(m => m ? [...m] : null); currentIndex = 0; wrongReviewMode = false; saveAnswers(); renderQuestion(); updateNavButtons(); toggleHistory(); document.querySelector('.progress-text').innerHTML = `<span id="answeredCount">${answers.filter(a=>a!==null).length}</span>/<span id="totalCount">${questions.length}</span> 已答`; showToast('已加载历史记录'); } }
        function deleteHistory(index) { if (!confirm('确定要删除这条记录吗？')) return; const history = getHistory(); if (index >= 0 && index < history.length) { history.splice(index, 1); localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history)); renderHistory(); showToast('记录已删除'); } }
        function clearAllHistory() { if (!confirm('确定要清空所有历史记录吗？')) return; localStorage.removeItem(STORAGE_KEY_HISTORY); renderHistory(); showToast('历史记录已清空'); }
        function saveAnswers() { localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify({ currentIndex, answers, multiSelectAnswers: multiSelectAnswers.map(m => m ? [...m] : null), wrongReviewMode, wrongReviewIndices, wrongReviewCurrentIndex })); }
        function saveSettings() { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ fontSize })); }
        function loadAllData() { const savedAnswers = localStorage.getItem(STORAGE_KEY_ANSWERS); if (savedAnswers) { const data = JSON.parse(savedAnswers); currentIndex = data.currentIndex || 0; answers = data.answers || new Array(questions.length).fill(null); if (data.multiSelectAnswers) multiSelectAnswers = data.multiSelectAnswers.map(m => m ? [...m] : null); else multiSelectAnswers = new Array(questions.length).fill(null); if (data.wrongReviewMode) { wrongReviewMode = data.wrongReviewMode; wrongReviewIndices = data.wrongReviewIndices || []; wrongReviewCurrentIndex = data.wrongReviewCurrentIndex || 0; } } const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS); if (savedSettings) { const settings = JSON.parse(savedSettings); fontSize = settings.fontSize || 16; document.documentElement.style.setProperty('--font-size-base', `${fontSize}px`); document.documentElement.style.setProperty('--font-size-small', `${fontSize-2}px`); document.documentElement.style.setProperty('--font-size-large', `${fontSize+2}px`); } }
        function startWrongReview() { wrongReviewIndices = []; for (let i = 0; i < questions.length; i++) { if (isAnswered(i) && !isAnswerCorrect(i)) wrongReviewIndices.push(i); } if (wrongReviewIndices.length === 0) { showToast('没有错题，太棒了！🎉'); return; } wrongReviewMode = true; wrongReviewCurrentIndex = 0; saveAnswers(); renderQuestion(); updateNavButtons(); document.querySelector('.progress-text').innerHTML = `<span style="color:#ff7875;">错题回顾模式</span> | 0/${wrongReviewIndices.length} 已答`; showToast(`共${wrongReviewIndices.length}道错题，开始回顾`); }
        function exitWrongReview() { wrongReviewMode = false; wrongReviewIndices = []; wrongReviewCurrentIndex = 0; saveAnswers(); renderQuestion(); updateNavButtons(); document.querySelector('.progress-text').innerHTML = `<span id="answeredCount">${answers.filter(a=>a!==null).length}</span>/<span id="totalCount">${questions.length}</span> 已答`; showToast('已退出错题回顾模式'); }
        function exportWrongCSV() { const wrongIndices = wrongReviewMode ? wrongReviewIndices : []; if (wrongIndices.length === 0) { for (let i = 0; i < questions.length; i++) { if (isAnswered(i) && !isAnswerCorrect(i)) wrongIndices.push(i); } } if (wrongIndices.length === 0) { showToast('没有错题可导出'); return; } let csvContent = '\uFEFF序号,题型,题目,选项,你的答案,正确答案,解析\n'; wrongIndices.forEach((qIdx, displayIdx) => { const q = questions[qIdx]; const userAns = getUserAnswer(qIdx); let userAnsStr = ''; if (isMultiSelect(q) && Array.isArray(userAns)) userAnsStr = userAns.map(i => q.options[i].label + '. ' + q.options[i].text).join('; '); else if (userAns !== null && !Array.isArray(userAns)) userAnsStr = q.options[userAns].label + '. ' + q.options[userAns].text; else userAnsStr = '未作答'; let correctAnsStr = ''; if (Array.isArray(q.answer)) correctAnsStr = q.answer.map(i => q.options[i].label + '. ' + q.options[i].text).join('; '); else correctAnsStr = q.options[q.answer].label + '. ' + q.options[q.answer].text; const optionsStr = q.options.map(o => o.label + '. ' + o.text).join(' | '); const stemClean = q.stem.replace(/"/g, '""').replace(/\n/g, ' '); const optionsClean = optionsStr.replace(/"/g, '""'); const userAnsClean = userAnsStr.replace(/"/g, '""'); const correctAnsClean = correctAnsStr.replace(/"/g, '""'); const analysisClean = q.analysis.replace(/<[^>]+>/g, '').replace(/"/g, '""').replace(/\n/g, ' ').trim(); csvContent += `"${displayIdx+1}","${q.type}","${stemClean}","${optionsClean}","${userAnsClean}","${correctAnsClean}","${analysisClean}"\n`; }); const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = '错题导出_' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url); showToast('错题CSV已导出！'); }
        function restartQuiz() { if (confirm('确定要重新开始吗？当前进度将被清除。')) { currentIndex = 0; answers = new Array(questions.length).fill(null); multiSelectAnswers = new Array(questions.length).fill(null); wrongReviewMode = false; wrongReviewIndices = []; wrongReviewCurrentIndex = 0; localStorage.removeItem(STORAGE_KEY_ANSWERS); document.querySelector('.progress-text').innerHTML = `<span id="answeredCount">0</span>/<span id="totalCount">${questions.length}</span> 已答`; renderQuestion(); updateNavButtons(); } }
        function showHome() { if (confirm('返回主页将丢失当前进度，确定吗？')) { window.location.href = 'index.html'; } }
        function showToast(message) { const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = message; document.body.appendChild(toast); setTimeout(() => toast.remove(), 1500); }
    </script>
