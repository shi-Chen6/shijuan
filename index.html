<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>教师招聘试卷导航中心</title>
    <style>
        :root {
            --primary: #4a6cf7;
            --success: #10b981;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #1c1c1e;
            --text-secondary: #555;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .region-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .region-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .region-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .region-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .region-icon.jieyang {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .region-icon.chaonan {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .region-info {
            text-align: left;
            flex: 1;
        }

        .region-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .region-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .arrow {
            font-size: 20px;
            color: #aaa;
        }

        .footer {
            margin-top: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📖</div>
        <h1>教师招聘试卷导航中心</h1>
        <p class="subtitle">选择您要刷题的地区</p>
        
        <div class="region-cards">
            <div class="region-card" onclick="goToRegion('jiedong')">
                <div class="region-icon jieyang">📍</div>
                <div class="region-info">
                    <div class="region-title">揭阳地区</div>
                    <div class="region-desc">揭东区 · 普宁市 · 惠来县</div>
                </div>
                <div class="arrow">→</div>
            </div>
            
            <div class="region-card" onclick="goToRegion('chaonan')">
                <div class="region-icon chaonan">🏆</div>
                <div class="region-info">
                    <div class="region-title">潮南地区</div>
                    <div class="region-desc">潮南区教师招聘真题与模拟题</div>
                </div>
                <div class="arrow">→</div>
            </div>
        </div>
        
        <div class="footer">
            实时同步您的刷题进度与错题记录
        </div>
    </div>

    <script>
        function goToRegion(region) {
            window.location.href = 'exams.html?region=' + region;
        }
    </script>
</body>
</html>
